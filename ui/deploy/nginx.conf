server {
    listen ${PORT} default_server;
    server_name _;

    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    location ~ /\.(?!well-known) {
        return 404;
    }

    location ~ ^/(deploy|tests)(/|$) {
        return 404;
    }

    location = / {
        try_files /demo/index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
