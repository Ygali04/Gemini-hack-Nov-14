        if (latestTask) {
          selectedRunId = latestTask.id;
        }

        if (getCurrentState() === "expanded") {
          for (const t of tasks) {
            if (t.isRealFailure) markFailedRunSeen(t.id);
          }
        }

        const nextStructureKey = buildPanelStructureKey(vm, activeConv);
        if (nextStructureKey === lastPanelStructureKey) {
          if (updateLiveTicksInPlace(vm)) {
            return;
          }
        }
        lastPanelStructureKey = nextStructureKey;

        const headerIdentity = activeConv?.identity || getPrimaryAgentRowIdentity();
        const headerGoal = latestTask?.goal || "";
        setPanelHeaderHtml(`
          <div class="chat-nav-left">
            <button type="button" class="btn btn-icon" data-action="open-chat-list" aria-label="Back to agents" title="Back to agents">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
                <path d="M8.75 3.25L5 7L8.75 10.75" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            ${renderAgentChipHtml(headerIdentity, `convhead-${activeConv?.id || "primary"}`, {
              action: "open-agent-settings",
              agentId: activeConv?.id || "__primary__",
              ariaLabel: `Agent settings for ${headerIdentity.name}`,
              title: "Agent settings",
            })}
            ${headerGoal ? `<span class="chat-nav-title" title="${escapeHtml(headerGoal)}">${escapeHtml(headerGoal)}</span>` : ""}
          </div>
          <span class="panel-header-right">
            ${stopAllBtnHtml}
            <button type="button" class="btn btn-esc" data-action="close-notch" aria-label="Close notch" title="Close (Esc)">Esc</button>
          </span>
        `);

        if (agentFormState && agentFormState.mode === "edit") {
          blocks.push(renderAgentFormHtml());
        }

        if (!tasks.length) {
          blocks.push(`<div class="chat-empty-note">Ask ${escapeHtml(headerIdentity.name)} anything to start.</div>`);
          destroyAllAgentChips();
          timelineScroll.innerHTML = blocks.join("");
          mountAllAgentChips();
          syncSizeAndBridge();
          return;
        }

        let latestFinishedTaskId = "";
        for (let i = tasks.length - 1; i >= 0; i--) {
          if (tasks[i].isFinished && tasks[i].state !== "failed") {
            latestFinishedTaskId = tasks[i].id;
            break;
          }
        }

        const taskHtmlParts = tasks.map((task, idx) => {
          let sepHtml = "";
          if (idx > 0) {
            const prevTask = tasks[idx - 1];
            const divLabel = formatTaskDividerLabel(prevTask.startTs || prevTask.sortTs, task.startTs || task.sortTs);
            sepHtml = divLabel
              ? `<div class="chat-date-divider">${escapeHtml(divLabel)}</div>`
              : `<div class="chat-task-sep" aria-hidden="true"></div>`;
          }
          return `${sepHtml}${renderAgentTaskHtml(task, activeConv, vm, task.id === latestFinishedTaskId)}`;
        });

        blocks.push(`<div class="chat-thread">${taskHtmlParts.join("")}</div>`);

        destroyAllAgentChips();
        const prevScrollTop = timelineScroll.scrollTop;
        const wasNearBottom =
          timelineScroll.scrollHeight - timelineScroll.clientHeight - prevScrollTop < 32;
        timelineScroll.innerHTML = blocks.join("");

        mountAllAgentChips();
        const totalRowsLen = tasks.reduce((sum, t) => sum + (t.transcriptRows?.length || 0), 0);
        const scrollKey = `${selectedAgentId}:${tasks.length}:${totalRowsLen}`;
        if (scrollKey !== lastScrolledRunKey || wasNearBottom) {
          lastScrolledRunKey = scrollKey;
          timelineScroll.scrollTop = timelineScroll.scrollHeight;
        }
        syncSizeAndBridge();
      }

      function renderNow() {
        const vm = WorkspaceAdapter.mapRuns([...optimisticRuns, ...rawRuns], detailsById, pendingHelp, {
          connectionStatus,
          connectionError,
          isSampleData,
          agentsById,
          rememberedAgentsById,
          costsById,
          transcriptsById,
        });
        renderPill(vm);
        renderPanel(vm);
      }

      /* ---------------- TIMELINE INTERACTIONS ---------------- */
      async function handleConnectSubmit() {
        const input = document.getElementById("connect-url-input");
        if (!input) return;
        const res = await Transport.setConnection(input.value);
        if (!res.ok) {
          connectionStatus = "disconnected";
          connectionError = res.error || "Paste the address ComputerAnything printed";
          renderNow();
          return;
        }
        connectionError = "";
        connectionStatus = "loading";
        resetCapabilityState();
        renderNow();
        await pollAll();
      }

      timelineScroll.addEventListener("keydown", (e) => {
        if (e.isComposing || e.keyCode === 229) return;
        if (e.key === "Enter" && e.target.id === "connect-url-input") {
          e.preventDefault();
          handleConnectSubmit();
        }
      });

      panelView.addEventListener("click", async (e) => {
        if (e.target.id === "connect-submit-btn") {
          handleConnectSubmit();
          return;
        }

        const actionBtn = e.target.closest("[data-action]");
        if (openRowMenuKey) {
          const inMenu = Boolean(e.target.closest(".chat-row-menu, .chat-row-more-btn"));
          if (!inMenu && (!actionBtn || actionBtn.dataset.action !== "toggle-row-menu")) {
            openRowMenuKey = "";
            confirmDeleteRunId = "";
            if (!actionBtn) {
              renderNow();
              return;
            }
          }
        }
        if (actionBtn) {
          const action = actionBtn.dataset.action;
          if (action === "select-agent" || action === "select-chat" || action === "new-primary-chat") {
            const sel = typeof window.getSelection === "function" ? window.getSelection() : null;
            if (sel && !sel.isCollapsed && String(sel).trim()) {
              const anchorInRow = sel.anchorNode && actionBtn.contains(sel.anchorNode);
              const focusInRow = sel.focusNode && actionBtn.contains(sel.focusNode);
              if (anchorInRow || focusInRow) {
                return;
              }
            }
          }
          if (action === "close-notch") {
            setState("collapsed", { instant: true });
            return;
          }
          if (action === "open-new-agent-form") {
            openRowMenuKey = "";
            confirmDeleteRunId = "";
            confirmDeleteAgentId = "";
            const primary = getPrimaryAgentRowIdentity();
            const existingAgents = readCreatedAgents();
            const usedNames = [primary.name, ...existingAgents.map((a) => a.name)];
            const usedSwatches = [primary.color, ...existingAgents.map((a) => a.swatch)];
            agentFormState = {
              mode: "create",
              agentId: "",
              name: WorkspaceAdapter.suggestAgentName(usedNames),
              swatch: WorkspaceAdapter.suggestAgentSwatch(usedSwatches),
              returnView: "list",
              error: "",
            };
            renderNow();
            requestAnimationFrame(() => {
              const nameInp = document.getElementById("agent-name-input");
              if (nameInp) {
                nameInp.focus();
                nameInp.select();
              }
            });
            return;
          }
          if (action === "pick-agent-swatch") {
            if (agentFormState) {
              const nameInp = document.getElementById("agent-name-input");
              if (nameInp) agentFormState.name = nameInp.value;
              agentFormState.swatch = actionBtn.dataset.swatch || agentFormState.swatch;
              agentFormState.error = "";
              renderNow();
            }
            return;
          }
          if (action === "cancel-agent-form") {
            agentFormState = null;
            renderNow();
            return;
          }
          if (action === "open-agent-settings" || action === "menu-agent-settings") {
            const targetAgentId =
              actionBtn.dataset.agentId ||
              (viewMode === "chat" ? selectedAgentId : "__primary__") ||
              "__primary__";
            openRowMenuKey = "";
            confirmDeleteRunId = "";
            confirmDeleteAgentId = "";
            if (targetAgentId === "__primary__") {
              Transport.openWorkspace(fixtureParam || "", { view: "agent-settings" });
              return;
            }
            const ag = readCreatedAgents().find((a) => a.id === targetAgentId);
            if (!ag) {
              Transport.openWorkspace(fixtureParam || "", { view: "agent-settings" });
              return;
            }
            agentFormState = {
              mode: "edit",
              agentId: ag.id,
              name: ag.name,
              swatch: ag.swatch,
              returnView: viewMode,
              error: "",
            };
            renderNow();
            requestAnimationFrame(() => {
              const nameInp = document.getElementById("agent-name-input");
              if (nameInp) {
                nameInp.focus();
                nameInp.select();
              }
            });
            return;
          }
          if (action === "open-app-settings") {
            openRowMenuKey = "";
            confirmDeleteRunId = "";
            confirmDeleteAgentId = "";
            Transport.openWorkspace(fixtureParam || "", { view: "app-settings" });
            return;
          }
          if (action === "open-chat-list") {
            viewMode = "list";
            isComposingNewChat = false;
            openRowMenuKey = "";
            confirmDeleteRunId = "";
            confirmDeleteAgentId = "";
            agentFormState = null;
            renderNow();
            return;
          }
          if (action === "select-agent") {
            const agentId = actionBtn.dataset.agentId || "__primary__";
            openAgentConversation(agentId, { render: true });
            const convs = lastViewModel ? getConversationsForVm(lastViewModel) : null;
            const conv = convs?.byId?.get(agentId);
            if (conv) {
              for (const t of conv.tasks) {
                if (t.isRealFailure) markFailedRunSeen(t.id);
              }
            }
            if (getCurrentState() === "expanded" && promptInput) {
              promptInput.focus();
            }
            return;
          }
          if (action === "new-primary-chat") {
            openAgentConversation("__primary__", { render: true });
            promptInput.focus();
            return;
          }
          if (action === "select-chat") {
            const runId = actionBtn.dataset.runId || "";
            if (runId) {
              selectedRunId = runId;
              const convs = lastViewModel ? getConversationsForVm(lastViewModel) : null;
              const owner = convs?.list?.find((c) => c.allRunIds.includes(runId));
              saveLastThreadId(runId);
              markFailedRunSeen(runId);
              openAgentConversation(owner ? owner.id : "__primary__", { render: true });
            }
            return;
          }
          if (action === "toggle-row-menu") {
            const rowKey = actionBtn.dataset.rowKey || "";
            if (rowKey) {
              if (openRowMenuKey === rowKey) {
                openRowMenuKey = "";
                confirmDeleteRunId = "";
                confirmDeleteAgentId = "";
              } else {
                openRowMenuKey = rowKey;
                confirmDeleteRunId = "";
                confirmDeleteAgentId = "";
              }
              renderNow();
            }
            return;
          }
          if (action === "menu-copy-result") {
            const agentId = actionBtn.dataset.agentId || "";
            const runId = actionBtn.dataset.runId || "";
            let text = "";
            if (agentId && lastViewModel) {
              const conv = getConversationsForVm(lastViewModel)?.byId?.get(agentId);
              text = conv?.copyResultText || (conv?.lastLinePreview !== "No tasks yet" ? conv?.lastLinePreview : "") || "";
            } else if (runId) {
              const runVm = lastViewModel?.runs?.find((r) => r.id === runId);
              text = runVm?.copyResultText || runVm?.lastLinePreview || "";
            }
            openRowMenuKey = "";
            confirmDeleteRunId = "";
            confirmDeleteAgentId = "";
            if (text) {
              await copyTextWithFeedback(text, `result:${agentId || runId}`, "Copied result");
            } else {
              renderNow();
            }
            return;
          }
          if (action === "menu-stop-agent-conv") {
            const agentId = actionBtn.dataset.agentId || "";
            openRowMenuKey = "";
            confirmDeleteAgentId = "";
            const conv = agentId && lastViewModel ? getConversationsForVm(lastViewModel)?.byId?.get(agentId) : null;
            const liveIds = conv?.liveRunIds || [];
            if (!liveIds.length) {
              renderNow();
              return;
            }
            liveIds.forEach((id) => pendingStopIds.add(id));
            renderNow();
            try {
              const results = await Promise.allSettled(
                liveIds.map((id) => Transport.request("POST", `/api/runs/${encodeURIComponent(id)}/stop`, {}))
              );
              results.forEach((res, idx) => {
                const rid = liveIds[idx];
                if (res.status === "fulfilled") {
                  stopNoticesByRunId.set(rid, buildStopSummary(rid, res.value));
                }
              });
              await pollAll();
            } catch (err) {
              sendErrorText = err.message || "Could not stop";
            } finally {
              liveIds.forEach((id) => pendingStopIds.delete(id));
              renderNow();
            }
            return;
          }
          if (action === "menu-ask-delete") {
            const agentId = actionBtn.dataset.agentId || "";
            if (agentId && agentId !== "__primary__") {
              openRowMenuKey = agentId;
              confirmDeleteAgentId = agentId;
              renderNow();
            }
            return;
          }
          if (action === "cancel-delete-agent" || action === "cancel-delete-chat") {
            confirmDeleteRunId = "";
            confirmDeleteAgentId = "";
            openRowMenuKey = "";
            renderNow();
            return;
          }
          if (action === "confirm-delete-agent") {
            const agentId = actionBtn.dataset.agentId || "";
            if (!agentId || agentId === "__primary__") return;
            const conv = lastViewModel ? getConversationsForVm(lastViewModel)?.byId?.get(agentId) : null;
            const existingAgents = readCreatedAgents();
            const targetAgent = existingAgents.find((a) => a.id === agentId);
            const liveIds = conv?.liveRunIds || [];
            if (liveIds.length && stopRouteSupported && !isSampleData && Transport.isConnected()) {
              liveIds.forEach((id) => pendingStopIds.add(id));
              try {
                await Promise.allSettled(
                  liveIds.map((id) => Transport.request("POST", `/api/runs/${encodeURIComponent(id)}/stop`, {}))
                );
              } finally {
                liveIds.forEach((id) => pendingStopIds.delete(id));
              }
            }
            const hideIds = [
              ...(conv?.allRunIds || []),
              ...(targetAgent?.threads || []),
              targetAgent?.thread || "",
            ].filter(Boolean);
            for (const rid of hideIds) {
              hiddenChatIds.add(rid);
            }
            persistHiddenChatIds();
            writeCreatedAgents(existingAgents.filter((a) => a.id !== agentId));
            openRowMenuKey = "";
            confirmDeleteAgentId = "";
            confirmDeleteRunId = "";
            if (selectedAgentId === agentId) {
              selectedAgentId = "__primary__";
              saveLastAgentId("__primary__");
            }
            announceStatus("Deleted agent");
            renderNow();
            return;
          }
          if (action === "confirm-delete-chat") {
            const runId = actionBtn.dataset.runId || "";
            if (!runId) return;
            const runVm = lastViewModel?.runs?.find((r) => r.id === runId);
            if (runVm && !runVm.isFinished && stopRouteSupported && !isSampleData && Transport.isConnected()) {
              pendingStopIds.add(runId);
              try {
                await Transport.request("POST", `/api/runs/${encodeURIComponent(runId)}/stop`, {});
              } catch {
                // Still hide deleted chat from list if already stopped or unreachable
              } finally {
                pendingStopIds.delete(runId);
              }
            }
            hiddenChatIds.add(runId);
            persistHiddenChatIds();
            openRowMenuKey = "";
            confirmDeleteRunId = "";
            if (selectedRunId === runId) {
              selectedRunId = null;
            }
            if (readStoredLastThreadId() === runId) {
              saveLastThreadId("");
            }
            announceStatus("Deleted chat");
            renderNow();
            return;
          }
          if (action === "toggle-result-detail") {
            const runId = actionBtn.dataset.runId || selectedRunId;
            if (runId) {
              if (openResultDetailIds.has(runId)) {
                openResultDetailIds.delete(runId);
              } else {
                openResultDetailIds.add(runId);
              }
              renderNow();
            }
            return;
          }
          if (action === "toggle-work") {
            const workKey = actionBtn.dataset.workKey || "";
            if (workKey) {
              if (openWorkKeys.has(workKey)) {
                openWorkKeys.delete(workKey);
              } else {
                openWorkKeys.add(workKey);
              }
              renderNow();
            }
            return;
          }
          if (action === "retry-connect") {
            await pollAll();
            return;
          }
          if (action === "run-again") {
            const p = actionBtn.dataset.prompt || "";
            const aid = actionBtn.dataset.agentId || selectedAgentId || "__primary__";
            if (p) submitTask(p, [], { agentId: aid });
            return;
          }
          if (action === "reply-run") {
            const runId = actionBtn.dataset.runId || selectedRunId;
            if (runId) {
              selectedRunId = runId;
              viewMode = "chat";
              isComposingNewChat = false;
              saveLastThreadId(runId);
              promptInput.focus();
            }
            return;
          }
          if (action === "copy-result") {
            const runId = actionBtn.dataset.runId || selectedRunId;
            const runVm = lastViewModel?.runs?.find((r) => r.id === runId);
            if (runVm?.copyResultText) {
              await copyTextWithFeedback(runVm.copyResultText, `result:${runId}`, "Copied result");
            }
            return;
          }
          if (action === "copy-output") {
            const runId = actionBtn.dataset.runId || selectedRunId;
            const outId = actionBtn.dataset.outputId || "";
            const runVm = lastViewModel?.runs?.find((r) => r.id === runId);
            const out = runVm?.producedOutputs?.find((o) => o.id === outId);
            if (out?.copyText) {
              await copyTextWithFeedback(out.copyText, `out:${runId}:${outId}`, `Copied ${out.title}`);
            }
            return;
          }
          if (action === "stop-speaking") {
            Transport.post("stopSpeaking");
            return;
          }
          if (action === "open-output") {
            const runId = actionBtn.dataset.runId || selectedRunId;
            const outId = actionBtn.dataset.outputId || "";
            const runVm = lastViewModel?.runs?.find((r) => r.id === runId);
            const out = runVm?.producedOutputs?.find((o) => o.id === outId);
            if (out?.openUrl && /^https?:\/\//i.test(out.openUrl)) {
              window.open(out.openUrl, "_blank", "noopener");
              announceStatus(`Opened ${out.title}`);
            } else if (out?.previewText) {
              const key = `${runId}:${outId}`;
              if (openOutputPreviewIds.has(key)) {
                openOutputPreviewIds.delete(key);
              } else {
                openOutputPreviewIds.add(key);
              }
              renderNow();
            }
            return;
          }
          if (action === "open-privacy") {
            const pane = actionBtn.dataset.pane || "";
            const label = actionBtn.dataset.label || "Privacy";
            if (!pane) return;
            if (hasShellBridge()) {
              announceStatus(`Opening ${label} settings`);
              const res = await Transport.openSettingsPane(pane);
              if (res && res.ok === false && res.error) {
                announceStatus(res.error);
              }
            } else {
              announceStatus(`Open System Settings -> Privacy & Security -> ${label}`);
            }
            return;
          }
          if (action === "stop-all") {
            if (isStoppingAll) return;
            const liveParents = (lastViewModel?.runs || []).filter((r) => !r.isFinished);
            const liveStandalone = rawRuns.filter(
              (r) =>
                r.state !== "done" &&
                r.state !== "failed" &&
                !liveParents.some((p) => p.id === r.id || p.id === r.parent)
            );
            const stopTargets = [...liveParents.map((r) => r.id), ...liveStandalone.map((r) => r.id)];
            if (!stopTargets.length) return;
            isStoppingAll = true;
            stopTargets.forEach((id) => pendingStopIds.add(id));
            renderNow();
            try {
              const results = await Promise.allSettled(
                stopTargets.map((id) => Transport.request("POST", `/api/runs/${encodeURIComponent(id)}/stop`, {}))
              );
              let stoppedCount = 0;
              let failCount = 0;
              let changedAny = false;
              let totalChangedActions = 0;
              results.forEach((res, idx) => {
                const rid = stopTargets[idx];
                if (res.status === "fulfilled") {
                  stoppedCount += 1;
                  const resp = res.value;
                  stopNoticesByRunId.set(rid, buildStopSummary(rid, resp));
                  if (Number(resp?.changed_actions || 0) > 0) {
                    changedAny = true;
                    totalChangedActions += Number(resp.changed_actions);
                  } else if (resp && typeof resp.changed === "string" && resp.changed.trim()) {
                    changedAny = true;
                  }
                } else {
                  failCount += 1;
                }
              });
              const baseSummary = failCount
                ? `Stopped ${stoppedCount} of ${stopTargets.length} tasks`
                : `Stopped ${stoppedCount} running task${stoppedCount === 1 ? "" : "s"}`;
              const changeNote = changedAny
                ? totalChangedActions > 0
                  ? `${totalChangedActions} action${totalChangedActions === 1 ? "" : "s"} already ran.`
                  : "Some actions had already run."
                : "Nothing was changed.";
              globalStopSummary = `${baseSummary}. ${changeNote}`;
              announceStatus(globalStopSummary);
              await pollAll();
            } catch (err) {
              sendErrorText = err.message || "Could not stop running agents";
              announceStatus(sendErrorText);
            } finally {
              isStoppingAll = false;
              stopTargets.forEach((id) => pendingStopIds.delete(id));
              renderNow();
            }
            return;
          }
          if (action === "stop-run" || action === "stop-agent" || action === "menu-stop-chat") {
            const targetRunId = actionBtn.dataset.runId || selectedRunId;
            openRowMenuKey = "";
            confirmDeleteRunId = "";
            if (!targetRunId || pendingStopIds.has(targetRunId)) return;
            const targetRunObj = rawRuns.find((r) => r.id === targetRunId);
            const parentNoticeId =
              action === "stop-run" ? targetRunId : targetRunObj?.parent || selectedRunId || targetRunId;
            pendingStopIds.add(targetRunId);
            renderNow();
            try {
              const resp = await Transport.request(
                "POST",
                `/api/runs/${encodeURIComponent(targetRunId)}/stop`,
                {}
              );
              stopNoticesByRunId.set(parentNoticeId, buildStopSummary(targetRunId, resp));
              await pollAll();
            } catch (err) {
              sendErrorText = err.message || "Could not stop";
            } finally {
              pendingStopIds.delete(targetRunId);
              renderNow();
            }
            return;
          }
          if (action === "undo-memory") {
            const memId = actionBtn.dataset.memoryId;
            if (!memId || pendingUndoMemoryIds.has(memId)) return;
            pendingUndoMemoryIds.add(memId);
            renderNow();
            try {
              await Transport.request("DELETE", `/api/memory/${encodeURIComponent(memId)}`);
              memoryItems = memoryItems.filter((m) => String(m.id) !== String(memId));
            } catch (err) {
              sendErrorText = err.message || "Could not undo memory";
            } finally {
              pendingUndoMemoryIds.delete(memId);
              renderNow();
            }
            return;
          }
          if (action === "toggle-run-steps") {
            const runId = actionBtn.dataset.runId || selectedRunId;
            if (!runId) return;
            if (openRunStepsIds.has(runId)) {
              openRunStepsIds.delete(runId);
            } else {
              openRunStepsIds.add(runId);
            }
            renderNow();
            return;
          }
          if (action === "bring-approval-forward") {
            const hid = actionBtn.dataset.helpId || "";
            try {
              if (typeof localStorage !== "undefined") {
                localStorage.setItem("ca.focusApprovalCard", JSON.stringify({ id: hid, at: Date.now() }));
              }
            } catch {
              // Ignore storage write errors
            }
            announceStatus("Answer in the approval card");
            return;
          }
        }

        const stepBtn = e.target.closest("[data-step-id]");
        if (stepBtn) {
          const id = stepBtn.dataset.stepId;
          if (expandedStepIds.has(id)) {
            expandedStepIds.delete(id);
          } else {
            expandedStepIds.add(id);
          }
          renderNow();
          return;
        }

        const runBtn = e.target.closest("[data-run-id]");
        if (runBtn) {
          selectedRunId = runBtn.dataset.runId;
          renderNow();
        }
      });

      panelView.addEventListener("contextmenu", (e) => {
        if (viewMode !== "list") return;
        const rowEl = e.target.closest("[data-row-key]");
        if (!rowEl) return;
        const rowKey = rowEl.dataset.rowKey || "";
        if (!rowKey) return;
        e.preventDefault();
        openRowMenuKey = rowKey;
        confirmDeleteRunId = "";
        renderNow();
      });

      panelView.addEventListener("keydown", (e) => {
        if (e.isComposing || e.keyCode === 229) return;
        if (e.key === "ContextMenu" || (e.shiftKey && e.key === "F10")) {
          if (viewMode === "list") {
            const rowEl = e.target.closest("[data-row-key]");
            const rowKey = rowEl?.dataset?.rowKey || "";
            if (rowKey) {
              e.preventDefault();
              openRowMenuKey = rowKey;
              confirmDeleteRunId = "";
              renderNow();
            }
          }
          return;
        }
        if (e.key !== "Enter" && e.key !== " ") return;
        const roleBtn = e.target.closest('[role="button"][data-action]');
        if (!roleBtn || roleBtn.tagName === "BUTTON") return;
        e.preventDefault();
        roleBtn.click();
      });

      panelView.addEventListener("submit", (e) => {
        if (!e.target || e.target.id !== "agent-inline-form" || !agentFormState) return;
        e.preventDefault();
        const nameInp = document.getElementById("agent-name-input");
        const cleanName = String(nameInp ? nameInp.value : agentFormState.name || "").trim();
        if (!cleanName) {
          agentFormState.name = "";
          agentFormState.error = "Enter a name";
          renderNow();
          requestAnimationFrame(() => {
            const inp = document.getElementById("agent-name-input");
            if (inp) inp.focus();
          });
          return;
        }
        const primary = getPrimaryAgentRowIdentity();
        const existingAgents = readCreatedAgents();
        const lowerTarget = cleanName.toLowerCase();
        const clash =
          primary.name.trim().toLowerCase() === lowerTarget ||
          existingAgents.some(
            (a) => a.id !== agentFormState.agentId && a.name.trim().toLowerCase() === lowerTarget
          );
        if (clash) {
          agentFormState.name = cleanName;
          agentFormState.error = "That name is already used";
          renderNow();
          requestAnimationFrame(() => {
            const inp = document.getElementById("agent-name-input");
            if (inp) {
              inp.focus();
              inp.select();
            }
          });
          return;
        }

        const sw = WorkspaceAdapter.normalizeAgentSwatch(agentFormState.swatch, 0);
        if (agentFormState.mode === "edit") {
          const updated = existingAgents.map((a) =>
            a.id === agentFormState.agentId ? { ...a, name: cleanName, swatch: sw.key } : a
          );
          writeCreatedAgents(updated);
          agentFormState = null;
          announceStatus(`Saved ${cleanName}`);
          renderNow();
          if (viewMode === "chat" && promptInput) promptInput.focus();
          return;
        }

        const newId = `ag-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`;
        writeCreatedAgents([
          ...existingAgents,
          { id: newId, name: cleanName, swatch: sw.key, thread: "", threads: [] },
        ]);
        agentFormState = null;
        openAgentConversation(newId, { render: true });
        announceStatus(`Created ${cleanName}`);
        requestAnimationFrame(() => {
          if (promptInput) promptInput.focus();
        });
      });

      /* ---------------- POLLING ---------------- */
      async function pollAll() {
        if (!Transport.isConnected()) {
          connectionStatus = "disconnected";
          renderNow();
          return;
        }

        try {
          const [runsResp, helpResp, agentsResp] = await Promise.all([
            Transport.request("GET", "/api/runs"),
            Transport.request("GET", "/api/help"),
            Transport.request("GET", "/api/agents").catch(() => ({})),
          ]);

          const nextRuns = Array.isArray(runsResp) ? runsResp : [];
          const nextHelp = Array.isArray(helpResp) ? helpResp : [];
          const nextAgents = agentsResp && typeof agentsResp === "object" ? agentsResp : {};

          /* Fetch incremental event details for active/selected runs (including nested children) */
          const rawByIdPoll = new Map(nextRuns.map((r) => [r.id, r]));
          const rootOfRun = (r) => {
            let cur = r;
            const seen = new Set();
            while (cur && cur.parent && rawByIdPoll.has(cur.parent) && !seen.has(cur.id)) {
              seen.add(cur.id);
              cur = rawByIdPoll.get(cur.parent);
            }
            return cur ? cur.id : r.id;
          };
          const parents = nextRuns.filter((r) => !r.parent || !rawByIdPoll.has(r.parent));
          const focusParentId =
            (selectedRunId && parents.some((p) => p.id === selectedRunId) && selectedRunId) ||
            parents[0]?.id ||
            null;

          const detailTargets = nextRuns.filter((r) => {
            const rootId = rootOfRun(r);
            return (
              rootId === focusParentId ||
              !r.parent ||
              (r.state !== "done" && r.state !== "failed") ||
              !detailsById[r.id]
            );
          });

          await Promise.all(
            detailTargets.map(async (r) => {
              const existing = detailsById[r.id];
              const since = existing ? existing.events.length : 0;
              if (existing && existing.n_events === r.n_events && (r.state === "done" || r.state === "failed")) {
                return;
              }
              try {
                const view = await Transport.request(
                  "GET",
                  `/api/runs/${encodeURIComponent(r.id)}?since=${since}`
                );
                if (existing && since > 0 && Array.isArray(view.events)) {
                  view.events = [...existing.events, ...view.events];
                }
                detailsById[r.id] = view;
              } catch {
                // Keep previous detail if transient failure
              }
            })
          );

          const costTargets = parents.filter((p) => {
            const isFinishedParent = p.state === "done" || p.state === "failed";
            if (!isFinishedParent) return true;
            return !finalCostsFetched.has(p.id);
          });
          if (costTargets.length) {
            await Promise.all(
              costTargets.map(async (p) => {
                const wasFinished = p.state === "done" || p.state === "failed";
                try {
                  const costResp = await Transport.request(
                    "GET",
                    `/api/runs/${encodeURIComponent(p.id)}/cost`
                  );
                  if (costResp && typeof costResp === "object") {
                    costsById[p.id] = costResp;
                  }
                  if (wasFinished) finalCostsFetched.add(p.id);
                } catch {
                  if (wasFinished) finalCostsFetched.add(p.id);
                }
              })
            );
          }

          const probeKey = getProbeConnectionKey();
          if (probeKey && stopProbeKey !== probeKey) {
            try {
              await Transport.request("POST", "/api/runs/__ca_probe_nonexistent__/stop", {});
              stopRouteSupported = true;
              stopProbeKey = probeKey;
            } catch (err) {
              const errMsg = String(err?.data?.error || err?.message || "").toLowerCase();
              if (err?.status === 404 && errMsg === "not found") {
                stopRouteSupported = false;
                stopProbeKey = probeKey;
              } else if (err?.status === 400 || (err?.status === 404 && errMsg && errMsg !== "not found")) {
                stopRouteSupported = true;
                stopProbeKey = probeKey;
              } else if (err?.status && err.status !== 403) {
                stopRouteSupported = false;
                stopProbeKey = probeKey;
              }
            }
          }

          if (probeKey && (!memoryRouteMissing || memoryProbeKey !== probeKey)) {
            try {
              const memResp = await Transport.request("GET", "/api/memory");
              const rawList = Array.isArray(memResp)
                ? memResp
                : Array.isArray(memResp?.items)
                ? memResp.items
                : Array.isArray(memResp?.memories)
                ? memResp.memories
                : [];
              memoryItems = rawList.filter((m) => m && m.id != null);
              memoryRouteMissing = false;
              memoryProbeKey = probeKey;
            } catch (err) {
              const errMsg = String(err?.data?.error || err?.message || "").toLowerCase();
              if (err?.status === 404 && errMsg === "not found") {
                memoryRouteMissing = true;
                memoryProbeKey = probeKey;
                memoryItems = [];
              }
            }
          }

          for (const [aid, info] of Object.entries(nextAgents)) {
            if (info && typeof info === "object") {
              rememberedAgentsById[aid] = info;
            }
          }

          /* Fetch transcript for the focused run thread and recover agent identities/colors */
          const transcriptTargets = parents.filter((p) => {
            const isActive = p.state !== "done" && p.state !== "failed";
            if (p.id === focusParentId && (isActive || !Array.isArray(transcriptsById[p.id]) || dirtyTranscriptRunIds.has(p.id))) {
              return true;
            }
            if (!isActive && Array.isArray(transcriptsById[p.id])) return false;
            const groupIds = nextRuns.filter((r) => r.id === p.id || r.parent === p.id).map((r) => r.id);
            const missingColor = groupIds.some((gid) => {
              const live = nextAgents[gid];
              const rem = rememberedAgentsById[gid];
              return !(live && (live.color || live.body)) && !(rem && (rem.color || rem.body));
            });
            return missingColor;
          });
          if (transcriptTargets.length) {
            await Promise.all(
              transcriptTargets.map(async (p) => {
                try {
                  const rows = await Transport.request(
                    "GET",
                    `/api/runs/${encodeURIComponent(p.id)}/transcript`
                  );
                  if (Array.isArray(rows)) {
                    transcriptsById[p.id] = rows;
                    dirtyTranscriptRunIds.delete(p.id);
                    for (const row of rows) {
                      if (row && row.role === "agent" && row.agent && (row.color || row.body)) {
                        const info = {
                          name: String(row.agent).trim(),
                          color: row.color || row.body,
                          edge: row.edge || "",
                          ink: row.ink || "",
                        };
                        if (row.run && !rememberedAgentsById[row.run]) {
                          rememberedAgentsById[row.run] = info;
                        }
                        if (!rememberedAgentsById[`agent:${info.name}`]) {
                          rememberedAgentsById[`agent:${info.name}`] = info;
                        }
                      }
                    }
                  }
                } catch {
                  // Ignore missing transcript endpoint or transient errors
                }
              })
            );
          }

          rawRuns = nextRuns;
          pendingHelp = nextHelp;
          agentsById = nextAgents;
          hasLoadedOnce = true;
          connectionStatus = "connected";
          connectionError = "";
          const checkVm = WorkspaceAdapter.mapRuns([...optimisticRuns, ...rawRuns], detailsById, pendingHelp, {
            connectionStatus,
            connectionError,
            isSampleData,
            agentsById,
            rememberedAgentsById,
            costsById,
            transcriptsById,
          });
          if (!hasInitializedFailureBaseline) {
            hasInitializedFailureBaseline = true;
            if (!fixtureParam) {
              let baselineChanged = false;
              for (const r of checkVm.runs) {
                if (r.isRealFailure && !seenFailedRuns.has(r.id)) {
                  seenFailedRuns.add(r.id);
                  baselineChanged = true;
                }
              }
              if (baselineChanged) persistSeenFailedRuns();
            } else {
              const unseenFirst = checkVm.runs.find((r) => r.isRealFailure && !isFailedRunSeen(r.id));
              if (unseenFirst && getCurrentState() === "collapsed") {
                triggerPillFailureNotice(unseenFirst);
              }
            }
          } else {
            const newlyFailed = checkVm.runs.find((r) => r.isRealFailure && !isFailedRunSeen(r.id));
            if (newlyFailed) {
              if (getCurrentState() === "expanded" && viewMode === "chat" && selectedRunId === newlyFailed.id) {
                markFailedRunSeen(newlyFailed.id);
              } else {
                triggerPillFailureNotice(newlyFailed);
              }
            }
          }
          processSpokenReplies(nextRuns);
          announceRunTransitions(checkVm);
          lastPrimaryAgentRaw = readPrimaryAgentStorageRaw();
          renderNow();
        } catch (err) {
          if (err.code === "AUTH") {
            Transport.clearConnection();
            rememberedAgentsById = {};
            costsById = {};
            resetCapabilityState();
            connectionStatus = "disconnected";
            connectionError = "Paste the address ComputerAnything printed";
          } else {
            connectionStatus = hasLoadedOnce ? "stale" : "disconnected";
          }
          renderNow();
        }
      }

      function processSpokenReplies(runsList) {
        const list = Array.isArray(runsList) ? runsList : [];
        const newSpeaks = [];
        const newResults = [];

        for (const r of list) {
          const detail = detailsById[r.id];
          const evs = Array.isArray(detail?.events) ? detail.events : [];
          evs.forEach((ev, idx) => {
            if (!ev) return;
            const isExplicitSpeak = ev.kind === "speak" || (ev.kind === "msg" && ev.msg_kind === "speak");
            const isResultReply =
              ev.kind === "msg" &&
              ev.msg_kind === "result" &&
              (ev.role === "assistant" || ev.role === "agent");
            if (!isExplicitSpeak && !isResultReply) return;

            const rawText = String(ev.text || ev.msg || ev.message || "").trim();
            if (!rawText) return;
            const key = `${r.id}:${idx}:${ev.kind}:${ev.msg_kind || ""}`;
            if (seenSpokenEventKeys.has(key)) return;
            seenSpokenEventKeys.add(key);

            if (!hasInitializedSpokenBaseline) return;
            if (isExplicitSpeak) {
              newSpeaks.push(rawText);
            } else {
              newResults.push({ role: ev.role, text: rawText });
            }
          });
        }

        if (!hasInitializedSpokenBaseline) {
          hasInitializedSpokenBaseline = true;
          return;
        }
        if (isSampleData || !hasShellBridge()) return;

        let chosenText = "";
        if (newSpeaks.length) {
          chosenText = newSpeaks[newSpeaks.length - 1];
        } else if (newResults.length) {
          const specific = newResults.filter((m) => m.text !== "Finished.");
          const pool = specific.length ? specific : newResults;
          chosenText = pool[pool.length - 1].text;
        }
        if (chosenText) {
          Transport.post("speak", { text: chosenText });
        }
      }

      if (typeof ResizeObserver !== "undefined") {
        const ro = new ResizeObserver(() => syncSizeAndBridge());
        ro.observe(panelView);
      }

      window.__ca = {
        Transport,
        addAttachments,
        createAttachmentController,
        submitTaskRequest,
        setState,
        escapeHtml,
        syncSizeAndBridge,
        getCurrentState,
        resolvePrimaryAgent: resolvePrimaryAgentDisplay,
        getApprovalKindWarning: WorkspaceAdapter.getApprovalKindWarning,
        isMoneyOrSendApproval: WorkspaceAdapter.isMoneyOrSendApproval,
        formatApprovalQuestionPlain: WorkspaceAdapter.formatApprovalQuestionPlain,
        actorLabelForRole: WorkspaceAdapter.actorLabelForRole,
      };

      function syncPrimaryAgentPrefFromStorage() {
        const currentRaw = readPrimaryAgentStorageRaw();
        if (currentRaw === lastPrimaryAgentRaw) return false;
        lastPrimaryAgentRaw = currentRaw;
        renderNow();
        return true;
      }

      window.addEventListener("storage", (e) => {
        if (!e.key || e.key === "ca.primaryAgent") {
          lastPrimaryAgentRaw = readPrimaryAgentStorageRaw();
          renderNow();
        }
        if (!e.key || e.key === "ca.focusTarget") {
          applyStoredFocusTarget();
        }
      });

      window.addEventListener("focus", () => {
        applyStoredFocusTarget();
        if (syncPrimaryAgentPrefFromStorage()) return;
        if (hasLoadedOnce) renderNow();
      });

      window.addEventListener("shell-event", (e) => {
        const msg = e.detail || {};
        if (msg.type === "hotkey") {
          if (viewMode === "list") {
            const convs = lastViewModel ? getConversationsForVm(lastViewModel) : null;
            const activeConv = convs ? resolveActiveConversation(convs) : null;
            const targetId = activeConv ? activeConv.id : (readLastAgentId() || "__primary__");
            openAgentConversation(targetId, { render: true });
          }
          setState("expanded", { instant: true });
          if (promptInput && viewMode === "chat") {
            promptInput.focus();
            setTimeout(() => {
              if (promptInput && viewMode === "chat") promptInput.focus();
            }, 0);
          }
        }
        if (msg.type === "primaryAgentUpdated") {
          const payload = msg.primaryAgent && typeof msg.primaryAgent === "object"
            ? msg.primaryAgent
            : { alias: msg.alias, swatch: msg.swatch };
          try {
            if (typeof localStorage !== "undefined" && (typeof payload.alias === "string" || typeof payload.swatch === "string")) {
              const prevRaw = readPrimaryAgentStorageRaw();
              const prevObj = prevRaw ? JSON.parse(prevRaw) : {};
              const nextObj = {
                alias: typeof payload.alias === "string" ? payload.alias : (prevObj.alias || ""),
                swatch: typeof payload.swatch === "string" ? payload.swatch : (prevObj.swatch || ""),
              };
              localStorage.setItem("ca.primaryAgent", JSON.stringify(nextObj));
            }
          } catch {
            // Ignore storage errors when syncing shell-broadcast primary agent pref
          }
          lastPrimaryAgentRaw = readPrimaryAgentStorageRaw();
          renderNow();
        }
        if (msg.type === "filesDropped" && Array.isArray(msg.files)) {
          if (document.body.dataset.mode === "chat") {
            if (typeof window.__caOnChatFilesDropped === "function") {
              window.__caOnChatFilesDropped(msg.files);
            }
          } else if (!document.body.dataset.mode) {
            if (getCurrentState() === "collapsed") setState("expanded", { instant: true });
            addAttachments(msg.files);
          }
        }
        if (msg.type === "voiceState") {
          if (typeof msg.speechAvailable === "boolean") speechAvailable = msg.speechAvailable;
          if (typeof msg.onDevice === "boolean") onDeviceSpeech = msg.onDevice;
          voiceState = msg.state || (msg.isDictating ? "listening" : "idle");
          voiceReason = msg.reason || "";
          voiceNextStep = msg.nextStep || "";
          if (voiceState === "idle") {
            dictationBaseText = promptInput.value.trimEnd();
          }
          renderVoiceStatusBar();
        }
        if (msg.type === "voiceTranscript") {
          const spokenChunk = String(msg.text || "").trim();
          const combined = dictationBaseText
            ? (spokenChunk ? `${dictationBaseText} ${spokenChunk}` : dictationBaseText)
            : spokenChunk;
          promptInput.value = combined;
          syncPromptFieldState();
          if (msg.isFinal) {
            dictationBaseText = promptInput.value.trimEnd();
          }
        }
        if (msg.type === "ttsState") {
          ttsSpeaking = Boolean(msg.speaking);
          ttsSpeakText = msg.text ? String(msg.text) : "";
          renderVoiceStatusBar();
          if (lastViewModel) {
            renderPill(lastViewModel);
            renderPanel(lastViewModel);
          }
        }
      });

      async function boot() {
        const mode = params.get("shell");
        if (mode === "chat" || mode === "notes") {
          document.body.dataset.mode = mode;
          const state = await Transport.init().catch(() => ({ connected: false }));
          /* the view code is in the next <script>; wait for it to be parsed */
          const start = () => window.__caBootView && window.__caBootView(mode, state);
          if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start);
          else start();
          return;
        }
        syncSizeAndBridge(true);
        try {
          const state = await Transport.init();
          isSampleData = state.isSampleData;
          if (fixtureParam) {
            fixtureSeenFailedIds = Array.isArray(state.seenFailedRunIds) ? state.seenFailedRunIds : [];
            seenFailedRuns = readSeenFailedRuns();
            fixtureCreatedAgentsOverride = Array.isArray(state.caAgents) ? state.caAgents : null;
            fixturePrimaryThreadOverride = state.primaryThread ? String(state.primaryThread) : "";
            fixtureLastAgentIdOverride = state.lastAgentId ? String(state.lastAgentId) : "";
          }
          const initialAgentId = readLastAgentId();
          if (initialAgentId) selectedAgentId = initialAgentId;
          speechAvailable = Boolean(state.speechAvailable);
          onDeviceSpeech = Boolean(state.onDeviceSpeech);
          if (state.isDictating) voiceState = "listening";
          ttsSpeaking = Boolean(state.isSpeaking);
          ttsSpeakText = state.speakText || "";
          renderVoiceStatusBar();
          if (state.connected) {
            if (Array.isArray(state.initialDroppedFiles) && state.initialDroppedFiles.length) {
              addAttachments(state.initialDroppedFiles);
            }
            await pollAll();
          } else {
            connectionStatus = "disconnected";
            renderNow();
          }
        } catch (err) {
          connectionStatus = "disconnected";
          connectionError = err.message || "Could not start workspace";
          renderNow();
        }
        setInterval(pollAll, 1000);
        setInterval(() => {
          syncPrimaryAgentPrefFromStorage();
          if (!lastViewModel) return;
          const isExpanded = getCurrentState() === "expanded";
          const pendingRun = lastViewModel.pendingHelpRunId
            ? lastViewModel.runs.find((r) => r.id === lastViewModel.pendingHelpRunId)
            : null;
          const activeRun = lastViewModel.runs.find((r) => r.id === selectedRunId) || lastViewModel.runs[0];
          if (!isExpanded && !pendingRun) return;
          const hasActiveHelp = Boolean(
            (activeRun && activeRun.pendingHelp.some((h) => !h.isExpired)) ||
            (pendingRun && pendingRun.pendingHelp.some((h) => !h.isExpired))
          );
          const hasLiveStep = Boolean(isExpanded && activeRun && activeRun.liveStep);
          if (!hasActiveHelp && !hasLiveStep) return;
          const vmNow = WorkspaceAdapter.mapRuns([...optimisticRuns, ...rawRuns], detailsById, pendingHelp, {
            connectionStatus,
            connectionError,
            isSampleData,
            agentsById,
            rememberedAgentsById,
            costsById,
            transcriptsById,
          });
          lastViewModel = vmNow;
          renderPill(vmNow);
          if (isExpanded && !updateLiveTicksInPlace(vmNow)) {
            renderPanel(vmNow);
          }
        }, 250);
      }

      boot();
    })();
  </script>

  <script>
    /* Views added on the shared workspace: file search, analytics, settings, chat windows, notifications.
       They reuse the shell transport above (window.__ca) and its styles; the backend does all the work. */
    (function () {
      const ca = () => window.__ca;
      const $ = (id) => document.getElementById(id);
      const esc = (v) => ca().escapeHtml(v);
      const req = (method, path, body) =>
        ca().Transport.request(method, path, body === undefined ? {} : { jsonBody: body });
      const money = (n) => (n == null ? "—" : "$" + Number(n).toFixed(Number(n) < 0.1 ? 4 : 2));
      const paint = (c) => (c ? ` style="color:${esc(c)}"` : "");

      /* ---------------- file search (attach menu: Search files…) ---------------- */
      let searchSeq = 0;
      let searchTimer = null;
      let hits = [];
      window.__caOpenFileSearch = function () {
        $("file-search-row").classList.remove("hidden");
        ca().syncSizeAndBridge();
        requestAnimationFrame(() => $("file-search-input").focus());
      };
      function closeSearch() {
        $("file-search-row").classList.add("hidden");
        $("file-search-input").value = "";
        $("file-search-results").innerHTML = "";
        hits = [];
        ca().syncSizeAndBridge();
      }
      function pick(i) {
        const h = hits[i];
        if (!h) return;
        ca().addAttachments([{ id: h.path, name: h.name, kind: "file", path: h.path }]);
        closeSearch();
        $("prompt-input").focus();
      }
      $("file-search-input")?.addEventListener("input", (e) => {
        clearTimeout(searchTimer);
        const q = e.target.value.trim();
        searchTimer = setTimeout(async () => {
          const mine = ++searchSeq;
          const box = $("file-search-results");
          if (q.length < 2) {
            box.innerHTML = "";
            ca().syncSizeAndBridge();
            return;
          }
          box.innerHTML = `<div class="timeline-fact">Searching…</div>`;
          try {
            const found = await req("GET", "/api/files?q=" + encodeURIComponent(q));
            if (mine !== searchSeq) return;
            hits = Array.isArray(found) ? found : [];
            box.innerHTML = hits.length
              ? hits.map((h, i) => `
                  <button type="button" class="past-run-btn file-hit" role="option" data-hit="${i}">
                    <span>${esc(h.name)}</span><span class="file-hit-where">${esc(h.where)}</span>
                  </button>`).join("")
              : `<div class="timeline-fact">No file names match “${esc(q)}”</div>`;
          } catch (err) {
            box.innerHTML = `<div class="state-text state-neutral">Search unavailable: ${esc(err.message)}</div>`;
          }
          ca().syncSizeAndBridge();
        }, 150);
      });
      $("file-search-input")?.addEventListener("keydown", (e) => {
        if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); closeSearch(); }
        if (e.key === "Enter") { e.preventDefault(); pick(0); }
      });
      $("file-search-results")?.addEventListener("click", (e) => {
        const b = e.target.closest("[data-hit]");
        if (b) pick(Number(b.dataset.hit));
      });

      /* ---------------- views in their own windows ---------------- */
      window.__caBootView = function (mode, state) {
        if (!state || !state.connected) {
          document.body.insertAdjacentHTML("beforeend",
            `<div class="note"><span class="state-text state-warning">Not connected to the agents on this Mac</span></div>`);
          return;
        }
        (mode === "chat" ? bootChat : bootNotes)(state);
      };

      const STATE_WORD = {
        done: ["✓ Done", "state-success"], failed: ["Stopped before finishing", "state-neutral"],
        awaiting_human: ["! Needs you", "state-warning"],
      };

      function bootChat() {
        document.body.insertAdjacentHTML("beforeend", `
          <div class="chat" id="chat-shell">
            <div class="chat-head">
              <span class="chat-title">Chats open in the notch</span>
              <button type="button" class="btn" id="chat-close">Close</button>
            </div>
          </div>`);
        $("chat-close").onclick = () => ca().Transport.post("closeWindow");
      }

      function getHelpRemainingSec(h) {
        if (!h || h.timed_out === true) return 0;
        const nowSec = Date.now() / 1000;
        const askedSec =
          h?.asked != null
            ? Number(h.asked)
            : h?.asked_age_s != null
            ? nowSec - Number(h.asked_age_s)
            : nowSec;
        return Math.max(0, Math.ceil(300 - Math.max(0, nowSec - askedSec)));
      }

      function formatApprovalCardTimer(h) {
        const remaining = getHelpRemainingSec(h);
        if (remaining <= 0) return "Expired";
        const m = Math.floor(remaining / 60);
        const s = String(remaining % 60).padStart(2, "0");
        return `${m}:${s} left`;
      }

      function renderCardChipHtml(name, color) {
        const cleanName = String(name || "Agent").trim();
        const rawHex = String(color || "").trim().toUpperCase();
        const palMap = {
          "#B5D0EB": { bg: "#B5D0EB", ink: "#2F647C" },
          "#EECED6": { bg: "#EECED6", ink: "#963F59" },
          "#C0DED0": { bg: "#C0DED0", ink: "#396C5A" },
          "#E1CDE8": { bg: "#E1CDE8", ink: "#71388B" },
          "#F0D9BE": { bg: "#F0D9BE", ink: "#865733" },
        };
        const pal = palMap[rawHex] || { bg: "#2b2f38", ink: "var(--text-primary)" };
        return `<span class="agent-chip" style="background:${esc(pal.bg)};color:${esc(pal.ink)};border:1px solid rgba(255,255,255,0.16)"><span class="agent-chip-label">${esc(cleanName)}</span></span>`;
      }

      function bootNotes() {
        document.body.insertAdjacentHTML("beforeend", `<div class="notes" id="notes" aria-live="polite"></div>`);
        let lastCardId = "";
        let lastHeight = -1;
        let currentHelpList = [];
        let currentAgentsMap = {};

        function renderCard() {
          const visibleHelp = currentHelpList.filter((h) => h && h.answer == null);
          const active = visibleHelp.find((h) => getHelpRemainingSec(h) > 0) || visibleHelp[0] || null;
          if (!active) {
            $("notes").innerHTML = "";
            lastCardId = "";
            if (lastHeight !== 0) {
              lastHeight = 0;
              ca().Transport.post("resize", { state: "notes", width: 330, height: 0, fresh: false });
            }
            return;
          }
          const resolvePrimary = ca().resolvePrimaryAgent;
          const actorForRole = ca().actorLabelForRole;
          const runAgent = (active.run && currentAgentsMap[active.run]) || {};
          const rawAgentVal = String(active.agent || runAgent.name || "").trim();
          const roleMappedName = /^(orchestrator|cu|qa|dev|marketing)$/i.test(rawAgentVal)
            ? (actorForRole ? actorForRole(rawAgentVal.toLowerCase()) : rawAgentVal)
            : rawAgentVal;
          const rawColor = active.color || runAgent.color || runAgent.body || "";
          const resolved = roleMappedName
            ? (resolvePrimary ? resolvePrimary(roleMappedName, rawColor) : { name: roleMappedName, color: rawColor })
            : { name: "Agent", color: rawColor };
          const isExpired = getHelpRemainingSec(active) <= 0 || active.timed_out === true;
          const kindWarning = ca().getApprovalKindWarning ? ca().getApprovalKindWarning(active.kind) : "";
          const plainQuestion = ca().formatApprovalQuestionPlain
            ? ca().formatApprovalQuestionPlain(active.question || "Approval needed")
            : (active.question || "Approval needed");
          const moneyOrSend = Boolean(ca().isMoneyOrSendApproval && ca().isMoneyOrSendApproval(active));
          const rawDetail = active.detail
            ? (typeof active.detail === "string" ? active.detail.trim() : JSON.stringify(active.detail))
            : "";
          const detailLine = isExpired
            ? "No answer received within 5m · Declined."
            : rawDetail
            ? `${rawDetail.replace(/[.]+$/, "")}. Silence means no.`
            : "Silence means no.";
          const options = Array.isArray(active.options)
            ? active.options.filter((opt) => opt != null && String(opt).trim() !== "")
            : [];
          const isPositiveOpt = (opt) => /^(yes|approve|approved|allow|allowed|ok|continue|done|confirm|confirmed|send|pay)$/i.test(String(opt).trim());
          const isNegativeOpt = (opt) => /^(no|deny|denied|decline|declined|reject|rejected|cancel|cancelled|canceled)$/i.test(String(opt).trim());
          const optionRank = (opt) => (isNegativeOpt(opt) ? 0 : isPositiveOpt(opt) ? 2 : 1);
          const orderedOptions = [...options].sort((a, b) => optionRank(a) - optionRank(b));
          const actionsHtml = !isExpired && orderedOptions.length
            ? `<span class="note-actions">
                ${orderedOptions
                  .map((opt) => {
                    const cls = isPositiveOpt(opt) ? (moneyOrSend ? "btn btn-money" : "btn btn-primary") : "btn";
                    const label = String(opt).charAt(0).toUpperCase() + String(opt).slice(1);
                    return `<button type="button" class="${cls}" data-help="${esc(active.id)}" data-choice="${esc(opt)}">${esc(label)}</button>`;
                  })
                  .join("")}
              </span>`
            : "";
          const cardClasses = `note${moneyOrSend ? " is-money" : ""}${isExpired ? " is-expired" : ""}`;
          $("notes").innerHTML = `
            <div class="${cardClasses}" data-help-card="${esc(active.id)}">
              <div>${renderCardChipHtml(resolved.name, resolved.color)}</div>
              ${kindWarning ? `<div class="note-warning">${esc(kindWarning)}</div>` : ""}
              <div class="note-q">${esc(plainQuestion)}</div>
              <div class="note-d">${esc(detailLine)}</div>
              <div class="note-row">
                <span class="note-timer">${esc(formatApprovalCardTimer(active))}</span>
                ${actionsHtml}
              </div>
            </div>
          `;
          const isFresh = active.id !== lastCardId;
          lastCardId = String(active.id || "");
          const height = $("notes").scrollHeight + 4;
          if (height !== lastHeight || isFresh) {
            lastHeight = height;
            ca().Transport.post("resize", { state: "notes", width: 330, height, fresh: isFresh });
          }
        }

        async function poll() {
          let help = [], agents = {};
          try {
            [help, agents] = await Promise.all([
              req("GET", "/api/help"),
              req("GET", "/api/agents").catch(() => ({})),
            ]);
          } catch {
            return; /* keep what is on screen; the next poll retries */
          }
          currentHelpList = Array.isArray(help) ? help : [];
          if (agents && typeof agents === "object") currentAgentsMap = agents;
          renderCard();
        }

        document.addEventListener("click", async (e) => {
          const t = e.target.closest("button");
          if (!t || t.disabled) return;
          if (t.dataset.help) {
            const helpId = t.dataset.help;
            const choice = t.dataset.choice || "";
            const targetItem = currentHelpList.find((h) => h && String(h.id) === String(helpId));
            const allowedOptions = Array.isArray(targetItem?.options) ? targetItem.options.map((o) => String(o)) : [];
            if (!targetItem || (allowedOptions.length && !allowedOptions.includes(choice))) return;
            document.querySelectorAll(`button[data-help="${CSS.escape ? CSS.escape(helpId) : helpId}"]`).forEach((btn) => {
              btn.disabled = true;
            });
            targetItem.answer = choice;
            renderCard();
            await req("POST", `/api/help/${encodeURIComponent(helpId)}`, { choice }).catch(() => {});
            poll();
          }
        });
        poll();
        setInterval(poll, 1000);
        setInterval(() => {
          if (currentHelpList.length) renderCard();
        }, 1000);
        window.addEventListener("storage", (e) => {
          if (e.key !== "ca.focusApprovalCard" && e.key !== null) return;
          renderCard();
          const cardEl = $("notes")?.querySelector("[data-help-card]");
          if (!cardEl) return;
          const height = $("notes").scrollHeight + 4;
          ca().Transport.post("resize", { state: "notes", width: 330, height, fresh: true });
          cardEl.classList.add("is-focused");
          const firstBtn = cardEl.querySelector("button:not(:disabled)");
          if (firstBtn) firstBtn.focus();
          setTimeout(() => cardEl.classList.remove("is-focused"), 900);
        });
      }
    })();
  </script>
</body>
</html>
