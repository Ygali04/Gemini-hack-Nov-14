      const PRIMARY_AGENT_SWATCHES = [
        { key: "lagoon", name: "Lagoon", color: "#B5D0EB", edge: "#D6E9FF", ink: "#2F647C" },
        { key: "rose",   name: "Rose",   color: "#EECED6", edge: "#FFF0F1", ink: "#963F59" },
        { key: "mint",   name: "Mint",   color: "#C0DED0", edge: "#E6FFF0", ink: "#396C5A" },
        { key: "lilac",  name: "Lilac",  color: "#E1CDE8", edge: "#FBE8F7", ink: "#71388B" },
        { key: "amber",  name: "Amber",  color: "#F0D9BE", edge: "#FFFCE0", ink: "#865733" },
      ];

      function resolvePrimaryAgentDisplay(backendName, backendColor) {
        const cleanName = String(backendName || "").trim();
        const result = { name: cleanName, color: backendColor || "" };
        if (cleanName !== "ComputerAnything") return result;
        try {
          const raw = typeof localStorage !== "undefined" ? localStorage.getItem("ca.primaryAgent") : null;
          if (!raw) return result;
          const parsed = JSON.parse(raw);
          if (!parsed || typeof parsed !== "object") return result;
          const alias = typeof parsed.alias === "string" ? parsed.alias.trim() : "";
          const swatchVal = String(parsed.swatch || "").trim();
          const lower = swatchVal.toLowerCase();
          const upper = swatchVal.toUpperCase();
          const swatch = swatchVal
            ? PRIMARY_AGENT_SWATCHES.find((s) => s.key === lower || s.name.toLowerCase() === lower || s.color === upper) || null
            : null;
          if (alias) result.name = alias;
          if (swatch) result.color = swatch.color;
        } catch {
          // Ignore invalid stored primaryAgent preference
        }
        return result;
      }

      function getProbeConnectionKey() {
        if (!Transport.isConnected()) return "";
        return fixtureParam ? `fixture:${fixtureParam}` : "live";
      }

      function resetCapabilityState() {
        finalCostsFetched.clear();
        stopRouteSupported = false;
        stopProbeKey = "";
        stopNoticesByRunId.clear();
        pendingStopIds.clear();
        memoryItems = [];
        memoryRouteMissing = false;
        memoryProbeKey = "";
        pendingUndoMemoryIds.clear();
      }

      function buildStopSummary(runId, resp) {
        if (resp && typeof resp.summary === "string" && resp.summary.trim()) {
          return resp.summary.trim();
        }
        if (resp && typeof resp.changed === "string" && resp.changed.trim()) {
          return `Stopped. ${resp.changed.trim()}`;
        }
        const targetIds = [runId, ...rawRuns.filter((r) => r.parent === runId).map((r) => r.id)];
        let patchCount = 0;
        let actCount = 0;
        for (const id of targetIds) {
          const evs = Array.isArray(detailsById[id]?.events) ? detailsById[id].events : [];
          for (const ev of evs) {
            if (ev?.kind === "patch" && ev.applied === true) patchCount += 1;
            else if (ev?.kind === "act") actCount += 1;
          }
        }
        if (patchCount > 0) {
          return `Stopped. ${patchCount} change${patchCount === 1 ? "" : "s"} already applied.`;
        }
        if (actCount > 0) {
          return `Stopped. ${actCount} action${actCount === 1 ? "" : "s"} already ran.`;
        }
        return "Stopped. Nothing was changed.";
      }

      function getVisibleMemoriesForRun(activeRun) {
        if (!activeRun || !Array.isArray(memoryItems) || !memoryItems.length) return [];
        const groupIds = new Set([activeRun.id, ...activeRun.steps.map((s) => s.id)]);
        return memoryItems.filter((m) => m && m.id && (!m.run || groupIds.has(m.run)));
      }

      const prefersReducedMotion = () =>
        Boolean(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

      function stopStepReplay() {
        if (replayCursor.timerId) {
          clearInterval(replayCursor.timerId);
        }
        replayCursor = { runId: null, stepIndex: -1, timerId: null };
      }

      function startStepReplay(runId, totalSteps) {
        stopStepReplay();
        if (!runId || !totalSteps || prefersReducedMotion()) {
          renderNow();
          return;
        }
        replayCursor = { runId, stepIndex: 0, timerId: null };
        renderNow();
        replayCursor.timerId = setInterval(() => {
          if (replayCursor.runId !== runId || !openReplayRunIds.has(runId)) {
            stopStepReplay();
            return;
          }
          if (replayCursor.stepIndex + 1 >= totalSteps) {
            stopStepReplay();
            renderNow();
            return;
          }
          replayCursor.stepIndex += 1;
          renderNow();
        }, 420);
      }

      function getSharedAgentGlass() {
        if (window.AgentGlass && typeof window.AgentGlass.mountAgentGlass === "function") {
          return window.AgentGlass;
        }
        if (typeof window.mountAgentGlass === "function") {
          return { mountAgentGlass: window.mountAgentGlass };
        }
        return null;
      }

      function destroyAllAgentChips() {
        for (const entry of mountedAgentChips.values()) {
          try {
            entry?.destroy?.();
          } catch {
            // Ignore teardown errors
          }
        }
        mountedAgentChips.clear();
      }

      function mountAllAgentChips() {
        if (getCurrentState() !== "expanded") return;
        const shared = getSharedAgentGlass();
        if (!shared) return;
        const nodes = timelineScroll.querySelectorAll("[data-agent-chip]");
        nodes.forEach((el) => {
          const stepId = el.dataset.agentChip || "";
          if (!stepId || mountedAgentChips.has(stepId)) return;
          if (el.dataset.agentHasColor !== "1") return;
          const name = el.dataset.agentName || "";
          const color = el.dataset.agentColor || "";
          const edge = el.dataset.agentEdge || "";
          const ink = el.dataset.agentInk || "";
          try {
            el.classList.add("has-glass");
            const inst = shared.mountAgentGlass(
              el,
              { id: stepId, name, color, edge, ink },
              { shape: "capsule" }
            );
            if (inst && !inst.isFallback) {
              mountedAgentChips.set(stepId, inst);
            } else if (inst) {
              el.classList.remove("has-glass");
              mountedAgentChips.set(stepId, inst);
            } else {
              el.classList.remove("has-glass");
            }
          } catch {
            el.classList.remove("has-glass");
          }
        });
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function getCurrentState() {
        return document.body.dataset.state === "expanded" ? "expanded" : "collapsed";
      }

      function syncSizeAndBridge(forcePost = false, instant = false) {
        const view = params.get("shell");
        if (view === "chat" || view === "notes") return; /* those windows size themselves; never resize the notch */
        const state = getCurrentState();
        let width = 280;
        let height = 36;

        if (state === "expanded") {
          width = hasShellBridge() ? 480 : Math.min(480, Math.max(320, window.innerWidth || 480));
          const naturalHeight = panelView.scrollHeight;
          height = Math.min(600, Math.max(150, Math.ceil(naturalHeight)));
          notchShell.style.setProperty("--panel-height", `${height}px`);
        }

        if (
          forcePost ||
          lastPostedResize.width !== width ||
          lastPostedResize.height !== height ||
          lastPostedResize.state !== state
        ) {
          lastPostedResize = { width, height, state };
          if (hasShellBridge()) {
            try {
              window.webkit.messageHandlers.shell.postMessage({
                type: "resize",
                width,
                height,
                state,
                instant: Boolean(instant),
              });
            } catch {
              // Ignore bridge errors
            }
          }
        }
      }

      function setState(nextState, options = {}) {
        const { instant = false } = options;
        const normalized = nextState === "expanded" ? "expanded" : "collapsed";
        if (instant) {
          document.body.classList.add("instant-motion");
        } else {
          document.body.classList.remove("instant-motion");
        }
        document.body.dataset.state = normalized;
        closeAttachMenu();
        syncSizeAndBridge(true, instant);

        if (normalized === "expanded") {
          requestAnimationFrame(() => {
            mountAllAgentChips();
            if (connectionStatus === "disconnected") {
              const connectInput = document.getElementById("connect-url-input");
              if (connectInput) connectInput.focus();
            } else {
              promptInput.focus();
            }
            syncSizeAndBridge(false, instant);
          });
        } else {
          destroyAllAgentChips();
          if (voiceState === "listening") {
            Transport.post("stopDictation");
          }
        }
      }

      function renderVoiceStatusBar() {
        if (micBtn) {
          micBtn.classList.toggle("hidden", !speechAvailable);
          const listening = voiceState === "listening";
          micBtn.classList.toggle("is-listening", listening);
          micBtn.setAttribute("aria-pressed", listening ? "true" : "false");
          micBtn.setAttribute(
            "aria-label",
            listening ? "Stop dictating prompt" : "Dictate prompt with microphone"
          );
          micBtn.title = listening ? "Stop voice input" : "Voice input";
        }
        if (!voiceStatusBar) return;

        const parts = [];
        if (ttsSpeaking) {
          parts.push(`
            <div class="voice-status-main">
              <span class="state-text state-working">&#9679; Speaking</span>
            </div>
            <div class="voice-status-actions">
              <button type="button" id="stop-speaking-btn" class="btn">Stop</button>
            </div>
          `);
        } else if (voiceState === "listening") {
          const modeLabel = onDeviceSpeech ? "Listening on this Mac" : "Listening";
          parts.push(`
            <div class="voice-status-main">
              <span class="state-text state-danger">&#9679; ${escapeHtml(modeLabel)} &middot; speak into prompt, click mic to stop</span>
            </div>
            <div class="voice-status-actions">
              <button type="button" id="stop-dictation-btn" class="btn">Stop</button>
            </div>
          `);
        } else if (voiceState === "requesting_permission") {
          parts.push(`
            <div class="voice-status-main">
              <span>${escapeHtml(voiceReason || "Allow Microphone and Speech Recognition to dictate prompts on this Mac.")}</span>
            </div>
          `);
        } else if (voiceState === "denied" || voiceState === "unavailable" || voiceState === "error") {
          const label = voiceState === "denied" ? "Voice blocked" : voiceState === "unavailable" ? "Voice unavailable" : "Voice error";
          const privacySection = String(voiceReason || "").toLowerCase().includes("microphone")
            ? "Privacy_Microphone"
            : "Privacy_SpeechRecognition";
          parts.push(`
            <div class="voice-status-main">
              <span class="state-text state-warning">! ${escapeHtml(label)}</span>
              <span>${escapeHtml(voiceReason)}${voiceNextStep ? " &middot; " + escapeHtml(voiceNextStep) : ""}</span>
            </div>
            <div class="voice-status-actions">
              ${voiceState === "denied" && hasShellBridge() ? `<button type="button" id="voice-open-settings-btn" class="btn" data-privacy-section="${privacySection}">Settings</button>` : ""}
              <button type="button" id="voice-dismiss-btn" class="btn">Dismiss</button>
            </div>
          `);
        }

        if (!parts.length) {
          voiceStatusBar.innerHTML = "";
          voiceStatusBar.classList.add("hidden");
        } else {
          voiceStatusBar.innerHTML = parts.join("");
          voiceStatusBar.classList.remove("hidden");
        }
        syncSizeAndBridge();
      }

      if (micBtn) {
        micBtn.addEventListener("click", () => {
          if (!hasShellBridge() || !speechAvailable) return;
          if (voiceState === "listening") {
            Transport.post("stopDictation");
          } else {
            dictationBaseText = promptInput.value.trimEnd();
            voiceState = "requesting_permission";
            voiceReason = "Requesting Speech Recognition and Microphone access to dictate into the prompt box.";
            voiceNextStep = "";
            renderVoiceStatusBar();
            Transport.post("startDictation");
          }
        });
      }

      if (voiceStatusBar) {
        voiceStatusBar.addEventListener("click", (e) => {
          if (e.target.closest("#stop-speaking-btn")) {
            Transport.post("stopSpeaking");
            return;
          }
          if (e.target.closest("#stop-dictation-btn")) {
            Transport.post("stopDictation");
            return;
          }
          const settingsBtn = e.target.closest("#voice-open-settings-btn");
          if (settingsBtn) {
            Transport.post("openPrivacySettings", {
              section: settingsBtn.dataset.privacySection || "Privacy_SpeechRecognition",
            });
            return;
          }
          if (e.target.closest("#voice-dismiss-btn")) {
            voiceState = "idle";
            voiceReason = "";
            voiceNextStep = "";
            renderVoiceStatusBar();
          }
        });
      }

      pillTrigger.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          setState("expanded", { instant: true });
        }

      pillTrigger.addEventListener("click", (e) => {
        setState("expanded", { instant: e.detail === 0 });
