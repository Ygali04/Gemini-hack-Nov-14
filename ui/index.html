            viewMode = "chat";
            isComposingNewChat = false;
            saveLastAgentId(selectedAgentId);
            saveLastThreadId(selectedRunId);
          }
          setState("expanded", { instant: true, focusRunId: parsed.run ? String(parsed.run) : "" });
        } catch {
          // Ignore invalid stored focus target
        }
      }

      function resetCapabilityState() {
        finalCostsFetched.clear();
        stopRouteSupported = false;
        stopProbeKey = "";
        stopNoticesByRunId.clear();
        pendingStopIds.clear();
        isStoppingAll = false;
        globalStopSummary = "";
        openOutputPreviewIds.clear();
        copiedItemIds.clear();
        dirtyTranscriptRunIds.clear();
        memoryItems = [];
        memoryRouteMissing = false;
        memoryProbeKey = "";
        pendingUndoMemoryIds.clear();
      }

      function buildStopSummary(runId, resp) {
        if (resp && typeof resp.summary === "string" && resp.summary.trim()) {
          return resp.summary.trim();
        }
        if (resp && typeof resp.changed === "string" && resp.changed.trim()) {
          return `Stopped. ${resp.changed.trim()}`;
        }
        const targetIds = [runId, ...rawRuns.filter((r) => r.parent === runId).map((r) => r.id)];
        let patchCount = 0;
        let actCount = 0;
        for (const id of targetIds) {
          const evs = Array.isArray(detailsById[id]?.events) ? detailsById[id].events : [];
          for (const ev of evs) {
            if (ev?.kind === "patch" && ev.applied === true) patchCount += 1;
            else if (ev?.kind === "act") actCount += 1;
          }
        }
        if (patchCount > 0) {
          return `Stopped. ${patchCount} change${patchCount === 1 ? "" : "s"} already applied.`;
        }
        if (actCount > 0) {
          return `Stopped. ${actCount} action${actCount === 1 ? "" : "s"} already ran.`;
        }
        return "Stopped. Nothing was changed.";
      }

      function getVisibleMemoriesForRun(activeRun) {
        if (!activeRun || !Array.isArray(memoryItems) || !memoryItems.length) return [];
        const groupIds = new Set([activeRun.id, ...activeRun.steps.map((s) => s.id)]);
        return memoryItems.filter((m) => m && m.id && (!m.run || groupIds.has(m.run)));
      }

      const prefersReducedMotion = () =>
        Boolean(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

      function getSharedAgentGlass() {
        if (window.AgentGlass && typeof window.AgentGlass.mountAgentGlass === "function") {
          return window.AgentGlass;
        }
        if (typeof window.mountAgentGlass === "function") {
          return { mountAgentGlass: window.mountAgentGlass };
        }
        return null;
      }

      function destroyAllAgentChips() {
        for (const entry of mountedAgentChips.values()) {
          try {
            entry?.destroy?.();
          } catch {
            // Ignore teardown errors
          }
        }
        mountedAgentChips.clear();
      }

      function mountAllAgentChips() {
        if (getCurrentState() !== "expanded") return;
        const shared = getSharedAgentGlass();
        if (!shared) return;
        const nodes = panelView.querySelectorAll("[data-agent-chip]");
        nodes.forEach((el) => {
          const stepId = el.dataset.agentChip || "";
          if (!stepId || mountedAgentChips.has(stepId)) return;
          if (el.dataset.agentHasColor !== "1") return;
          const name = el.dataset.agentName || "";
          const color = el.dataset.agentColor || "";
          const edge = el.dataset.agentEdge || "";
          const ink = el.dataset.agentInk || "";
          try {
            el.classList.add("has-glass");
            const inst = shared.mountAgentGlass(
              el,
              { id: stepId, name, color, edge, ink },
              { shape: "capsule" }
            );
            if (inst && !inst.isFallback) {
              mountedAgentChips.set(stepId, inst);
            } else if (inst) {
              el.classList.remove("has-glass");
              mountedAgentChips.set(stepId, inst);
            } else {
              el.classList.remove("has-glass");
            }
          } catch {
            el.classList.remove("has-glass");
          }
        });
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function getCurrentState() {
        return document.body.dataset.state === "expanded" ? "expanded" : "collapsed";
      }

      function syncSizeAndBridge(forcePost = false, instant = false) {
        const view = params.get("shell");
        if (view === "chat" || view === "notes") return; /* those windows size themselves; never resize the notch */
        const state = getCurrentState();
        let width = 280;
        let height = 36;

        if (state === "expanded") {
          width = hasShellBridge() ? 480 : Math.min(480, Math.max(320, window.innerWidth || 480));
          const screenH = (typeof window !== "undefined" && (window.screen?.availHeight || window.screen?.height)) || 900;
          const maxPanelHeight = Math.max(240, Math.round(screenH * 0.6));
          notchShell.style.setProperty("--max-panel-height", `${maxPanelHeight}px`);
          const headerVisible = panelHeader && !panelHeader.classList.contains("hidden");
          const sampleVisible = sampleBanner && sampleBanner.style.display !== "none";
          const contentNaturalHeight =
            26 +
            (headerVisible ? panelHeader.offsetHeight + 10 : 0) +
            (sampleVisible ? sampleBanner.offsetHeight + 10 : 0) +
            (timelineScroll ? timelineScroll.scrollHeight : 0) +
            (promptForm ? promptForm.offsetHeight + 10 : 0);
          const naturalHeight = Math.max(panelView.scrollHeight, contentNaturalHeight);
          height = Math.min(maxPanelHeight, Math.max(88, Math.ceil(naturalHeight)));
          notchShell.style.setProperty("--panel-height", `${height}px`);
        }

        if (
          forcePost ||
          lastPostedResize.width !== width ||
          lastPostedResize.height !== height ||
          lastPostedResize.state !== state
        ) {
          lastPostedResize = { width, height, state };
          if (hasShellBridge()) {
            try {
              window.webkit.messageHandlers.shell.postMessage({
                type: "resize",
                width,
                height,
                state,
                instant: Boolean(instant),
              });
            } catch {
              // Ignore bridge errors
            }
          }
        }
      }

      function setState(nextState, options = {}) {
        const { instant = false, focusRunId = "" } = options;
        const normalized = nextState === "expanded" ? "expanded" : "collapsed";
        const prevState = getCurrentState();
        if (instant) {
          document.body.classList.add("instant-motion");
        } else {
          document.body.classList.remove("instant-motion");
        }
        document.body.dataset.state = normalized;
        closeAttachMenu();
        syncSizeAndBridge(true, instant);

        if (normalized === "expanded") {
          const targetPendingId = focusRunId || lastViewModel?.pendingHelpRunId || "";
          if (targetPendingId) {
            selectedRunId = targetPendingId;
            viewMode = "chat";
            isComposingNewChat = false;
            saveLastThreadId(targetPendingId);
            if (lastViewModel) renderNow();
          } else if (pillFailureToast && pillFailureToast.runId) {
            selectedRunId = pillFailureToast.runId;
            viewMode = "chat";
            isComposingNewChat = false;
            saveLastThreadId(selectedRunId);
            markFailedRunSeen(selectedRunId);
            if (lastViewModel) renderNow();
          } else if (lastViewModel && viewMode === "chat") {
            const openRun = lastViewModel.runs.find((r) => r.id === selectedRunId) || lastViewModel.runs[0];
            if (openRun?.isRealFailure && markFailedRunSeen(openRun.id)) {
              renderNow();
            }
          }
          requestAnimationFrame(() => {
            mountAllAgentChips();
            const landedOnApproval = targetPendingId ? focusPendingApprovalInPanel(targetPendingId) : false;
            if (!landedOnApproval) {
              if (connectionStatus === "disconnected") {
                const connectInput = document.getElementById("connect-url-input");
                if (connectInput) connectInput.focus();
              } else {
                promptInput.focus();
              }
            }
            if (prevState !== "expanded" && landedOnApproval) {
              announceStatus("Approval needed");
            }
            syncSizeAndBridge(false, instant);
          });
        } else {
          destroyAllAgentChips();
          if (voiceState === "listening") {
            Transport.post("stopDictation");
          }
        }
      }

      if (micBtn) {

      pillTrigger.addEventListener("keydown", (e) => {

      window.addEventListener("keydown", (e) => {

      function syncPromptFieldState() {
        promptInput.style.height = "20px";
        promptInput.style.height = `${Math.min(80, Math.max(20, promptInput.scrollHeight))}px`;
        syncSizeAndBridge();
      }

      promptInput.addEventListener("input", syncPromptFieldState);
      promptInput.addEventListener("keydown", (e) => {
        if (e.isComposing || e.keyCode === 229) return;
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          promptForm.requestSubmit();
        }
      });

      /* ---------------- ATTACHMENTS ---------------- */
      function describeBrowserFile(file, isDirectory = false) {
        if (!file) return null;
        const name = String(file.name || "file");
        if (isDirectory) {
          return {
            id: `folder-${name}`,
            name,
            kind: "file",
            fileKind: "folder",
            size: 0,
          };
        }
        const size = typeof file.size === "number" && Number.isFinite(file.size) ? file.size : null;
        const dotIdx = name.lastIndexOf(".");
        const ext = dotIdx >= 0 ? name.slice(dotIdx + 1).toLowerCase() : "";
        const mime = String(file.type || "").toLowerCase();

        if (mime.startsWith("image/") || BROWSER_IMAGE_EXTS.has(ext)) {
          let objectUrl = "";
          if (
            (size == null || size <= ATTACHMENT_LIMITS.maxFileBytes) &&
            (BROWSER_PREVIEW_IMAGE_EXTS.has(ext) || /^image\/(png|jpeg|gif|webp|bmp)$/.test(mime)) &&
            typeof URL !== "undefined" &&
            typeof URL.createObjectURL === "function"
          ) {
            objectUrl = URL.createObjectURL(file);
          }
          return {
            id: `file-${name}-${size ?? ""}`,
            name,
            kind: "file",
            fileKind: "image",
            size,
            thumbnail: objectUrl,
            objectUrl,
            file,
          };
        }

        if (ext === "pdf" || mime === "application/pdf") {
          return {
            id: `file-${name}-${size ?? ""}`,
            name,
            kind: "file",
            fileKind: "pdf",
            size,
            textExtracted: false,
            file,
          };
        }

        if ((mime.startsWith("text/") || BROWSER_TEXT_EXTS.has(ext)) && (size == null || size <= 1_000_000)) {
          return {
            id: `file-${name}-${size ?? ""}`,
            name,
            kind: "file",
            fileKind: "text",
            size,
            file,
          };
        }

        return {
          id: `file-${name}-${size ?? ""}`,
          name,
          kind: "file",
          fileKind: "other",
          size,
          file,
        };
      }

      function normalizeIncomingAttachment(raw) {
        if (!raw || typeof raw !== "object") return null;
        const rawPath = typeof raw.path === "string" ? raw.path : "";
        const rawName = typeof raw.name === "string" ? raw.name.trim() : "";
        const fallbackName = rawPath ? rawPath.split("/").pop() || "" : "";
        const name = rawName || fallbackName;
        if (!name) return null;

        if (raw.kind === "link" || raw.fileKind === "link") {
          const url = typeof raw.url === "string" && raw.url.trim() ? raw.url.trim() : name;
          return {
            id: raw.id || `link-${url}`,
            name,
            kind: "link",
            fileKind: "link",
            url,
          };
        }

        const rawKind = typeof raw.fileKind === "string" ? raw.fileKind : raw.kind;
        const fileKind = KNOWN_SHELL_FILE_KINDS.has(rawKind) ? rawKind : null;
        const size =
          typeof raw.size === "number" && Number.isFinite(raw.size) && raw.size >= 0
            ? raw.size
            : typeof raw.file?.size === "number" && Number.isFinite(raw.file.size) && raw.file.size >= 0
            ? raw.file.size
            : null;
        const thumbnail =
          typeof raw.thumbnail === "string" && (raw.thumbnail.startsWith("data:image/") || raw.thumbnail.startsWith("blob:"))
            ? raw.thumbnail
            : "";
        const pageCount =
          typeof raw.pageCount === "number" && Number.isFinite(raw.pageCount) && raw.pageCount >= 0
            ? raw.pageCount
            : null;
        const textExtracted = raw.textExtracted === true;
        const id = raw.id || (rawPath ? `path:${rawPath}` : `file:${name}:${size ?? ""}`);

        return {
          id,
          name,
          kind: "file",
          fileKind,
          size,
          thumbnail,
          pageCount,
          textExtracted,
          path: rawPath,
          file: raw.file || null,
          objectUrl: typeof raw.objectUrl === "string" ? raw.objectUrl : "",
        };
      }

      function getAttachmentRefusalReason(item) {
        if (!item) return "";
        if (item.fileKind === "folder") return ATTACHMENT_LABELS.folder;
        if (typeof item.size === "number" && item.size > ATTACHMENT_LIMITS.maxFileBytes) {
          return ATTACHMENT_LABELS.overSize;
        }
        return "";
      }

      function resolveAttachmentLabel(att, imageIndex) {
        if (!att) return "";
        if (att.kind === "link" || att.fileKind === "link") return ATTACHMENT_LABELS.link;
        if (att.fileKind === "image") {
          return imageIndex < ATTACHMENT_LIMITS.maxImages ? ATTACHMENT_LABELS.imageSee : ATTACHMENT_LABELS.imageLimit;
        }
        if (att.fileKind === "text") return ATTACHMENT_LABELS.textRead;
        if (att.fileKind === "pdf") {
          if (att.textExtracted === true) {
            if (typeof att.pageCount === "number" && att.pageCount > 0) {
              return `Agents read the text · ${att.pageCount} ${att.pageCount === 1 ? "page" : "pages"}`;
            }
            return "Agents read the text";
          }
          return ATTACHMENT_LABELS.nameOnlyUnsupported;
        }
        if (att.fileKind === "other") return ATTACHMENT_LABELS.nameOnlyUnsupported;
        return "";
      }

      function extractDroppedBrowserItems(dataTransfer) {
        const dtItems = Array.from(dataTransfer?.items || []);
        const rawFiles = Array.from(dataTransfer?.files || []);
        if (dtItems.length && typeof dtItems[0].webkitGetAsEntry === "function") {
          const out = [];
          for (let i = 0; i < dtItems.length; i++) {
            const item = dtItems[i];
            if (item.kind !== "file") continue;
            const entry = item.webkitGetAsEntry();
            const file = item.getAsFile();
            if (entry?.isDirectory) {
              out.push(describeBrowserFile({ name: entry.name || file?.name || "Folder" }, true));
            } else if (file) {
              out.push(describeBrowserFile(file, false));
            }
          }
          if (out.length) return out.filter(Boolean);
        }
        return rawFiles.map((f) => describeBrowserFile(f, false)).filter(Boolean);
      }

      function createAttachmentController(cfg) {
        const {
          attachBtn: btnEl,
          attachMenu: menuEl,
          fileInput: fileInputEl,
          linkRow: linkRowEl,
          linkInput: linkInputEl,
          linkAddBtn: linkAddEl,
          linkCancelBtn: linkCancelEl,
          listEl,
          noticeEl,
          dropZone: dropZoneEl,
          onOpenSearch,
          onExpandForDrop,
          onLayoutChange,
          shouldHandleWindowPaste,
        } = cfg;

        let items = [];
        let notices = [];

        function revokeItem(att) {
          if (att?.objectUrl && typeof URL !== "undefined" && typeof URL.revokeObjectURL === "function") {
            URL.revokeObjectURL(att.objectUrl);
          }
        }

        function notifyLayout() {
          if (typeof onLayoutChange === "function") onLayoutChange();
        }

        function closeMenu() {
          if (!menuEl || !btnEl) return;
          menuEl.classList.remove("open");
          btnEl.setAttribute("aria-expanded", "false");
        }

        function closeLinkRow() {
          if (!linkRowEl || !linkInputEl) return;
          linkRowEl.classList.add("hidden");
          linkInputEl.value = "";
          notifyLayout();
        }

        function render() {
          if (noticeEl) {
            if (!notices.length) {
              noticeEl.innerHTML = "";
            } else {
              noticeEl.innerHTML = notices
                .map(
                  (n, idx) => `
                    <div class="attachment-notice-row">
                      <span class="attachment-notice-copy">
                        <span class="state-text state-warning">! ${escapeHtml(n.name)}</span>
                        <span class="attachment-notice-reason">${escapeHtml(n.reason)}</span>
                      </span>
                      <button type="button" class="attachment-remove" data-dismiss-notice="${idx}" aria-label="Dismiss notice for ${escapeHtml(n.name)}">&times;</button>
                    </div>
                  `
                )
                .join("");
            }
          }

          if (listEl) {
            if (!items.length) {
              listEl.innerHTML = "";
            } else {
              let imageIndex = 0;
              listEl.innerHTML = items
                .map((att, idx) => {
                  const isImage = att.fileKind === "image";
                  const label = resolveAttachmentLabel(att, isImage ? imageIndex++ : 0);
                  const hasThumb = Boolean(isImage && att.thumbnail);
                  const thumbHtml = hasThumb
                    ? `<img class="attachment-thumb" src="${escapeHtml(att.thumbnail)}" alt="" />`
                    : "";
                  const labelHtml = label ? `<span class="attachment-label">${escapeHtml(label)}</span>` : "";
                  return `
                    <span class="attachment-token${hasThumb ? " has-thumb" : ""}" data-attachment-kind="${escapeHtml(att.fileKind || att.kind)}">
                      ${thumbHtml}
                      <span class="attachment-meta">
                        <span class="attachment-name" title="${escapeHtml(att.name)}">${escapeHtml(att.name)}</span>
                        ${labelHtml}
                      </span>
                      <button type="button" class="attachment-remove" data-remove-idx="${idx}" aria-label="Remove ${escapeHtml(att.name)}">&times;</button>
                    </span>
                  `;
                })
                .join("");
            }
          }
        }

        function add(rawList) {
          let changed = false;
          const refused = [];
          for (const raw of rawList || []) {
            const norm = normalizeIncomingAttachment(raw);
            if (!norm) continue;
            const refusal = getAttachmentRefusalReason(norm);
            if (refusal) {
              revokeItem(norm);
              refused.push({ name: norm.name, reason: refusal });
              continue;
            }
            if (!items.some((a) => a.id === norm.id)) {
              items.push(norm);
              changed = true;
            } else {
              revokeItem(norm);
            }
          }
          if (refused.length) {
            notices = refused;
            changed = true;
          }
          if (changed) {
            render();
            notifyLayout();
          }
        }

        function takeReadyForSubmit() {
          const ready = [];
          const refused = [];
          for (const att of items) {
            const refusal = getAttachmentRefusalReason(att);
            if (refusal) {
              revokeItem(att);
              refused.push({ name: att.name, reason: refusal });
            } else {
              ready.push(att);
            }
          }
          items = [];
          notices = refused;
          render();
          notifyLayout();
          return ready;
        }

        function restore(restoredItems) {
          if (!Array.isArray(restoredItems) || !restoredItems.length) return;
          for (const att of restoredItems) {
            if (att && !items.some((a) => a.id === att.id)) {
              items.push(att);
            }
          }
          render();
          notifyLayout();
        }

        if (btnEl && menuEl) {
          btnEl.addEventListener("click", (e) => {
            e.stopPropagation();
            const willOpen = !menuEl.classList.contains("open");
            menuEl.classList.toggle("open", willOpen);
            btnEl.setAttribute("aria-expanded", willOpen ? "true" : "false");
            notifyLayout();
          });

          document.addEventListener("click", (e) => {
            if (!menuEl.contains(e.target) && e.target !== btnEl) {
              closeMenu();
            }
          });

          menuEl.addEventListener("click", async (e) => {
            const item = e.target.closest("[data-attach-kind]");
            if (!item) return;
            const kind = item.dataset.attachKind;
            closeMenu();

            if (kind === "search") {
              if (typeof onOpenSearch === "function") onOpenSearch();
              return;
            }

            if (kind === "link") {
              if (linkRowEl && linkInputEl) {
                linkRowEl.classList.remove("hidden");
                notifyLayout();
                requestAnimationFrame(() => linkInputEl.focus());
              }
              return;
            }

            if (hasShellBridge()) {
              const picked = await Transport.pickFiles(kind);
              if (picked && picked.length) add(picked);
              return;
            }

            if (fileInputEl) {
              if (kind === "photo") fileInputEl.setAttribute("accept", "image/*");
              else if (kind === "video") fileInputEl.setAttribute("accept", "video/*");
              else fileInputEl.removeAttribute("accept");
              fileInputEl.click();
            }
          });
        }

        if (linkAddEl && linkInputEl) {
          linkAddEl.addEventListener("click", () => {
            const val = linkInputEl.value.trim();
            if (val) {
              add([{ id: `link-${val}`, name: val, kind: "link", url: val }]);
            }
            closeLinkRow();
          });
          linkInputEl.addEventListener("keydown", (e) => {
            if (e.isComposing || e.keyCode === 229) return;
            if (e.key === "Enter") {
              e.preventDefault();
              linkAddEl.click();
            }
          });
        }

        if (linkCancelEl) {
          linkCancelEl.addEventListener("click", closeLinkRow);
        }

        if (listEl) {
          listEl.addEventListener("click", (e) => {
            const removeBtn = e.target.closest("[data-remove-idx]");
            if (!removeBtn) return;
            const idx = Number(removeBtn.dataset.removeIdx);
            if (!Number.isNaN(idx) && items[idx]) {
              revokeItem(items[idx]);
              items.splice(idx, 1);
              render();
              notifyLayout();
            }
          });
        }

        if (noticeEl) {
          noticeEl.addEventListener("click", (e) => {
            const dismissBtn = e.target.closest("[data-dismiss-notice]");
            if (!dismissBtn) return;
            const idx = Number(dismissBtn.dataset.dismissNotice);
            if (!Number.isNaN(idx)) {
              notices.splice(idx, 1);
              render();
              notifyLayout();
            }
          });
        }

        if (fileInputEl) {
          fileInputEl.addEventListener("change", () => {
            const files = Array.from(fileInputEl.files || []);
            add(files.map((f) => describeBrowserFile(f, false)).filter(Boolean));
            fileInputEl.value = "";
          });
        }

        if (dropZoneEl) {
          dropZoneEl.addEventListener("dragover", (e) => {
            e.preventDefault();
            if (typeof onExpandForDrop === "function") onExpandForDrop();
            dropZoneEl.classList.add("drag-over");
          });

          dropZoneEl.addEventListener("dragleave", (e) => {
            if (!dropZoneEl.contains(e.relatedTarget)) {
              dropZoneEl.classList.remove("drag-over");
            }
          });

          dropZoneEl.addEventListener("drop", (e) => {
            e.preventDefault();
            dropZoneEl.classList.remove("drag-over");
            if (!hasShellBridge()) {
              const dropped = extractDroppedBrowserItems(e.dataTransfer);
              if (dropped.length) {
                add(dropped);
                return;
              }
            }
            const uri = e.dataTransfer?.getData("text/uri-list") || e.dataTransfer?.getData("text/plain");
            if (uri && /^https?:\/\//i.test(uri.trim())) {
              const clean = uri.trim();
              add([{ id: `link-${clean}`, name: clean, kind: "link", url: clean }]);
            }
          });
        }

        if (typeof shouldHandleWindowPaste === "function") {
          window.addEventListener("paste", (e) => {
            if (!shouldHandleWindowPaste()) return;
            if (hasShellBridge()) return;
            const files = Array.from(e.clipboardData?.files || []);
            if (files.length) {
              add(
                files.map((f, i) => {
                  const described = describeBrowserFile(f, false);
                  if (described && !f.name) {
                    described.name = `photo-${Date.now()}-${i + 1}.png`;
                    described.id = `paste-${described.name}-${f.size}`;
                  }
                  return described;
                }).filter(Boolean)
              );
            }
          });
        }

        return {
          add,
          closeMenu,
          closeLinkRow,
          isMenuOpen: () => Boolean(menuEl && menuEl.classList.contains("open")),
          isLinkRowOpen: () => Boolean(linkRowEl && !linkRowEl.classList.contains("hidden")),
          takeReadyForSubmit,
          restore,
          render,
        };
      }

      const notchAttachments = createAttachmentController({
        attachBtn,
        attachMenu,
        fileInput,
        linkRow: linkInputRow,
        linkInput,
        linkAddBtn,
        linkCancelBtn,
        listEl: attachmentsList,
        noticeEl: attachmentsNotice,
        dropZone: notchShell,
        onOpenSearch: () => window.__caOpenFileSearch && window.__caOpenFileSearch(),
        onExpandForDrop: () => {
          if (getCurrentState() === "collapsed") setState("expanded");
        },
        onLayoutChange: () => syncSizeAndBridge(),
        shouldHandleWindowPaste: () => !document.body.dataset.mode,
      });

      function closeAttachMenu() {
        notchAttachments.closeMenu();
      }

      function closeLinkInput() {
        notchAttachments.closeLinkRow();
      }

      function addAttachments(items) {
        notchAttachments.add(items);
      }

      async function submitTaskRequest({ rawPrompt, attachedItems = [], thread = "" }) {
        const safeItems = (attachedItems || []).filter((item) => !getAttachmentRefusalReason(item));
        const links = safeItems.filter((a) => a.kind === "link").map((a) => a.url);
        const fullPrompt = links.length ? `${rawPrompt}\n${links.join("\n")}` : rawPrompt;
        const fileItems = safeItems.filter((a) => a.kind === "file");
        const attachedNames = fileItems.map((f) => f.name).filter(Boolean);
        const cleanThread = String(thread || "").trim();

        if (hasShellBridge()) {
          const filePaths = fileItems.map((f) => f.path).filter(Boolean);
          if (filePaths.length) {
            return Transport.request("POST", "/api/task", {
              prompt: fullPrompt,
              filePaths,
              ...(cleanThread ? { thread: cleanThread } : {}),
              attachedNames,
            });
          }
          return Transport.request("POST", "/api/task", {
            jsonBody: cleanThread ? { prompt: fullPrompt, thread: cleanThread } : { prompt: fullPrompt },
          });
        }

        if (fileItems.length) {
          const fd = new FormData();
          fd.append("prompt", fullPrompt);
          if (cleanThread) fd.append("thread", cleanThread);
          for (const item of fileItems) {
            if (item.file) fd.append("files", item.file, item.name);
            else if (item.path) fd.append("paths", item.path); /* picked from file search or fixture */
          }
          return Transport.request("POST", "/api/task", {
            formData: fd,
            prompt: fullPrompt,
            ...(cleanThread ? { thread: cleanThread } : {}),
            attachedNames,
          });
        }

        return Transport.request("POST", "/api/task", {
          jsonBody: cleanThread ? { prompt: fullPrompt, thread: cleanThread } : { prompt: fullPrompt },
        });
      }

      /* ---------------- SUBMIT PROMPT ---------------- */
      function recordAgentThread(agentId, threadId, runId) {
        const cleanThread = String(threadId || "").trim();
        const cleanRun = String(runId || "").trim();
        const aid = String(agentId || "__primary__").trim() || "__primary__";
        if (aid === "__primary__") {
          if (cleanThread) savePrimaryThreadId(cleanThread);
          return;
        }
        const list = readCreatedAgents();
        const idx = list.findIndex((a) => a.id === aid);
        if (idx === -1) return;
        const ag = list[idx];
        const nextThreads = Array.from(new Set([
          ...(Array.isArray(ag.threads) ? ag.threads : []),
          ag.thread,
          cleanThread,
          cleanRun,
        ].map((t) => String(t || "").trim()).filter(Boolean)));
        list[idx] = {
          ...ag,
          thread: cleanThread || cleanRun || ag.thread || "",
          threads: nextThreads,
        };
        writeCreatedAgents(list);
      }

      function resolveThreadTargetForAgent(agentId) {
        const aid = String(agentId || "__primary__").trim() || "__primary__";
        if (aid === "__primary__") return readPrimaryThreadId();
        const ag = readCreatedAgents().find((a) => a.id === aid);
        return ag?.thread ? String(ag.thread).trim() : "";
      }

      async function submitTask(rawPrompt, attachedItems, options = {}) {
        sendErrorText = "";
        globalStopSummary = "";

        const targetAgentId =
          options.agentId ||
          (viewMode === "chat" ? (selectedAgentId || readLastAgentId() || "__primary__") : "__primary__");
        const explicitThread =
          options.thread !== undefined
            ? options.thread
            : resolveThreadTargetForAgent(targetAgentId);
        const threadTarget =
          explicitThread && !String(explicitThread).startsWith("optimistic-") ? String(explicitThread) : "";

        if (threadTarget) {
          if (!Array.isArray(transcriptsById[threadTarget])) {
            transcriptsById[threadTarget] = [];
          }
          transcriptsById[threadTarget] = [
            ...transcriptsById[threadTarget],
            {
              id: `local-${Date.now()}`,
              ts: Math.floor(Date.now() / 1000),
              run: threadTarget,
              role: "user",
              agent: "",
              kind: "msg",
              text: rawPrompt,
            },
          ];
          selectedRunId = threadTarget;
          saveLastThreadId(threadTarget);
          dirtyTranscriptRunIds.add(threadTarget);
          openAgentConversation(targetAgentId, { render: true });
          try {
            let created = null;
            try {
              created = await submitTaskRequest({ rawPrompt, attachedItems, thread: threadTarget });
            } catch (threadErr) {
              const errMsg = String(threadErr?.message || threadErr?.data?.error || "");
              if (/no such conversation|unknown conversation|not found/i.test(errMsg)) {
                created = await submitTaskRequest({ rawPrompt, attachedItems, thread: "" });
              } else {
                throw threadErr;
              }
            }
            const nextThread = String(created?.thread || created?.run || threadTarget).trim();
            recordAgentThread(targetAgentId, nextThread, created?.run || "");
            if (created?.run) {
              selectedRunId = created.run;
              saveLastThreadId(created.run);
              dirtyTranscriptRunIds.add(created.run);
            }
            if (nextThread) dirtyTranscriptRunIds.add(nextThread);
            announceStatus("Message sent");
            await pollAll();
          } catch (err) {
            if (err.code === "AUTH") {
              Transport.clearConnection();
              rememberedAgentsById = {};
              costsById = {};
              connectionStatus = "disconnected";
              connectionError = "Token rejected · Paste the address again";
            } else {
              sendErrorText = err.message || "Could not send message";
              announceStatus(sendErrorText);
            }
            renderNow();
          }
          return;
        }

        const tempId = `optimistic-${Date.now()}`;
        optimisticAgentByRunId[tempId] = targetAgentId;
        optimisticRuns.push({
          id: tempId,
          goal: rawPrompt,
          role: "orchestrator",
          parent: null,
          state: "planning",
          elapsed: 0,
          n_events: 0,
          result: null,
        });
        selectedRunId = tempId;
        openAgentConversation(targetAgentId, { render: true });

        try {
          const created = await submitTaskRequest({ rawPrompt, attachedItems });

          optimisticRuns = optimisticRuns.filter((r) => r.id !== tempId);
          delete optimisticAgentByRunId[tempId];
          if (created?.run) {
            const nextThread = String(created.thread || created.run).trim();
            recordAgentThread(targetAgentId, nextThread, created.run);
            selectedRunId = created.run;
            saveLastThreadId(created.run);
            dirtyTranscriptRunIds.add(created.run);
            if (nextThread) dirtyTranscriptRunIds.add(nextThread);
            openAgentConversation(targetAgentId, { render: false });
          }
          announceStatus("Task sent");
          await pollAll();
        } catch (err) {
          optimisticRuns = optimisticRuns.filter((r) => r.id !== tempId);
          delete optimisticAgentByRunId[tempId];
          if (err.code === "AUTH") {
            Transport.clearConnection();
            rememberedAgentsById = {};
            costsById = {};
            connectionStatus = "disconnected";
            connectionError = "Token rejected · Paste the address again";
          } else {
            sendErrorText = err.message || "Could not send task";
            announceStatus(sendErrorText);
          }
          renderNow();
        }
      }

      promptForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const prompt = promptInput.value.trim();
        if (!prompt) return;

        if (!Transport.isConnected()) {
          connectionStatus = "disconnected";
          connectionError = "Paste the address ComputerAnything printed";
          renderNow();
          return;
        }

        const currentAttachments = notchAttachments.takeReadyForSubmit();
        promptInput.value = "";
        syncPromptFieldState();

        submitTask(prompt, currentAttachments);
      });

      /* ---------------- VIEW RENDERING (Reads ONLY WorkspaceAdapter ViewModel) ---------------- */
      function isLiveStepFaded(liveStep, nowMs = Date.now()) {
        if (!liveStep) return false;
        const prev = liveStepTimers.get(liveStep.key);
        if (!prev || prev.fingerprint !== liveStep.fingerprint) {
          liveStepTimers.set(liveStep.key, { fingerprint: liveStep.fingerprint, updatedAt: nowMs });
          return false;
        }
        return nowMs - prev.updatedAt >= 3000;
      }

      function setPillHtml(html) {
        if (pillStatusLine.innerHTML !== html) {
          pillStatusLine.innerHTML = html;
        }
      }

      function renderPill(vm) {
        if (vm.connectionStatus === "loading" && !hasLoadedOnce) {
          setPillHtml(`<span class="state-text state-working">&hellip; Loading</span>`);
          return;
        }

        if (vm.connectionStatus === "disconnected") {
          setPillHtml(`<span class="state-text state-warning">&oslash; Not connected</span>`);
          return;
        }

        const pendingRun = vm.pendingHelpRunId
          ? vm.runs.find((r) => r.id === vm.pendingHelpRunId) || null
          : vm.runs.find((r) => r.pendingHelp.some((h) => !h.isExpired)) || null;
        if (pendingRun) {
          const activeHelp = pendingRun.pendingHelp.find((h) => !h.isExpired);
          const fallbackSteps = pendingRun.steps.filter((s) => s.agentIdentity && (s.isWorking || s.stateColorClass === "state-warning"));
          const stepAgents = (fallbackSteps.length ? fallbackSteps : pendingRun.steps)
            .filter((s) => s.agentIdentity)
            .map((s) => ({
              name: s.agentIdentity.name,
              color: s.agentIdentity.color,
              edge: s.agentIdentity.edge || s.agentIdentity.palette?.edge || "rgba(255,255,255,0.25)",
            }));
          const pillAgents = vm.liveAgents.length ? vm.liveAgents : stepAgents;
          const dotsHtml = pillAgents.length
            ? `<span class="pill-dots">${pillAgents
                .map(
                  (a) =>
                    `<span class="pill-agent-dot" title="${escapeHtml(a.name)}" style="--dot-bg: ${escapeHtml(a.color)}; --dot-edge: ${escapeHtml(a.edge || "rgba(255,255,255,0.25)")};"></span>`
                )
                .join("")}</span>`
            : "";
          const countdownText = activeHelp?.countdownText ? `Needs you ${activeHelp.countdownText}` : "Needs you";
          setPillHtml(`
            ${dotsHtml}
            <span class="pill-need">${escapeHtml(countdownText)}</span>
          `);
          return;
        }

        if (ttsSpeaking) {
          setPillHtml(`
            <span class="state-text state-working">&#9679; Speaking</span>
            <span class="pill-sub">&middot; Click to stop</span>
          `);
          return;
        }

        if (pillFailureToast && Date.now() < pillFailureToast.expiresAt && !isFailedRunSeen(pillFailureToast.runId)) {
          setPillHtml(`<span class="pill-idle">${escapeHtml(pillFailureToast.text)}</span>`);
          return;
        }

        if (vm.liveAgents.length) {
          const dotsHtml = `<span class="pill-dots" aria-label="${escapeHtml(String(vm.liveAgents.length))} running agent${vm.liveAgents.length === 1 ? "" : "s"}">${vm.liveAgents
            .map(
              (a) =>
                `<span class="pill-agent-dot" title="${escapeHtml(a.name)}" style="--dot-bg: ${escapeHtml(a.color)}; --dot-edge: ${escapeHtml(a.edge)};"></span>`
            )
            .join("")}</span>`;
          setPillHtml(`
            ${dotsHtml}
            <span class="pill-sub">${escapeHtml(String(vm.liveAgents.length))} working</span>
          `);
          return;
        }

        setPillHtml(`<span class="pill-idle">Ask your agents</span>`);
      }

      function updateLiveTicksInPlace(vm) {
        if (viewMode !== "chat" || isComposingNewChat) return false;
        const convs = getConversationsForVm(vm);
        const activeConv = resolveActiveConversation(convs);
        const tasks = activeConv?.tasks || [];
        if (!tasks.length) return false;

        let expiryCrossed = false;
        for (const task of tasks) {
          for (const h of task.pendingHelp) {
            const el = timelineScroll.querySelector(`[data-help-row-id="${CSS.escape(h.id)}"]`);
            if (h.isExpired && el && !el.classList.contains("is-expired")) {
              expiryCrossed = true;
            }
          }
          const liveList = Array.isArray(task.liveSteps) && task.liveSteps.length
            ? task.liveSteps
            : task.liveStep
            ? [task.liveStep]
            : [];
          for (const item of liveList) {
            const liveEl = timelineScroll.querySelector(`[data-live-step-key="${CSS.escape(item.key)}"]`);
            if (liveEl) {
              liveEl.classList.toggle("is-faded", isLiveStepFaded(item));
            }
          }
        }

        return !expiryCrossed;
      }

      function buildTaskStructureKey(task) {
        if (!task) return "";
        const helpKey = task.pendingHelp
          .map((h) => `${h.id}:${h.isExpired ? "exp" : "act"}:${h.kindWarning}`)
          .join(",");
        const historyKey = (task.approvalHistory || [])
          .map((a) => `${a.id}:${a.lineText || a.choiceText}`)
          .join(",");
        const stepsKey = task.steps
          .map(
            (s) =>
              `${s.id}:${s.stateSymbolWord}:${s.isWorking ? 1 : 0}:${pendingStopIds.has(s.id) ? 1 : 0}:${s.agentIdentity.name}:${s.agentIdentity.color}:${s.elapsedText}:${s.workStepCount}:${s.workSteps.length}:${openWorkKeys.has(`${task.id}:${s.id}`) ? 1 : 0}`
          )
          .join("|");
        const memoryKey = getVisibleMemoriesForRun(task)
          .map((m) => `${m.id}:${m.text || ""}:${pendingUndoMemoryIds.has(m.id) ? 1 : 0}`)
          .join("|");
        const outputKey = task.producedOutputs
          .map((o) => `${o.id}:${openOutputPreviewIds.has(`${task.id}:${o.id}`) ? 1 : 0}:${copiedItemIds.has(`out:${task.id}:${o.id}`) ? 1 : 0}`)
          .join("|");
        const resultDetailKey = openResultDetailIds.has(task.id) ? 1 : 0;
        const transcriptKey = task.transcriptRows
          .map((t) => `${t.id}:${t.role}:${t.who}:${t.color}:${t.text}`)
          .join("|");
        const liveStepsKey =
          Array.isArray(task.liveSteps) && task.liveSteps.length
            ? task.liveSteps.map((l) => l.fingerprint).join("|")
            : task.liveStep
            ? task.liveStep.fingerprint
            : "";
        return [
          task.id,
          pendingStopIds.has(task.id) ? 1 : 0,
          stopNoticesByRunId.get(task.id) || "",
          copiedItemIds.has(`result:${task.id}`) ? 1 : 0,
          resultDetailKey,
          task.permissionIssue ? task.permissionIssue.key : "",
          outputKey,
          transcriptKey,
          task.goal,
          task.state,
          task.stopKind,
          task.stateSymbolWord,
          task.stateFact,
          task.speakText,
          task.evidenceText,
          task.elapsedText,
          task.digest.costText,
          task.digest.liveCostText || "",
          liveStepsKey,
          helpKey,
          historyKey,
          memoryKey,
          stepsKey,
        ].join("::");
      }

      function buildPanelStructureKey(vm, activeConv) {
        const primaryRaw = readPrimaryAgentStorageRaw();
        const formKey = agentFormState
          ? `${agentFormState.mode}:${agentFormState.agentId}:${agentFormState.swatch}:${agentFormState.error || ""}`
          : "";
        if (vm.connectionStatus === "loading" && !hasLoadedOnce) return `loading:${primaryRaw}`;
        if (vm.connectionStatus === "disconnected") return `disconnected:${vm.connectionError}:${primaryRaw}`;
        const convs = getConversationsForVm(vm);
        const listSummaryKey = convs.list
          .map((c) => `${c.id}:${c.name}:${c.swatch}:${c.badge?.text || ""}:${c.lastLinePreview}:${c.listClockText}:${c.tasks.length}`)
          .join("|");
        if (viewMode === "list") {
          return `list:${primaryRaw}:${vm.connectionStatus}:${sendErrorText}:${vm.liveAgents.length}:${stopRouteSupported ? 1 : 0}:${openRowMenuKey}:${confirmDeleteAgentId}:${hiddenChatIds.size}:${formKey}:${listSummaryKey}`;
        }
        const conv = activeConv || resolveActiveConversation(convs);
        const tasksKey = (conv?.tasks || []).map(buildTaskStructureKey).join("||");
        return [
          "chat",
          primaryRaw,
          vm.connectionStatus,
          vm.isSampleData ? 1 : 0,
          vm.liveAgents.length,
          sendErrorText,
          stopRouteSupported ? 1 : 0,
          ttsSpeaking ? 1 : 0,
          formKey,
          conv ? `${conv.id}:${conv.name}:${conv.swatch}` : "none",
          tasksKey,
        ].join("::");
      }

      function renderAgentChipHtml(agentIdentity, chipId, buttonOptions) {
        const id = agentIdentity || { name: "Agent", color: "#5c6b7a", hasAgentColor: false, palette: { body: "rgba(92, 107, 122, 0.25)", edge: "#E0E3E6", ink: "#F2F4F8" } };
        const pal = id.palette || { body: "rgba(92, 107, 122, 0.25)", edge: "#E0E3E6", ink: "#F2F4F8" };
        const styleAttr = `style="--chip-bg: ${escapeHtml(pal.body)}; --chip-edge: ${escapeHtml(pal.edge)}; --chip-ink: ${escapeHtml(pal.ink)};"`;
        const dataAttrs = `data-agent-chip="${escapeHtml(chipId)}" data-agent-has-color="${id.hasAgentColor ? "1" : "0"}" data-agent-name="${escapeHtml(id.name)}" data-agent-color="${escapeHtml(id.color)}" data-agent-edge="${escapeHtml(id.rawEdge || pal.edge)}" data-agent-ink="${escapeHtml(id.rawInk || pal.ink)}"`;
        if (buttonOptions && buttonOptions.action) {
          const ariaLabel = buttonOptions.ariaLabel || `Agent settings for ${id.name}`;
          const title = buttonOptions.title || "Agent settings";
          const agentAttr = buttonOptions.agentId ? `data-agent-id="${escapeHtml(buttonOptions.agentId)}"` : "";
          return `<button type="button" class="agent-chip agent-chip-btn" data-action="${escapeHtml(buttonOptions.action)}" ${agentAttr} aria-label="${escapeHtml(ariaLabel)}" title="${escapeHtml(title)}" ${styleAttr} ${dataAttrs}><span class="agent-chip-label">${escapeHtml(id.name)}</span></button>`;
        }
        return `<span class="agent-chip" ${styleAttr} ${dataAttrs}><span class="agent-chip-label">${escapeHtml(id.name)}</span></span>`;
      }

      function getPrimaryAgentRowIdentity() {
        const primary = resolvePrimaryAgentDisplay("ComputerAnything", "#B5D0EB");
        const swatch =
          PRIMARY_AGENT_SWATCHES.find((s) => s.color.toUpperCase() === String(primary.color || "").toUpperCase()) ||

          rawEdge: swatch.edge,
          rawInk: swatch.ink,
          palette: { body: swatch.color, edge: swatch.edge, ink: swatch.ink },

      }

      function renderAvatarHtml(identity) {
        const name = String(identity?.name || "A").trim();
        const initial = name.charAt(0).toUpperCase() || "A";
        const pal = identity?.palette || { body: "#B5D0EB", edge: "#D6E9FF", ink: "#2F647C" };
        return `<div class="chat-avatar" style="--av-bg: ${escapeHtml(pal.body)}; --av-ink: ${escapeHtml(pal.ink)}; --av-edge: ${escapeHtml(pal.edge)};">${escapeHtml(initial)}</div>`;
      }

      function formatListStateBadge(r) {
        if (r.state === "waiting") return { text: "! Needs you", cls: "state-warning" };
        if (r.state === "working") return { text: "● Working", cls: "state-working" };
        if (r.state === "verified") return { text: "✓ Done", cls: "state-success" };
        if (r.state === "unverified") return { text: "Finished", cls: "state-neutral" };
        if (r.stopKind && r.stopKind.startsWith("user_")) {
          return { text: r.stateSymbolWord || "Cancelled by you", cls: "state-neutral" };
        }
        if (r.isRealFailure) {
          return isFailedRunSeen(r.id) ? null : { text: "Couldn't finish", cls: "state-neutral" };
        }
        return null;
      }

      function renderRowMenuHtml(conv) {
        if (!conv || openRowMenuKey !== conv.id) return "";
        if (!conv.isPrimary && confirmDeleteAgentId === conv.id) {
          return `
            <div class="chat-row-menu" role="menu" aria-label="Confirm delete agent">
              <div class="chat-row-confirm">
                <span>Delete ${escapeHtml(conv.name)}? Removes this agent and hides its chat.</span>
                <span class="chat-row-confirm-acts">
                  <button type="button" class="btn btn-danger chat-row-menu-item" data-action="confirm-delete-agent" data-agent-id="${escapeHtml(conv.id)}">Delete</button>
                  <button type="button" class="btn chat-row-menu-item" data-action="cancel-delete-agent">Keep</button>
                </span>
              </div>
            </div>
          `;
        }
        const canStop = Boolean(conv.liveRunIds.length > 0 && stopRouteSupported);
        return `
          <div class="chat-row-menu" role="menu" aria-label="Agent options">
            <button type="button" class="btn chat-row-menu-item" role="menuitem" data-action="select-agent" data-agent-id="${escapeHtml(conv.id)}">Open</button>
            ${
              conv.copyResultText
                ? `<button type="button" class="btn chat-row-menu-item" role="menuitem" data-action="menu-copy-result" data-agent-id="${escapeHtml(conv.id)}">Copy last result</button>`
                : ""
            }
            <button type="button" class="btn chat-row-menu-item" role="menuitem" data-action="menu-agent-settings" data-agent-id="${escapeHtml(conv.id)}">Agent settings</button>
            ${
              canStop
                ? `<button type="button" class="btn chat-row-menu-item" role="menuitem" data-action="menu-stop-agent-conv" data-agent-id="${escapeHtml(conv.id)}">Stop</button>`
                : ""
            }
            ${
              !conv.isPrimary
                ? `<button type="button" class="btn btn-danger chat-row-menu-item" role="menuitem" data-action="menu-ask-delete" data-agent-id="${escapeHtml(conv.id)}">Delete</button>`
                : ""
            }
          </div>
        `;
      }

      function renderChatListHtml(vm) {
        const convs = getConversationsForVm(vm);
        const rowsHtml = convs.list
          .map((conv) => {
            const isMenuOpen = openRowMenuKey === conv.id;
            return `
              <div class="chat-list-item ${isMenuOpen ? "is-menu-open" : ""}" data-row-key="${escapeHtml(conv.id)}">
                <div class="chat-list-row-wrap">
                  <div role="button" tabindex="0" class="chat-list-row" data-action="select-agent" data-agent-id="${escapeHtml(conv.id)}" data-row-key="${escapeHtml(conv.id)}" aria-label="Open conversation with ${escapeHtml(conv.name)}">
                    ${renderAvatarHtml(conv.identity)}
                    <div class="chat-list-mid">
                      <div class="chat-list-name-row">
                        <span class="chat-list-name">${escapeHtml(conv.name)}</span>
                      </div>
                      <div class="chat-list-preview">${escapeHtml(conv.lastLinePreview)}</div>
                    </div>
                    <div class="chat-list-rt">
                      ${conv.badge ? `<span class="state-text ${escapeHtml(conv.badge.cls)}">${escapeHtml(conv.badge.text)}</span>` : ""}
                      ${conv.listClockText ? `<span class="chat-list-time">${escapeHtml(conv.listClockText)}</span>` : ""}
                    </div>
                  </div>
                  <button
                    type="button"
                    class="btn btn-icon chat-row-more-btn"
                    data-action="toggle-row-menu"
                    data-row-key="${escapeHtml(conv.id)}"
                    aria-label="More options for ${escapeHtml(conv.name)}"
                    aria-expanded="${isMenuOpen ? "true" : "false"}"
                    title="More options"
                  >&middot;&middot;&middot;</button>
                </div>
                ${renderRowMenuHtml(conv)}
              </div>
            `;
          })
          .join("");

        return `${agentFormState ? renderAgentFormHtml() : ""}<div class="chat-list">${rowsHtml}</div>`;
      }

      function renderWorkDividerHtml(runId, step, runVm) {
        if (!step || !Array.isArray(step.workSteps) || !step.workSteps.length) return "";
        const workKey = `${runId}:${step.id}`;
        const isOpen = openWorkKeys.has(workKey);
        const count = step.workStepCount || step.workSteps.length;
        const stepWord = count === 1 ? "step" : "steps";
        const timeText = step.elapsedText || "";
        const rawLiveCost = String(step.liveCostText || runVm?.digest?.liveCostText || "").trim();
        const showLiveCost = Boolean(
          step.isWorking &&
          !runVm?.isMock &&
          rawLiveCost &&
          rawLiveCost !== "—" &&
          !/^\$0(?:\.0+)?(?:\s*\((?:mock|sample)\s+run\))?$/i.test(rawLiveCost)
        );
        const labelParts = ["Work", step.agentIdentity.name, `${count} ${stepWord}`];
        if (timeText && timeText !== "—") labelParts.push(timeText);
        if (showLiveCost) labelParts.push(rawLiveCost);
        const labelText = labelParts.join(" · ");
        const canStopAgent = Boolean(step.isWorking && stopRouteSupported);
        const isStoppingAgent = pendingStopIds.has(step.id);
        return `
          <div class="work-divider-wrap">
            <div class="work-divider-header">
              <button
                type="button"
                class="work-divider-btn"
                data-action="toggle-work"
                data-work-key="${escapeHtml(workKey)}"
                aria-expanded="${isOpen ? "true" : "false"}"
              >
                <span class="work-divider-label">${escapeHtml(labelText)} &middot; <span class="work-toggle-word">${isOpen ? "Hide" : "Show"}</span></span>
              </button>
              ${
                canStopAgent
                  ? `<button type="button" class="btn btn-danger work-stop-btn" data-action="stop-agent" data-run-id="${escapeHtml(step.id)}" ${isStoppingAgent ? "disabled" : ""} aria-label="Stop ${escapeHtml(step.agentIdentity.name)}">${isStoppingAgent ? "Stopping…" : "Stop"}</button>`
                  : ""
              }
            </div>
            ${
              isOpen
                ? `<div class="work-steps-list">${step.workSteps
                    .map((line) => `<div class="work-step-line">${escapeHtml(line)}</div>`)
                    .join("")}</div>`
                : ""
            }
          </div>
        `;
      }

      function setPanelHeaderHtml(html) {
        if (!panelHeader) return;
        const trimmed = String(html || "").trim();
        if (!trimmed) {
          panelHeader.innerHTML = "";
          panelHeader.classList.add("hidden");
        } else {
          panelHeader.innerHTML = trimmed;
          panelHeader.classList.remove("hidden");
        }
      }

      function renderStopAllButtonHtml(vm) {
        const hasLiveRuns = Boolean(
          stopRouteSupported &&
            ((vm?.liveAgents && vm.liveAgents.length > 0) ||
              (vm?.runs && vm.runs.some((r) => !r.isFinished)))
        );
        if (!hasLiveRuns) return "";
        return `<button type="button" class="btn btn-danger" data-action="stop-all" ${isStoppingAll ? "disabled" : ""}>Stop all</button>`;
      }

      function renderAgentTaskHtml(activeRun, conv, vm, isLatestFinishedTask = false) {
        const messageNodes = [];
        const rows = activeRun.transcriptRows || [];
        const hasInitialUserRow =
          rows.length > 0 &&
          rows[0].role === "user" &&
          String(rows[0].text || "").trim() === String(activeRun.goal || "").trim();

        if (!hasInitialUserRow && activeRun.goal) {
          messageNodes.push(`
            <div class="chat-msg-row is-user">
              <div class="chat-bubble is-user">${escapeHtml(activeRun.goal)}</div>
            </div>
          `);
        }

        const stepById = new Map();
        const stepIdentityByName = new Map();
        for (const s of activeRun.steps) {
          stepById.set(s.id, s);
          if (s.agentIdentity?.name && !stepIdentityByName.has(s.agentIdentity.name)) {
            stepIdentityByName.set(s.agentIdentity.name, s);
          }
        }
        const attachedWorkStepIds = new Set();
        const attachedStopStepIds = new Set();
        const bubbledStepIds = new Set();
        const primaryIdentity = getPrimaryAgentRowIdentity();
        const leadIdentity = conv?.identity || primaryIdentity;
        const introducedAgents = new Set([leadIdentity.name, primaryIdentity.name, "ComputerAnything"].filter(Boolean));
        const buildHandoffLineHtml = (agentName, targetApp) => {
          const cleanName = String(agentName || "").trim();
          if (!cleanName || introducedAgents.has(cleanName)) return "";
          introducedAgents.add(cleanName);
          const cleanApp = String(targetApp || "").trim();
          const introCopy = cleanApp
            ? `Asked ${cleanName} to do this in ${cleanApp}`
            : `Asked ${cleanName} to help`;
          return `<div class="chat-handoff-line">${escapeHtml(introCopy)}</div>`;
        };

        let renderedAgentBubble = false;
        rows.forEach((row, idx) => {
          if (row.role === "user") {
            messageNodes.push(`
              <div class="chat-msg-row is-user">
                <div class="chat-bubble is-user">${escapeHtml(row.text)}</div>
              </div>
            `);
            return;
          }
          if (/^Finished\.?$/i.test(String(row.text || "").trim())) {
            return;
          }
          renderedAgentBubble = true;
          const matchingStep = (row.run && stepById.get(row.run)) || stepIdentityByName.get(row.who) || null;
          if (matchingStep) bubbledStepIds.add(matchingStep.id);
          const isLeadLine = Boolean(
            (matchingStep && matchingStep.isOrchestrator) ||
            (!matchingStep && (!row.who || row.who === "ComputerAnything" || row.who === primaryIdentity.name || row.who === leadIdentity.name))
          );
          const chipId = `tr-${activeRun.id}-${idx}`;
          const chipIdentity = isLeadLine
            ? leadIdentity
            : matchingStep
            ? matchingStep.agentIdentity
            : {
                name: row.who || leadIdentity.name,
                color: row.color || leadIdentity.color,
                hasAgentColor: Boolean(row.color || leadIdentity.hasAgentColor),
                palette: {
                  body: row.color || leadIdentity.color,
                  edge: row.edge || leadIdentity.rawEdge,
                  ink: "#1E2630",
                },
              };
          const handoffLineHtml = isLeadLine ? "" : buildHandoffLineHtml(chipIdentity.name, matchingStep?.app || "");
          let workHtml = "";
          if (matchingStep && !attachedWorkStepIds.has(matchingStep.id)) {
            attachedWorkStepIds.add(matchingStep.id);
            workHtml = renderWorkDividerHtml(activeRun.id, matchingStep, activeRun);
          }
          let inlineStopHtml = "";
          if (matchingStep && matchingStep.isWorking && stopRouteSupported && !workHtml && !attachedStopStepIds.has(matchingStep.id)) {
            attachedStopStepIds.add(matchingStep.id);
            const isStoppingAgent = pendingStopIds.has(matchingStep.id);
            inlineStopHtml = `<button type="button" class="btn btn-danger work-stop-btn" data-action="stop-agent" data-run-id="${escapeHtml(matchingStep.id)}" ${isStoppingAgent ? "disabled" : ""} aria-label="Stop ${escapeHtml(chipIdentity.name)}">${isStoppingAgent ? "Stopping…" : "Stop"}</button>`;
          }
          messageNodes.push(`
            ${handoffLineHtml}
            <div class="chat-msg-row is-agent">
              <div class="chat-msg-head">${renderAgentChipHtml(chipIdentity, chipId)}${inlineStopHtml}</div>
              <div class="chat-bubble is-agent">${escapeHtml(row.text)}</div>
              ${workHtml}
            </div>
          `);
        });

        for (const step of activeRun.steps) {
          const needsWork = !attachedWorkStepIds.has(step.id);
          const needsBubble = !bubbledStepIds.has(step.id) && (!renderedAgentBubble || !step.isOrchestrator);
          if (!needsWork && !needsBubble) continue;
          const workHtml = needsWork ? renderWorkDividerHtml(activeRun.id, step, activeRun) : "";
          const stepChipIdentity = step.isOrchestrator ? leadIdentity : step.agentIdentity;
          let greetingText = "";
          if (needsBubble) {
            if (step.goal && activeRun.steps.length > 1) {
              greetingText = step.goal;
            } else if (step.isWorking) {
              greetingText = step.app ? `Working in ${step.app}` : "Working on it";
            } else if (activeRun.speakText && !/^Finished\.?$/i.test(activeRun.speakText) && activeRun.steps.length === 1) {
              greetingText = activeRun.speakText;
            } else if (step.latestSummary && !step.latestSummaryIsAction && !/^Finished\.?$/i.test(step.latestSummary)) {
              greetingText = step.latestSummary;
            } else if (activeRun.stateFact && activeRun.steps.length === 1) {
              greetingText = activeRun.stateFact;
            } else if (!workHtml) {
              greetingText = activeRun.state === "waiting" ? `${stepChipIdentity.name} is waiting for you` : "On it";
            }
          }
          if (greetingText || workHtml) {
            attachedWorkStepIds.add(step.id);
            const handoffLineHtml =
              !step.isOrchestrator && (greetingText || workHtml)
                ? buildHandoffLineHtml(stepChipIdentity?.name, step.app)
                : "";
            let inlineStopHtml = "";
            if (greetingText && step.isWorking && stopRouteSupported && !workHtml && !attachedStopStepIds.has(step.id)) {
              attachedStopStepIds.add(step.id);
              const isStoppingAgent = pendingStopIds.has(step.id);
              inlineStopHtml = `<button type="button" class="btn btn-danger work-stop-btn" data-action="stop-agent" data-run-id="${escapeHtml(step.id)}" ${isStoppingAgent ? "disabled" : ""} aria-label="Stop ${escapeHtml(stepChipIdentity.name)}">${isStoppingAgent ? "Stopping…" : "Stop"}</button>`;
            }
            messageNodes.push(`
              ${handoffLineHtml}
              <div class="chat-msg-row is-agent">
                ${greetingText ? `<div class="chat-msg-head">${renderAgentChipHtml(stepChipIdentity, `step-${activeRun.id}-${step.id}`)}${inlineStopHtml}</div>` : ""}
                ${greetingText ? `<div class="chat-bubble is-agent">${escapeHtml(greetingText)}</div>` : ""}
                ${workHtml}
              </div>
            `);
          }
        }

        const approvalHistoryHtml = (activeRun.approvalHistory || [])
          .map(
            (item) =>
              `<div class="chat-approval-history">${escapeHtml(item.lineText || `Asked “${item.question}” · ${item.choiceText}`)}</div>`
          )
          .join("");

        const helpHtml = activeRun.pendingHelp
          .map((h) => {
            const helpStep = h.run ? stepById.get(h.run) : null;
            const waiterName =
              helpStep && !helpStep.isOrchestrator && helpStep.agentIdentity?.name
                ? helpStep.agentIdentity.name
                : h.agentName || leadIdentity.name;
            let rawReason = String(h.question || "").replace(/\?+$/, "").trim();
            if ((!rawReason || /^(Approval needed|Approve action)$/i.test(rawReason)) && h.detail) {
              rawReason = String(h.detail).trim();
            }
            const shortReason =
              rawReason.length > 56 ? `${rawReason.slice(0, 55).trimEnd()}…` : rawReason;
            if (h.isExpired) {
              const expiredCopy = shortReason
                ? `${waiterName} timed out waiting for you: ${shortReason}`
                : `${waiterName} timed out waiting for you`;
              return `<div class="help-wait-row is-expired" data-help-row-id="${escapeHtml(h.id)}"><span class="state-text state-neutral">${escapeHtml(expiredCopy)}</span></div>`;
            }
            const waitCopy = shortReason
              ? `${waiterName} is waiting for you: ${shortReason}`
              : `${waiterName} is waiting for you`;
            return `<div class="help-wait-row" data-help-row-id="${escapeHtml(h.id)}"><button type="button" class="help-wait-btn" data-action="bring-approval-forward" data-help-id="${escapeHtml(h.id)}">&#9684; ${escapeHtml(waitCopy)}</button></div>`;
          })
          .join("");

        const permissionHtml = activeRun.permissionIssue
          ? `
            <div class="permission-row">
              <span class="permission-copy">! ${escapeHtml(activeRun.permissionIssue.message)}</span>
              ${
                activeRun.permissionIssue.pane && activeRun.permissionIssue.buttonText
                  ? `<button
                type="button"
                class="btn"
                data-action="open-privacy"
                data-pane="${escapeHtml(activeRun.permissionIssue.pane)}"
                data-label="${escapeHtml(activeRun.permissionIssue.label)}"
              >${escapeHtml(activeRun.permissionIssue.buttonText)}</button>`
                  : ""
              }
            </div>
          `
          : "";

        const stopNoticeText = stopNoticesByRunId.get(activeRun.id) || "";
        const stopNoticeHtml =
          stopNoticeText && activeRun.state !== "failed"
            ? `<div class="stop-notice-line">${escapeHtml(stopNoticeText)}</div>`
            : "";
        let outcomeHtml = "";
        let failureHtml = "";
        let outputsHtml = "";
        if (activeRun.isFinished) {
          if (activeRun.state === "failed") {
            const noticeCopy = activeRun.isRealFailure
              ? activeRun.failureLineText
              : stopNoticeText || activeRun.failureLineText;
            const retryBtnHtml = activeRun.isRealFailure
              ? `<button type="button" class="btn" data-action="run-again" data-prompt="${escapeHtml(activeRun.goal)}" data-agent-id="${escapeHtml(conv?.id || "__primary__")}">Try again</button>`
              : "";
            failureHtml = `
              <div class="chat-failure-event">
                <span class="chat-failure-copy">${escapeHtml(noticeCopy)}</span>
                ${retryBtnHtml}
              </div>
            `;
          } else {
            const isVerified = activeRun.state === "verified";
            const compactFact = isVerified
              ? activeRun.evidenceText || activeRun.stateFact || "Done"
              : activeRun.stateFact || activeRun.stateSymbolWord || "Finished";
            const detailSentence =
              activeRun.stateFact &&
              activeRun.stateFact.toLowerCase() !== compactFact.toLowerCase() &&
              !compactFact.toLowerCase().includes(activeRun.stateFact.toLowerCase())
                ? activeRun.stateFact
                : "";
            const isDetailOpen = Boolean(detailSentence && openResultDetailIds.has(activeRun.id));
            const inlineParts = [compactFact];
            if (activeRun.elapsedText && activeRun.elapsedText !== "—") {
              inlineParts.push(activeRun.elapsedText);
            }
            if (
              isVerified &&
              activeRun.digest?.costText &&
              activeRun.digest.costText !== "—" &&
              !activeRun.isMock
            ) {
              inlineParts.push(activeRun.digest.costText);
            }
            const isCopiedResult = copiedItemIds.has(`result:${activeRun.id}`);
            const firstOpenableOutput = activeRun.producedOutputs.find((o) => o.openUrl || o.previewText) || null;
            const firstPreviewKey = firstOpenableOutput ? `${activeRun.id}:${firstOpenableOutput.id}` : "";
            const isFirstPreviewOpen = firstPreviewKey ? openOutputPreviewIds.has(firstPreviewKey) : false;
            const copyIconHtml = isCopiedResult
              ? `<span class="state-success">&#10003;</span>`
              : `<svg width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="5" y="5" width="8.5" height="8.5" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M11 5V3.5C11 2.95 10.55 2.5 10 2.5H3.5C2.95 2.5 2.5 2.95 2.5 3.5V10C2.5 10.55 2.95 11 3.5 11H5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>`;

            outcomeHtml = `
              <div class="chat-result-line ${isVerified ? "is-verified" : ""}">
                <div class="chat-result-body">
                  <div
                    class="chat-result-main ${detailSentence ? "is-expandable" : ""}"
                    ${
                      detailSentence
                        ? `role="button" tabindex="0" data-action="toggle-result-detail" data-run-id="${escapeHtml(activeRun.id)}" aria-expanded="${isDetailOpen ? "true" : "false"}"`
                        : ""
                    }
                  >${isVerified ? `<span class="state-success">&#10003;</span> ` : ""}${escapeHtml(inlineParts.join(" · "))}</div>
                  ${isDetailOpen ? `<div class="chat-result-detail">${escapeHtml(detailSentence)}</div>` : ""}
                </div>
                <div class="chat-result-acts">
                  ${
                    activeRun.copyResultText
                      ? `<button type="button" class="btn btn-icon" data-action="copy-result" data-run-id="${escapeHtml(activeRun.id)}" aria-label="${isCopiedResult ? "Copied result" : "Copy result"}" title="${isCopiedResult ? "Copied" : "Copy result"}">${copyIconHtml}</button>`
                      : ""
                  }
                  ${
                    firstOpenableOutput
                      ? `<button type="button" class="btn" data-action="open-output" data-run-id="${escapeHtml(activeRun.id)}" data-output-id="${escapeHtml(firstOpenableOutput.id)}" aria-expanded="${firstOpenableOutput.previewText ? (isFirstPreviewOpen ? "true" : "false") : "false"}">${isFirstPreviewOpen ? "Hide" : "Open"}</button>`
                      : ""
                  }
                  ${
                    ttsSpeaking && isLatestFinishedTask
                      ? `<button type="button" class="btn" data-action="stop-speaking" aria-label="Stop speaking">Stop</button>`
                      : ""
                  }
                </div>
              </div>
            `;

            if (activeRun.producedOutputs.length) {
              outputsHtml = activeRun.producedOutputs
                .map((out) => {
                  const previewKey = `${activeRun.id}:${out.id}`;
                  const isPreviewOpen = openOutputPreviewIds.has(previewKey);
                  if (out === firstOpenableOutput && activeRun.producedOutputs.length === 1) {
                    return isPreviewOpen && out.previewText
                      ? `<pre class="step-detail-mono">${escapeHtml(out.previewText)}</pre>`
                      : "";
                  }
                  const isCopiedOut = copiedItemIds.has(`out:${activeRun.id}:${out.id}`);
                  const canOpenInPage = Boolean(out.openUrl || out.previewText);
                  return `
                    <div>
                      <div class="output-row">
                        <span class="output-title" title="${escapeHtml(out.openPath || out.title)}">${escapeHtml(out.title)}</span>
                        <span class="output-actions">
                          <button type="button" class="btn" data-action="copy-output" data-run-id="${escapeHtml(activeRun.id)}" data-output-id="${escapeHtml(out.id)}">${isCopiedOut ? "✓ Copied" : "Copy"}</button>
                          ${canOpenInPage ? `<button type="button" class="btn" data-action="open-output" data-run-id="${escapeHtml(activeRun.id)}" data-output-id="${escapeHtml(out.id)}" aria-expanded="${out.previewText ? (isPreviewOpen ? "true" : "false") : "false"}">${isPreviewOpen ? "Hide" : "Open"}</button>` : ""}
                        </span>
                      </div>
                      ${isPreviewOpen && out.previewText ? `<pre class="step-detail-mono">${escapeHtml(out.previewText)}</pre>` : ""}
                    </div>
                  `;
                })
                .filter(Boolean)
                .join("");
            }
          }
        }

        const visibleMemories = getVisibleMemoriesForRun(activeRun);
        const memoryNoticeHtml = visibleMemories
          .map((m) => {
            const rawText = String(m.text || m.summary || m.content || "").trim();
            const label = /^i['’]ll remember/i.test(rawText)
              ? rawText
              : rawText
              ? `I'll remember: ${rawText}`
              : "I'll remember this for next time.";
            return `
              <div class="memory-notice-row" data-memory-id="${escapeHtml(m.id)}">
                <span class="memory-notice-text">${escapeHtml(label)}</span>
                <button type="button" class="btn" data-action="undo-memory" data-memory-id="${escapeHtml(m.id)}" ${pendingUndoMemoryIds.has(String(m.id)) ? "disabled" : ""}>Undo</button>
              </div>
            `;
          })
          .join("");

        const mockBannerHtml =
          activeRun.mockNote && !vm.isSampleData
            ? `<div class="sample-tag">${escapeHtml(activeRun.mockNote)}</div>`
            : "";

        return `
          <div class="chat-task-block" data-task-id="${escapeHtml(activeRun.id)}">
            ${messageNodes.join("")}
            ${approvalHistoryHtml}
            ${helpHtml}
            ${stopNoticeHtml}
            ${permissionHtml}
            ${mockBannerHtml}
            ${outcomeHtml}
            ${failureHtml}
            ${outputsHtml}
            ${memoryNoticeHtml}
          </div>
        `;
      }

      function renderPanel(vm) {
        lastViewModel = vm;
        sampleBanner.style.display = vm.isSampleData ? "flex" : "none";
        syncThreadModeBar();
        if (promptForm) {
          promptForm.classList.toggle("hidden", viewMode === "list");
        }

        if (vm.connectionStatus === "loading" && !hasLoadedOnce) {
          lastPanelStructureKey = "loading";
          destroyAllAgentChips();
          setPanelHeaderHtml("");
          timelineScroll.innerHTML = `
            <div class="timeline-row">
              <span class="state-text state-working">&hellip; Loading</span>
              <div class="skeleton-line" style="flex: 1; max-width: 240px;"></div>
            </div>
          `;
          syncSizeAndBridge();
          return;
        }

        if (vm.connectionStatus === "disconnected") {
          lastPanelStructureKey = `disconnected:${vm.connectionError}`;
          destroyAllAgentChips();
          setPanelHeaderHtml("");
          const prevInput = document.getElementById("connect-url-input")?.value || "";
          timelineScroll.innerHTML = `
            <div class="timeline-block">
              <div class="timeline-row">
                <span class="state-text state-warning">&oslash; Not connected</span>
                <span class="timeline-fact">${escapeHtml(vm.connectionError || "Paste the address ComputerAnything printed")}</span>
              </div>
              <div class="inline-input-row">
                <input
                  type="url"
                  id="connect-url-input"
                  class="inline-text-input"
                  placeholder="http://127.0.0.1:8765/?t=..."
                  aria-label="ComputerAnything address"
                  value="${escapeHtml(prevInput)}"
                />
                <button type="button" id="connect-submit-btn" class="btn">Connect</button>
              </div>
            </div>
          `;
          syncSizeAndBridge();
          return;
        }

        const blocks = [];

        if (vm.connectionStatus === "stale") {
          blocks.push(`
            <div class="timeline-row">
              <span class="state-text state-warning">&#9684; May be out of date</span>
              <button type="button" class="btn" data-action="retry-connect">Retry</button>
            </div>
          `);
        }

        if (sendErrorText) {
          blocks.push(`
            <div class="timeline-row">
              <span class="state-text state-neutral">Could not send &middot; ${escapeHtml(sendErrorText)}</span>
            </div>
          `);
        }

        const stopAllBtnHtml = renderStopAllButtonHtml(vm);
        const convs = getConversationsForVm(vm);

        if (viewMode === "list") {
          lastPanelStructureKey = buildPanelStructureKey(vm, null);
          destroyAllAgentChips();
          const workingCount = convs.list.filter((c) => c.hasWorking).length;
          setPanelHeaderHtml(`
            <span class="list-nav-title">Agents</span>
            <span style="flex:1"></span>
            <span class="panel-header-right">
              ${workingCount > 0 ? `<span class="state-text state-working">${escapeHtml(String(workingCount))} working</span>` : ""}
              ${stopAllBtnHtml}
              <button type="button" class="btn btn-icon" data-action="open-app-settings" aria-label="App settings" title="App settings">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                  <circle cx="8" cy="8" r="2.2" stroke="currentColor" stroke-width="1.35"/>
                  <path d="M6.8 1.8H9.2L9.5 3.3L10.6 3.9L12 3.2L13.2 5.2L12 6.2V9.8L13.2 10.8L12 12.8L10.6 12.1L9.5 12.7L9.2 14.2H6.8L6.5 12.7L5.4 12.1L4 12.8L2.8 10.8L4 9.8V6.2L2.8 5.2L4 3.2L5.4 3.9L6.5 3.3Z" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round"/>
                </svg>
              </button>
              <button type="button" class="btn btn-icon" data-action="open-new-agent-form" aria-label="New agent" title="New agent">
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
                  <path d="M7 2.5V11.5M2.5 7H11.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
              </button>
              <button type="button" class="btn btn-esc" data-action="close-notch" aria-label="Close notch" title="Close (Esc)">Esc</button>
            </span>
          `);
          blocks.push(renderChatListHtml(vm));
          timelineScroll.innerHTML = blocks.join("");
          mountAllAgentChips();
          syncSizeAndBridge();
          return;
        }

        const activeConv = resolveActiveConversation(convs);
        selectedAgentId = activeConv ? activeConv.id : "__primary__";
        const tasks = activeConv?.tasks || [];
        const latestTask = activeConv?.latestTask || null;
