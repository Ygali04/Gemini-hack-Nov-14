              const name = f.name || `photo-${Date.now()}-${i + 1}.png`;
              return { id: `paste-${name}-${f.size}`, name, kind: "file", file: f };
            })
          );
        }
      });

      /* ---------------- SUBMIT PROMPT ---------------- */
      async function submitTask(rawPrompt, attachedItems) {
        sendErrorText = "";
        const links = attachedItems.filter((a) => a.kind === "link").map((a) => a.url);
        const fullPrompt = links.length ? `${rawPrompt}\n${links.join("\n")}` : rawPrompt;
        const fileItems = attachedItems.filter((a) => a.kind === "file");

        const tempId = `optimistic-${Date.now()}`;
        optimisticRuns.push({
          id: tempId,
          goal: rawPrompt,
          role: "orchestrator",
          parent: null,
          state: "planning",
          elapsed: 0,
          n_events: 0,
          result: null,
        });
        selectedRunId = tempId;
        renderNow();

        try {
          let created;
          if (hasShellBridge()) {
            const filePaths = fileItems.map((f) => f.path).filter(Boolean);
            created = await Transport.request("POST", "/api/task", filePaths.length
              ? { prompt: fullPrompt, filePaths }
              : { jsonBody: { prompt: fullPrompt } }
            );
          } else if (fileItems.length) {
            const fd = new FormData();
            fd.append("prompt", fullPrompt);
            for (const item of fileItems) {
              if (item.file) fd.append("files", item.file, item.name);
              else if (item.path) fd.append("paths", item.path); /* picked from file search */
            }
            created = await Transport.request("POST", "/api/task", { formData: fd });
          } else {
            created = await Transport.request("POST", "/api/task", {
              jsonBody: { prompt: fullPrompt },
            });
          }

          optimisticRuns = optimisticRuns.filter((r) => r.id !== tempId);
          if (created?.run) {
            selectedRunId = created.run;
            Transport.post("openChat", { run: created.thread || created.run });
          }
          await pollAll();
        } catch (err) {
          optimisticRuns = optimisticRuns.filter((r) => r.id !== tempId);
          if (err.code === "AUTH") {
            Transport.clearConnection();
            connectionStatus = "disconnected";
            connectionError = "Token rejected · Paste the address again";
          } else {
            sendErrorText = err.message || "Could not send task";
          }
          renderNow();
        }
      }

      promptForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const prompt = promptInput.value.trim();
        if (!prompt) return;

        if (!Transport.isConnected()) {
          connectionStatus = "disconnected";
          connectionError = "Paste the address the backend printed";
          renderNow();
          return;
        }

        const currentAttachments = [...attachments];
        promptInput.value = "";
        attachments = [];
        renderAttachments();
        syncPromptFieldState();

        submitTask(prompt, currentAttachments);
      });

      /* ---------------- VIEW RENDERING (Reads ONLY WorkspaceAdapter ViewModel) ---------------- */
      function renderPill(vm) {
        if (vm.connectionStatus === "loading" && !hasLoadedOnce) {
          pillStatusLine.innerHTML = `<span class="state-text state-working">&hellip; Loading</span>`;
          return;
        }

        if (vm.connectionStatus === "disconnected") {
          pillStatusLine.innerHTML = `<span class="state-text state-warning">&oslash; Not connected</span>`;
          return;
        }

        const latest = vm.runs[0] || null;
        if (!latest) {
          pillStatusLine.innerHTML = `<span class="pill-idle">Ask your agents</span>`;
          return;
        }

        /* F2 & F3: No fake "Run again" action in pill; only symbol + word get state color */
        const pillDetail = latest.pillFact || latest.stateFact;
        const fact = pillDetail ? `<span class="pill-sub">&middot; ${escapeHtml(pillDetail)}</span>` : "";
        pillStatusLine.innerHTML = `
          <span class="state-text ${escapeHtml(latest.stateColorClass)}">${escapeHtml(latest.stateSymbolWord)}</span>
          ${fact}
        `;
      }

      function renderPanel(vm) {
        sampleBanner.style.display = vm.isSampleData ? "flex" : "none";

        if (vm.connectionStatus === "loading" && !hasLoadedOnce) {
          destroyAllAgentChips();
          timelineScroll.innerHTML = `
            <div class="timeline-row">
              <span class="state-text state-working">&hellip; Loading</span>
              <div class="skeleton-line" style="flex: 1; max-width: 240px;"></div>
            </div>
          `;
          syncSizeAndBridge();
          return;
        }

        if (vm.connectionStatus === "disconnected") {
          destroyAllAgentChips();
          const prevInput = document.getElementById("connect-url-input")?.value || "";
          timelineScroll.innerHTML = `
            <div class="timeline-block">
              <div class="timeline-row">
                <span class="state-text state-warning">&oslash; Not connected</span>
                <span class="timeline-fact">${escapeHtml(vm.connectionError || "Paste the address the backend printed")}</span>
              </div>
              <div class="inline-input-row">
                <input
                  type="url"
                  id="connect-url-input"
                  class="inline-text-input"
                  placeholder="http://127.0.0.1:8765/?t=..."
                  aria-label="Backend address"
                  value="${escapeHtml(prevInput)}"
                />
                <button type="button" id="connect-submit-btn" class="btn">Connect</button>
              </div>
            </div>
          `;
          syncSizeAndBridge();
          return;
        }

        const blocks = [];

        if (vm.connectionStatus === "stale") {
          blocks.push(`
            <div class="timeline-row">
              <span class="state-text state-warning">&#9684; May be out of date</span>
              <button type="button" class="btn" data-action="retry-connect">Retry</button>
            </div>
          `);
        }

        if (sendErrorText) {
          blocks.push(`
            <div class="timeline-row">
              <span class="state-text state-danger">&times; Failed &middot; ${escapeHtml(sendErrorText)}</span>
            </div>
          `);
        }

        if (!vm.runs.length) {
          destroyAllAgentChips();
          blocks.push(`
            <div class="timeline-row">
              <span class="state-text state-neutral">&cir; No runs yet</span>
            </div>
          `);
          timelineScroll.innerHTML = blocks.join("");
          syncSizeAndBridge();
          return;
        }

        const newestId = vm.runs[0].id;
        if (newestId !== latestSeenRunId) {
          latestSeenRunId = newestId;
          selectedRunId = newestId;
        }
        const activeRun = vm.runs.find((r) => r.id === selectedRunId) || vm.runs[0];
        selectedRunId = activeRun.id;

        const savedScroll = new Map();
        timelineScroll.querySelectorAll("[data-detail-scroll]").forEach((el) => {
          savedScroll.set(el.dataset.detailScroll, el.scrollTop);
        });

        /* Inline pending help rows inside timeline (Requirement 5 & A4) */
        const helpHtml = activeRun.pendingHelp
          .map(
            (h) => `
              <div class="help-block ${h.isExpired ? "is-expired" : ""}">
                <div class="help-row">
                  <span class="help-question">${escapeHtml(h.question)}</span>
                  <span class="help-actions">
                    ${h.isExpired
                      ? `<span class="state-text state-danger">&oslash; Expired</span>`
                      : h.options
                          .map(
                            (opt) => `
                              <button
                                type="button"
                                class="btn"
                                data-action="answer-help"
                                data-help-id="${escapeHtml(h.id)}"
                                data-choice="${escapeHtml(opt)}"
                              >${escapeHtml(opt.charAt(0).toUpperCase() + opt.slice(1))}</button>
                            `
                          )
                          .join("")
                    }
                  </span>
                </div>
                ${h.kindWarning ? `<div class="help-warning">${escapeHtml(h.kindWarning)}</div>` : ""}
                ${h.detail ? `<div class="help-meta">${escapeHtml(h.detail)}</div>` : ""}
                <div class="help-meta">${escapeHtml(h.timeoutNote)}</div>
              </div>
            `
          )
          .join("");

        /* Steps (F5: NO elapsed duplicated on child steps; A3: agent sea-glass chip + current step) */
        const stepsHtml = activeRun.steps
          .map((step) => {
            const isExpanded = expandedStepIds.has(step.id);
            const fingerprint = `${step.stateSymbolWord}:${step.agentIdentity.name}:${step.latestSummary}`;
            const prev = knownStepFingerprints.get(step.id);
            if (prev && prev !== fingerprint) {
              highlightedStepIds.add(step.id);
              setTimeout(() => highlightedStepIds.delete(step.id), 650);
            }
            knownStepFingerprints.set(step.id, fingerprint);

            const highlightClass = highlightedStepIds.has(step.id) ? "changed-highlight" : "";
            const enterClass = !prev && hasLoadedOnce ? "step-enter" : "";

            let detailHtml = "";
            if (isExpanded) {
              const linesHtml = step.detailLines.length
                ? step.detailLines.map((l) => `<div>${escapeHtml(l)}</div>`).join("")
                : `<div>No events recorded yet.</div>`;
              const shimmerHtml = step.isWorking
                ? `<div class="skeleton-line" style="margin-top: 8px; width: 70%;"></div>`
                : "";
              detailHtml = `
                <div class="step-detail-mono" data-detail-scroll="${escapeHtml(step.id)}">${linesHtml}${shimmerHtml}</div>
              `;
            }

            return `
              <div class="step-item ${highlightClass} ${enterClass}">
                <button
                  type="button"
                  class="step-row-btn"
                  data-step-id="${escapeHtml(step.id)}"
                  aria-expanded="${isExpanded ? "true" : "false"}"
                >
                  <span class="step-left">
                    <span class="state-text ${escapeHtml(step.stateColorClass)}">${escapeHtml(step.stateSymbolWord)}</span>
                    <span
                      class="agent-chip"
                      style="--chip-bg: ${escapeHtml(step.agentIdentity.palette.body)}; --chip-edge: ${escapeHtml(step.agentIdentity.palette.edge)}; --chip-ink: ${escapeHtml(step.agentIdentity.palette.ink)};"
                      data-agent-chip="${escapeHtml(step.id)}"
                      data-agent-name="${escapeHtml(step.agentIdentity.name)}"
                      data-agent-color="${escapeHtml(step.agentIdentity.color)}"
                    ><span class="agent-chip-label">${escapeHtml(step.agentIdentity.name)}</span></span>
                    <span class="step-event-text">${escapeHtml(step.latestSummary)}</span>
                  </span>
                </button>
                ${detailHtml}
              </div>
            `;
          })
          .join("");

        const runAgainHtml =
          activeRun.state === "failed"
            ? `<button type="button" class="btn" data-action="run-again" data-prompt="${escapeHtml(activeRun.goal)}">Run again</button>`
            : "";

        const speakHtml =
          activeRun.speakText && activeRun.speakText !== activeRun.evidenceText
            ? `<div class="run-evidence-line">${escapeHtml(activeRun.speakText)}</div>`
            : "";

        const evidenceHtml = activeRun.evidenceText
          ? `<div class="run-evidence-line">Verified on screen: ${escapeHtml(activeRun.evidenceText)}</div>`
          : "";

        const mockBannerHtml =
          activeRun.mockNote && !vm.isSampleData
            ? `<div class="sample-tag">${escapeHtml(activeRun.mockNote)}</div>`
            : "";

        blocks.push(`
          <div class="timeline-block">
            <div class="run-header">
              <div class="run-title-row">
                <span class="run-title">${escapeHtml(activeRun.goal)}</span>
                <span class="run-elapsed">${escapeHtml(activeRun.elapsedText)}</span>
              </div>
              <div class="run-outcome-row">
                <div class="run-outcome-copy">
                  <span class="state-text ${escapeHtml(activeRun.stateColorClass)}">${escapeHtml(activeRun.stateSymbolWord)}</span>
                  ${activeRun.stateFact ? `<span class="run-summary-text">${escapeHtml(activeRun.stateFact)}</span>` : ""}
                </div>
                ${runAgainHtml}
              </div>
              ${mockBannerHtml}
              ${speakHtml}
              ${evidenceHtml}
            </div>
            ${helpHtml}
            <div class="steps-list">
              ${stepsHtml}
            </div>
          </div>
        `);

        const otherRuns = vm.runs.filter((r) => r.id !== activeRun.id);
        if (otherRuns.length) {
          const pastHtml = otherRuns
            .map(
              (r) => `
                <button type="button" class="past-run-btn" data-run-id="${escapeHtml(r.id)}">
                  <span class="past-run-left">
                    <span class="state-text ${escapeHtml(r.stateColorClass)}">${escapeHtml(r.stateSymbolWord)}</span>
                    <span class="past-run-instr">${escapeHtml(r.goal)}</span>
                  </span>
                  <span class="run-elapsed">${escapeHtml(r.elapsedText)}</span>
                </button>
              `
            )
            .join("");

          blocks.push(`
            <div class="past-runs-section">
              <div class="section-heading">Earlier runs</div>
              ${pastHtml}
            </div>
          `);
        }

        destroyAllAgentChips();
        timelineScroll.innerHTML = blocks.join("");

        timelineScroll.querySelectorAll("[data-detail-scroll]").forEach((el) => {
          const prev = savedScroll.get(el.dataset.detailScroll);
          if (prev != null) el.scrollTop = prev;
        });

        mountAllAgentChips();
        syncSizeAndBridge();
      }

      function renderNow() {
        const vm = WorkspaceAdapter.mapRuns([...optimisticRuns, ...rawRuns], detailsById, pendingHelp, {
          connectionStatus,
          connectionError,
          isSampleData,
          agentsById,
        });
        renderPill(vm);
        renderPanel(vm);
      }

      /* ---------------- TIMELINE INTERACTIONS ---------------- */
      async function handleConnectSubmit() {
        const input = document.getElementById("connect-url-input");
        if (!input) return;
        const res = await Transport.setConnection(input.value);
        if (!res.ok) {
          connectionStatus = "disconnected";
          connectionError = res.error || "Paste the address the backend printed";
          renderNow();
          return;
        }
        connectionError = "";
        connectionStatus = "loading";
        renderNow();
        await pollAll();
      }

      timelineScroll.addEventListener("keydown", (e) => {
        if (e.isComposing || e.keyCode === 229) return;
        if (e.key === "Enter" && e.target.id === "connect-url-input") {
          e.preventDefault();
          handleConnectSubmit();
        }
      });

      timelineScroll.addEventListener("click", async (e) => {
        if (e.target.id === "connect-submit-btn") {
          handleConnectSubmit();
          return;
        }

        const actionBtn = e.target.closest("[data-action]");
        if (actionBtn) {
          const action = actionBtn.dataset.action;
          if (action === "retry-connect") {
            await pollAll();
            return;
          }
          if (action === "run-again") {
            const p = actionBtn.dataset.prompt || "";
            if (p) submitTask(p, []);
            return;
          }
          if (action === "answer-help") {
            const hid = actionBtn.dataset.helpId;
            const choice = actionBtn.dataset.choice;
            const helpRecord = pendingHelp.find((h) => h.id === hid);
            const allowedOptions = Array.isArray(helpRecord?.options) ? helpRecord.options : [];
            if (hid && choice && allowedOptions.includes(choice)) {
              actionBtn.disabled = true;
              try {
                await Transport.request("POST", `/api/help/${encodeURIComponent(hid)}`, {
                  jsonBody: { choice },
                });
                await pollAll();
              } catch (err) {
                sendErrorText = err.message || "Could not send answer";
                renderNow();
              }
            }
            return;
          }
        }

        const stepBtn = e.target.closest("[data-step-id]");
        if (stepBtn) {
          const id = stepBtn.dataset.stepId;
          if (expandedStepIds.has(id)) {
            expandedStepIds.delete(id);
          } else {
            expandedStepIds.add(id);
          }
          renderNow();
          return;
        }

        const runBtn = e.target.closest("[data-run-id]");
        if (runBtn) {
          selectedRunId = runBtn.dataset.runId;
          renderNow();
        }
      });

      /* ---------------- POLLING ---------------- */
      async function pollAll() {
        if (!Transport.isConnected()) {
          connectionStatus = "disconnected";
          renderNow();
          return;
        }

        try {
          const [runsResp, helpResp, agentsResp] = await Promise.all([
            Transport.request("GET", "/api/runs"),
            Transport.request("GET", "/api/help"),
            Transport.request("GET", "/api/agents").catch(() => ({})),
          ]);

          const nextRuns = Array.isArray(runsResp) ? runsResp : [];
          const nextHelp = Array.isArray(helpResp) ? helpResp : [];
          const nextAgents = agentsResp && typeof agentsResp === "object" ? agentsResp : {};

          /* Fetch incremental event details for active/selected runs */
          const parents = nextRuns.filter((r) => !r.parent);
          const focusParentId =
            (selectedRunId && parents.some((p) => p.id === selectedRunId) && selectedRunId) ||
            parents[0]?.id ||
            null;

          const detailTargets = nextRuns.filter(
            (r) => r.id === focusParentId || r.parent === focusParentId || !r.parent
          );

          await Promise.all(
            detailTargets.map(async (r) => {
              const existing = detailsById[r.id];
              const since = existing ? existing.events.length : 0;
              if (existing && existing.n_events === r.n_events && (r.state === "done" || r.state === "failed")) {
                return;
              }
              try {
                const view = await Transport.request(
                  "GET",
                  `/api/runs/${encodeURIComponent(r.id)}?since=${since}`
                );
                if (existing && since > 0 && Array.isArray(view.events)) {
                  view.events = [...existing.events, ...view.events];
                }
                detailsById[r.id] = view;
              } catch {
                // Keep previous detail if transient failure
              }
            })
          );

          rawRuns = nextRuns;
          pendingHelp = nextHelp;
          agentsById = nextAgents;
          hasLoadedOnce = true;
          connectionStatus = "connected";
          connectionError = "";
          renderNow();
        } catch (err) {
          if (err.code === "AUTH") {
            Transport.clearConnection();
            connectionStatus = "disconnected";
            connectionError = "Paste the address the backend printed";
          } else {
            connectionStatus = hasLoadedOnce ? "stale" : "disconnected";
          }
          renderNow();
        }
      }

      if (typeof ResizeObserver !== "undefined") {
        const ro = new ResizeObserver(() => syncSizeAndBridge());
        ro.observe(panelView);
      }

      window.__ca = { Transport, addAttachments, setState, escapeHtml, syncSizeAndBridge, getCurrentState };

      window.addEventListener("shell-event", (e) => {
        const msg = e.detail || {};
        if (msg.type === "hotkey") setState("expanded", { instant: true });
        if (msg.type === "filesDropped" && Array.isArray(msg.files)) {
          if (getCurrentState() === "collapsed") setState("expanded", { instant: true });
          addAttachments(msg.files.map((f) => ({ id: `${f.path}-${f.name}`, name: f.name, kind: "file", path: f.path })));
        }
      });

      async function boot() {
        const mode = params.get("shell");
        if (mode === "chat" || mode === "notes") {
          document.body.dataset.mode = mode;
          const state = await Transport.init().catch(() => ({ connected: false }));
          /* the view code is in the next <script>; wait for it to be parsed */
          const start = () => window.__caBootView && window.__caBootView(mode, state);
          if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start);
          else start();
          return;
        }
        syncSizeAndBridge(true);
        try {
          const state = await Transport.init();
          isSampleData = state.isSampleData;
          if (state.connected) {
            await pollAll();
          } else {
            connectionStatus = "disconnected";
            renderNow();
          }
        } catch (err) {
          connectionStatus = "disconnected";
          connectionError = err.message || "Could not start workspace";
          renderNow();
        }
        setInterval(pollAll, 1000);
      }

      boot();
    })();
  </script>

  <script>
    /* Views added on the shared workspace: file search, analytics, settings, chat windows, notifications.
       They reuse the shell transport above (window.__ca) and its styles; the backend does all the work. */
    (function () {
      const ca = () => window.__ca;
      const $ = (id) => document.getElementById(id);
      const esc = (v) => ca().escapeHtml(v);
      const req = (method, path, body) =>
        ca().Transport.request(method, path, body === undefined ? {} : { jsonBody: body });
      const money = (n) => (n == null ? "none yet" : "$" + Number(n).toFixed(Number(n) < 0.1 ? 4 : 2));
      const paint = (c) => (c ? ` style="color:${esc(c)}"` : "");

      /* ---------------- file search (attach menu: Search files…) ---------------- */
      let searchSeq = 0;
      let searchTimer = null;
      let hits = [];
      window.__caOpenFileSearch = function () {
        $("file-search-row").classList.remove("hidden");
        ca().syncSizeAndBridge();
        requestAnimationFrame(() => $("file-search-input").focus());
      };
      function closeSearch() {
        $("file-search-row").classList.add("hidden");
        $("file-search-input").value = "";
        $("file-search-results").innerHTML = "";
        hits = [];
        ca().syncSizeAndBridge();
      }
      function pick(i) {
        const h = hits[i];
        if (!h) return;
        ca().addAttachments([{ id: h.path, name: h.name, kind: "file", path: h.path }]);
        closeSearch();
        $("prompt-input").focus();
      }
      $("file-search-input")?.addEventListener("input", (e) => {
        clearTimeout(searchTimer);
        const q = e.target.value.trim();
        searchTimer = setTimeout(async () => {
          const mine = ++searchSeq;
          const box = $("file-search-results");
          if (q.length < 2) {
            box.innerHTML = "";
            ca().syncSizeAndBridge();
            return;
          }
          box.innerHTML = `<div class="timeline-fact">Searching…</div>`;
          try {
            const found = await req("GET", "/api/files?q=" + encodeURIComponent(q));
            if (mine !== searchSeq) return;
            hits = Array.isArray(found) ? found : [];
            box.innerHTML = hits.length
              ? hits.map((h, i) => `
                  <button type="button" class="past-run-btn file-hit" role="option" data-hit="${i}">
                    <span>${esc(h.name)}</span><span class="file-hit-where">${esc(h.where)}</span>
                  </button>`).join("")
              : `<div class="timeline-fact">No file names match “${esc(q)}”</div>`;
          } catch (err) {
            box.innerHTML = `<div class="state-text state-danger">Search failed: ${esc(err.message)}</div>`;
          }
          ca().syncSizeAndBridge();
        }, 150);
      });
      $("file-search-input")?.addEventListener("keydown", (e) => {
        if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); closeSearch(); }
        if (e.key === "Enter") { e.preventDefault(); pick(0); }
      });
      $("file-search-results")?.addEventListener("click", (e) => {
        const b = e.target.closest("[data-hit]");
        if (b) pick(Number(b.dataset.hit));
      });

      /* ---------------- side views: analytics, settings ---------------- */
      function showSide(on) {
        $("side-view").classList.toggle("hidden", !on);
        $("timeline-scroll").classList.toggle("hidden", on);
        ca().syncSizeAndBridge();
      }
      const sideHead = (title) => `
        <div class="side-head"><span class="side-title">${title}</span>
        <button type="button" class="btn" data-close-side>Back</button></div>`;
      document.addEventListener("click", async (e) => {
        if (e.target.closest("[data-close-side]")) return showSide(false);
        const b = e.target.closest("[data-side]");
        if (!b) return;
        const v = $("side-view");
        const title = b.dataset.side === "analytics" ? "Analytics" : "Settings";
        v.innerHTML = sideHead(title) + `<div class="timeline-fact">Loading…</div>`;
        showSide(true);
        try {
          v.innerHTML = sideHead(title) + (b.dataset.side === "analytics" ? await analyticsHtml() : await settingsHtml());
        } catch (err) {
          v.innerHTML = sideHead(title) + `<div class="state-text state-danger">Could not load: ${esc(err.message)}</div>`;
        }
        ca().syncSizeAndBridge();
      });

      async function analyticsHtml() {
        const midnight = new Date();
        midnight.setHours(0, 0, 0, 0);
        const [day, all] = await Promise.all([
          req("GET", "/api/analytics?since=" + Math.floor(midnight.getTime() / 1000)),
          req("GET", "/api/analytics"),
        ]);
        if (!all.tasks) return `<div class="timeline-fact">No tasks yet. Spend and success show up here after your first task.</div>`;
        const block = (label, a) => `
          <dl class="kv">
            <dt>${label}</dt><dd>${a.tasks} task${a.tasks === 1 ? "" : "s"}</dd>
            <dt>Spend</dt><dd>${money(a.cost_usd)}</dd>
            <dt>Per task</dt><dd>${money(a.mean_cost_per_task)}</dd>
            <dt>Model calls</dt><dd>${a.llm_calls}</dd>
          </dl>`;
        const roles = (all.by_role || []).filter((r) => r.role !== "orchestrator").map((r) =>
          `<dt>${esc(r.role)}</dt><dd>${r.ok || 0} of ${r.runs} finished, ${Math.round(r.mean_seconds || 0)} s each</dd>`).join("");
        return block("Today", day) + block("All time", all) + (roles ? `<dl class="kv">${roles}</dl>` : "");
      }

      async function settingsHtml() {
        const p = await req("GET", "/api/profile");
        const field = (key, label, hint) => `
          <label>${label}
            <input class="inline-text-input" name="${key}" value="${esc(p[key] || "")}" placeholder="${esc(hint)}" />
          </label>`;
        return `
          <form class="settings-form" id="settings-form">
            ${field("call_me", "What should your agents call you?", "Your first name")}
            ${field("voice_id", "Voice (ElevenLabs voice id)", "Default: Sunny")}
            ${field("model", "Model", "google/gemini-4-argon")}
            ${field("decide_model", "Faster model for each step (blank uses Model)", "e.g. google/gemini-3.5-flash-lite")}
            <div class="settings-actions">
              <button type="submit" class="btn btn-primary">Save settings</button>
              <span id="settings-msg" class="timeline-fact" aria-live="polite"></span>
            </div>
          </form>`;
      }
      document.addEventListener("submit", async (e) => {
        if (e.target.id !== "settings-form") return;
        e.preventDefault();
        const msg = $("settings-msg");
        const body = Object.fromEntries(new FormData(e.target).entries());
        try {
          await req("POST", "/api/profile", body);
          msg.className = "state-text state-success";
          msg.textContent = "✓ Saved";
        } catch (err) {
          msg.className = "state-text state-danger";
          msg.textContent = err.message;
        }
      });

      /* ---------------- views in their own windows ---------------- */
      window.__caBootView = function (mode, state) {
        if (!state || !state.connected) {
          document.body.insertAdjacentHTML("beforeend",
            `<div class="note"><span class="state-text state-warning">Not connected to the backend</span></div>`);
          return;
        }
        (mode === "chat" ? bootChat : bootNotes)();
      };

      const STATE_WORD = {
        done: ["✓ Done", "state-success"], failed: ["× Failed", "state-danger"],
        awaiting_human: ["! Needs you", "state-warning"],
      };

      function bootChat() {
        const run = new URLSearchParams(location.search).get("run") || "";
        document.body.insertAdjacentHTML("beforeend", `
          <div class="chat">
            <div class="chat-head">
              <span class="chat-title" id="chat-title">Conversation</span>
              <span id="chat-state" class="state-text state-working"></span>
              <button type="button" class="btn" id="chat-close">Close</button>
            </div>
            <div class="chat-log" id="chat-log" role="log" aria-live="polite">
              <div class="timeline-fact">Loading the conversation…</div>
            </div>
            <form class="chat-reply" id="chat-form">
              <input class="inline-text-input" id="chat-input" placeholder="Reply or ask a follow-up" aria-label="Reply" />
              <button type="submit" class="btn btn-primary">Send</button>
            </form>
          </div>`);
        $("chat-close").onclick = () => ca().Transport.post("closeWindow");
        let shown = -1;
        async function poll() {
          try {
            const [msgs, info] = await Promise.all([
              req("GET", `/api/runs/${encodeURIComponent(run)}/transcript`),
              req("GET", `/api/runs/${encodeURIComponent(run)}?since=1000000`),
            ]);
            $("chat-title").textContent = info.goal || "Conversation";
            const [word, cls] = STATE_WORD[info.state] || ["… Working", "state-working"];
            $("chat-state").textContent = word;
            $("chat-state").className = "state-text " + cls;
            if (msgs.length !== shown) {
              shown = msgs.length;
              const log = $("chat-log");
              log.innerHTML = msgs.length ? msgs.map((m) => `
                <div class="${m.kind === "step" ? "msg-step" : "msg"}">
                  <span class="msg-who"${m.role === "user" ? "" : paint(m.color)}>${esc(m.role === "user" ? "You" : m.agent)}</span>${esc(m.text)}
                </div>`).join("") : `<div class="timeline-fact">Waiting for the first message…</div>`;
              log.scrollTop = log.scrollHeight;
            }
          } catch (err) {
            $("chat-state").textContent = "Reconnecting…";
            $("chat-state").className = "state-text state-warning";
          }
        }
        $("chat-form").addEventListener("submit", async (e) => {
          e.preventDefault();
          const input = $("chat-input");
          const prompt = input.value.trim();
          if (!prompt) return;
          input.value = "";
          try {
            await req("POST", "/api/task", { prompt, thread: run });
            poll();
          } catch (err) {
            input.value = prompt;
            $("chat-state").textContent = "Not sent: " + err.message;
            $("chat-state").className = "state-text state-danger";
          }
        });
        poll();
        setInterval(poll, 1000);
        $("chat-input").focus();
      }

      function bootNotes() {
        document.body.insertAdjacentHTML("beforeend", `<div class="notes" id="notes" aria-live="polite"></div>`);
        const seen = new Set();
        let lastHeight = -1;
        async function poll() {
          let help = [], notes = [];
          try {
            [notes, help] = await Promise.all([req("GET", "/api/notifications"), req("GET", "/api/help")]);
          } catch {
            return; /* keep what is on screen; the next poll retries */
          }
          const ids = [...help.map((h) => "h:" + h.id), ...notes.map((n) => "n:" + n.id)];
          const fresh = ids.some((id) => !seen.has(id));
          ids.forEach((id) => seen.add(id));
          $("notes").innerHTML = help.map((h) => `
              <div class="note">
                <span class="note-title state-warning">${esc(h.agent || "An agent")} needs you</span>
                <span>${esc(h.question)}</span>
                ${h.detail ? `<div class="note-detail">${esc(typeof h.detail === "string" ? h.detail : JSON.stringify(h.detail))}</div>` : ""}
                <div class="note-actions">
                  <button type="button" class="btn" data-open="${esc(h.thread)}">Open chat</button>
                  ${h.options.map((o, i) => `<button type="button" class="btn${i === 0 ? " btn-primary" : ""}" data-help="${esc(h.id)}" data-choice="${esc(o)}">${esc(o[0].toUpperCase() + o.slice(1))}</button>`).join("")}
                </div>
              </div>`).join("") + notes.map((n) => `
              <div class="note">
                <span class="note-title"><span class="state-text ${n.ok === false ? "state-danger" : "state-success"}">${n.ok === false ? "× Failed" : "✓ Done"}</span> ${esc(n.title)}</span>
                <span>${esc(n.text)}</span>
                <div class="note-actions">
                  <button type="button" class="btn" data-open="${esc(n.thread)}">Open chat</button>
                  <button type="button" class="btn" data-dismiss="${esc(n.id)}">Dismiss</button>
                </div>
              </div>`).join("");
          const height = ids.length ? $("notes").scrollHeight + 4 : 0;
          if (height !== lastHeight || fresh) {
            lastHeight = height;
            ca().Transport.post("resize", { state: "notes", width: 320, height, fresh });
          }
        }
        document.addEventListener("click", async (e) => {
          const t = e.target.closest("button");
          if (!t) return;
          if (t.dataset.open) ca().Transport.post("openChat", { run: t.dataset.open });
          if (t.dataset.help) await req("POST", `/api/help/${encodeURIComponent(t.dataset.help)}`, { choice: t.dataset.choice }).catch(() => {});
          if (t.dataset.dismiss) await req("POST", `/api/notifications/${encodeURIComponent(t.dataset.dismiss)}/dismiss`, {}).catch(() => {});
          poll();
        });
        poll();
        setInterval(poll, 1000);
      }
    })();
  </script>
</body>
</html>
