      openWorkspaceBtn.addEventListener("click", () => {
        Transport.openWorkspace(fixtureParam || "");
      });

      collapseBtn.addEventListener("click", (e) => {
        setState("collapsed", { instant: e.detail === 0 });
      });

      window.addEventListener("keydown", (e) => {
        if (e.isComposing || e.keyCode === 229) return;
        if (e.key === "Escape") {
          if (attachMenu.classList.contains("open")) {
            e.preventDefault();
            closeAttachMenu();
            attachBtn.focus();
            return;
          }
          if (!linkInputRow.classList.contains("hidden")) {
            e.preventDefault();
            closeLinkInput();
            attachBtn.focus();
            return;
          }
          if (getCurrentState() === "expanded") {
            e.preventDefault();
            setState("collapsed", { instant: true });
          }
        }
      });

      /* F1: Toggle .has-text immediately so hint hides the moment user types */
      function syncPromptFieldState() {
        promptFieldWrap.classList.toggle("has-text", promptInput.value.length > 0);
        promptInput.style.height = "20px";
        promptInput.style.height = `${Math.min(80, Math.max(20, promptInput.scrollHeight))}px`;
        syncSizeAndBridge();
      }

      promptInput.addEventListener("input", syncPromptFieldState);
      promptInput.addEventListener("keydown", (e) => {
        if (e.isComposing || e.keyCode === 229) return;
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          promptForm.requestSubmit();
        }
      });

      /* ---------------- ATTACHMENTS ---------------- */
      function closeAttachMenu() {
        attachMenu.classList.remove("open");
        attachBtn.setAttribute("aria-expanded", "false");
      }

      function closeLinkInput() {
        linkInputRow.classList.add("hidden");
        linkInput.value = "";
        syncSizeAndBridge();
      }

      attachBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        const willOpen = !attachMenu.classList.contains("open");
        attachMenu.classList.toggle("open", willOpen);
        attachBtn.setAttribute("aria-expanded", willOpen ? "true" : "false");
        syncSizeAndBridge();
      });

      document.addEventListener("click", (e) => {
        if (!attachMenu.contains(e.target) && e.target !== attachBtn) {
          closeAttachMenu();
        }
      });

      attachMenu.addEventListener("click", async (e) => {
        const item = e.target.closest("[data-attach-kind]");
        if (!item) return;
        const kind = item.dataset.attachKind;
        closeAttachMenu();

        if (kind === "search") {
          window.__caOpenFileSearch && window.__caOpenFileSearch();
          return;
        }

        if (kind === "link") {
          linkInputRow.classList.remove("hidden");
          syncSizeAndBridge();
          requestAnimationFrame(() => linkInput.focus());
          return;
        }

        if (hasShellBridge()) {
          const picked = await Transport.pickFiles(kind);
          if (picked && picked.length) {
            addAttachments(
              picked.map((f) => ({
                id: `${f.path}-${f.name}`,
                name: f.name,
                kind: "file",
                path: f.path,
              }))
            );
          }
          return;
        }

        if (kind === "photo") {
          fileInput.setAttribute("accept", "image/*");
        } else if (kind === "video") {
          fileInput.setAttribute("accept", "video/*");
        } else {
          fileInput.removeAttribute("accept");
        }
        fileInput.click();
      });

      linkAddBtn.addEventListener("click", () => {
        const val = linkInput.value.trim();
        if (val) {
          addAttachments([{ id: `link-${val}`, name: val, kind: "link", url: val }]);
        }
        closeLinkInput();
      });

      linkCancelBtn.addEventListener("click", closeLinkInput);

      linkInput.addEventListener("keydown", (e) => {
        if (e.isComposing || e.keyCode === 229) return;
        if (e.key === "Enter") {
          e.preventDefault();
          linkAddBtn.click();
        }
      });

      function addAttachments(items) {
        let changed = false;
        for (const item of items) {
          if (!item || !item.name) continue;
          if (!attachments.some((a) => a.id === item.id)) {
            attachments.push(item);
            changed = true;
          }
        }
        if (changed) {
          renderAttachments();
          syncSizeAndBridge();
        }
      }

      function renderAttachments() {
        if (!attachments.length) {
          attachmentsList.innerHTML = "";
          return;
        }
        attachmentsList.innerHTML = attachments
          .map(
            (att, idx) => `
              <span class="attachment-token">
                <span class="attachment-name" title="${escapeHtml(att.name)}">${escapeHtml(att.name)}</span>
                <button type="button" class="attachment-remove" data-remove-idx="${idx}" aria-label="Remove ${escapeHtml(att.name)}">&times;</button>
              </span>
            `
          )
          .join("");
      }

      attachmentsList.addEventListener("click", (e) => {
        const removeBtn = e.target.closest("[data-remove-idx]");
        if (!removeBtn) return;
        const idx = Number(removeBtn.dataset.removeIdx);
        if (!Number.isNaN(idx)) {
          attachments.splice(idx, 1);
          renderAttachments();
          syncSizeAndBridge();
        }
      });

      fileInput.addEventListener("change", () => {
        const files = Array.from(fileInput.files || []);
        addAttachments(
          files.map((f) => ({
            id: `file-${f.name}-${f.size}`,
            name: f.name,
            kind: "file",
            file: f,
          }))
        );
        fileInput.value = "";
      });

      notchShell.addEventListener("dragover", (e) => {
        e.preventDefault();
        if (getCurrentState() === "collapsed") setState("expanded");
        notchShell.classList.add("drag-over");
      });

      notchShell.addEventListener("dragleave", (e) => {
        if (!notchShell.contains(e.relatedTarget)) {
          notchShell.classList.remove("drag-over");
        }
      });

      notchShell.addEventListener("drop", (e) => {
        e.preventDefault();
        notchShell.classList.remove("drag-over");
        const files = Array.from(e.dataTransfer?.files || []);
        if (files.length && !hasShellBridge()) {
          addAttachments(
            files.map((f) => ({
              id: `file-${f.name}-${f.size}`,
              name: f.name,
              kind: "file",
              file: f,
            }))
          );
          return;
        }
        const uri = e.dataTransfer?.getData("text/uri-list") || e.dataTransfer?.getData("text/plain");
        if (uri && /^https?:\/\//i.test(uri.trim())) {
          const clean = uri.trim();
          addAttachments([{ id: `link-${clean}`, name: clean, kind: "link", url: clean }]);
        }
      });

      window.addEventListener("paste", (e) => {
        const files = Array.from(e.clipboardData?.files || []);
        if (files.length && !hasShellBridge()) {
          addAttachments(
            files.map((f, i) => {
              const name = f.name || `photo-${Date.now()}-${i + 1}.png`;
              return { id: `paste-${name}-${f.size}`, name, kind: "file", file: f };
            })
          );
        }
      });

      /* ---------------- SUBMIT PROMPT ---------------- */
      async function submitTask(rawPrompt, attachedItems) {
        sendErrorText = "";
        const links = attachedItems.filter((a) => a.kind === "link").map((a) => a.url);
        const fullPrompt = links.length ? `${rawPrompt}\n${links.join("\n")}` : rawPrompt;
        const fileItems = attachedItems.filter((a) => a.kind === "file");

        const tempId = `optimistic-${Date.now()}`;
        optimisticRuns.push({
          id: tempId,
          goal: rawPrompt,
          role: "orchestrator",
          parent: null,
          state: "planning",
          elapsed: 0,
          n_events: 0,
          result: null,
        });
        selectedRunId = tempId;
        renderNow();

        try {
          let created;
          if (hasShellBridge()) {
            const filePaths = fileItems.map((f) => f.path).filter(Boolean);
            created = await Transport.request("POST", "/api/task", filePaths.length
              ? { prompt: fullPrompt, filePaths }
              : { jsonBody: { prompt: fullPrompt } }
            );
          } else if (fileItems.length) {
            const fd = new FormData();
            fd.append("prompt", fullPrompt);
            for (const item of fileItems) {
              if (item.file) fd.append("files", item.file, item.name);
              else if (item.path) fd.append("paths", item.path); /* picked from file search */
            }
            created = await Transport.request("POST", "/api/task", { formData: fd });
          } else {
            created = await Transport.request("POST", "/api/task", {
              jsonBody: { prompt: fullPrompt },
            });
          }

          optimisticRuns = optimisticRuns.filter((r) => r.id !== tempId);
          if (created?.run) {
            selectedRunId = created.run;
            Transport.post("openChat", { run: created.thread || created.run });
          }
          await pollAll();
        } catch (err) {
          optimisticRuns = optimisticRuns.filter((r) => r.id !== tempId);
          if (err.code === "AUTH") {
            Transport.clearConnection();
            rememberedAgentsById = {};
            costsById = {};
            connectionStatus = "disconnected";
            connectionError = "Token rejected · Paste the address again";
          } else {
            sendErrorText = err.message || "Could not send task";
          }
          renderNow();
        }
      }

      promptForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const prompt = promptInput.value.trim();
        if (!prompt) return;

        if (!Transport.isConnected()) {
          connectionStatus = "disconnected";
          connectionError = "Paste the address the backend printed";
          renderNow();
          return;
        }

        const currentAttachments = [...attachments];
        promptInput.value = "";
        attachments = [];
        renderAttachments();
        syncPromptFieldState();

        submitTask(prompt, currentAttachments);
      });

      /* ---------------- VIEW RENDERING (Reads ONLY WorkspaceAdapter ViewModel) ---------------- */
      function isLiveStepFaded(liveStep, nowMs = Date.now()) {
        if (!liveStep) return false;
        const prev = liveStepTimers.get(liveStep.key);
        if (!prev || prev.fingerprint !== liveStep.fingerprint) {
          liveStepTimers.set(liveStep.key, { fingerprint: liveStep.fingerprint, updatedAt: nowMs });
          return false;
        }
        return nowMs - prev.updatedAt >= 3000;
      }

      function setPillHtml(html) {
        if (pillStatusLine.innerHTML !== html) {
          pillStatusLine.innerHTML = html;
        }
      }

      function renderPill(vm) {
        if (vm.connectionStatus === "loading" && !hasLoadedOnce) {
          setPillHtml(`<span class="state-text state-working">&hellip; Loading</span>`);
          return;
        }

        if (vm.connectionStatus === "disconnected") {
          setPillHtml(`<span class="state-text state-warning">&oslash; Not connected</span>`);
          return;
        }

        if (ttsSpeaking) {
          setPillHtml(`
            <span class="state-text state-working">&#9679; Speaking</span>
            <span class="pill-sub">&middot; Click to stop</span>
          `);
          return;
        }

        const latest = vm.runs[0] || null;
        if (!latest) {
          setPillHtml(`<span class="pill-idle">Ask your agents</span>`);
          return;
        }

        const dotsHtml = vm.liveAgents.length
          ? `<span class="pill-dots" aria-label="${escapeHtml(String(vm.liveAgents.length))} active agent${vm.liveAgents.length === 1 ? "" : "s"}">${vm.liveAgents
              .map(
                (a) =>
                  `<span class="pill-agent-dot" title="${escapeHtml(a.name)}" style="--dot-bg: ${escapeHtml(a.color)}; --dot-edge: ${escapeHtml(a.edge)};"></span>`
              )
              .join("")}</span>`
          : "";

        /* F2 & F3: No fake "Run again" action in pill; only symbol + word get state color */
        const pillDetail = latest.pillFact || latest.stateFact;
        const fact = pillDetail ? `<span class="pill-sub">&middot; ${escapeHtml(pillDetail)}</span>` : "";
        setPillHtml(`
          ${dotsHtml}
          <span class="state-text ${escapeHtml(latest.stateColorClass)}">${escapeHtml(latest.stateSymbolWord)}</span>
          ${fact}
        `);
      }

      function updateLiveTicksInPlace(vm) {
        const activeRun = vm.runs.find((r) => r.id === selectedRunId) || vm.runs[0];
        if (!activeRun) return false;

        const elapsedEl = timelineScroll.querySelector(`[data-run-elapsed="${CSS.escape(activeRun.id)}"]`);
        if (elapsedEl) {
          elapsedEl.textContent = activeRun.elapsedText;
        }

        let expiryCrossed = false;
        for (const h of activeRun.pendingHelp) {
          const el = timelineScroll.querySelector(`[data-help-note="${CSS.escape(h.id)}"]`);
          if (h.isExpired) {
            if (el && !el.closest(".help-block")?.classList.contains("is-expired")) {
              expiryCrossed = true;
            }
          } else if (el) {
            el.innerHTML = `<span class="help-countdown" data-help-countdown="${escapeHtml(h.id)}">Denies in ${escapeHtml(h.countdownText)}</span> &middot; Silence means no.`;
          }
        }

        if (activeRun.liveStep) {
          const liveEl = timelineScroll.querySelector(`[data-live-step-key="${CSS.escape(activeRun.liveStep.key)}"]`);
          if (liveEl) {
            liveEl.classList.toggle("is-faded", isLiveStepFaded(activeRun.liveStep));
          }
        }

        if (!activeRun.isFinished) {
          const liveCostEl = timelineScroll.querySelector(`[data-run-live-cost="${CSS.escape(activeRun.id)}"]`);
          if (liveCostEl) {
            liveCostEl.textContent = `Cost ${activeRun.digest.liveCostText}`;
          }
        }

        return !expiryCrossed;
      }

      function buildPanelStructureKey(vm, activeRun) {
        if (vm.connectionStatus === "loading" && !hasLoadedOnce) return "loading";
        if (vm.connectionStatus === "disconnected") return `disconnected:${vm.connectionError}`;
        if (!activeRun) return `empty:${vm.connectionStatus}:${sendErrorText}`;

        const helpKey = activeRun.pendingHelp
          .map((h) => `${h.id}:${h.isExpired ? "exp" : "act"}:${h.kindWarning}`)
          .join(",");
        const stepsKey = activeRun.steps
          .map(
            (s) =>
              `${s.id}:${s.stateSymbolWord}:${s.isWorking ? 1 : 0}:${pendingStopIds.has(s.id) ? 1 : 0}:${s.agentIdentity.name}:${s.agentIdentity.color}:${s.app}:${s.latestSummary}:${expandedStepIds.has(s.id) ? 1 : 0}:${s.detailLines.length}`
          )
          .join("|");
        const replayOpen = openReplayRunIds.has(activeRun.id) ? 1 : 0;
        const replayIdx = replayCursor.runId === activeRun.id ? replayCursor.stepIndex : -1;
        const memoryKey = getVisibleMemoriesForRun(activeRun)
          .map((m) => `${m.id}:${m.text || ""}:${pendingUndoMemoryIds.has(m.id) ? 1 : 0}`)
          .join("|");
        const otherKey = vm.runs
          .filter((r) => r.id !== activeRun.id)
          .map((r) => `${r.id}:${r.stateSymbolWord}:${r.goal}`)
          .join("|");

        return [
          vm.connectionStatus,
          vm.isSampleData ? 1 : 0,
          sendErrorText,
          stopRouteSupported ? 1 : 0,
          pendingStopIds.has(activeRun.id) ? 1 : 0,
          stopNoticesByRunId.get(activeRun.id) || "",
          activeRun.id,
          activeRun.goal,
          activeRun.appLabel,
          activeRun.state,
          activeRun.stateSymbolWord,
          activeRun.stateFact,
          activeRun.speakText,
          activeRun.evidenceText,
          activeRun.liveStep ? activeRun.liveStep.fingerprint : "",
          activeRun.digest.totalSteps,
          activeRun.digest.memorySteps,
          activeRun.digest.costText,
          activeRun.digest.liveCostText,
          helpKey,
          memoryKey,
          stepsKey,
          replayOpen,
          replayIdx,
          otherKey,
        ].join("::");
      }

      function renderPanel(vm) {
        lastViewModel = vm;
        sampleBanner.style.display = vm.isSampleData ? "flex" : "none";

        if (vm.connectionStatus === "loading" && !hasLoadedOnce) {
          lastPanelStructureKey = "loading";
          destroyAllAgentChips();
          timelineScroll.innerHTML = `
            <div class="timeline-row">
              <span class="state-text state-working">&hellip; Loading</span>
              <div class="skeleton-line" style="flex: 1; max-width: 240px;"></div>
            </div>
          `;
          syncSizeAndBridge();
          return;
        }

        if (vm.connectionStatus === "disconnected") {
          lastPanelStructureKey = `disconnected:${vm.connectionError}`;
          destroyAllAgentChips();
          const prevInput = document.getElementById("connect-url-input")?.value || "";
          timelineScroll.innerHTML = `
            <div class="timeline-block">
              <div class="timeline-row">
                <span class="state-text state-warning">&oslash; Not connected</span>
                <span class="timeline-fact">${escapeHtml(vm.connectionError || "Paste the address the backend printed")}</span>
              </div>
              <div class="inline-input-row">
                <input
                  type="url"
                  id="connect-url-input"
                  class="inline-text-input"
                  placeholder="http://127.0.0.1:8765/?t=..."
                  aria-label="Backend address"
                  value="${escapeHtml(prevInput)}"
                />
                <button type="button" id="connect-submit-btn" class="btn">Connect</button>
              </div>
            </div>
          `;
          syncSizeAndBridge();
          return;
        }

        const blocks = [];

        if (vm.connectionStatus === "stale") {
          blocks.push(`
            <div class="timeline-row">
              <span class="state-text state-warning">&#9684; May be out of date</span>
              <button type="button" class="btn" data-action="retry-connect">Retry</button>
            </div>
          `);
        }

        if (sendErrorText) {
          blocks.push(`
            <div class="timeline-row">
              <span class="state-text state-danger">&times; Failed &middot; ${escapeHtml(sendErrorText)}</span>
            </div>
          `);
        }

        if (!vm.runs.length) {
          lastPanelStructureKey = `empty:${vm.connectionStatus}:${sendErrorText}`;
          destroyAllAgentChips();
          blocks.push(`
            <div class="timeline-row">
              <span class="state-text state-neutral">&cir; No runs yet</span>
            </div>
          `);
          timelineScroll.innerHTML = blocks.join("");
          syncSizeAndBridge();
          return;
        }

        const newestId = vm.runs[0].id;
        if (newestId !== latestSeenRunId) {
          latestSeenRunId = newestId;
          selectedRunId = newestId;
          stopStepReplay();
        }
        const activeRun = vm.runs.find((r) => r.id === selectedRunId) || vm.runs[0];
        selectedRunId = activeRun.id;

        const nextStructureKey = buildPanelStructureKey(vm, activeRun);
        if (nextStructureKey === lastPanelStructureKey) {
          if (updateLiveTicksInPlace(vm)) {
            return;
          }
        }
        lastPanelStructureKey = nextStructureKey;

        const savedScroll = new Map();
        timelineScroll.querySelectorAll("[data-detail-scroll]").forEach((el) => {
          savedScroll.set(el.dataset.detailScroll, el.scrollTop);
        });

        /* Inline live step line from act/decide events, fading after 3s */
        let liveStepHtml = "";
        if (activeRun.liveStep) {
          const faded = isLiveStepFaded(activeRun.liveStep);
          liveStepHtml = `
            <div
              class="live-step-line ${faded ? "is-faded" : ""}"
              data-live-step-key="${escapeHtml(activeRun.liveStep.key)}"
            >
              <span
                class="agent-dot"
                style="--dot-bg: ${escapeHtml(activeRun.liveStep.agentColor)}; --dot-edge: ${escapeHtml(activeRun.liveStep.agentEdge)};"
              ></span>
              <span class="live-step-text" title="${escapeHtml(activeRun.liveStep.text)}">${escapeHtml(activeRun.liveStep.text)}</span>
            </div>
          `;
        }

        /* Inline pending help rows inside timeline (Requirement 5, A4, countdown to 5m deny) */
        const helpHtml = activeRun.pendingHelp
          .map(
            (h) => `
              <div class="help-block ${h.isExpired ? "is-expired" : ""}">
                <div class="help-row">
                  <span class="help-question">${escapeHtml(h.question)}</span>
                  <span class="help-actions">
                    ${h.isExpired
                      ? `<span class="state-text state-danger">&oslash; Expired</span>`
                      : h.options
                          .map(
                            (opt) => `
                              <button
                                type="button"
                                class="btn"
                                data-action="answer-help"
                                data-help-id="${escapeHtml(h.id)}"
                                data-choice="${escapeHtml(opt)}"
                              >${escapeHtml(opt.charAt(0).toUpperCase() + opt.slice(1))}</button>
                            `
                          )
                          .join("")
                    }
                  </span>
                </div>
                ${h.kindWarning ? `<div class="help-warning">${escapeHtml(h.kindWarning)}</div>` : ""}
                ${h.detail ? `<div class="help-meta">${escapeHtml(h.detail)}</div>` : ""}
                <div class="help-meta" data-help-note="${escapeHtml(h.id)}">${
                  h.isExpired
                    ? escapeHtml(h.timeoutNote)
                    : `<span class="help-countdown" data-help-countdown="${escapeHtml(h.id)}">Denies in ${escapeHtml(h.countdownText)}</span> &middot; Silence means no.`
                }</div>
              </div>
            `
          )
          .join("");

        /* Steps (one row per agent with its color; A3 & After a task) */
        const stepsHtml = activeRun.steps
          .map((step) => {
            const isExpanded = expandedStepIds.has(step.id);
            const fingerprint = `${step.stateSymbolWord}:${step.agentIdentity.name}:${step.app}:${step.latestSummary}`;
            const prev = knownStepFingerprints.get(step.id);
            if (prev && prev !== fingerprint) {
              highlightedStepIds.add(step.id);
              setTimeout(() => highlightedStepIds.delete(step.id), 650);
            }
            knownStepFingerprints.set(step.id, fingerprint);

            const highlightClass = highlightedStepIds.has(step.id) ? "changed-highlight" : "";
            const enterClass = !prev && hasLoadedOnce ? "step-enter" : "";
            const stepSummaryText = step.app && step.latestSummary
              ? `${step.app} · ${step.latestSummary}`
              : step.latestSummary || step.app;

            let detailHtml = "";
            if (isExpanded) {
              const linesHtml = step.detailLines.length
                ? step.detailLines.map((l) => `<div>${escapeHtml(l)}</div>`).join("")
                : `<div>No events recorded yet.</div>`;
              const shimmerHtml = step.isWorking
                ? `<div class="skeleton-line" style="margin-top: 8px; width: 70%;"></div>`
                : "";
              detailHtml = `
                <div class="step-detail-mono" data-detail-scroll="${escapeHtml(step.id)}">${linesHtml}${shimmerHtml}</div>
              `;
            }

            const stopStepBtnHtml =
              stopRouteSupported && step.isWorking
                ? `<button type="button" class="btn" data-action="stop-agent" data-run-id="${escapeHtml(step.id)}" aria-label="Stop ${escapeHtml(step.agentIdentity.name)}" ${pendingStopIds.has(step.id) ? "disabled" : ""}>Stop</button>`
                : "";

            return `
              <div class="step-item ${highlightClass} ${enterClass}">
                <div class="step-row-line">
                  <button
                    type="button"
                    class="step-row-btn"
                    data-step-id="${escapeHtml(step.id)}"
                    aria-expanded="${isExpanded ? "true" : "false"}"
                  >
                    <span class="step-left">
                      <span class="state-text ${escapeHtml(step.stateColorClass)}">${escapeHtml(step.stateSymbolWord)}</span>
                      <span
                        class="agent-chip"
                        style="--chip-bg: ${escapeHtml(step.agentIdentity.palette.body)}; --chip-edge: ${escapeHtml(step.agentIdentity.palette.edge)}; --chip-ink: ${escapeHtml(step.agentIdentity.palette.ink)};"
                        data-agent-chip="${escapeHtml(step.id)}"
                        data-agent-has-color="${step.agentIdentity.hasAgentColor ? "1" : "0"}"
                        data-agent-name="${escapeHtml(step.agentIdentity.name)}"
                        data-agent-color="${escapeHtml(step.agentIdentity.color)}"
                        data-agent-edge="${escapeHtml(step.agentIdentity.rawEdge || step.agentIdentity.palette.edge)}"
                        data-agent-ink="${escapeHtml(step.agentIdentity.rawInk || step.agentIdentity.palette.ink)}"
                      ><span class="agent-chip-label">${escapeHtml(step.agentIdentity.name)}</span></span>
                      <span class="step-event-text">${escapeHtml(stepSummaryText)}</span>
                    </span>
                  </button>
                  ${stopStepBtnHtml}
                </div>
                ${detailHtml}
              </div>
            `;
          })
          .join("");

        /* After-a-task digest metrics & "Show steps" replay toggle */
        let digestRowHtml = "";
        if (activeRun.isFinished) {
          const metricParts = [
            activeRun.digest.timeText,
            `${activeRun.digest.totalSteps} step${activeRun.digest.totalSteps === 1 ? "" : "s"}`,
          ];
          if (activeRun.digest.memorySteps > 0) {
            metricParts.push(`${activeRun.digest.memorySteps} from memory`);
          }
          if (activeRun.digest.costText) {
            metricParts.push(activeRun.digest.costText);
          }
          const isReplayOpen = openReplayRunIds.has(activeRun.id);
          const showStepsBtn = activeRun.digest.hasActEvents
            ? `<button type="button" class="btn" data-action="toggle-steps" data-run-id="${escapeHtml(activeRun.id)}" aria-expanded="${isReplayOpen ? "true" : "false"}">${isReplayOpen ? "Hide steps" : "Show steps"}</button>`
            : "";

          digestRowHtml = `
            <div class="digest-row">
              <div class="digest-metrics">${metricParts.map((p) => `<span>${escapeHtml(p)}</span>`).join("<span>&middot;</span>")}</div>
              ${showStepsBtn}
            </div>
          `;
        }

        let replayHtml = "";
        if (activeRun.isFinished && activeRun.digest.hasActEvents && openReplayRunIds.has(activeRun.id)) {
          const activeIdx = replayCursor.runId === activeRun.id ? replayCursor.stepIndex : -1;
          const rowsHtml = activeRun.digest.actEvents
            .map((act, idx) => {
              const isCurrent = idx === activeIdx;
              const metaParts = [];
              if (act.app) metaParts.push(act.app);
              if (act.fromMemory) metaParts.push("from memory");
              if (act.actMs != null) metaParts.push(`${act.actMs}ms`);
              return `
                <div class="act-replay-row ${isCurrent ? "is-replaying" : ""}">
                  <span class="act-replay-index">${isCurrent ? "▶" : `${act.index}.`}</span>
                  <span
                    class="agent-dot"
                    style="--dot-bg: ${escapeHtml(act.agentColor)}; --dot-edge: ${escapeHtml(act.agentEdge)};"
                  ></span>
                  <span class="act-replay-agent">${escapeHtml(act.agentName)}</span>
                  <span class="act-replay-action" title="${escapeHtml(act.plainText)}">${escapeHtml(act.plainText)}</span>
                  ${metaParts.length ? `<span class="act-replay-meta">${escapeHtml(metaParts.join(" · "))}</span>` : ""}
                </div>
              `;
            })
            .join("");

          replayHtml = `
            <div class="act-replay-section">
              <div class="act-replay-header">
                <span class="section-heading" style="padding: 0;">Action steps (${activeRun.digest.actEvents.length})</span>
                <button type="button" class="btn" data-action="replay-steps" data-run-id="${escapeHtml(activeRun.id)}">Replay</button>
              </div>
              <div class="act-replay-list" data-detail-scroll="replay-${escapeHtml(activeRun.id)}">
                ${rowsHtml}
              </div>
            </div>
          `;
        }

        const outcomeActionParts = [];
        if (!activeRun.isFinished) {
          outcomeActionParts.push(
            `<span class="run-live-cost" data-run-live-cost="${escapeHtml(activeRun.id)}">Cost ${escapeHtml(activeRun.digest.liveCostText)}</span>`
          );
          if (stopRouteSupported) {
            outcomeActionParts.push(
              `<button type="button" class="btn" data-action="stop-run" data-run-id="${escapeHtml(activeRun.id)}" ${pendingStopIds.has(activeRun.id) ? "disabled" : ""}>Stop all</button>`
            );
          }
        }
        if (activeRun.state === "failed") {
          outcomeActionParts.push(
            `<button type="button" class="btn" data-action="run-again" data-prompt="${escapeHtml(activeRun.goal)}">Run again</button>`
          );
        }
        const runOutcomeActionsHtml = outcomeActionParts.length
          ? `<div class="run-outcome-actions">${outcomeActionParts.join("")}</div>`
          : "";

        const stopNoticeText = stopNoticesByRunId.get(activeRun.id) || "";
        const stopNoticeHtml = stopNoticeText
          ? `<div class="stop-notice-line">${escapeHtml(stopNoticeText)}</div>`
          : "";

        const visibleMemories = getVisibleMemoriesForRun(activeRun);
        const memoryNoticeHtml = visibleMemories
          .map((m) => {
            const rawText = String(m.text || m.summary || m.content || "").trim();
            const label = /^i['’]ll remember/i.test(rawText)
              ? rawText
              : rawText
              ? `I'll remember: ${rawText}`
              : "I'll remember this for next time.";
            return `
              <div class="memory-notice-row" data-memory-id="${escapeHtml(m.id)}">
                <span class="memory-notice-text">${escapeHtml(label)}</span>
                <button type="button" class="btn" data-action="undo-memory" data-memory-id="${escapeHtml(m.id)}" ${pendingUndoMemoryIds.has(String(m.id)) ? "disabled" : ""}>Undo</button>
              </div>
            `;
          })
          .join("");

        const appLineHtml = activeRun.appLabel
          ? `<div class="run-app-line">${activeRun.apps.length > 1 ? "Apps" : "App"}: ${escapeHtml(activeRun.appLabel)}</div>`
          : "";

        const speakHtml =
          activeRun.speakText &&
          activeRun.speakText !== activeRun.evidenceText &&
          activeRun.speakText !== activeRun.stateFact
            ? `<div class="run-evidence-line">${escapeHtml(activeRun.speakText)}</div>`
            : "";

        const evidenceHtml = activeRun.evidenceText
          ? `<div class="run-evidence-line">Verified on screen: ${escapeHtml(activeRun.evidenceText)}</div>`
          : "";

        const mockBannerHtml =
          activeRun.mockNote && !vm.isSampleData
            ? `<div class="sample-tag">${escapeHtml(activeRun.mockNote)}</div>`
            : "";

        blocks.push(`
          <div class="timeline-block">
            <div class="run-header">
              <div class="run-title-row">
                <span class="run-title">${escapeHtml(activeRun.goal)}</span>
                <span class="run-elapsed" data-run-elapsed="${escapeHtml(activeRun.id)}">${escapeHtml(activeRun.elapsedText)}</span>
              </div>
              ${appLineHtml}
              <div class="run-outcome-row">
                <div class="run-outcome-copy">
                  <span class="state-text ${escapeHtml(activeRun.stateColorClass)}">${escapeHtml(activeRun.stateSymbolWord)}</span>
                  ${activeRun.stateFact ? `<span class="run-summary-text">${escapeHtml(activeRun.stateFact)}</span>` : ""}
                </div>
                ${runOutcomeActionsHtml}
              </div>
              ${stopNoticeHtml}
              ${digestRowHtml}
              ${mockBannerHtml}
              ${speakHtml}
              ${evidenceHtml}
            </div>
            ${liveStepHtml}
            ${helpHtml}
            ${memoryNoticeHtml}
            <div class="steps-list">
              ${stepsHtml}
            </div>
            ${replayHtml}
          </div>
        `);

        const otherRuns = vm.runs.filter((r) => r.id !== activeRun.id);
        if (otherRuns.length) {
          const pastHtml = otherRuns
            .map(
              (r) => `
                <button type="button" class="past-run-btn" data-run-id="${escapeHtml(r.id)}">
                  <span class="past-run-left">
                    <span class="state-text ${escapeHtml(r.stateColorClass)}">${escapeHtml(r.stateSymbolWord)}</span>
                    <span class="past-run-instr">${escapeHtml(r.goal)}</span>
                  </span>
                  <span class="run-elapsed">${escapeHtml(r.elapsedText)}</span>
                </button>
              `
            )
            .join("");

          blocks.push(`
            <div class="past-runs-section">
              <div class="section-heading">Earlier runs</div>
              ${pastHtml}
            </div>
          `);
        }

        destroyAllAgentChips();
        timelineScroll.innerHTML = blocks.join("");

        timelineScroll.querySelectorAll("[data-detail-scroll]").forEach((el) => {
          const prev = savedScroll.get(el.dataset.detailScroll);
          if (prev != null) el.scrollTop = prev;
        });

        mountAllAgentChips();
        syncSizeAndBridge();
      }

      function renderNow() {
        const vm = WorkspaceAdapter.mapRuns([...optimisticRuns, ...rawRuns], detailsById, pendingHelp, {
          connectionStatus,
          connectionError,
          isSampleData,
          agentsById,
          rememberedAgentsById,
          costsById,
          transcriptsById,
        });
        renderPill(vm);
        renderPanel(vm);
      }

      /* ---------------- TIMELINE INTERACTIONS ---------------- */
      async function handleConnectSubmit() {
        const input = document.getElementById("connect-url-input");
        if (!input) return;
        const res = await Transport.setConnection(input.value);
        if (!res.ok) {
          connectionStatus = "disconnected";
          connectionError = res.error || "Paste the address the backend printed";
          renderNow();
          return;
        }
        connectionError = "";
        connectionStatus = "loading";
        resetCapabilityState();
        renderNow();
        await pollAll();
      }

      timelineScroll.addEventListener("keydown", (e) => {
        if (e.isComposing || e.keyCode === 229) return;
        if (e.key === "Enter" && e.target.id === "connect-url-input") {
          e.preventDefault();
          handleConnectSubmit();
        }
      });

      timelineScroll.addEventListener("click", async (e) => {
        if (e.target.id === "connect-submit-btn") {
          handleConnectSubmit();
          return;
        }

        const actionBtn = e.target.closest("[data-action]");
        if (actionBtn) {
          const action = actionBtn.dataset.action;
          if (action === "retry-connect") {
            await pollAll();
            return;
          }
          if (action === "run-again") {
            const p = actionBtn.dataset.prompt || "";
            if (p) submitTask(p, []);
            return;
          }
          if (action === "stop-run" || action === "stop-agent") {
            const targetRunId = actionBtn.dataset.runId || selectedRunId;
            if (!targetRunId || pendingStopIds.has(targetRunId)) return;
            const targetRunObj = rawRuns.find((r) => r.id === targetRunId);
            const parentNoticeId =
              action === "stop-run" ? targetRunId : targetRunObj?.parent || selectedRunId || targetRunId;
            pendingStopIds.add(targetRunId);
            renderNow();
            try {
              const resp = await Transport.request(
                "POST",
                `/api/runs/${encodeURIComponent(targetRunId)}/stop`,
                {}
              );
              stopNoticesByRunId.set(parentNoticeId, buildStopSummary(targetRunId, resp));
              await pollAll();
            } catch (err) {
              sendErrorText = err.message || "Could not stop";
            } finally {
              pendingStopIds.delete(targetRunId);
              renderNow();
            }
            return;
          }
          if (action === "undo-memory") {
            const memId = actionBtn.dataset.memoryId;
            if (!memId || pendingUndoMemoryIds.has(memId)) return;
            pendingUndoMemoryIds.add(memId);
            renderNow();
            try {
              await Transport.request("DELETE", `/api/memory/${encodeURIComponent(memId)}`);
              memoryItems = memoryItems.filter((m) => String(m.id) !== String(memId));
            } catch (err) {
              sendErrorText = err.message || "Could not undo memory";
            } finally {
              pendingUndoMemoryIds.delete(memId);
              renderNow();
            }
            return;
          }
          if (action === "toggle-steps") {
            const runId = actionBtn.dataset.runId || selectedRunId;
            if (!runId) return;
            if (openReplayRunIds.has(runId)) {
              openReplayRunIds.delete(runId);
              if (replayCursor.runId === runId) stopStepReplay();
              renderNow();
            } else {
              openReplayRunIds.add(runId);
              const runVm = lastViewModel?.runs?.find((r) => r.id === runId);
              startStepReplay(runId, runVm?.digest?.actEvents?.length || 0);
            }
            return;
          }
          if (action === "replay-steps") {
            const runId = actionBtn.dataset.runId || selectedRunId;
            if (!runId) return;
            openReplayRunIds.add(runId);
            const runVm = lastViewModel?.runs?.find((r) => r.id === runId);
            startStepReplay(runId, runVm?.digest?.actEvents?.length || 0);
            return;
          }
          if (action === "answer-help") {
            const hid = actionBtn.dataset.helpId;
            const choice = actionBtn.dataset.choice;
            const helpRecord = pendingHelp.find((h) => h.id === hid);
            const allowedOptions = Array.isArray(helpRecord?.options) ? helpRecord.options : [];
            if (hid && choice && allowedOptions.includes(choice)) {
              actionBtn.disabled = true;
              try {
                await Transport.request("POST", `/api/help/${encodeURIComponent(hid)}`, {
                  jsonBody: { choice },
                });
                await pollAll();
              } catch (err) {
                sendErrorText = err.message || "Could not send answer";
                renderNow();
              }
            }
            return;
          }
        }

        const stepBtn = e.target.closest("[data-step-id]");
        if (stepBtn) {
          const id = stepBtn.dataset.stepId;
          if (expandedStepIds.has(id)) {
            expandedStepIds.delete(id);
          } else {
            expandedStepIds.add(id);
          }
          renderNow();
          return;
        }

        const runBtn = e.target.closest("[data-run-id]");
        if (runBtn) {
          selectedRunId = runBtn.dataset.runId;
          stopStepReplay();
          renderNow();
        }
      });

      /* ---------------- POLLING ---------------- */
      async function pollAll() {
        if (!Transport.isConnected()) {
          connectionStatus = "disconnected";
          renderNow();
          return;
        }

        try {
          const [runsResp, helpResp, agentsResp] = await Promise.all([
            Transport.request("GET", "/api/runs"),
            Transport.request("GET", "/api/help"),
            Transport.request("GET", "/api/agents").catch(() => ({})),
          ]);

          const nextRuns = Array.isArray(runsResp) ? runsResp : [];
          const nextHelp = Array.isArray(helpResp) ? helpResp : [];
          const nextAgents = agentsResp && typeof agentsResp === "object" ? agentsResp : {};

          /* Fetch incremental event details for active/selected runs */
          const parents = nextRuns.filter((r) => !r.parent);
          const focusParentId =
            (selectedRunId && parents.some((p) => p.id === selectedRunId) && selectedRunId) ||
            parents[0]?.id ||
            null;

          const detailTargets = nextRuns.filter(
            (r) => r.id === focusParentId || r.parent === focusParentId || !r.parent
          );

          await Promise.all(
            detailTargets.map(async (r) => {
              const existing = detailsById[r.id];
              const since = existing ? existing.events.length : 0;
              if (existing && existing.n_events === r.n_events && (r.state === "done" || r.state === "failed")) {
                return;
              }
              try {
                const view = await Transport.request(
                  "GET",
                  `/api/runs/${encodeURIComponent(r.id)}?since=${since}`
                );
                if (existing && since > 0 && Array.isArray(view.events)) {
                  view.events = [...existing.events, ...view.events];
                }
                detailsById[r.id] = view;
              } catch {
                // Keep previous detail if transient failure
              }
            })
          );

          const costTargets = parents.filter((p) => {
            const isFinishedParent = p.state === "done" || p.state === "failed";
            if (!isFinishedParent) return true;
            return !finalCostsFetched.has(p.id);
          });
          if (costTargets.length) {
            await Promise.all(
              costTargets.map(async (p) => {
                const wasFinished = p.state === "done" || p.state === "failed";
                try {
                  const costResp = await Transport.request(
                    "GET",
                    `/api/runs/${encodeURIComponent(p.id)}/cost`
                  );
                  if (costResp && typeof costResp === "object") {
                    costsById[p.id] = costResp;
                  }
                  if (wasFinished) finalCostsFetched.add(p.id);
                } catch {
                  if (wasFinished) finalCostsFetched.add(p.id);
                }
              })
            );
          }

          const probeKey = getProbeConnectionKey();
          if (probeKey && stopProbeKey !== probeKey) {
            try {
              await Transport.request("POST", "/api/runs/__ca_probe_nonexistent__/stop", {});
              stopRouteSupported = true;
              stopProbeKey = probeKey;
            } catch (err) {
              const errMsg = String(err?.data?.error || err?.message || "").toLowerCase();
              if (err?.status === 404 && errMsg === "not found") {
                stopRouteSupported = false;
                stopProbeKey = probeKey;
              } else if (err?.status === 400 || (err?.status === 404 && errMsg && errMsg !== "not found")) {
                stopRouteSupported = true;
                stopProbeKey = probeKey;
              } else if (err?.status && err.status !== 403) {
                stopRouteSupported = false;
                stopProbeKey = probeKey;
              }
            }
          }

          if (probeKey && (!memoryRouteMissing || memoryProbeKey !== probeKey)) {
            try {
              const memResp = await Transport.request("GET", "/api/memory");
              const rawList = Array.isArray(memResp)
                ? memResp
                : Array.isArray(memResp?.items)
                ? memResp.items
                : Array.isArray(memResp?.memories)
                ? memResp.memories
                : [];
              memoryItems = rawList.filter((m) => m && m.id != null);
              memoryRouteMissing = false;
              memoryProbeKey = probeKey;
            } catch (err) {
              const errMsg = String(err?.data?.error || err?.message || "").toLowerCase();
              if (err?.status === 404 && errMsg === "not found") {
                memoryRouteMissing = true;
                memoryProbeKey = probeKey;
                memoryItems = [];
              }
            }
          }

          for (const [aid, info] of Object.entries(nextAgents)) {
            if (info && typeof info === "object") {
              rememberedAgentsById[aid] = info;
            }
          }

          /* Recover finished runs' agent names and colors from transcripts when /api/agents is empty */
          const transcriptTargets = parents.filter((p) => {
            const isActive = p.state !== "done" && p.state !== "failed";
            if (!isActive && Array.isArray(transcriptsById[p.id])) return false;
            const groupIds = nextRuns.filter((r) => r.id === p.id || r.parent === p.id).map((r) => r.id);
            const missingColor = groupIds.some((gid) => {
              const live = nextAgents[gid];
              const rem = rememberedAgentsById[gid];
              return !(live && (live.color || live.body)) && !(rem && (rem.color || rem.body));
            });
            return missingColor;
          });
          if (transcriptTargets.length) {
            await Promise.all(
              transcriptTargets.map(async (p) => {
                try {
                  const rows = await Transport.request(
                    "GET",
                    `/api/runs/${encodeURIComponent(p.id)}/transcript`
                  );
                  if (Array.isArray(rows)) {
                    transcriptsById[p.id] = rows;
                    for (const row of rows) {
                      if (row && row.role === "agent" && row.agent && (row.color || row.body)) {
                        const info = {
                          name: String(row.agent).trim(),
                          color: row.color || row.body,
                          edge: row.edge || "",
                          ink: row.ink || "",
                        };
                        if (row.run && !rememberedAgentsById[row.run]) {
                          rememberedAgentsById[row.run] = info;
                        }
                        if (!rememberedAgentsById[`agent:${info.name}`]) {
                          rememberedAgentsById[`agent:${info.name}`] = info;
                        }
                      }
                    }
                  }
                } catch {
                  // Ignore missing transcript endpoint or transient errors
                }
              })
            );
          }

          rawRuns = nextRuns;
          pendingHelp = nextHelp;
          agentsById = nextAgents;
          hasLoadedOnce = true;
          connectionStatus = "connected";
          connectionError = "";
          processSpokenReplies(nextRuns);
          renderNow();
        } catch (err) {
          if (err.code === "AUTH") {
            Transport.clearConnection();
            rememberedAgentsById = {};
            costsById = {};
            resetCapabilityState();
            connectionStatus = "disconnected";
            connectionError = "Paste the address the backend printed";
          } else {
            connectionStatus = hasLoadedOnce ? "stale" : "disconnected";
          }
          renderNow();
        }
      }

      function processSpokenReplies(runsList) {
        const list = Array.isArray(runsList) ? runsList : [];
        const newSpeaks = [];
        const newResults = [];

        for (const r of list) {
          const detail = detailsById[r.id];
          const evs = Array.isArray(detail?.events) ? detail.events : [];
          evs.forEach((ev, idx) => {
            if (!ev) return;
            const isExplicitSpeak = ev.kind === "speak" || (ev.kind === "msg" && ev.msg_kind === "speak");
            const isResultReply =
              ev.kind === "msg" &&
              ev.msg_kind === "result" &&
              (ev.role === "assistant" || ev.role === "agent");
            if (!isExplicitSpeak && !isResultReply) return;

            const rawText = String(ev.text || ev.msg || ev.message || "").trim();
            if (!rawText) return;
            const key = `${r.id}:${idx}:${ev.kind}:${ev.msg_kind || ""}`;
            if (seenSpokenEventKeys.has(key)) return;
            seenSpokenEventKeys.add(key);

            if (!hasInitializedSpokenBaseline) return;
            if (isExplicitSpeak) {
              newSpeaks.push(rawText);
            } else {
              newResults.push({ role: ev.role, text: rawText });
            }
          });
        }

        if (!hasInitializedSpokenBaseline) {
          hasInitializedSpokenBaseline = true;
          return;
        }
        if (isSampleData || !hasShellBridge()) return;

        let chosenText = "";
        if (newSpeaks.length) {
          chosenText = newSpeaks[newSpeaks.length - 1];
        } else if (newResults.length) {
          const specific = newResults.filter((m) => m.text !== "Finished.");
          const pool = specific.length ? specific : newResults;
          chosenText = pool[pool.length - 1].text;
        }
        if (chosenText) {
          Transport.post("speak", { text: chosenText });
        }
      }

      if (typeof ResizeObserver !== "undefined") {
        const ro = new ResizeObserver(() => syncSizeAndBridge());
        ro.observe(panelView);
      }

      window.__ca = {
        Transport,
        addAttachments,
        setState,
        escapeHtml,
        syncSizeAndBridge,
        getCurrentState,
        resolvePrimaryAgent: resolvePrimaryAgentDisplay,
      };

      window.addEventListener("storage", (e) => {
        if (!e.key || e.key === "ca.primaryAgent") {
          renderNow();
        }
      });

      window.addEventListener("focus", () => {
        if (hasLoadedOnce) renderNow();
      });

      window.addEventListener("shell-event", (e) => {
        const msg = e.detail || {};
        if (msg.type === "hotkey") setState("expanded", { instant: true });
        if (msg.type === "filesDropped" && Array.isArray(msg.files)) {
          if (getCurrentState() === "collapsed") setState("expanded", { instant: true });
          addAttachments(msg.files.map((f) => ({ id: `${f.path}-${f.name}`, name: f.name, kind: "file", path: f.path })));
        }
        if (msg.type === "voiceState") {
          if (typeof msg.speechAvailable === "boolean") speechAvailable = msg.speechAvailable;
          if (typeof msg.onDevice === "boolean") onDeviceSpeech = msg.onDevice;
          voiceState = msg.state || (msg.isDictating ? "listening" : "idle");
          voiceReason = msg.reason || "";
          voiceNextStep = msg.nextStep || "";
          if (voiceState === "idle") {
            dictationBaseText = promptInput.value.trimEnd();
          }
          renderVoiceStatusBar();
        }
        if (msg.type === "voiceTranscript") {
          const spokenChunk = String(msg.text || "").trim();
          const combined = dictationBaseText
            ? (spokenChunk ? `${dictationBaseText} ${spokenChunk}` : dictationBaseText)
            : spokenChunk;
          promptInput.value = combined;
          syncPromptFieldState();
          if (msg.isFinal) {
            dictationBaseText = promptInput.value.trimEnd();
          }
        }
        if (msg.type === "ttsState") {
          ttsSpeaking = Boolean(msg.speaking);
          ttsSpeakText = msg.text ? String(msg.text) : "";
          renderVoiceStatusBar();
          if (lastViewModel) renderPill(lastViewModel);
        }
      });

      async function boot() {
        const mode = params.get("shell");
        if (mode === "chat" || mode === "notes") {
          document.body.dataset.mode = mode;
          const state = await Transport.init().catch(() => ({ connected: false }));
          /* the view code is in the next <script>; wait for it to be parsed */
          const start = () => window.__caBootView && window.__caBootView(mode, state);
          if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start);
          else start();
          return;
        }
        syncSizeAndBridge(true);
        try {
          const state = await Transport.init();
          isSampleData = state.isSampleData;
          speechAvailable = Boolean(state.speechAvailable);
          onDeviceSpeech = Boolean(state.onDeviceSpeech);
          if (state.isDictating) voiceState = "listening";
          ttsSpeaking = Boolean(state.isSpeaking);
          ttsSpeakText = state.speakText || "";
          renderVoiceStatusBar();
          if (state.connected) {
            await pollAll();
          } else {
            connectionStatus = "disconnected";
            renderNow();
          }
        } catch (err) {
          connectionStatus = "disconnected";
          connectionError = err.message || "Could not start workspace";
          renderNow();
        }
        setInterval(pollAll, 1000);
        setInterval(() => {
          if (getCurrentState() !== "expanded") return;
          if (!lastViewModel) return;
          const activeRun = lastViewModel.runs.find((r) => r.id === selectedRunId) || lastViewModel.runs[0];
          if (!activeRun) return;
          const hasActiveHelp = activeRun.pendingHelp.some((h) => !h.isExpired);
          const hasLiveStep = Boolean(activeRun.liveStep);
          if (!hasActiveHelp && !hasLiveStep) return;
          const vmNow = WorkspaceAdapter.mapRuns([...optimisticRuns, ...rawRuns], detailsById, pendingHelp, {
            connectionStatus,
            connectionError,
            isSampleData,
            agentsById,
            rememberedAgentsById,
            costsById,
            transcriptsById,
          });
          lastViewModel = vmNow;
          if (!updateLiveTicksInPlace(vmNow)) {
            renderPanel(vmNow);
          }
        }, 250);
      }

      boot();
    })();
  </script>

  <script>
    /* Views added on the shared workspace: file search, analytics, settings, chat windows, notifications.
       They reuse the shell transport above (window.__ca) and its styles; the backend does all the work. */
    (function () {
      const ca = () => window.__ca;
      const $ = (id) => document.getElementById(id);
      const esc = (v) => ca().escapeHtml(v);
      const req = (method, path, body) =>
        ca().Transport.request(method, path, body === undefined ? {} : { jsonBody: body });
      const money = (n) => (n == null ? "—" : "$" + Number(n).toFixed(Number(n) < 0.1 ? 4 : 2));
      const paint = (c) => (c ? ` style="color:${esc(c)}"` : "");

      /* ---------------- file search (attach menu: Search files…) ---------------- */
      let searchSeq = 0;
      let searchTimer = null;
      let hits = [];
      window.__caOpenFileSearch = function () {
        $("file-search-row").classList.remove("hidden");
        ca().syncSizeAndBridge();
        requestAnimationFrame(() => $("file-search-input").focus());
      };
      function closeSearch() {
        $("file-search-row").classList.add("hidden");
        $("file-search-input").value = "";
        $("file-search-results").innerHTML = "";
        hits = [];
        ca().syncSizeAndBridge();
      }
      function pick(i) {
        const h = hits[i];
        if (!h) return;
        ca().addAttachments([{ id: h.path, name: h.name, kind: "file", path: h.path }]);
        closeSearch();
        $("prompt-input").focus();
      }
      $("file-search-input")?.addEventListener("input", (e) => {
        clearTimeout(searchTimer);
        const q = e.target.value.trim();
        searchTimer = setTimeout(async () => {
          const mine = ++searchSeq;
          const box = $("file-search-results");
          if (q.length < 2) {
            box.innerHTML = "";
            ca().syncSizeAndBridge();
            return;
          }
          box.innerHTML = `<div class="timeline-fact">Searching…</div>`;
          try {
            const found = await req("GET", "/api/files?q=" + encodeURIComponent(q));
            if (mine !== searchSeq) return;
            hits = Array.isArray(found) ? found : [];
            box.innerHTML = hits.length
              ? hits.map((h, i) => `
                  <button type="button" class="past-run-btn file-hit" role="option" data-hit="${i}">
                    <span>${esc(h.name)}</span><span class="file-hit-where">${esc(h.where)}</span>
                  </button>`).join("")
              : `<div class="timeline-fact">No file names match “${esc(q)}”</div>`;
          } catch (err) {
            box.innerHTML = `<div class="state-text state-danger">Search failed: ${esc(err.message)}</div>`;
          }
          ca().syncSizeAndBridge();
        }, 150);
      });
      $("file-search-input")?.addEventListener("keydown", (e) => {
        if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); closeSearch(); }
        if (e.key === "Enter") { e.preventDefault(); pick(0); }
      });
      $("file-search-results")?.addEventListener("click", (e) => {
        const b = e.target.closest("[data-hit]");
        if (b) pick(Number(b.dataset.hit));
      });

      /* ---------------- side views: analytics, settings ---------------- */
      function showSide(on) {
        $("side-view").classList.toggle("hidden", !on);
        $("timeline-scroll").classList.toggle("hidden", on);
        ca().syncSizeAndBridge();
      }
      const sideHead = (title) => `
        <div class="side-head"><span class="side-title">${title}</span>
        <button type="button" class="btn" data-close-side>Back</button></div>`;
      document.addEventListener("click", async (e) => {
        if (e.target.closest("[data-close-side]")) return showSide(false);
        const b = e.target.closest("[data-side]");
        if (!b) return;
        const v = $("side-view");
        const title = b.dataset.side === "analytics" ? "Analytics" : "Settings";
        v.innerHTML = sideHead(title) + `<div class="timeline-fact">Loading…</div>`;
        showSide(true);
        try {
          v.innerHTML = sideHead(title) + (b.dataset.side === "analytics" ? await analyticsHtml() : await settingsHtml());
        } catch (err) {
          v.innerHTML = sideHead(title) + `<div class="state-text state-danger">Could not load: ${esc(err.message)}</div>`;
        }
        ca().syncSizeAndBridge();
      });

      async function analyticsHtml() {
        const midnight = new Date();
        midnight.setHours(0, 0, 0, 0);
        const [day, all] = await Promise.all([
          req("GET", "/api/analytics?since=" + Math.floor(midnight.getTime() / 1000)),
          req("GET", "/api/analytics"),
        ]);
        if (!all.tasks) return `<div class="timeline-fact">No tasks yet. Spend and success show up here after your first task.</div>`;
        const block = (label, a) => `
          <dl class="kv">
            <dt>${label}</dt><dd>${a.tasks} task${a.tasks === 1 ? "" : "s"}</dd>
            <dt>Spend</dt><dd>${money(a.cost_usd)}</dd>
            <dt>Per task</dt><dd>${money(a.mean_cost_per_task)}</dd>
            <dt>Model calls</dt><dd>${a.llm_calls}</dd>
          </dl>`;
        const roles = (all.by_role || []).filter((r) => r.role !== "orchestrator").map((r) =>
          `<dt>${esc(r.role)}</dt><dd>${r.ok || 0} of ${r.runs} finished, ${Math.round(r.mean_seconds || 0)} s each</dd>`).join("");
        return block("Today", day) + block("All time", all) + (roles ? `<dl class="kv">${roles}</dl>` : "");
      }

      async function settingsHtml() {
        const p = await req("GET", "/api/profile");
        const field = (key, label, hint) => `
          <label>${label}
            <input class="inline-text-input" name="${key}" value="${esc(p[key] || "")}" placeholder="${esc(hint)}" />
          </label>`;
        return `
          <form class="settings-form" id="settings-form">
            ${field("call_me", "What should your agents call you?", "Your first name")}
            ${field("voice_id", "Voice (ElevenLabs voice id)", "Default: Sunny")}
            ${field("model", "Model", "google/gemini-4-argon")}
            ${field("decide_model", "Faster model for each step (blank uses Model)", "e.g. google/gemini-3.5-flash-lite")}
            <div class="settings-actions">
              <button type="submit" class="btn btn-primary">Save settings</button>
              <span id="settings-msg" class="timeline-fact" aria-live="polite"></span>
            </div>
          </form>`;
      }
      document.addEventListener("submit", async (e) => {
        if (e.target.id !== "settings-form") return;
        e.preventDefault();
        const msg = $("settings-msg");
        const body = Object.fromEntries(new FormData(e.target).entries());
        try {
          await req("POST", "/api/profile", body);
          msg.className = "state-text state-success";
          msg.textContent = "✓ Saved";
        } catch (err) {
          msg.className = "state-text state-danger";
          msg.textContent = err.message;
        }
      });

      /* ---------------- views in their own windows ---------------- */
      window.__caBootView = function (mode, state) {
        if (!state || !state.connected) {
          document.body.insertAdjacentHTML("beforeend",
            `<div class="note"><span class="state-text state-warning">Not connected to the backend</span></div>`);
          return;
        }
        (mode === "chat" ? bootChat : bootNotes)();
      };

      const STATE_WORD = {
        done: ["✓ Done", "state-success"], failed: ["× Failed", "state-danger"],
        awaiting_human: ["! Needs you", "state-warning"],
      };

      function bootChat() {
        const run = new URLSearchParams(location.search).get("run") || "";
        document.body.insertAdjacentHTML("beforeend", `
          <div class="chat">
            <div class="chat-head">
              <span class="chat-title" id="chat-title">Conversation</span>
              <span id="chat-state" class="state-text state-working"></span>
              <button type="button" class="btn" id="chat-close">Close</button>
            </div>
            <div class="chat-log" id="chat-log" role="log" aria-live="polite">
              <div class="timeline-fact">Loading the conversation…</div>
            </div>
            <form class="chat-reply" id="chat-form">
              <input class="inline-text-input" id="chat-input" placeholder="Reply or ask a follow-up" aria-label="Reply" />
              <button type="submit" class="btn btn-primary">Send</button>
            </form>
          </div>`);
        $("chat-close").onclick = () => ca().Transport.post("closeWindow");
        let shownKey = "";
        let lastChatMsgs = [];
        let chatMemories = [];
        let chatMemoryMissing = false;

        function renderChatBody() {
          const log = $("chat-log");
          const resolvePrimary = ca().resolvePrimaryAgent;
          const visibleMemories = chatMemories.filter((m) => m && m.id != null && (!m.run || m.run === run));
          const key =
            lastChatMsgs.length +
            "::" +
            visibleMemories.map((m) => `${m.id}:${m.text || ""}`).join("|") +
            "::" +
            (resolvePrimary ? resolvePrimary("ComputerAnything", "").name + resolvePrimary("ComputerAnything", "").color : "");
          if (key === shownKey) return;
          shownKey = key;

          const msgsHtml = lastChatMsgs.length
            ? lastChatMsgs
                .map((m) => {
                  const who =
                    m.role === "user"
                      ? { name: "You", color: "" }
                      : resolvePrimary
                      ? resolvePrimary(m.agent, m.color)
                      : { name: m.agent, color: m.color };
                  return `
                <div class="${m.kind === "step" ? "msg-step" : "msg"}">
                  <span class="msg-who"${m.role === "user" ? "" : paint(who.color)}>${esc(who.name)}</span>${esc(m.text)}
                </div>`;
                })
                .join("")
            : `<div class="timeline-fact">Waiting for the first message…</div>`;

          const memHtml = visibleMemories
            .map((m) => {
              const rawText = String(m.text || m.summary || m.content || "").trim();
              const label = /^i['’]ll remember/i.test(rawText)
                ? rawText
                : rawText
                ? `I'll remember: ${rawText}`
                : "I'll remember this for next time.";
              return `
                <div class="memory-notice-row" data-memory-id="${esc(m.id)}">
                  <span class="memory-notice-text">${esc(label)}</span>
                  <button type="button" class="btn" data-undo-memory="${esc(m.id)}">Undo</button>
                </div>`;
            })
            .join("");

          log.innerHTML = msgsHtml + memHtml;
          log.scrollTop = log.scrollHeight;
        }

        async function poll() {
          try {
            const [msgs, info] = await Promise.all([
              req("GET", `/api/runs/${encodeURIComponent(run)}/transcript`),
              req("GET", `/api/runs/${encodeURIComponent(run)}?since=1000000`),
            ]);
            if (!chatMemoryMissing) {
              try {
                const memResp = await req("GET", "/api/memory");
                const list = Array.isArray(memResp)
                  ? memResp
                  : Array.isArray(memResp?.items)
                  ? memResp.items
                  : Array.isArray(memResp?.memories)
                  ? memResp.memories
                  : [];
                chatMemories = list.filter((m) => m && m.id != null);
              } catch (memErr) {
                const memMsg = String(memErr?.data?.error || memErr?.message || "").toLowerCase();
                if (memErr?.status === 404 && memMsg === "not found") {
                  chatMemoryMissing = true;
                  chatMemories = [];
                }
              }
            }
            $("chat-title").textContent = info.goal || "Conversation";
            const [word, cls] = STATE_WORD[info.state] || ["… Working", "state-working"];
            $("chat-state").textContent = word;
            $("chat-state").className = "state-text " + cls;
            lastChatMsgs = Array.isArray(msgs) ? msgs : [];
            renderChatBody();
          } catch (err) {
            $("chat-state").textContent = "Reconnecting…";
            $("chat-state").className = "state-text state-warning";
          }
        }

        $("chat-log").addEventListener("click", async (e) => {
          const btn = e.target.closest("[data-undo-memory]");
          if (!btn) return;
          const memId = btn.dataset.undoMemory;
          if (!memId) return;
          btn.disabled = true;
          try {
            await req("DELETE", `/api/memory/${encodeURIComponent(memId)}`);
            chatMemories = chatMemories.filter((m) => String(m.id) !== String(memId));
            shownKey = "";
            renderChatBody();
          } catch {
            btn.disabled = false;
          }
        });

        window.addEventListener("storage", (e) => {
          if (!e.key || e.key === "ca.primaryAgent") {
            shownKey = "";
            renderChatBody();
          }
        });
        window.addEventListener("focus", () => {
          shownKey = "";
          renderChatBody();
        });
        $("chat-form").addEventListener("submit", async (e) => {
          e.preventDefault();
          const input = $("chat-input");
          const prompt = input.value.trim();
          if (!prompt) return;
          input.value = "";
          try {
            await req("POST", "/api/task", { prompt, thread: run });
            poll();
          } catch (err) {
            input.value = prompt;
            $("chat-state").textContent = "Not sent: " + err.message;
            $("chat-state").className = "state-text state-danger";
          }
        });
        poll();
        setInterval(poll, 1000);
        $("chat-input").focus();
      }

      function bootNotes() {
        document.body.insertAdjacentHTML("beforeend", `<div class="notes" id="notes" aria-live="polite"></div>`);
        const seen = new Set();
        let lastHeight = -1;
        async function poll() {
          let help = [], notes = [];
          try {
            [notes, help] = await Promise.all([req("GET", "/api/notifications"), req("GET", "/api/help")]);
          } catch {
            return; /* keep what is on screen; the next poll retries */
          }
          const ids = [...help.map((h) => "h:" + h.id), ...notes.map((n) => "n:" + n.id)];
          const fresh = ids.some((id) => !seen.has(id));
          ids.forEach((id) => seen.add(id));
          const resolvePrimary = ca().resolvePrimaryAgent;
          $("notes").innerHTML = help.map((h) => {
              const agentLabel = h.agent
                ? (resolvePrimary ? resolvePrimary(h.agent, h.color).name : h.agent)
                : "An agent";
              return `
              <div class="note">
                <span class="note-title state-warning">${esc(agentLabel)} needs you</span>
                <span>${esc(h.question)}</span>
                ${h.detail ? `<div class="note-detail">${esc(typeof h.detail === "string" ? h.detail : JSON.stringify(h.detail))}</div>` : ""}
                <div class="note-actions">
                  <button type="button" class="btn" data-open="${esc(h.thread)}">Open chat</button>
                  ${h.options.map((o, i) => `<button type="button" class="btn${i === 0 ? " btn-primary" : ""}" data-help="${esc(h.id)}" data-choice="${esc(o)}">${esc(o[0].toUpperCase() + o.slice(1))}</button>`).join("")}
                </div>
              </div>`;
            }).join("") + notes.map((n) => `
              <div class="note">
                <span class="note-title"><span class="state-text ${n.ok === false ? "state-danger" : "state-success"}">${n.ok === false ? "× Failed" : "✓ Done"}</span> ${esc(n.title)}</span>
                <span>${esc(n.text)}</span>
                <div class="note-actions">
                  <button type="button" class="btn" data-open="${esc(n.thread)}">Open chat</button>
                  <button type="button" class="btn" data-dismiss="${esc(n.id)}">Dismiss</button>
                </div>
              </div>`).join("");
          const height = ids.length ? $("notes").scrollHeight + 4 : 0;
          if (height !== lastHeight || fresh) {
            lastHeight = height;
            ca().Transport.post("resize", { state: "notes", width: 320, height, fresh });
          }
        }
        document.addEventListener("click", async (e) => {
          const t = e.target.closest("button");
          if (!t) return;
          if (t.dataset.open) ca().Transport.post("openChat", { run: t.dataset.open });
          if (t.dataset.help) await req("POST", `/api/help/${encodeURIComponent(t.dataset.help)}`, { choice: t.dataset.choice }).catch(() => {});
          if (t.dataset.dismiss) await req("POST", `/api/notifications/${encodeURIComponent(t.dataset.dismiss)}/dismiss`, {}).catch(() => {});
          poll();
        });
        poll();
        setInterval(poll, 1000);
      }
    })();
  </script>
</body>
</html>
