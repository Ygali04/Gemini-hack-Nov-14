<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agent Workspace</title>
  <style>
    :root {
      color-scheme: dark;
      /* Two surfaces only: app background and raised surface */
      --bg-app: #0c0d10;
      --bg-raised: #16181d;
      --btn-hover: rgba(255, 255, 255, 0.07);
      --btn-pressed: rgba(255, 255, 255, 0.04);
      --line-divider: rgba(255, 255, 255, 0.08);
      --focus-ring: #8a8f9e;

      /* Text hierarchy */
      --text-primary: #f2f4f8;
      --text-secondary: #a6adbb;
      --text-muted: #7d8495;

      /* Primary ink button (only filled button in panel) */
      --ink-fill: #f2f4f8;
      --ink-fill-hover: #ffffff;
      --ink-fill-pressed: #d5d9e2;
      --ink-text: #0c0d10;

      /* State colors (used only with symbol + word, never as region fill) */
      --state-working: #4c8dff;
      --state-success: #32d583;
      --state-warning: #f5a623;
      --state-danger: #ff5c6c;

      /* Motion */
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      --dur-enter: 180ms;
      --dur-exit: 117ms;

      /* Typography */
      --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
      --font-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      font-family: var(--font-sans);
      font-size: 13px;
      line-height: 20px;
      font-weight: 400;
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      -webkit-user-select: text;
      user-select: text;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      background: var(--bg-app);
      overflow-x: hidden;
    }

    html.is-shell,
    body.is-shell {
      background: transparent !important;
      min-height: 0;
      overflow: hidden;
    }

    /* Neutral mid-tone focus ring (never blue) */
    button:focus-visible,
    textarea:focus-visible,
    input:focus-visible,
    [tabindex]:focus-visible {
      outline: 1.5px solid var(--focus-ring);
      outline-offset: 2px;
    }

    /* Overlay shell: the ONLY element with a shadow */
    .notch-shell {
      position: relative;
      background: var(--bg-app);
      border-bottom: 1px solid var(--line-divider);
      border-left: 1px solid var(--line-divider);
      border-right: 1px solid var(--line-divider);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.65);
      overflow: hidden;
      transform-origin: top center;
      transition:
        width var(--dur-enter) var(--ease-out),
        height var(--dur-enter) var(--ease-out),
        border-radius var(--dur-enter) var(--ease-out);
    }

    body[data-state="collapsed"] .notch-shell {
      width: 280px;
      height: 36px;
      border-radius: 0 0 16px 16px;
      transition:
        width var(--dur-exit) var(--ease-out),
        height var(--dur-exit) var(--ease-out),
        border-radius var(--dur-exit) var(--ease-out);
    }

    body[data-state="expanded"] .notch-shell {
      width: min(480px, 100vw);
      max-width: 100%;
      height: var(--panel-height, 220px);
      max-height: var(--max-panel-height, 60vh);
      border-radius: 0 0 16px 16px;
    }

    /* Instant open/close when keyboard-driven */
    body.instant-motion .notch-shell,
    body.instant-motion .pill-bar,
    body.instant-motion .panel-view {
      transition: none !important;
    }

    .notch-shell.drag-over {
      background: var(--bg-raised);
    }

    /* ---------------- COLLAPSED PILL ---------------- */
    .pill-bar {
      width: 280px;
      height: 36px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      background: transparent;
      border: none;
      color: var(--text-primary);
      font: inherit;
      font-size: 12px;
      line-height: 16px;
      cursor: pointer;
      user-select: none;
    }

    .pill-bar:hover {
      background: var(--btn-hover);
    }

    .pill-bar:active {
      background: var(--btn-pressed);
    }

    body[data-state="expanded"] .pill-bar {
      opacity: 0;
      pointer-events: none;
      position: absolute;
      top: 0;
      left: 0;
      visibility: hidden;
    }

    .pill-status-line {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
      max-width: 256px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 12px;
      line-height: 16px;
    }

    .pill-dots {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }

    .pill-agent-dot,
    .agent-dot {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      flex-shrink: 0;
      background: var(--dot-bg, #5c6b7a);
      border: 1px solid var(--dot-edge, rgba(255, 255, 255, 0.25));
    }

    .pill-sub {
      color: var(--text-secondary);
      font-weight: 400;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .pill-need {
      margin-left: auto;
      color: var(--state-warning);
      font-weight: 600;
      font-size: 12px;
      line-height: 16px;
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }

    .pill-idle {
      margin: 0 auto;
      color: var(--text-primary);
      font-weight: 400;
    }

    /* ---------------- EXPANDED PANEL ---------------- */
    .panel-view {
      width: 100%;
      max-width: 480px;
      max-height: var(--max-panel-height, 60vh);
      display: flex;
      flex-direction: column;
      padding: 12px 16px 14px;
      gap: 10px;
      overflow: hidden;
    }

    body[data-state="collapsed"] .panel-view {
      position: absolute;
      top: 0;
      left: 0;
      opacity: 0;
      pointer-events: none;
      visibility: hidden;
    }

    body[data-state="expanded"] .panel-view {
      position: relative;
      opacity: 1;
      pointer-events: auto;
      visibility: visible;
    }

    /* ---------------- BUTTONS (Section 5) ---------------- */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      height: 28px;
      min-width: 28px;
      min-height: 28px;
      padding: 0 8px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--text-secondary);
      font-family: var(--font-sans);
      font-size: 12px;
      line-height: 16px;
      font-weight: 400;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      -webkit-user-select: none;
      user-select: none;
    }

    .btn svg,
    .pill-bar svg,
    .work-divider-btn svg {
      pointer-events: none;
      -webkit-user-select: none;
      user-select: none;
    }

    .btn-esc {
      height: 26px;
      min-height: 26px;
      padding: 0 8px;
      font-size: 12px;
      line-height: 16px;
      color: var(--text-secondary);
    }

    .btn:hover:not(:disabled) {
      background: var(--btn-hover);
      color: var(--text-primary);
    }

    .btn:active:not(:disabled) {
      background: var(--btn-pressed);
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-icon {
      width: 28px;
      padding: 0;
    }

    /* Primary button (Send): the ONLY filled button in the panel */
    .btn-primary {
      background: var(--ink-fill);
      color: var(--ink-text);
      font-weight: 600;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--ink-fill-hover);
      color: var(--ink-text);
    }

    .btn-primary:active:not(:disabled) {
      background: var(--ink-fill-pressed);
      color: var(--ink-text);
    }

    .btn-danger {
      background: transparent;
      color: var(--state-danger);
      border: 1px solid rgba(255, 92, 108, 0.5);
    }

    .btn-danger:hover:not(:disabled) {
      background: rgba(255, 92, 108, 0.12);
      color: var(--state-danger);
    }

    .btn-money {
      background: var(--state-warning);
      color: #111317;
      font-weight: 600;
    }

    .btn-money:hover:not(:disabled) {
      background: #ffba42;
      color: #111317;
    }

    /* ---------------- PROMPT SURFACE ---------------- */
    .prompt-section {
      display: flex;
      flex-direction: column;
      gap: 6px;
      position: relative;
      flex-shrink: 0;
    }

    .composer-frame {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: #121418;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 12px;
      padding: 6px 8px;
    }

    .composer-frame:focus-within {
      border-color: var(--focus-ring);
      box-shadow: 0 0 0 1px var(--focus-ring);
    }

    .composer-frame .attachments-list,
    .composer-frame .attachments-notice {
      padding: 0 2px;
    }

    .composer-frame .attachment-token,
    .composer-frame .attachment-notice-row {
      background: var(--bg-app);
    }

    .prompt-row {
      display: flex;
      align-items: center;
      gap: 6px;
      min-height: 28px;
    }

    .attach-wrapper {
      position: relative;
      display: inline-flex;
      flex-shrink: 0;
    }

    .attach-menu {
      position: absolute;
      top: 32px;
      left: 0;
      z-index: 20;
      background: var(--bg-raised);
      border: 1px solid var(--line-divider);
      border-radius: 8px;
      padding: 4px;
      display: none;
      flex-direction: column;
      min-width: 140px;
    }

    .panel-view .attach-menu {
      top: auto;
      bottom: 36px;
    }

    .attach-menu.open {
      display: flex;
    }

    .attach-menu-item {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      height: 32px;
      padding: 0 8px;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: var(--text-primary);
      font: inherit;
      font-size: 13px;
      line-height: 20px;
      text-align: left;
      cursor: pointer;
    }

    .attach-menu-item:hover {
      background: var(--btn-hover);
    }

    .attach-menu-item:active {
      background: var(--btn-pressed);
    }

    .prompt-field-wrap {
      flex: 1;
      min-width: 0;
      min-height: 28px;
      background: transparent;
      border-radius: 0;
      padding: 4px 2px;
      display: flex;
      align-items: center;
    }

    .prompt-textarea {
      flex: 1;
      min-width: 0;
      height: 20px;
      min-height: 20px;
      max-height: 80px;
      resize: none;
      border: none;
      background: transparent;
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 13px;
      line-height: 20px;
      border-radius: 0;
      overflow-y: auto;
      scrollbar-color: var(--bg-raised) var(--bg-raised);
      user-select: text;
    }

    .prompt-textarea::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }

    .prompt-textarea::-webkit-scrollbar-track {
      background: var(--bg-raised);
    }

    .prompt-textarea::-webkit-scrollbar-thumb {
      background: var(--bg-raised);
      border-radius: 4px;
    }

    .prompt-textarea:focus,
    .prompt-textarea:focus-visible {
      outline: 1px solid transparent;
      outline-offset: 0;
    }

    .prompt-textarea::placeholder {
      color: var(--text-muted);
    }

    .sample-tag {
      font-size: 12px;
      line-height: 16px;
      color: var(--text-muted);
      white-space: normal;
      word-break: break-word;
    }

    /* Inline Link attachment or Connect input row */
    .inline-input-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 32px;
    }

    .inline-input-row.hidden {
      display: none;
    }

    .inline-text-input {
      flex: 1;
      min-width: 0;
      height: 32px;
      background: var(--bg-raised);
      border: none;
      border-radius: 8px;
      padding: 0 8px;
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 13px;
      line-height: 20px;
      user-select: text;
    }

    .inline-text-input::placeholder {
      color: var(--text-muted);
    }

    /* Attachment tokens: thumbnail, name, agent-visibility label, and remove button */
    .attachments-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .attachments-list:empty,
    .attachments-notice:empty {
      display: none;
    }

    .attachments-notice {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .attachment-notice-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 8px;
      border-radius: 8px;
      background: var(--bg-raised);
      font-size: 12px;
      line-height: 16px;
      color: var(--text-primary);
    }

    .attachment-notice-copy {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 6px;
      min-width: 0;
      flex: 1;
      overflow-wrap: anywhere;
    }

    .attachment-notice-reason {
      font-size: 12px;
      line-height: 16px;
      color: var(--text-secondary);
    }

    .attachment-token {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 36px;
      padding: 4px 4px 4px 8px;
      border-radius: 8px;
      background: var(--bg-raised);
      font-size: 12px;
      line-height: 16px;
      color: var(--text-primary);
      max-width: 260px;
    }

    .attachment-token.has-thumb {
      padding-left: 4px;
    }

    .attachment-thumb {
      width: 28px;
      height: 28px;
      border-radius: 5px;
      object-fit: cover;
      flex-shrink: 0;
      background: var(--bg-app);
    }

    .attachment-meta {
      display: flex;
      flex-direction: column;
      min-width: 0;
      gap: 1px;
    }

    .attachment-name {
      font-size: 12px;
      line-height: 16px;
      font-weight: 500;
      color: var(--text-primary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .attachment-label {
      font-size: 12px;
      line-height: 16px;
      color: var(--text-secondary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .attachment-remove {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      min-width: 28px;
      min-height: 28px;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: var(--text-secondary);
      font-size: 14px;
      line-height: 16px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .attachment-remove:hover {
      background: var(--btn-hover);
      color: var(--text-primary);
    }

    .attachment-remove:active {
      background: var(--btn-pressed);
    }

    /* ---------------- STATE TEXT & COLORS ---------------- */
    .state-text {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      line-height: 16px;
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .state-working { color: var(--state-working); }
    .state-success { color: var(--state-success); }
    .state-warning { color: var(--state-warning); }
    .state-danger  { color: var(--state-danger); }
    .state-neutral { color: var(--text-muted); }

    /* ---------------- CONVERSATION TIMELINE ---------------- */
    .timeline-scroll {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 2px 0;
      overflow-y: auto;
      max-height: none;
      scrollbar-color: var(--bg-app) var(--bg-app);
    }

    .timeline-scroll::-webkit-scrollbar,
    .step-detail-mono::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }

    .timeline-scroll::-webkit-scrollbar-track {
      background: var(--bg-app);
    }

    .timeline-scroll::-webkit-scrollbar-thumb {
      background: var(--bg-app);
      border-radius: 4px;
    }

    .step-detail-mono::-webkit-scrollbar-track {
      background: var(--bg-raised);
    }

    .step-detail-mono::-webkit-scrollbar-thumb {
      background: var(--bg-raised);
      border-radius: 4px;
    }

    .timeline-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 32px;
      width: 100%;
    }

    .timeline-row-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }

    .timeline-fact {
      font-size: 12px;
      line-height: 16px;
      color: var(--text-secondary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .timeline-block {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .section-divider {
      border: none;
      border-top: 1px solid var(--line-divider);
      margin: 0;
    }

    /* Run Header */
    .run-header {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--line-divider);
    }

    .run-title-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
    }

    .run-title {
      font-size: 15px;
      line-height: 20px;
      font-weight: 600;
      color: var(--text-primary);
      min-width: 0;
      flex: 1;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .run-elapsed {
      font-size: 12px;
      line-height: 16px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }

    .run-app-line {
      font-size: 12px;
      line-height: 16px;
      color: var(--text-secondary);
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .live-step-line {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 22px;
      min-width: 0;
      width: 100%;
      font-size: 12px;
      line-height: 16px;
      color: var(--text-secondary);
      opacity: 1;
      transition: opacity var(--dur-enter) ease;
    }

    .chat-msg-row.is-agent .live-step-line {
      padding-left: 2px;
    }

    .live-step-line.is-faded {
      opacity: 0.35;
    }

    .live-step-text {
      min-width: 0;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .digest-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 4px 8px;
      min-height: 28px;
    }

    .digest-metrics {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      line-height: 16px;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
      min-width: 0;
    }

    .run-outcome-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 28px;
    }

    .run-outcome-copy {
      display: flex;
      align-items: baseline;
      gap: 8px;
      min-width: 0;
      flex: 1;
      flex-wrap: wrap;
    }

    .run-summary-text {
      font-size: 12px;
      line-height: 16px;
      color: var(--text-secondary);
      word-break: break-word;
    }

    .run-evidence-line {
      font-size: 12px;
      line-height: 16px;
      color: var(--text-secondary);
      word-break: break-word;
    }

    .run-outcome-actions {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .run-live-cost {
      font-size: 12px;
      line-height: 16px;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .stop-notice-line {
      font-size: 12px;
      line-height: 16px;
      color: var(--text-secondary);
      padding: 2px 8px;
      word-break: break-word;
    }

    .memory-notice-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 0;
      border-top: 1px solid var(--line-divider);
      min-height: 32px;
    }

    .memory-notice-text {
      font-size: 12px;
      line-height: 16px;
      color: var(--text-secondary);
      min-width: 0;
      flex: 1;
      overflow-wrap: anywhere;
    }

    /* Steps list: flat rows collapsed per run behind a keyboard-accessible toggle */
    .steps-section {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
    }

    .steps-collapse-btn {
      min-height: 28px;
      padding: 0 8px;
      color: var(--text-secondary);
    }

    .steps-collapse-btn:focus-visible {
      outline: 1.5px solid var(--focus-ring);
      outline-offset: 2px;
    }

    .steps-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .step-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
      border-radius: 8px;
    }

    .step-row-line {
      display: flex;
      align-items: center;
      gap: 4px;
      width: 100%;
    }

    .step-row-btn {
      flex: 1;
      min-width: 0;
      min-height: 32px;
      padding: 4px 8px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--text-primary);

    /* ---------------- SKELETON SHIMMER & HIGHLIGHT FADE ---------------- */
    @keyframes shimmerMove {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .skeleton-line {
      height: 16px;
      border-radius: 4px;
      background: linear-gradient(
        90deg,
        rgba(255, 255, 255, 0.04) 25%,
        rgba(255, 255, 255, 0.11) 50%,
        rgba(255, 255, 255, 0.04) 75%
      );
      background-size: 200% 100%;
      animation: shimmerMove 1.4s linear infinite;
    }

    @keyframes highlightFade {
      0% { background-color: rgba(255, 255, 255, 0.09); }
      100% { background-color: transparent; }
    }

    .changed-highlight {
      animation: highlightFade 600ms ease-out forwards;
    }

    @keyframes heroStepEnter {
      0% {
        opacity: 0;
        transform: translateY(-4px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .step-enter {
      animation: heroStepEnter var(--dur-enter) var(--ease-out) forwards;
    }

    @media (prefers-reduced-motion: reduce) {
      .notch-shell {
        transition: opacity 120ms ease !important;
      }
      .step-enter {
        animation: highlightFade 120ms ease-out forwards !important;
      }
      .skeleton-line {
        animation: none !important;
        background: rgba(255, 255, 255, 0.07) !important;
      }
    }

  <script src="./vendor/sea-glass/sea-glass.classic.js"></script>
  <script src="./shared/agent-glass.js"></script>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const fixtureParam = params.get("fixture");
      const queryToken = params.get("t") || "";
      const hasShellBridge = () => Boolean(window.webkit?.messageHandlers?.shell);

      if (hasShellBridge() || params.get("shell") === "notch") {
        document.documentElement.classList.add("is-shell");
        document.body.classList.add("is-shell");
      }

      if (params.get("state") === "expanded") {
        document.body.dataset.state = "expanded";
      }

      /* ============================================================================
         1. TRANSPORT LAYER (Shell Bridge | Same-Origin Fetch | Fixture Mode)
         ============================================================================ */
      const Transport = (function () {
        let bridgeSeq = 1;
        const pendingBridgeCalls = new Map();

        /* Session-only connection state (never persisted to disk/localStorage) */
        let sessionToken = queryToken;
        let sessionBaseUrl = queryToken ? window.location.origin : "";
        let fixtureState = null;

        window.__notchBridgeReceive = function (msg) {
          if (!msg) return;
          if (msg.id && pendingBridgeCalls.has(msg.id)) {
            const resolver = pendingBridgeCalls.get(msg.id);
            pendingBridgeCalls.delete(msg.id);
            resolver(msg);
            return;
          }
          if (msg.type === "connectionUpdated" && msg.ok && !fixtureParam) {
            sessionBaseUrl = msg.baseUrl || "shell";
            sessionToken = "shell-session";
            connectionError = "";
            connectionStatus = "loading";
            pollAll();
            return;
          }
          if (!msg.id) {
            /* Pushed by the shell, not a reply: hotkey, dropped files */
            window.dispatchEvent(new CustomEvent("shell-event", { detail: msg }));
          }
        };

        function callShell(type, payload) {
          return new Promise((resolve, reject) => {
            if (!hasShellBridge()) {
              reject(new Error("Shell unavailable"));
              return;
            }
            const id = "b-" + bridgeSeq++;
            pendingBridgeCalls.set(id, resolve);
            try {
              window.webkit.messageHandlers.shell.postMessage({
                type,
                id,
                ...(payload || {}),
              });
            } catch (err) {
              pendingBridgeCalls.delete(id);
              reject(err);
            }
          });
        }

        function parseBackendAddress(raw) {
          const trimmed = String(raw || "").trim();
          if (!trimmed) {
            return { ok: false, error: "Paste the address ComputerAnything printed" };
          }
          let parsed;
          try {
            parsed = new URL(trimmed);
          } catch {
            return { ok: false, error: "Address must be a valid URL with ?t=" };
          }
          const token = parsed.searchParams.get("t") || "";
          if (!token) {
            return { ok: false, error: "Address is missing ?t= token" };
          }
          return {
            ok: true,
            baseUrl: parsed.origin,
            token,
          };
        }

        async function init() {
          if (fixtureParam) {
            await loadFixture(fixtureParam);
            let voiceMeta = {
              speechAvailable: Boolean(fixtureState?.speechAvailable),
              onDeviceSpeech: Boolean(fixtureState?.onDeviceSpeech),
              isDictating: Boolean(fixtureState?.isDictating),
              isSpeaking: Boolean(fixtureState?.isSpeaking),
              speakText: fixtureState?.speakText ? String(fixtureState.speakText) : "",
            };
            if (fixtureState?.speechAvailable === undefined && hasShellBridge()) {
              const cfg = await callShell("getConfig").catch(() => null);
              if (cfg) {
                voiceMeta = {
                  speechAvailable: Boolean(cfg.speechAvailable),
                  onDeviceSpeech: Boolean(cfg.onDeviceSpeech),
                  isDictating: Boolean(cfg.isDictating),
                  isSpeaking: Boolean(cfg.isSpeaking),
                  speakText: cfg.speakText ? String(cfg.speakText) : "",
                };
              }
            }
            return {
              connected: true,
              isSampleData: true,
              initialDroppedFiles: fixtureState?.droppedFiles || [],
              seenFailedRunIds: fixtureState?.seenFailedRunIds || [],
              caAgents: fixtureState?.caAgents || null,
              primaryThread: fixtureState?.primaryThread || "",
              lastAgentId: fixtureState?.lastAgentId || "",
              ...voiceMeta,
            };
          }
          if (hasShellBridge()) {
            const cfg = await callShell("getConfig");
            const voiceMeta = {
              speechAvailable: Boolean(cfg && cfg.speechAvailable),
              onDeviceSpeech: Boolean(cfg && cfg.onDeviceSpeech),
              isDictating: Boolean(cfg && cfg.isDictating),
              isSpeaking: Boolean(cfg && cfg.isSpeaking),
              speakText: cfg && cfg.speakText ? String(cfg.speakText) : "",
            };
            if (cfg && cfg.connected) {
              sessionBaseUrl = cfg.baseUrl || "shell";
              sessionToken = "shell-session"; /* same marker as setConnection: the real token stays in the shell */
              return { connected: true, isSampleData: false, ...voiceMeta };
            }
            return { connected: false, isSampleData: false, ...voiceMeta };
          }
          if (sessionToken && window.location.protocol.startsWith("http")) {
            return { connected: true, isSampleData: false };
          }
          return { connected: false, isSampleData: false };
        }

        async function setConnection(rawUrl) {
          if (hasShellBridge()) {
            const res = await callShell("setConnection", { url: rawUrl });
            if (!res || !res.ok) {
              return { ok: false, error: res?.error || "Invalid address" };
            }
            sessionBaseUrl = res.baseUrl || "shell";
            sessionToken = "shell-session";
            return { ok: true };
          }

          const parsed = parseBackendAddress(rawUrl);
          if (!parsed.ok) return parsed;

          if (window.location.protocol.startsWith("http") && parsed.baseUrl !== window.location.origin) {
            return {
              ok: false,
              error: "Browser origin differs; open " + parsed.baseUrl + "/?t=… directly or use desktop notch",
            };
          }

          sessionBaseUrl = parsed.baseUrl;
          sessionToken = parsed.token;
          return { ok: true };
        }

        function clearConnection() {
          sessionToken = "";
          sessionBaseUrl = "";
        }

        function isConnected() {
          if (fixtureParam) return Boolean(fixtureState);
          return Boolean(sessionToken);
        }

        async function loadFixture(name) {
          const safe = String(name || "").replace(/[^A-Za-z0-9_-]/g, "");
          if (!safe) throw new Error("Invalid sample name");
          let rawText = "";
          if (hasShellBridge()) {
            const res = await callShell("readFixture", { name: safe });
            if (!res || !res.ok) throw new Error("Sample data not found");
            rawText = res.body || "";
          } else {
            const res = await fetch(`./fixtures/${safe}.json`, { cache: "no-store" });
            if (!res.ok) throw new Error("Sample data not found");
            rawText = await res.text();
          }
          const parsed = JSON.parse(rawText);
          const nowSec = Math.floor(Date.now() / 1000);
          const rawHelp = Array.isArray(parsed.help) ? parsed.help : [];
          const normalizedHelp = rawHelp.map((h) => {
            if (h && h.asked == null && h.asked_age_s != null) {
              return { ...h, asked: nowSec - Number(h.asked_age_s) };
            }
            return h;
          });
          fixtureState = {
            runs: Array.isArray(parsed.runs) ? parsed.runs : [],
            details: parsed.details && typeof parsed.details === "object" ? parsed.details : {},
            help: normalizedHelp,
            agents: parsed.agents && typeof parsed.agents === "object" ? parsed.agents : {},
            costs: parsed.costs && typeof parsed.costs === "object" ? parsed.costs : {},
            capabilities: parsed.capabilities && typeof parsed.capabilities === "object" ? parsed.capabilities : {},
            memory: Array.isArray(parsed.memory) ? parsed.memory : [],
            transcripts: parsed.transcripts && typeof parsed.transcripts === "object" ? parsed.transcripts : {},
            droppedFiles: Array.isArray(parsed.droppedFiles) ? parsed.droppedFiles : [],
            seenFailedRunIds: Array.isArray(parsed.seenFailedRunIds) ? parsed.seenFailedRunIds : [],
            speechAvailable: typeof parsed.speechAvailable === "boolean" ? parsed.speechAvailable : undefined,
            onDeviceSpeech: typeof parsed.onDeviceSpeech === "boolean" ? parsed.onDeviceSpeech : undefined,
            isDictating: Boolean(parsed.isDictating),
            isSpeaking: Boolean(parsed.isSpeaking),
            speakText: parsed.speakText ? String(parsed.speakText) : "",
            caAgents: Array.isArray(parsed.caAgents) ? parsed.caAgents : null,
            primaryThread: parsed.primaryThread ? String(parsed.primaryThread) : "",
            lastAgentId: parsed.lastAgentId ? String(parsed.lastAgentId) : "",
          };
        }

        async function request(method, path, options = {}) {
          if (fixtureParam) {
            return handleFixtureRequest(method, path, options);
          }

          if (hasShellBridge()) {
            const payload = { method, path };
            if (options.filePaths && options.filePaths.length) {
              payload.filePaths = options.filePaths;
              payload.prompt = options.prompt || "";
              if (options.thread) {
                payload.thread = String(options.thread);
              }
            } else if (options.jsonBody !== undefined) {
              payload.body = JSON.stringify(options.jsonBody);
            }
            const res = await callShell("http", payload);
            if (!res || res.status === 0) {
              throw Object.assign(new Error(res?.error || "Not connected"), { code: "NETWORK" });
            }
            let data = null;
            try {
              data = res.body ? JSON.parse(res.body) : {};
            } catch {
              data = {};
            }
            if (!res.ok) {
              throw Object.assign(new Error(data.error || `HTTP ${res.status}`), {
                status: res.status,
                code: res.status === 403 ? "AUTH" : "HTTP",
                data,
              });
            }
            return data;
          }

          if (!sessionToken) {
            throw Object.assign(new Error("Not connected"), { code: "AUTH" });
          }

          const fetchOpts = {
            method,
            headers: { "X-CA-Token": sessionToken },
          };
          if (options.formData) {
            fetchOpts.body = options.formData;
          } else if (options.jsonBody !== undefined) {
            fetchOpts.headers["Content-Type"] = "application/json";
            fetchOpts.body = JSON.stringify(options.jsonBody);
          }

          const res = await fetch(path, fetchOpts);
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            throw Object.assign(new Error(data.error || `HTTP ${res.status}`), {
              status: res.status,
              code: res.status === 403 ? "AUTH" : "HTTP",
              data,
            });
          }
          return data;
        }

        function handleFixtureRequest(method, path, options) {
          if (!fixtureState) throw new Error("Sample data unavailable");
          const cleanPath = String(path || "").split("?")[0];
          if (method === "GET" && cleanPath === "/api/runs") {
            return JSON.parse(JSON.stringify(fixtureState.runs));
          }
          if (method === "POST" && cleanPath.startsWith("/api/runs/") && cleanPath.endsWith("/stop")) {
            if (!fixtureState.capabilities?.stop) {
              throw Object.assign(new Error("not found"), {
                status: 404,
                code: "HTTP",
                data: { error: "not found" },
              });
            }
            const runId = decodeURIComponent(cleanPath.slice("/api/runs/".length, -"/stop".length));
            const target = fixtureState.runs.find((r) => r.id === runId);
            if (!target) {
              throw Object.assign(new Error("no such run"), {
                status: 404,
                code: "HTTP",
                data: { error: "no such run" },
              });
            }
            const targets = [target, ...fixtureState.runs.filter((r) => r.parent === runId)];
            const actCount = targets.reduce((sum, r) => {
              const evs = Array.isArray(fixtureState.details?.[r.id]?.events) ? fixtureState.details[r.id].events : [];
              return sum + evs.filter((e) => e?.kind === "act" || (e?.kind === "patch" && e.applied === true)).length;
            }, 0);
            for (const r of targets) {
              if (r.state === "done" || r.state === "failed") continue;
              r.state = "failed";
              r.result = { ok: false, summary: actCount > 0 ? "Stopped by user" : "Stopped by user · Nothing was changed." };
              const detail = fixtureState.details?.[r.id];
              if (detail) {
                detail.state = "failed";
                detail.result = r.result;
                if (!Array.isArray(detail.events)) detail.events = [];
                detail.events.push({ t: (detail.elapsed || 1) + 0.1, kind: "state", state: "failed" });
              }
            }
            return { ok: true, stopped: runId, changed_actions: actCount };
          }
          if (method === "GET" && cleanPath.startsWith("/api/runs/")) {
            const subPath = cleanPath.slice("/api/runs/".length);
            if (subPath.endsWith("/transcript")) {
              const runId = decodeURIComponent(subPath.slice(0, -"/transcript".length));
              const rows = fixtureState.transcripts?.[runId] || [];
              return JSON.parse(JSON.stringify(rows));
            }
            if (subPath.endsWith("/cost")) {
              const runId = decodeURIComponent(subPath.slice(0, -"/cost".length));
              const cost =
                fixtureState.costs?.[runId] ||
                fixtureState.details?.[runId]?.result?.digest?.task_cost ||
                fixtureState.runs.find((r) => r.id === runId)?.result?.digest?.task_cost ||
                {};
              return JSON.parse(JSON.stringify(cost));
            }
            const detail = fixtureState.details[subPath] || fixtureState.runs.find((r) => r.id === subPath);
            if (!detail) throw new Error("Run not found");
            return JSON.parse(JSON.stringify(detail));
          }
          if (method === "GET" && cleanPath === "/api/help") {
            return JSON.parse(JSON.stringify(fixtureState.help.filter((h) => h.answer == null)));
          }
          if (method === "GET" && cleanPath === "/api/agents") {
            return JSON.parse(JSON.stringify(fixtureState.agents || {}));
          }
          if (method === "GET" && cleanPath === "/api/memory") {
            const hasMemory = fixtureState.capabilities?.memory === true || (fixtureState.memory && fixtureState.memory.length > 0);
            if (fixtureState.capabilities?.memory === false || !hasMemory) {
              throw Object.assign(new Error("not found"), {
                status: 404,
                code: "HTTP",
                data: { error: "not found" },
              });
            }
            return JSON.parse(JSON.stringify(fixtureState.memory || []));
          }
          if (method === "DELETE" && cleanPath.startsWith("/api/memory/")) {
            const hasMemory = fixtureState.capabilities?.memory === true || (fixtureState.memory && fixtureState.memory.length > 0);
            if (fixtureState.capabilities?.memory === false || !hasMemory) {
              throw Object.assign(new Error("not found"), {
                status: 404,
                code: "HTTP",
                data: { error: "not found" },
              });
            }
            const memId = decodeURIComponent(cleanPath.slice("/api/memory/".length));
            const before = fixtureState.memory.length;
            fixtureState.memory = fixtureState.memory.filter((m) => String(m.id) !== memId);
            if (fixtureState.memory.length === before) {
              throw Object.assign(new Error("no such memory"), {
                status: 404,
                code: "HTTP",
                data: { error: "no such memory" },
              });
            }
            return { ok: true, id: memId };
          }
          if (method === "POST" && path.startsWith("/api/help/")) {
            const hid = path.slice("/api/help/".length);
            const choice = options.jsonBody?.choice;
            const item = fixtureState.help.find((h) => h.id === hid);
            if (!item || !item.options.includes(choice)) {
              throw new Error("Invalid choice");
            }
            item.answer = choice;
            const targetRun = fixtureState.runs.find((r) => r.id === item.run);
            const targetDetail = fixtureState.details[item.run];
            const isApprove = !/^(no|deny|denied|decline|declined|reject|rejected|cancel|cancelled|canceled)$/i.test(
              String(choice || "").trim()
            );
            const denySummary = /^cancel/i.test(String(choice || "").trim())
              ? "Stopped: cancelled by you"
              : "Stopped: denied by user";
            if (targetRun) {
              targetRun.state = isApprove ? "done" : "failed";
              targetRun.result = {
                ok: isApprove,
                summary: isApprove ? "Completed after approval" : denySummary,
              };
            }
            if (targetDetail) {
              targetDetail.state = targetRun ? targetRun.state : "done";
              targetDetail.events.push({
                t: (targetDetail.elapsed || 9) + 1,
                ts: Math.floor(Date.now() / 1000),
                kind: "help_answer",
                id: hid,
                answer: choice,
                timed_out: false,
              });
              targetDetail.result = targetRun?.result || null;
            }
            const parent = targetRun?.parent
              ? fixtureState.runs.find((r) => r.id === targetRun.parent)
              : null;
            if (parent) {
              parent.state = isApprove ? "done" : "failed";
              parent.result = {
                ok: isApprove,
                summary: isApprove ? "Completed after approval" : denySummary,
              };
            }
            return { ok: true };
          }
          if (method === "POST" && cleanPath === "/api/task") {
            const promptText = options.prompt || options.jsonBody?.prompt || "New task";
            const threadId = options.thread || options.jsonBody?.thread || "";
            const attachedNames = Array.isArray(options.attachedNames) ? options.attachedNames : [];
            if (threadId) {
              if (!fixtureState.transcripts[threadId]) {
                fixtureState.transcripts[threadId] = [];
              }
              const suffix = attachedNames.length ? ` (${attachedNames.join(", ")})` : "";
              fixtureState.transcripts[threadId].push({
                id: "msg-" + Date.now(),
                ts: Math.floor(Date.now() / 1000),
                run: threadId,
                role: "user",
                agent: "",
                kind: "msg",
                text: promptText + suffix,
              });
              return { run: threadId, thread: threadId };
            }
            const newId = "r-sample-" + Date.now();
            const parentRun = {
              id: newId,
              goal: promptText,
              role: "orchestrator",
              parent: null,
              state: "planning",
              elapsed: 0.1,
              n_events: 1,
              result: null,
            };
            fixtureState.runs.unshift(parentRun);
            fixtureState.details[newId] = {
              ...parentRun,
              events: [{ t: 0.1, kind: "state", state: "planning" }],
            };
            return { run: newId, thread: newId };
          }
          throw new Error("Unsupported path in sample data");
        }

        async function pickFiles(kind) {
          if (!hasShellBridge()) return null;
          const res = await callShell("pickFiles", { kind });
          return Array.isArray(res?.files) ? res.files : [];
        }

        /* Fire-and-forget message to the shell (open or close a window); no reply expected */
        function post(type, payload) {
          if (!hasShellBridge()) return;
          try {
            window.webkit.messageHandlers.shell.postMessage({ type, ...(payload || {}) });
          } catch {
            // Ignore bridge errors
          }
        }

        async function openWorkspace(fixtureName, options = {}) {
          const view = options && options.view ? String(options.view) : "";
          if (hasShellBridge()) {
            const payload = { mode: "sheet" };
            if (fixtureName) payload.fixture = fixtureName;
            if (view) payload.view = view;
            return callShell("openWorkspace", payload);
          }
          const url = new URL("./workspace.html", window.location.href);
          if (fixtureName) url.searchParams.set("fixture", fixtureName);
          if (view) url.searchParams.set("view", view);
          if (queryToken) url.searchParams.set("t", queryToken);
          window.open(url.toString(), "_blank", "noopener");
          return { ok: true };
        }

        const ALLOWED_SETTINGS_PANES = new Set([
          "accessibility",
          "screenRecording",
          "microphone",
          "speechRecognition",
          "automation",
        ]);

        async function openSettingsPane(pane) {
          const cleanPane = String(pane || "").trim();
          if (!hasShellBridge() || !ALLOWED_SETTINGS_PANES.has(cleanPane)) {
            return { ok: false, pane: cleanPane, error: "Unsupported settings pane" };
          }
          return callShell("openSettingsPane", { pane: cleanPane });
        }

        function openLegacyChatWindow(runId) {
          if (runId) post("openChat", { run: runId });
        }

        return {
          init,
          setConnection,
          clearConnection,
          isConnected,
          request,
          pickFiles,
          post,
          openWorkspace,
          openSettingsPane,
          openLegacyChatWindow,
        };
      })();

      /* ============================================================================
         2. SINGLE ADAPTER (Maps upstream /api/* shapes -> ViewModel; views read ONLY ViewModel)

      const WorkspaceAdapter = (function () {
        const NEUTRAL_AGENT_COLOR = "#5C6B7A";

        const PRIMARY_SWATCHES = [
          { key: "lagoon", name: "Lagoon", color: "#B5D0EB", edge: "#D6E9FF", ink: "#2F647C" },
          { key: "rose",   name: "Rose",   color: "#EECED6", edge: "#FFF0F1", ink: "#963F59" },
          { key: "mint",   name: "Mint",   color: "#C0DED0", edge: "#E6FFF0", ink: "#396C5A" },
          { key: "lilac",  name: "Lilac",  color: "#E1CDE8", edge: "#FBE8F7", ink: "#71388B" },
          { key: "amber",  name: "Amber",  color: "#F0D9BE", edge: "#FFFCE0", ink: "#865733" },
        ];

        const APPROVAL_KIND_WARNINGS = {
          destructive: "This can't be undone",

        function getApprovalKindWarning(kind) {
          const normalized = String(kind || "").trim().toLowerCase().replace(/-/g, "_");
          return APPROVAL_KIND_WARNINGS[normalized] || "";
        }

        function isMoneyOrSendApproval(h) {
          const kind = String(h?.kind || h?.help_kind || "").trim().toLowerCase();
          if (kind === "money" || kind === "send") return true;
          const text = `${h?.question || ""} ${h?.detail || ""}`;
          return /(?:^|[^A-Za-z0-9_])\$\d|\b(pay|pays|paying|payment|purchase|buy|checkout|place\s+order|submit\s+order|send|sends|sending|email|transfer|wire)\b/i.test(
            text
          );
        }

        function formatApprovalQuestionPlain(rawQuestion) {
          let s = String(rawQuestion || "").trim();
          if (!s) return "Approval needed";
          s = s
            .replace(/\s*\(\s*matched\s+["'][^"']*["']\s*\)\s*/gi, " ")
            .replace(/^allow\s+double_click\s+(?:on\s+)?/i, "Double-click ")
            .replace(/^allow\s+right_click\s+(?:on\s+)?/i, "Right-click ")
            .replace(/^allow\s+click\s+(?:on\s+)?/i, "Click ")
            .replace(/^allow\s+set_value\s+(?:in|into|on|of)?\s*/i, "Enter text in ")
            .replace(/^allow\s+type\s+(?:text\s+)?(?:in|into|on)?\s*/i, "Type in ")
            .replace(/^allow\s+press\s+(?:key\s+)?/i, "Press ")
            .replace(/^allow\s+scroll\s+/i, "Scroll ")
            .replace(/^allow\s+open_app\s+/i, "Open ")
            .replace(/^allow\s+run_applescript\b[:\s-]*/i, "Run script ")
            .replace(/\bdouble_click\b/gi, "double-click")
            .replace(/\bright_click\b/gi, "right-click")
            .replace(/\bset_value\b/gi, "enter text")
            .replace(/\bopen_app\b/gi, "open app")
            .replace(/\brun_applescript\b/gi, "run script")
            .replace(
              /\b(?:AX[A-Z][A-Za-z0-9]*|statictext|textfield|textarea|searchfield|securetextfield|button|link|menuitem|menubaritem|checkbox|radiobutton|popupbutton|combobox|tab|cell|row|treeitem|slider|switch|heading|image|scrollarea|incrementor|colorwell|disclosure):/gi,
              ""
            )
            .replace(/\s+([?.!,])/g, "$1")
            .replace(/\s{2,}/g, " ")
            .trim();
          if (!s) return "Approval needed";
          return s.charAt(0).toUpperCase() + s.slice(1);
        }

        function matchPrimarySwatch(rawSwatch) {
          const val = String(rawSwatch || "").trim();
          if (!val) return null;
          const lower = val.toLowerCase();
          const upper = val.toUpperCase();
          return (
            PRIMARY_SWATCHES.find((s) => s.key === lower || s.name.toLowerCase() === lower || s.color === upper) ||
            null
          );
        }

        function readPrimaryAgentPref(meta) {
          let raw = meta && meta.primaryAgent ? meta.primaryAgent : null;
          if (!raw) {
            try {
              if (typeof localStorage !== "undefined") {
                const stored = localStorage.getItem("ca.primaryAgent");
                if (stored) raw = JSON.parse(stored);
              }
            } catch {
              raw = null;
            }
          }
          if (!raw || typeof raw !== "object") return null;
          const alias = typeof raw.alias === "string" ? raw.alias.trim() : "";
          const swatch = matchPrimarySwatch(raw.swatch);
          if (!alias && !swatch) return null;
          return { alias, swatch };
        }

        function normalizeHex(hex, fallback) {
          const s = String(hex || "").trim();
          if (/^#[0-9a-fA-F]{6}$/.test(s)) return s.toUpperCase();
          if (/^#[0-9a-fA-F]{3}$/.test(s)) {
            return (
              "#" +
              s[1] + s[1] +
              s[2] + s[2] +
              s[3] + s[3]
            ).toUpperCase();
          }
          return fallback;
        }

        function hexToRgb(hex) {
          const clean = normalizeHex(hex, "#000000").slice(1);
          const n = parseInt(clean, 16);
          return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
        }

        function rgbToHex(r, g, b) {
          const clamp = (v) => Math.max(0, Math.min(255, Math.round(v)));
          return (
            "#" +
            [clamp(r), clamp(g), clamp(b)]
              .map((v) => v.toString(16).padStart(2, "0"))
              .join("")
              .toUpperCase()
          );
        }

        function mixHex(hexA, hexB, weightB) {
          const [r1, g1, b1] = hexToRgb(hexA);
          const [r2, g2, b2] = hexToRgb(hexB);
          const w = Math.max(0, Math.min(1, weightB));
          return rgbToHex(
            r1 + (r2 - r1) * w,
            g1 + (g2 - g1) * w,
            b1 + (b2 - b1) * w
          );
        }

        function relativeLuminance(hex) {
          const [r, g, b] = hexToRgb(hex).map((v) => {
            const c = v / 255;
            return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
          });
          return 0.2126 * r + 0.7152 * g + 0.0722 * b;
        }

        function contrastRatio(hexA, hexB) {
          const l1 = relativeLuminance(hexA);
          const l2 = relativeLuminance(hexB);
          const hi = Math.max(l1, l2);
          const lo = Math.min(l1, l2);
          return (hi + 0.05) / (lo + 0.05);
        }

        function ensureContrastInk(bodyHex, rawInkHex) {
          let ink = normalizeHex(rawInkHex, mixHex(bodyHex, "#101216", 0.65));
          for (let step = 0; step < 6; step++) {
            if (contrastRatio(bodyHex, ink) >= 4.7) return ink;
            ink = mixHex(ink, "#101216", 0.28);
          }
          return ink;
        }

        function hashString(str) {
          let h = 2166136261;
          for (let i = 0; i < str.length; i++) {
            h ^= str.charCodeAt(i);
            h = Math.imul(h, 16777619);
          }
          return h >>> 0;
        }

        function extractEventAgentName(runObj, events, parentRouteEvent, fallbackIndex) {
          if (runObj?.agent_name) return String(runObj.agent_name).trim();
          if (runObj?.agent) return String(runObj.agent).trim();
          const list = Array.isArray(events) ? events : [];
          for (let i = list.length - 1; i >= 0; i--) {
            const ev = list[i];
            if (
              (ev?.kind === "route" ||
                ev?.kind === "act" ||
                ev?.kind === "decide" ||
                ev?.kind === "verify" ||
                ev?.kind === "result" ||
                ev?.kind === "help" ||
                (ev?.kind === "msg" && ev.role === "agent")) &&
              ev.agent
            ) {
              return String(ev.agent).trim();
            }
          }
          if (parentRouteEvent) {
            if (Array.isArray(parentRouteEvent.names) && parentRouteEvent.names[fallbackIndex]) {
              return String(parentRouteEvent.names[fallbackIndex]).trim();
            }
            if (parentRouteEvent.agent) {
              return String(parentRouteEvent.agent).trim();
            }
          }
          return "";
        }

        function extractEventOrTranscriptAgent(runObj, events, transcriptsById, parentRouteEvent, fallbackIndex) {
          const list = Array.isArray(events) ? events : [];
          let evColor = "";
          let evEdge = "";
          let evInk = "";
          for (let i = list.length - 1; i >= 0; i--) {
            const ev = list[i];
            if ((ev?.kind === "route" || ev?.kind === "act" || (ev?.kind === "msg" && ev.role === "agent")) && (ev.color || ev.body)) {
              evColor = ev.color || ev.body;
              evEdge = ev.edge || "";
              evInk = ev.ink || "";
              break;
            }
          }
          const evName = extractEventAgentName(runObj, list, parentRouteEvent, fallbackIndex);
          const allRows = [];
          if (transcriptsById && runObj?.id && Array.isArray(transcriptsById[runObj.id])) {
            allRows.push(...transcriptsById[runObj.id]);
          }
          if (transcriptsById && runObj?.parent && Array.isArray(transcriptsById[runObj.parent])) {
            allRows.push(...transcriptsById[runObj.parent]);
          }
          let trName = "";
          let trColor = "";
          for (const row of allRows) {
            if (!row || row.role !== "agent") continue;
            if (row.run === runObj?.id || (evName && row.agent === evName)) {
              if (!trName && row.agent) trName = String(row.agent).trim();
              if (!trColor && (row.color || row.body)) trColor = row.color || row.body;
              if (trName && trColor) break;
            }
          }
          return {
            name: evName || trName,
            color: evColor || trColor,
            edge: evEdge,
            ink: evInk,
          };
        }

        function resolveAgentIdentity(
          runObj,
          agentsMap,
          fallbackIndex,
          rememberedMap,
          events,
          parentRouteEvent,
          transcriptsById,
          primaryAgentPref,
          groupAgentCount
        ) {
          const recovered = extractEventOrTranscriptAgent(
            runObj,
            events,
            transcriptsById,
            parentRouteEvent,
            fallbackIndex
          );
          const directRecord =
            (agentsMap && runObj?.id ? agentsMap[runObj.id] : null) ||
            (rememberedMap && runObj?.id ? rememberedMap[runObj.id] : null) ||
            (rememberedMap && recovered.name ? rememberedMap[`agent:${recovered.name}`] : null) ||
            null;
          const record = directRecord && (directRecord.color || directRecord.body)
            ? directRecord
            : recovered.color
            ? {
                name: directRecord?.name || recovered.name,
                color: recovered.color,
                edge: recovered.edge,
                ink: recovered.ink,
              }
            : directRecord;
          const fallbackName = recovered.name || actorLabelForRole(runObj?.role, fallbackIndex, groupAgentCount);
          const resolvedBackendName = String(record?.name || fallbackName).trim();
          const isOrchestrator = runObj?.role === "orchestrator" || resolvedBackendName === "ComputerAnything";
          const displayName =
            isOrchestrator && primaryAgentPref && primaryAgentPref.alias
              ? primaryAgentPref.alias
              : resolvedBackendName;
          const swatchOverride = isOrchestrator && primaryAgentPref ? primaryAgentPref.swatch : null;
          const seed = hashString(String(runObj?.id || displayName || "agent")) % 10000;
          const hasAgentColor = Boolean(swatchOverride || (record && (record.color || record.body)));
          if (hasAgentColor) {
            const rawColor = normalizeHex(
              swatchOverride ? swatchOverride.color : record.color || record.body,
              NEUTRAL_AGENT_COLOR
            );
            const rawEdge = normalizeHex(
              swatchOverride ? swatchOverride.edge : record.edge,
              mixHex(rawColor, "#FFFFFF", 0.35)
            );
            const rawInk = normalizeHex(
              swatchOverride ? swatchOverride.ink : record.ink,
              mixHex(rawColor, "#000000", 0.45)
            );
            const shared = typeof window !== "undefined" ? window.AgentGlass : null;
            let palette;
            if (shared && typeof shared.resolveAgentPalette === "function") {
              const resolved = shared.resolveAgentPalette({
                color: rawColor,
                edge: rawEdge,
                ink: rawInk,
              });
              palette = {
                body: normalizeHex(resolved.body, rawColor),
                edge: normalizeHex(resolved.edge, rawEdge),
                ink: normalizeHex(resolved.ink, rawInk),
              };
            } else {
              palette = {
                body: rawColor,
                edge: rawEdge,
                ink: ensureContrastInk(rawColor, mixHex(rawInk, "#000000", 0.25)),
              };
            }
            return {
              id: runObj?.id || `agent-${fallbackIndex}`,
              name: displayName,
              color: rawColor,
              rawEdge,
              rawInk,
              hasAgentColor: true,
              palette,
              seed,
            };
          }
          const baseColor = NEUTRAL_AGENT_COLOR;
          const body = mixHex(baseColor, "#FFFFFF", 0.70);
          const edge = mixHex(body, "#FFFFFF", 0.35);
          const derivedInk = mixHex(baseColor, "#000000", 0.45);
          const ink = ensureContrastInk(body, derivedInk);
          return {
            id: runObj?.id || `agent-${fallbackIndex}`,
            name: displayName,
            color: baseColor,
            rawEdge: edge,
            rawInk: derivedInk,
            hasAgentColor: false,
            palette: { body, edge, ink },
            seed,
          };
        }

        function formatCountdown(sec) {
          const total = Math.max(0, Math.ceil(Number(sec) || 0));
          const mins = Math.floor(total / 60);
          const rem = total % 60;
          return `${mins}:${String(rem).padStart(2, "0")}`;
        }

        function formatCostUsd(costUsd) {
          if (costUsd == null || costUsd === "" || Number.isNaN(Number(costUsd))) return "";
          const n = Math.max(0, Number(costUsd));
          if (n === 0) return "$0.00";
          if (n < 0.01) return `$${n.toFixed(4)}`;
          return `$${n.toFixed(2)}`;
        }

        const UNSAFE_ROLE_WORD_RE =
          /\b(?:statictext|textfield|textarea|searchfield|securetextfield|menuitem|menubaritem|radiobutton|popupbutton|combobox|treeitem|scrollarea|incrementor|colorwell|disclosure|axui|axerror)\b/i;
        const AX_COCOA_ROLE_RE = /\bAX[A-Z][A-Za-z0-9]*\b/;
        const ROLE_SYNTAX_RE =
          /(?:\[\d+\]\s*(?:button|link|checkbox|tab|cell|row|slider|switch|heading|image|group|window|toolbar|outline|table|list)\b|\b(?:button|link|checkbox|tab|cell|row|slider|switch|heading|image|group|window|toolbar|outline|table|list)\s*:\s*["']?[^\s"']|^(?:button|link|checkbox|tab|cell|row|slider|switch|heading|image|group|window|toolbar|outline|table|list)\s+["'][^"']+["'])/i;
        const SINGLE_ROLE_EVIDENCE_RE =
          /^(?:\[\d+\]\s*)?(?:AX[A-Z][A-Za-z0-9]*|statictext|textfield|textarea|searchfield|securetextfield|button|link|menuitem|menubaritem|checkbox|radiobutton|popupbutton|combobox|tab|cell|row|treeitem|slider|switch|heading|image|scrollarea|incrementor|colorwell|disclosure)\s*:?\s*(?:"([^"]*)"|'([^']*)'|([^\s(][^()]*?))(?:\s*\((?:read-only|disabled|focused|selected)\))?$/i;
        const ACTION_ROLE_PREFIX_RE =
          /^(?:AX[A-Z][A-Za-z0-9]*|statictext|textfield|textarea|searchfield|securetextfield|button|link|menuitem|menubaritem|checkbox|radiobutton|popupbutton|combobox|tab|cell|row|treeitem|slider|switch|heading|image|scrollarea|incrementor|colorwell|disclosure):/i;

        function containsRoleName(text) {
          const s = String(text || "").trim();
          if (!s) return false;
          return UNSAFE_ROLE_WORD_RE.test(s) || AX_COCOA_ROLE_RE.test(s) || ROLE_SYNTAX_RE.test(s);
        }

        function stripActionRolePrefix(target) {
          let s = String(target || "").trim();
          while (ACTION_ROLE_PREFIX_RE.test(s)) {
            s = s.replace(ACTION_ROLE_PREFIX_RE, "").trim();
          }
          return s;
        }

        function formatEvidencePlain(rawEvidence, appName, resultSummary) {
          const raw = String(rawEvidence || "").trim();
          if (!raw || /^mock$/i.test(raw)) return "";
          if (!containsRoleName(raw)) return raw;
          const m = raw.match(SINGLE_ROLE_EVIDENCE_RE);
          if (m) {
            const val = String(m[1] ?? m[2] ?? m[3] ?? "").trim();
            if (val && !containsRoleName(val)) {
              const prefix = String(appName || "").trim();
              return prefix ? `${prefix} shows ${val}` : `Screen shows ${val}`;
            }
          }
          const fallback = String(resultSummary || "").trim();
          if (fallback && !/^mock$/i.test(fallback) && !containsRoleName(fallback)) {
            return fallback;
          }
          return "";
        }

        function cleanPlainSummary(rawText, appName, fallbackText) {
          const text = String(rawText || "").trim();
          if (!text) return "";
          if (!containsRoleName(text)) return text;
          const formatted = formatEvidencePlain(text, appName, fallbackText);
          if (formatted) return formatted;
          const fallback = String(fallbackText || "").trim();
          return fallback && !containsRoleName(fallback) ? fallback : "";
        }

        function cleanActionTargetText(target, verb) {
          let s = stripActionRolePrefix(String(target || "").trim());
          s = s.replace(/\s*->\s*[^:\s]+:[0-9a-f]{6,}\b.*$/i, "").trim();
          s = s.replace(/:[0-9a-f]{8,}\b/gi, "").trim();
          if (verb === "open_app" || verb === "launch") {
            s = s.replace(/^(?:running|finder|spotlight|auto):/i, "").trim();
            if (s && s === s.toLowerCase()) {
              s = s.split(/\s+/).map((w) => sentenceCase(w)).join(" ");
            }
          }
          if (/^(?:invalid-target|no-key|no-name)$/i.test(s)) return "";
          return s;
        }

        function parseActionParts(rawAction) {
          const raw = String(rawAction || "").trim();
          if (!raw) return { verb: "", target: "" };
          const idx = raw.indexOf(":");
          if (idx === -1) return { verb: raw.toLowerCase(), target: "" };
          const verb = raw.slice(0, idx).trim().toLowerCase();
          const rawTarget = raw.slice(idx + 1).trim();
          if (/^(?:invalid-target|no-key|no-name)$/i.test(rawTarget)) {
            return { verb: "", target: "" };
          }
          return {
            verb,
            target: cleanActionTargetText(rawTarget, verb),
          };
        }

        function summarizeActPlain(ev) {
          const { verb, target } = parseActionParts(ev?.action);
          if (!verb || verb === "done") return "";
          switch (verb) {
            case "click":
              return target ? `clicked ${target}` : "clicked element";
            case "double_click":
              return target ? `double-clicked ${target}` : "double-clicked element";
            case "type":
              return target ? `typed in ${target}` : "typed text";
            case "set_value":
              return target ? `set ${target}` : "set value";
            case "press":
              return target ? `pressed ${target}` : "pressed key";
            case "scroll":
              return target ? `scrolled ${target}` : "scrolled";
            case "open_app":
            case "launch":
              return target ? `opened ${target}` : "opened app";
            case "run_applescript":
              return "ran app script";
            default:
              return target ? `${verb.replace(/_/g, " ")} ${target}` : verb.replace(/_/g, " ");
          }
        }

        const ACTION_TEXT_TAG_RE =
          /^\[?(click|double_click|right_click|type|set_value|press|scroll|open_app|launch|run_applescript)(?::|\s+)([^\]]*)\]?$/i;
        const TRAILING_ACTION_TAG_RE =
          /\s*\[?(click|double_click|right_click|type|set_value|press|scroll|open_app|launch|run_applescript):[^\]]*\]?\s*$/i;

        function isAgentActionLine(text, kind, msgKind) {
          if (kind === "step" || msgKind === "step") return true;
          const raw = String(text || "").trim();
          if (!raw) return false;
          if (ACTION_TEXT_TAG_RE.test(raw)) return true;
          if (TRAILING_ACTION_TAG_RE.test(raw)) return true;
          return false;
        }

        function formatActionTextPlain(rawText, actionHint) {
          const raw = String(rawText || "").trim();
          if (actionHint) {
            return sentenceCase(summarizeActPlain({ action: actionHint }));
          }
          if (!raw) return "";
          const unwrapped = raw.startsWith("[") && raw.endsWith("]") ? raw.slice(1, -1).trim() : raw;
          const exactMatch = unwrapped.match(ACTION_TEXT_TAG_RE);
          if (exactMatch) {
            const verb = exactMatch[1].toLowerCase();
            let rest = String(exactMatch[2] || "").trim();
            if (unwrapped.includes(":")) {
              return sentenceCase(summarizeActPlain({ action: `${verb}:${rest}` }));
            }
            rest = stripActionRolePrefix(
              rest.replace(/^(?:button|link|textfield|textarea|searchfield|menuitem|menubaritem|checkbox|radiobutton|popupbutton|combobox|tab|cell|row)\s+/i, "")
            );
            return sentenceCase(summarizeActPlain({ action: `${verb}:${rest}` }));
          }
          const stripped = raw
            .replace(TRAILING_ACTION_TAG_RE, "")
            .replace(/\s*->\s*[^:\s]+:[0-9a-f]{6,}\b.*$/i, "")
            .trim();
          if (stripped && !/\[|->|:[0-9a-f]{8,}|running:|invalid-target/i.test(stripped)) {
            return sentenceCase(stripped);
          }
          const trailingMatch = raw.match(/\[?([a-z_]+:[^\]]*)\]?\s*$/i);
          if (trailingMatch) {
            return sentenceCase(summarizeActPlain({ action: trailingMatch[1] }));
          }
          return sentenceCase(stripped || raw);
        }

        function summarizeDecidePlain(ev) {
          if (ev?.thought) return String(ev.thought).trim();
          if (ev?.action === "done") return "checking if done";
          return "choosing next step";
        }

        function extractRunApp(runObj, events, parentRouteEvent) {
          if (runObj?.app) return String(runObj.app).trim();
          const list = Array.isArray(events) ? events : [];
          for (let i = list.length - 1; i >= 0; i--) {
            if (list[i]?.kind === "app_ready" && list[i].app) {
              return String(list[i].app).trim();
            }
          }
          for (let i = list.length - 1; i >= 0; i--) {
            if ((list[i]?.kind === "act" || list[i]?.kind === "decide") && list[i].app) {
              return String(list[i].app).trim();
            }
          }
          for (let i = list.length - 1; i >= 0; i--) {
            const node = list[i]?.kind === "graph" ? String(list[i].node || "") : "";
            const prefix = node.split(":")[0].trim();
            if (prefix && prefix !== "?") return prefix;
          }
          if (parentRouteEvent && Array.isArray(parentRouteEvent.subtasks) && parentRouteEvent.subtasks.length) {
            const byGoal = parentRouteEvent.subtasks.find((s) => s && s.goal === runObj?.goal && s.app);
            if (byGoal) return String(byGoal.app).trim();
            if (parentRouteEvent.subtasks.length === 1 && parentRouteEvent.subtasks[0]?.app) {
              return String(parentRouteEvent.subtasks[0].app).trim();
            }
          }
          if (parentRouteEvent?.app) return String(parentRouteEvent.app).trim();
          return "";
        }

        function pluralizeUnits(text) {
          return String(text || "")
            .replace(/(\d+)\s+round\(s\)/gi, (_, n) => `${n} round${Number(n) === 1 ? "" : "s"}`)
            .replace(/(\d+)\s+patch\(es\)/gi, (_, n) => `${n} patch${Number(n) === 1 ? "" : "es"}`);
        }

        function formatSeconds(sec) {
          const n = Math.max(0, Number(sec) || 0);
          if (n < 1) return "<1s";
          if (n < 10) return `${n.toFixed(1)}s`;
          const whole = Math.round(n);
          if (whole < 60) return `${whole}s`;
          const mins = Math.floor(whole / 60);
          const rem = whole % 60;
          return `${mins}m ${String(rem).padStart(2, "0")}s`;
        }

        function sentenceCase(text) {
          const s = String(text || "").trim();
          if (!s) return "";
          return s.charAt(0).toUpperCase() + s.slice(1);
        }

        function actorLabelForRole(role, fallbackIndex, totalCount) {
          if (role === "qa") return "QA agent";
          if (role === "dev") return "Dev agent";
          if (role === "cu") {
            if (totalCount > 1 && fallbackIndex != null) return `Agent ${fallbackIndex + 1}`;
            return "Computer use agent";
          }
          if (role === "marketing") return "Marketing agent";
          if (totalCount > 1 && fallbackIndex != null) return `Agent ${fallbackIndex + 1}`;
          return "Agent";
        }

        function summarizeEventPlain(ev) {
          if (!ev || typeof ev !== "object") return "";
          switch (ev.kind) {
            case "state":
              if (ev.state === "planning") return "Planning next steps";
              if (ev.state === "acting") return "Working";
              if (ev.state === "awaiting_human") return "Waiting for your answer";
              if (ev.state === "done") return "Finished";
              if (ev.state === "failed") return "Stopped";
              return "";
            case "graph":
              return "";
            case "route":
              if (Array.isArray(ev.names) && ev.names.length) {
                return `Assigned to ${ev.names.join(", ")}`;
              }
              if (ev.agent) return `Assigned to ${ev.agent}`;
              return `Assigned to ${actorLabelForRole(ev.role)}`;
            case "app_ready":
              return ev.app ? `Opened ${ev.app}` : "Opened app";
            case "memory":
              return "";
            case "decide":
              return "";
            case "act":
              return ev.action ? sentenceCase(summarizeActPlain(ev)) : "";
            case "verify": {
              const rawEv = String(ev.evidence || "").trim();
              if (ev.achieved) {
                if (/^mock$/i.test(rawEv)) return "";
                const plainEv = formatEvidencePlain(rawEv, "", "");
                return plainEv ? `Verified: ${plainEv}` : "Verified goal on screen";
              }
              const plainFail = cleanPlainSummary(rawEv, "", "");
              return plainFail ? `Not verified yet: ${plainFail}` : "Verification check did not pass";
            }
            case "tests":
              return ev.exit === 0
                ? `Tests passed (round ${ev.round || 1})`
                : `Tests did not pass (round ${ev.round || 1})`;
            case "ui_check":
              return ev.summary ? sentenceCase(ev.summary) : (ev.ok ? "UI check passed" : "UI check found issues");
            case "bug_report": {
              const count = Array.isArray(ev.bugs) ? ev.bugs.length : 0;
              if (count === 0) return `Round ${ev.round || 1}: no bugs found`;
              return `Round ${ev.round || 1}: found ${count} bug${count === 1 ? "" : "s"}`;
            }
            case "patch":
              if (ev.applied === false) {
                return ev.error && /denied/i.test(ev.error)
                  ? "Patch denied · Nothing was changed."
                  : "Patch not applied · Nothing was changed.";
              }
              return ev.explanation ? `Applied fix: ${ev.explanation}` : "Applied patch";
            case "commit":
              return ev.ok ? "Committed fix" : "Could not commit fix";
            case "help":
              return ev.question ? `Asked: ${ev.question}` : "Waiting for approval";
            case "help_answer":
              if (ev.timed_out) return "Approval expired";
              return `Answered: ${sentenceCase(ev.answer || "")}`;
            case "msg": {
              const msgText = String(ev.text || "").trim();
              if (!msgText || ev.msg_kind === "prompt") return "";
              if (ev.msg_kind === "step" || (ev.role !== "user" && isAgentActionLine(msgText, ev.kind, ev.msg_kind))) {
                return formatActionTextPlain(msgText, ev.action);
              }
              return sentenceCase(msgText);
            }
            case "speak":
              return ev.text || ev.msg || ev.message ? sentenceCase(ev.text || ev.msg || ev.message) : "";
            case "artifact":
              return ev.tagline ? `Created brief: ${ev.tagline}` : "Saved output";
            case "tour":
              return ev.summary ? sentenceCase(ev.summary) : `Captured screen ${ev.step || ""}`.trim();
            case "warn":
              return ev.error ? sentenceCase(ev.error) : "Warning";
            case "error":
              return ev.error || ev.msg ? sentenceCase(ev.error || ev.msg) : "Error occurred";
            case "result":
              return ev.summary ? sentenceCase(ev.summary) : "";
            default:
              return "";
          }
        }

        function formatStepDetails(run, events, appName) {
          const lines = [];
          for (const ev of events) {
            let line = "";
            if (ev?.kind === "verify" && ev.achieved) {
              const rawEv = String(ev.evidence || "").trim();
              if (/^mock$/i.test(rawEv)) {
                line = "Sample run check (not verified)";
              } else {
                const plainEv = formatEvidencePlain(rawEv, appName || "", run?.result?.summary || "");
                line = plainEv ? `Verified: ${plainEv}` : "Verified goal on screen";
              }
            } else {
              line = summarizeEventPlain(ev);
            }
            if (line) {
              lines.push(line);
            }
            if (ev.kind === "bug_report" && Array.isArray(ev.bugs)) {
              for (const b of ev.bugs) {
                lines.push(`  - [${b.severity || "issue"}] ${b.title}${b.evidence ? ` (${b.evidence})` : ""}`);
              }
            }
            if (ev.kind === "patch" && ev.diff) {
              lines.push(ev.diff);
            }
            if (ev.kind === "patch" && ev.applied === false && ev.error) {
              lines.push(`  Reason: ${ev.error} · Nothing was changed.`);
            }
          }
          if (!lines.length && run.result?.summary) {
            const plainSummary = cleanPlainSummary(run.result.summary, appName || "", "");
            if (plainSummary) lines.push(sentenceCase(plainSummary));
          }
          return lines;
        }

        function extractVerificationEvidence(allRunsInGroup, detailsById, appName, resultSummary) {
          for (const r of allRunsInGroup) {
            const detail = detailsById[r.id];
            const evs = Array.isArray(detail?.events) ? detail.events : [];
            const verified = [...evs].reverse().find((e) => e.kind === "verify" && e.achieved && e.evidence);
            if (verified) {
              const formatted = formatEvidencePlain(verified.evidence, appName, resultSummary);
              if (formatted) return formatted;
            }
          }
          return "";
        }

        function hasUnappliedPatch(allRunsInGroup, detailsById) {
          for (const r of allRunsInGroup) {
            const detail = detailsById[r.id];
            const evs = Array.isArray(detail?.events) ? detail.events : [];
            const unapplied = [...evs].reverse().find((e) => e.kind === "patch" && e.applied === false);
            if (unapplied) return unapplied;
          }
          return null;
        }

        const ALLOWED_SETTINGS_PANES = new Set([
          "accessibility",
          "screenRecording",
          "microphone",
          "speechRecognition",
          "automation",
        ]);

        const PERMISSION_RULES = [
          {
            key: "accessibility",
            label: "Accessibility",
            pane: "accessibility",
            buttonText: "Open Accessibility settings",
            message: "Accessibility permission needed to inspect and interact with windows.",
            pattern: /\b(accessibility|axui|axerror|not trusted|assistive)\b/i,
          },
          {
            key: "screen_recording",
            label: "Screen Recording",
            pane: "screenRecording",
            buttonText: "Open Screen Recording settings",
            message: "Screen Recording permission needed to capture the screen.",
            pattern: /(screen\s*recording|screen\s*capture|cgwindowlist|screencapture|cannot record|screenrecording)/i,
          },
          {
            key: "automation",
            label: "Automation",
            pane: "automation",
            buttonText: "Open Automation settings",
            message: "Automation permission needed to control apps on this Mac.",
            pattern: /(automation|apple\s*event|-1743|not authorized to send apple events)/i,
          },
          {
            key: "microphone",
            label: "Microphone",
            pane: "microphone",
