<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agent Workspace</title>
  <style>
    :root {
      color-scheme: dark;
      /* Two surfaces only: app background and raised surface */
      --bg-app: #0c0d10;
      --bg-raised: #16181d;
      --btn-hover: rgba(255, 255, 255, 0.07);
      --btn-pressed: rgba(255, 255, 255, 0.04);
      --line-divider: rgba(255, 255, 255, 0.08);
      --focus-ring: #8a8f9e;

      /* Text hierarchy */
      --text-primary: #f2f4f8;
      --text-secondary: #a6adbb;
      --text-muted: #7d8495;

      /* Primary ink button (only filled button in panel) */
      --ink-fill: #f2f4f8;
      --ink-fill-hover: #ffffff;
      --ink-fill-pressed: #d5d9e2;
      --ink-text: #0c0d10;

      /* State colors (used only with symbol + word, never as region fill) */
      --state-working: #4c8dff;
      --state-success: #32d583;
      --state-warning: #f5a623;
      --state-danger: #ff5c6c;

      /* Motion */
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      --dur-enter: 180ms;
      --dur-exit: 117ms;

      /* Typography */
      --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
      --font-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      font-family: var(--font-sans);
      font-size: 13px;
      line-height: 20px;
      font-weight: 400;
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      background: var(--bg-app);
      overflow-x: hidden;
    }

    html.is-shell,
    body.is-shell {
      background: transparent !important;
      min-height: 0;
      overflow: hidden;
    }

    /* Neutral mid-tone focus ring (never blue) */
    button:focus-visible,
    textarea:focus-visible,
    input:focus-visible,
    [tabindex]:focus-visible {
      outline: 1.5px solid var(--focus-ring);
      outline-offset: 2px;
    }

    /* Overlay shell: the ONLY element with a shadow */
    .notch-shell {
      position: relative;
      background: var(--bg-app);
      border-bottom: 1px solid var(--line-divider);
      border-left: 1px solid var(--line-divider);
      border-right: 1px solid var(--line-divider);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.65);
      overflow: hidden;
      transform-origin: top center;
      transition:
        width var(--dur-enter) var(--ease-out),
        height var(--dur-enter) var(--ease-out),
        border-radius var(--dur-enter) var(--ease-out);
    }

    body[data-state="collapsed"] .notch-shell {
      width: 280px;
      height: 36px;
      border-radius: 0 0 16px 16px;
      transition:
        width var(--dur-exit) var(--ease-out),
        height var(--dur-exit) var(--ease-out),
        border-radius var(--dur-exit) var(--ease-out);
    }

    body[data-state="expanded"] .notch-shell {
      width: min(480px, 100vw);
      max-width: 100%;
      height: var(--panel-height, 220px);
      max-height: 600px;
      border-radius: 0 0 16px 16px;
    }

    /* Instant open/close when keyboard-driven */
    body.instant-motion .notch-shell,
    body.instant-motion .pill-bar,
    body.instant-motion .panel-view {
      transition: none !important;
    }

    .notch-shell.drag-over {
      background: var(--bg-raised);
    }

    /* ---------------- COLLAPSED PILL ---------------- */
    .pill-bar {
      width: 280px;
      height: 36px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      background: transparent;
      border: none;
      color: var(--text-primary);
      font: inherit;
      font-size: 12px;
      line-height: 16px;
      cursor: pointer;
    }

    .pill-bar:hover {
      background: var(--btn-hover);
    }

    .pill-bar:active {
      background: var(--btn-pressed);
    }

    body[data-state="expanded"] .pill-bar {
      opacity: 0;
      pointer-events: none;
      position: absolute;
      top: 0;
      left: 0;
      visibility: hidden;
    }

    .pill-status-line {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      max-width: 256px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 12px;
      line-height: 16px;
    }

    .pill-dots {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .pill-agent-dot,
    .agent-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      flex-shrink: 0;
      background: var(--dot-bg, #5c6b7a);
      border: 1px solid var(--dot-edge, rgba(255, 255, 255, 0.25));
    }

    .pill-sub {
      color: var(--text-secondary);
      font-weight: 400;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .pill-idle {
      color: var(--text-primary);
      font-weight: 400;
    }

    /* ---------------- EXPANDED PANEL ---------------- */
    .panel-view {
      width: 100%;
      max-width: 480px;
      max-height: 600px;
      display: flex;
      flex-direction: column;
      padding: 12px 16px 16px;
      gap: 16px;
    }

    body[data-state="collapsed"] .panel-view {
      position: absolute;
      top: 0;
      left: 0;
      opacity: 0;
      pointer-events: none;
      visibility: hidden;
    }

    body[data-state="expanded"] .panel-view {
      position: relative;
      opacity: 1;
      pointer-events: auto;
      visibility: visible;
    }

    /* ---------------- BUTTONS (Section 5) ---------------- */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      height: 28px;
      min-width: 28px;
      min-height: 28px;
      padding: 0 8px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--text-secondary);
      font-family: var(--font-sans);
      font-size: 12px;
      line-height: 16px;
      font-weight: 400;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .btn:hover:not(:disabled) {
      background: var(--btn-hover);
      color: var(--text-primary);
    }

    .btn:active:not(:disabled) {
      background: var(--btn-pressed);
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-icon {
      width: 28px;
      padding: 0;
    }

    /* Primary button (Send): the ONLY filled button in the panel */
    .btn-primary {
      background: var(--ink-fill);
      color: var(--ink-text);
      font-weight: 600;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--ink-fill-hover);
      color: var(--ink-text);
    }

    .btn-primary:active:not(:disabled) {
      background: var(--ink-fill-pressed);
      color: var(--ink-text);
    }

    /* ---------------- PROMPT SURFACE (F1 fixed: hint only while empty, never over text) ---------------- */
    .prompt-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
    }

    .prompt-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 32px;
    }

    .attach-wrapper {
      position: relative;
      display: inline-flex;
      flex-shrink: 0;
    }

    .attach-menu {
      position: absolute;
      top: 32px;
      left: 0;
      z-index: 20;
      background: var(--bg-raised);
      border: 1px solid var(--line-divider);
      border-radius: 8px;
      padding: 4px;
      display: none;
      flex-direction: column;
      min-width: 140px;
    }

    .attach-menu.open {
      display: flex;
    }

    .attach-menu-item {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      height: 32px;
      padding: 0 8px;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: var(--text-primary);
      font: inherit;
      font-size: 13px;
      line-height: 20px;
      text-align: left;
      cursor: pointer;
    }

    .attach-menu-item:hover {
      background: var(--btn-hover);
    }

    .attach-menu-item:active {
      background: var(--btn-pressed);
    }

    .prompt-field-wrap {
      flex: 1;
      min-width: 0;
      min-height: 32px;
      background: var(--bg-raised);
      border-radius: 8px;
      padding: 6px 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .prompt-textarea {
      flex: 1;
      min-width: 0;
      height: 20px;
      min-height: 20px;
      max-height: 80px;
      resize: none;
      border: none;
      background: transparent;
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 13px;
      line-height: 20px;
      border-radius: 4px;
      overflow-y: auto;
      user-select: text;
    }

    .prompt-textarea:focus,
    .prompt-textarea:focus-visible {
      outline: 1.5px solid var(--focus-ring);
      outline-offset: 2px;
    }

    .prompt-textarea::placeholder {
      color: var(--text-muted);
    }

    /* F1: Shown ONLY when field is empty, hidden immediately on any text */
    .enter-action-hint {
      font-size: 12px;
      line-height: 16px;
      color: var(--text-muted);
      white-space: nowrap;
      flex-shrink: 0;
      pointer-events: none;
    }

    .prompt-field-wrap.has-text .enter-action-hint {
      display: none;
    }

    .sample-tag {
      font-size: 12px;
      line-height: 16px;
      color: var(--text-muted);
      white-space: normal;
      word-break: break-word;
    }

    @media (max-width: 465px) {
      .enter-action-hint {
        display: none;
      }
    }

    /* Inline Link attachment or Connect input row */
    .inline-input-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 32px;
    }

    .inline-input-row.hidden {
      display: none;
    }

    .inline-text-input {
      flex: 1;
      min-width: 0;
      height: 32px;
      background: var(--bg-raised);
      border: none;
      border-radius: 8px;
      padding: 0 8px;
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 13px;
      line-height: 20px;
      user-select: text;
    }

    .inline-text-input::placeholder {
      color: var(--text-muted);
    }

    /* Attachment tokens: "photo.png ×" */
    .attachments-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .attachments-list:empty {
      display: none;
    }

    .attachment-token {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      height: 28px;
      padding: 0 8px;
      border-radius: 8px;
      background: var(--bg-raised);
      font-size: 12px;
      line-height: 16px;
      color: var(--text-secondary);
      max-width: 220px;
    }

    .attachment-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .attachment-remove {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      border: none;
      border-radius: 4px;
      background: transparent;
      color: var(--text-muted);
      font-size: 12px;
      line-height: 16px;
      cursor: pointer;
    }

    .attachment-remove:hover {
      background: var(--btn-hover);
      color: var(--text-primary);
    }

    .attachment-remove:active {
      background: var(--btn-pressed);
    }

    /* ---------------- STATE TEXT & COLORS ---------------- */
    .state-text {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      line-height: 16px;
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .state-working { color: var(--state-working); }
    .state-success { color: var(--state-success); }
    .state-warning { color: var(--state-warning); }
    .state-danger  { color: var(--state-danger); }
    .state-neutral { color: var(--text-muted); }

    /* ---------------- CONVERSATION TIMELINE ---------------- */
    .timeline-scroll {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 6px 0;
      overflow-y: auto;
      max-height: 460px;
    }

    .timeline-scroll::-webkit-scrollbar,
    .step-detail-mono::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }

    .timeline-scroll::-webkit-scrollbar-thumb,
    .step-detail-mono::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.14);
      border-radius: 4px;
    }

    .timeline-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 32px;
      width: 100%;
    }

    .timeline-row-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }

    .timeline-fact {
      font-size: 12px;
      line-height: 16px;
      color: var(--text-secondary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .timeline-block {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .section-divider {
      border: none;
      border-top: 1px solid var(--line-divider);
      margin: 0;
    }

    /* Run Header */
    .run-header {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--line-divider);
    }

    .run-title-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
    }

    .run-title {
      font-size: 15px;
      line-height: 20px;
      font-weight: 600;
      color: var(--text-primary);
      min-width: 0;
      flex: 1;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .run-elapsed {
      font-size: 12px;
      line-height: 16px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }

    .run-app-line {
      font-size: 12px;
      line-height: 16px;
      color: var(--text-secondary);
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .live-step-line {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 24px;
      min-width: 0;
      font-size: 12px;
      line-height: 16px;
      color: var(--text-primary);
      opacity: 1;
      transition: opacity var(--dur-enter) ease;
    }

    .live-step-line.is-faded {
      opacity: 0.35;
    }

    .live-step-text {
      min-width: 0;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .digest-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 4px 8px;
      min-height: 28px;
    }

    .digest-metrics {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      line-height: 16px;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
      min-width: 0;
    }

    .act-replay-section {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding-top: 8px;
      border-top: 1px solid var(--line-divider);
    }

    .act-replay-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 28px;
    }

    .act-replay-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
      max-height: 200px;
      overflow-y: auto;
    }

    .act-replay-list::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }

    .act-replay-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.14);
      border-radius: 4px;
    }

    .act-replay-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 28px;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
      line-height: 16px;
      color: var(--text-secondary);
      transition: background-color var(--dur-enter) ease, color var(--dur-enter) ease;
    }

    .act-replay-row.is-replaying {
      background: var(--btn-hover);
      color: var(--text-primary);
    }

    .act-replay-index {
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      min-width: 18px;
      flex-shrink: 0;
    }

    .act-replay-agent {
      font-weight: 600;
      color: var(--text-primary);
      flex-shrink: 0;
    }

    .act-replay-action {
      min-width: 0;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .act-replay-meta {
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }

    .run-outcome-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 28px;
    }

    .run-outcome-copy {
      display: flex;
      align-items: baseline;
      gap: 8px;
      min-width: 0;
      flex: 1;
      flex-wrap: wrap;
    }

    .run-summary-text {
      font-size: 12px;
      line-height: 16px;
      color: var(--text-secondary);
      word-break: break-word;
    }

    .run-evidence-line {
      font-size: 12px;
      line-height: 16px;
      color: var(--text-secondary);
      word-break: break-word;
    }

    .run-outcome-actions {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .run-live-cost {
      font-size: 12px;
      line-height: 16px;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .stop-notice-line {
      font-size: 12px;
      line-height: 16px;
      color: var(--text-secondary);
      padding: 2px 8px;
      word-break: break-word;
    }

    .memory-notice-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 0;
      border-top: 1px solid var(--line-divider);
      min-height: 32px;
    }

    .memory-notice-text {
      font-size: 12px;
      line-height: 16px;
      color: var(--text-secondary);
      min-width: 0;
      flex: 1;
      overflow-wrap: anywhere;
    }

    /* Pending human help request inline inside timeline */
    .help-block {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 8px 0;
      border-bottom: 1px solid var(--line-divider);
    }

    .help-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 32px;
      width: 100%;
    }

    .help-question {
      font-size: 13px;
      line-height: 20px;
      font-weight: 600;
      color: var(--text-primary);
      min-width: 0;
      flex: 1 1 220px;
      word-break: break-word;
    }

    .help-actions {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      max-width: 100%;
    }

    .help-meta {
      font-size: 12px;
      line-height: 16px;
      color: var(--text-muted);
      word-break: break-word;
    }

    .help-warning {
      font-size: 12px;
      line-height: 16px;
      font-weight: 600;
      color: var(--state-warning);
      word-break: break-word;
    }

    .help-countdown {
      font-size: 12px;
      line-height: 16px;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
    }

    .help-block.is-expired .help-question {
      color: var(--text-secondary);
    }

    /* Steps list: flat rows separated by whitespace, no cards */
    .steps-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .step-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
      border-radius: 8px;
    }

    .step-row-line {
      display: flex;
      align-items: center;
      gap: 4px;
      width: 100%;
    }

    .step-row-btn {
      flex: 1;
      min-width: 0;
      min-height: 32px;
      padding: 4px 8px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 13px;
      line-height: 20px;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .step-row-btn:hover {
      background: var(--btn-hover);
    }

    .step-row-btn:active {
      background: var(--btn-pressed);
    }

    .step-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }

    .step-actor {
      font-size: 13px;
      line-height: 20px;
      font-weight: 600;
      color: var(--text-primary);
      flex-shrink: 0;
    }

    /* A3: Agent identity chip — sea-glass via ui/shared/agent-glass.js, plain capsule fallback */
    .agent-chip {
      position: relative;
      isolation: isolate;
      overflow: visible;
      background: var(--chip-bg, #cfd4d9);
      border: 1px solid var(--chip-edge, #e0e3e6);
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 64px;
      height: 24px;
      padding: 0 10px;
      font-size: 12px;
      line-height: 16px;
      font-weight: 600;
      color: var(--chip-ink, #323b43);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .agent-chip.has-glass {
      background: transparent;
      border-color: transparent;
      border-radius: 0;
      color: var(--glass-ink, var(--chip-ink, #323b43));
    }

    .agent-chip-label {
      position: relative;
      z-index: 1;
    }

    .step-event-text {
      font-size: 12px;
      line-height: 16px;
      color: var(--text-secondary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }

    /* Expandable report / log detail */
    .step-detail-mono {
      padding: 8px 12px;
      border-radius: 8px;
      background: var(--bg-raised);
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 18px;
      color: var(--text-secondary);
      max-height: 180px;
      overflow-y: auto;
      user-select: text;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* Past runs inside timeline */
    .past-runs-section {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding-top: 8px;
      border-top: 1px solid var(--line-divider);
    }

    .section-heading {
      font-size: 12px;
      line-height: 16px;
      font-weight: 600;
      color: var(--text-muted);
      padding: 0 8px;
    }

    .past-run-btn {
      width: 100%;
      min-height: 32px;
      padding: 0 8px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--text-secondary);
      font-family: var(--font-sans);
      font-size: 13px;
      line-height: 20px;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .past-run-btn:hover {
      background: var(--btn-hover);
      color: var(--text-primary);
    }

    .past-run-btn:active {
      background: var(--btn-pressed);
    }

    .past-run-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1;
      overflow: hidden;
    }

    .past-run-instr {
      font-size: 13px;
      line-height: 20px;
      color: var(--text-primary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ---------------- SKELETON SHIMMER & HIGHLIGHT FADE ---------------- */
    @keyframes shimmerMove {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .skeleton-line {
      height: 16px;
      border-radius: 4px;
      background: linear-gradient(
        90deg,
        rgba(255, 255, 255, 0.04) 25%,
        rgba(255, 255, 255, 0.11) 50%,
        rgba(255, 255, 255, 0.04) 75%
      );
      background-size: 200% 100%;
      animation: shimmerMove 1.4s linear infinite;
    }

    @keyframes highlightFade {
      0% { background-color: rgba(255, 255, 255, 0.09); }
      100% { background-color: transparent; }
    }

    .changed-highlight {
      animation: highlightFade 600ms ease-out forwards;
    }

    @keyframes heroStepEnter {
      0% {
        opacity: 0;
        transform: translateY(-4px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .step-enter {
      animation: heroStepEnter var(--dur-enter) var(--ease-out) forwards;
    }

    @media (prefers-reduced-motion: reduce) {
      .notch-shell {
        transition: opacity 120ms ease !important;
      }
      .step-enter {
        animation: highlightFade 120ms ease-out forwards !important;
      }
      .skeleton-line {
        animation: none !important;
        background: rgba(255, 255, 255, 0.07) !important;
      }
    }

    /* ---------------- FILE SEARCH, SIDE VIEWS (analytics, settings) ---------------- */
    .file-search { display: flex; flex-direction: column; gap: 4px; }
    .file-search.hidden, .side-view.hidden, .timeline-scroll.hidden { display: none; }
    .file-search-results { display: flex; flex-direction: column; max-height: 200px; overflow-y: auto; }
    .file-hit { display: flex; flex-direction: column; align-items: flex-start; }
    .file-hit-where { font-size: 12px; line-height: 16px; color: var(--text-muted); }
    .panel-footer { display: flex; gap: 4px; padding-top: 4px; border-top: 1px solid var(--line-divider); }
    .side-view { display: flex; flex-direction: column; gap: 12px; }
    .side-head { display: flex; align-items: center; justify-content: space-between; }
    .side-title { font-size: 13px; font-weight: 600; color: var(--text-primary); }
    .kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; font-size: 13px; }
    .kv dt { color: var(--text-muted); }
    .kv dd { color: var(--text-primary); font-variant-numeric: tabular-nums; }
    .settings-form { display: flex; flex-direction: column; gap: 10px; }
    .settings-form label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--text-secondary); }
    .settings-actions { display: flex; align-items: center; gap: 8px; }

    /* ---------------- CHAT WINDOW (?shell=chat) and NOTIFICATIONS (?shell=notes) ---------------- */
    body[data-mode="chat"] .notch-shell, body[data-mode="notes"] .notch-shell { display: none; }
    body[data-mode="chat"], body[data-mode="notes"] { background: transparent; user-select: text; }
    .chat { height: 100vh; display: flex; flex-direction: column; background: var(--bg-app); border-radius: 14px;
            border: 1px solid var(--line-divider); overflow: hidden; }
    .chat-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line-divider); }
    .chat-title { flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chat-log { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    .msg, .msg-step, .note > span { overflow-wrap: anywhere; min-width: 0; }
    .msg-who { font-weight: 600; margin-right: 6px; }
    .msg-step { font-size: 12px; line-height: 16px; color: var(--text-muted); }
    .msg-step .msg-who { font-weight: 500; }
    .chat-reply { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line-divider); }
    .notes { display: flex; flex-direction: column; gap: 8px; padding: 2px; width: 100%; overflow-x: clip; }
    .note { background: var(--bg-app); border: 1px solid var(--line-divider); border-radius: 12px; padding: 10px 12px;
            display: flex; flex-direction: column; gap: 6px; }
    .note-title { font-size: 12px; line-height: 16px; font-weight: 600; }
    .note-detail { font-family: var(--font-mono); font-size: 12px; line-height: 16px; color: var(--text-secondary); white-space: pre-wrap;
                   max-height: 96px; overflow-y: auto; }
    .note-actions { display: flex; gap: 4px; justify-content: flex-end; }

    /* ---------------- ON-DEVICE VOICE (STT mic + AVSpeechSynthesizer) ---------------- */
    .btn-icon.hidden { display: none; }
    .btn-icon.is-listening {
      background: var(--btn-hover);
      color: var(--state-danger);
    }
    .voice-status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 8px;
      border-radius: 8px;
      background: var(--bg-raised);
      font-size: 12px;
      line-height: 16px;
      color: var(--text-secondary);
    }
    .voice-status-bar.hidden { display: none; }
    .voice-status-main {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
      flex: 1;
      overflow-wrap: anywhere;
    }
    .voice-status-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
  </style>
</head>
