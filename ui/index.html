            buttonText: "Open Microphone settings",
            message: "Microphone permission needed for audio input.",
            pattern: /\bmicrophone\b/i,
          },
          {
            key: "speech",
            label: "Speech Recognition",
            pane: "speechRecognition",
            buttonText: "Open Speech settings",
            message: "Speech Recognition permission needed for dictation.",
            pattern: /(speech\s*recognition|sfspeech)/i,
          },
          {
            key: "files",
            label: "Full Disk Access",
            pane: "",
            buttonText: "",
            message: "Full Disk Access permission may be needed for this file.",
            pattern: /(full disk access|operation not permitted)/i,
          },
        ];

        function detectPermissionIssue(parent, allRunsInGroup, detailsById, state) {
          if (state === "verified") return null;
          const texts = [];
          if (parent.result?.error) texts.push(String(parent.result.error));
          if (parent.result?.summary && state === "failed") texts.push(String(parent.result.summary));
          for (const r of allRunsInGroup) {
            const evs = Array.isArray(detailsById[r.id]?.events) ? detailsById[r.id].events : [];
            for (const ev of [...evs].reverse()) {
              if (!ev) continue;
              if (ev.kind === "error" || ev.kind === "warn") {
                if (ev.error) texts.push(String(ev.error));
                if (ev.msg) texts.push(String(ev.msg));
                if (ev.permission) texts.push(String(ev.permission));
              }
            }
          }
          const combined = texts.join("\n");
          if (!combined) return null;
          for (const rule of PERMISSION_RULES) {
            if (rule.pattern.test(combined)) {
              const pane = ALLOWED_SETTINGS_PANES.has(rule.pane) ? rule.pane : "";
              return {
                key: rule.key,
                label: rule.label,
                pane,
                buttonText: pane ? rule.buttonText : "",
                message: rule.message,
              };
            }
          }
          return null;
        }

        function formatBriefText(brief) {
          if (!brief || typeof brief !== "object") return String(brief || "");
          const lines = [];
          if (brief.headline || brief.tagline) lines.push(String(brief.headline || brief.tagline));
          if (brief.summary) lines.push(String(brief.summary));
          if (Array.isArray(brief.audience)) lines.push(`Audience: ${brief.audience.join(", ")}`);
          if (Array.isArray(brief.highlights) || Array.isArray(brief.points)) {
            const pts = brief.highlights || brief.points;
            pts.forEach((p) => lines.push(`- ${typeof p === "string" ? p : JSON.stringify(p)}`));
          }
          return lines.length ? lines.join("\n") : JSON.stringify(brief, null, 2);
        }

        function basenameOfPath(p) {
          const clean = String(p || "").trim();
          if (!clean) return "";
          const parts = clean.split(/[\\/]/).filter(Boolean);
          return parts[parts.length - 1] || clean;
        }

        function extractProducedOutputs(parent, allRunsInGroup, detailsById) {
          const outputs = [];
          const seenKeys = new Set();
          const addOutput = (item) => {
            const k = `${item.kind}:${item.title}:${item.openPath || ""}:${item.openUrl || ""}`;
            if (seenKeys.has(k)) return;
            seenKeys.add(k);
            outputs.push({ id: `out-${outputs.length + 1}`, ...item });
          };

          for (const r of allRunsInGroup) {
            const evs = Array.isArray(detailsById[r.id]?.events) ? detailsById[r.id].events : [];
            evs.forEach((ev) => {
              if (!ev) return;
              if (ev.kind === "patch" && (ev.diff || ev.path || ev.file)) {
                const filePath = ev.path || ev.file || "";
                const title = filePath ? `Patch: ${basenameOfPath(filePath)}` : "Code patch";
                const text = String(ev.diff || filePath || "").trim();
                if (text) {
                  addOutput({
                    kind: "patch",
                    title,
                    copyText: text,
                    previewText: String(ev.diff || "").trim(),
                    openPath: filePath,
                    openUrl: "",
                  });
                }
              } else if (ev.kind === "artifact") {
                const filePath = String(ev.path || ev.file || "").trim();
                const openUrl = String(ev.url || "").trim();
                const rawBrief = ev.brief && typeof ev.brief === "object" ? ev.brief : null;
                const text = String(
                  ev.text || ev.content || (rawBrief ? formatBriefText(rawBrief) : "") || ev.tagline || filePath || openUrl
                ).trim();
                const title = ev.tagline
                  ? `Brief: ${String(ev.tagline).trim()}`
                  : filePath
                  ? `File: ${basenameOfPath(filePath)}`
                  : "Produced output";
                if (text || openUrl || filePath) {
                  addOutput({
                    kind: rawBrief || ev.tagline ? "brief" : "file",
                    title,
                    copyText: text || filePath || openUrl,
                    previewText: rawBrief ? formatBriefText(rawBrief) : String(ev.text || ev.content || "").trim(),
                    openPath: filePath,
                    openUrl,
                  });
                }
              } else if (ev.kind === "commit" && ev.ok) {
                const sha = String(ev.sha || ev.hash || "").trim();
                const msg = String(ev.message || "").trim();
                const text = [sha, msg].filter(Boolean).join(" · ");
                if (text) {
                  addOutput({
                    kind: "commit",
                    title: msg ? `Commit: ${msg}` : `Commit ${sha.slice(0, 7)}`,
                    copyText: sha || msg,
                    previewText: text,
                    openPath: "",
                    openUrl: "",
                  });
                }
              }
            });
          }

          if (parent.result?.brief) {
            const text = formatBriefText(parent.result.brief);
            if (text) {
              addOutput({
                kind: "brief",
                title: parent.result.brief.headline || parent.result.brief.tagline || "Marketing brief",
                copyText: text,
                previewText: text,
                openPath: String(parent.result.brief.path || "").trim(),
                openUrl: String(parent.result.brief.url || "").trim(),
              });
            }
          }
          if (Array.isArray(parent.result?.files)) {
            parent.result.files.forEach((f) => {
              const p = typeof f === "string" ? f : f?.path || "";
              if (!p) return;
              addOutput({
                kind: "file",
                title: `File: ${basenameOfPath(p)}`,
                copyText: p,
                previewText: "",
                openPath: p,
                openUrl: typeof f === "object" && f?.url ? String(f.url) : "",
              });
            });
          }
          return outputs;
        }

        function normalizeTranscriptRows(rawRows, allowedParentId, rootParentByRunId) {
          if (!Array.isArray(rawRows)) return [];
          return rawRows
            .filter((row) => {
              if (!row) return false;
              const isUserRow = row.role === "user" || row.kind === "prompt" || row.msg_kind === "prompt";
              if (
                allowedParentId &&
                rootParentByRunId instanceof Map &&
                row.run &&
                rootParentByRunId.has(row.run) &&
                rootParentByRunId.get(row.run) !== allowedParentId
              ) {
                return false;
              }
              if (
                row.role === "step" ||
                row.kind === "decide" ||
                row.kind === "ask" ||
                row.kind === "answer" ||
                row.msg_kind === "thought" ||
                row.msg_kind === "ask" ||
                row.msg_kind === "answer"
              ) {
                return false;
              }
              if (!isUserRow && isAgentActionLine(row.text, row.kind, row.msg_kind)) {
                return false;
              }
              return Boolean(String(row.text || "").trim());
            })
            .map((row, idx) => {
              const role = row.role === "user" ? "user" : "agent";
              const rawName = role === "user" ? "You" : String(row.agent || row.role || "Agent").trim();
              const resolved = role === "agent" ? resolvePrimaryAgentDisplay(rawName, row.color || row.body) : null;
              return {
                id: String(row.id || `msg-${idx}`),
                ts: row.ts != null ? Number(row.ts) : row.t != null ? Number(row.t) : null,
                run: row.run ? String(row.run) : "",
                msgKind: row.msg_kind ? String(row.msg_kind) : "",
                role,
                who: resolved ? resolved.name : rawName,
                text: String(row.text || "").trim(),
                color: resolved?.color || row.color || row.body || "",
                edge: row.edge || "",
              };
            });
        }

        function buildCopyResultText({ stateSymbolWord, stateFact, speakText, evidenceText, outputs }) {
          const parts = [];
          if (stateSymbolWord) {
            parts.push(stateFact ? `${stateSymbolWord} · ${stateFact}` : stateSymbolWord);
          } else if (stateFact) {
            parts.push(stateFact);
          }
          if (speakText && speakText !== stateFact && speakText !== evidenceText) {
            parts.push(speakText);
          }
          if (evidenceText) {
            parts.push(`Verified on screen: ${evidenceText}`);
          }
          if (!parts.length && Array.isArray(outputs) && outputs.length) {
            parts.push(outputs[0].copyText);
          }
          return parts.join("\n").trim();
        }

        function extractSpeakText(allRunsInGroup, detailsById) {
          let latestMsg = "";
          for (const r of allRunsInGroup) {
            const detail = detailsById[r.id];
            const evs = Array.isArray(detail?.events) ? detail.events : [];
            const speak = [...evs]
              .reverse()
              .find(
                (e) =>
                  e.kind === "speak" &&
                  (e.text || e.msg || e.message) &&
                  !isAgentActionLine(e.text || e.msg || e.message, e.kind, e.msg_kind)
              );
            if (speak) {
              const txt = String(speak.text || speak.msg || speak.message).trim();
              if (txt) return txt;
            }
            if (!latestMsg) {
              const msg = [...evs]
                .reverse()
                .find(
                  (e) =>
                    e.kind === "msg" &&
                    (e.role === "assistant" || e.msg_kind === "result" || e.msg_kind === "plan") &&
                    e.msg_kind !== "step" &&
                    e.text &&
                    !isAgentActionLine(e.text, e.kind, e.msg_kind)
                );
              if (msg) {
                latestMsg = String(msg.text).trim();
              }
            }
          }
          return latestMsg;
        }

        function hasMockVerifyEvidence(allRunsInGroup, detailsById) {
          for (const r of allRunsInGroup) {
            const evs = Array.isArray(detailsById[r.id]?.events) ? detailsById[r.id].events : [];
            if (evs.some((e) => e?.kind === "verify" && e.achieved === true && /^mock$/i.test(String(e.evidence || "").trim()))) {
              return true;
            }
          }
          return false;
        }

        function isMockSummaryText(value) {
          return /^mock$/i.test(String(value || "").trim());
        }

        function isMockRunGroup(allRunsInGroup, detailsById, costData, isSampleContext) {
          if (isSampleContext) return true;
          if (hasMockVerifyEvidence(allRunsInGroup, detailsById)) return true;
          if (costData && costData.mock === true) return true;
          for (const r of allRunsInGroup) {
            if (r?.result?.digest?.task_cost?.mock === true) return true;
            if (isMockSummaryText(r?.result?.summary) || isMockSummaryText(r?.result?.digest?.summary)) {
              return true;
            }
          }
          return false;
        }

        function hasVerifyPass(allRunsInGroup, detailsById) {
          let seenVerify = false;
          for (const r of allRunsInGroup) {
            const detail = detailsById[r.id];
            const evs = Array.isArray(detail?.events) ? detail.events : [];
            for (let i = evs.length - 1; i >= 0; i--) {
              if (evs[i]?.kind === "verify") {
                seenVerify = true;
                if (evs[i].achieved === true) return { seenVerify: true, passed: true };
                if (evs[i].achieved === false) return { seenVerify: true, passed: false };
              }
            }
          }
          return { seenVerify, passed: false };
        }

        function cleanFailureFact(rawSummary) {
          const text = pluralizeUnits(String(rawSummary || "").trim());
          if (!text) return "Stopped before finishing";
          const withoutRepo = text.replace(/^QA\s+\S+:\s*/i, "");
          const cleaned = withoutRepo
            .replace(/^failed(?:\s*[:·-]\s*|\s+to\s+)/i, (m) => (/to\s+/i.test(m) ? "Could not " : ""))
            .replace(/\bfailed\b/gi, "did not finish")
            .replace(/^\s*[✕✗]+\s*/g, "")
            .trim();
          return sentenceCase(cleaned || "Stopped before finishing");
        }

        function classifyStoppedOutcome(rawSummary, events) {
          const rawStr = String(rawSummary || "").trim();
          const evList = Array.isArray(events) ? events : [];
          const helpAnswers = evList.filter((e) => e && e.kind === "help_answer");
          const isGenericStopText = /^$|^stopped\b|^did not finish|^cancelled\b|^canceled\b|^denied\b/i.test(rawStr);
          const timedOutEv = helpAnswers.some((e) => e.timed_out === true);
          if (/timed?\s*out|no answer received within|approval expired/i.test(rawStr) || (isGenericStopText && timedOutEv)) {
            return { kind: "user_timeout", label: "Timed out waiting for you" };
          }
          const deniedEv = helpAnswers.some(
            (e) =>
              e.timed_out !== true &&
              /^(no|deny|denied|decline|declined|reject|rejected|cancel)$/i.test(String(e.answer || "").trim())
          );
          if (/\byou said no\b|denied by user|^stopped\s*:\s*denied/i.test(rawStr) || (isGenericStopText && deniedEv)) {
            return { kind: "user_denied", label: "You said no" };
          }
          if (/declined.*question|clarify.*declined/i.test(rawStr)) {
            return { kind: "user_declined", label: "Cancelled by you" };
          }
          if (/cancelled|canceled|declined by user/i.test(rawStr)) {
            return { kind: "user_cancelled", label: "Cancelled by you" };
          }
          if (/^stopped(\s+by\s+(user|you))?(?:\s*·\s*nothing was changed\.?)?$|^user stopped/i.test(rawStr)) {
            return { kind: "user_stopped", label: "Stopped by you" };
          }
          const cleaned = cleanFailureFact(rawStr);
          if (
            !cleaned ||
            /^stopped before finishing$/i.test(cleaned) ||
            /^did not finish run$/i.test(cleaned) ||
            /^run did not finish$/i.test(cleaned)
          ) {
            return { kind: "real_failure", label: "Stopped before finishing" };
          }
          const firstSentence = (cleaned.split(/(?<=[.!?])\s+/)[0] || cleaned).replace(/[.]+$/, "").trim();
          if (firstSentence.length <= 56) {
            return { kind: "real_failure", label: sentenceCase(firstSentence) };
          }
          const cut = firstSentence.slice(0, 55);
          const sp = cut.lastIndexOf(" ");
          return {
            kind: "real_failure",
            label: sentenceCase((sp > 20 ? cut.slice(0, sp) : cut).trim()),
          };
        }

        function deriveStoppedLabel(rawSummary, events) {
          return classifyStoppedOutcome(rawSummary, events).label;
        }

        function formatShortClock(ts) {
          const num = Number(ts);
          if (!Number.isFinite(num) || num < 1000000000) return "";
          try {
            return new Date(num * 1000).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
          } catch {
            return "";
          }
        }

        function buildWorkStepsForRun(childRun, detail, appName, groupTranscriptRows, stepRunIdSet, includeUnmatchedTranscriptSteps) {
          const events = Array.isArray(detail?.events) ? detail.events : [];
          const actEvents = events.filter((ev) => ev && ev.kind === "act");
          const lines = [];
          const isAllowedWorkLine = (line) => {
            const clean = String(line || "").trim();
            if (!clean) return false;
            if (/\[|->|:[0-9a-f]{8,}|running:|invalid-target/i.test(clean)) return false;
            if (/^(?:Working|Finished|Stopped|Done|Replaying a saved skill|Sample run check \(not verified\))$/i.test(clean)) return false;
            return true;
          };

          if (actEvents.length > 0) {
            const seenActKeys = new Set();
            actEvents.forEach((ev, idx) => {
              const stepKey = ev.step != null ? `step:${ev.step}` : `idx:${idx}`;
              if (seenActKeys.has(stepKey)) return;
              seenActKeys.add(stepKey);
              const plain = ev.action ? sentenceCase(summarizeActPlain(ev)) : "";
              if (isAllowedWorkLine(plain)) {
                lines.push(plain.trim());
              }
            });
            return {
              lines,
              stepCount: lines.length,
            };
          }

          const seenStepKeys = new Set();
          const pushFallbackLine = (line, stepKey) => {
            const clean = String(line || "").trim();
            if (!isAllowedWorkLine(clean)) return;
            if (stepKey != null && seenStepKeys.has(stepKey)) return;
            if (lines.length && lines[lines.length - 1].toLowerCase() === clean.toLowerCase()) return;
            if (stepKey != null) seenStepKeys.add(stepKey);
            lines.push(clean);
          };

          for (const ev of events) {
            if (!ev) continue;
            if (
              ev.kind === "decide" ||
              ev.kind === "state" ||
              ev.kind === "llm" ||
              ev.kind === "speak" ||
              ev.kind === "route" ||
              ev.kind === "graph" ||
              ev.kind === "memory" ||
              ev.kind === "app_ready" ||
              ev.kind === "verify" ||
              ev.kind === "result"
            ) {
              continue;
            }
            const isActionMsg =
              ev.kind === "msg" &&
              (ev.msg_kind === "step" || (ev.role !== "user" && isAgentActionLine(ev.text, ev.kind, ev.msg_kind)));
            if (ev.kind === "msg" && !isActionMsg) continue;
            if (isActionMsg) {
              const plain = formatActionTextPlain(ev.text, ev.action);
              pushFallbackLine(plain, ev.step != null ? `step:${ev.step}` : null);
            } else if (ev.kind === "tests" || ev.kind === "ui_check" || ev.kind === "bug_report" || ev.kind === "patch" || ev.kind === "commit") {
              pushFallbackLine(summarizeEventPlain(ev), null);
            }
          }

          const tRows = Array.isArray(groupTranscriptRows) ? groupTranscriptRows : [];
          for (const row of tRows) {
            if (!row) continue;
            const isUserRow = row.role === "user" || row.kind === "prompt" || row.msg_kind === "prompt";
            if (isUserRow) continue;
            if (!isAgentActionLine(row.text, row.kind, row.msg_kind)) continue;
            const belongsToChild =
              row.run === childRun.id ||
              (includeUnmatchedTranscriptSteps && (!row.run || !(stepRunIdSet instanceof Set) || !stepRunIdSet.has(row.run)));
            if (!belongsToChild) continue;
            const plain = formatActionTextPlain(row.text, row.action);
            const rowStepKey = row.meta && row.meta.step != null ? `step:${row.meta.step}` : null;
            pushFallbackLine(plain, rowStepKey);
          }

          return {
            lines,
            stepCount: lines.length || Number(childRun?.result?.steps) || 0,
          };
        }

        function formatApprovalAnswerPrefix(rawAns, timedOut) {
          if (timedOut) return "Timed out waiting for you";
          const ans = String(rawAns || "").trim();
          if (/^(no|deny|denied|decline|declined|reject|rejected|cancel|cancelled|canceled)$/i.test(ans)) {
            return "You said no";
          }
          if (/^(yes|approve|approved|allow|allowed|ok|continue)$/i.test(ans)) {
            return "You approved";
          }
          if (/^(done|completed|finished|confirm|confirmed)$/i.test(ans)) {
            return "Done";
          }
          return ans ? sentenceCase(ans) : "Answered";
        }

        function buildApprovalHistoryForGroup(groupRuns, detailsById, rawTranscriptRows) {
          const asksById = new Map();
          const answeredIds = new Set();
          const history = [];
          const tRows = Array.isArray(rawTranscriptRows) ? rawTranscriptRows : [];
          for (const row of tRows) {
            if (!row) continue;
            if ((row.kind === "ask" || row.msg_kind === "ask") && row.id && row.text) {
              asksById.set(String(row.id), formatApprovalQuestionPlain(row.text));
            }
          }
          for (const r of groupRuns) {
            const evs = Array.isArray(detailsById[r.id]?.events) ? detailsById[r.id].events : [];
            for (const ev of evs) {
              if (!ev) continue;
              if (ev.kind === "help" && ev.id) {
                asksById.set(
                  String(ev.id),
                  ev.question ? formatApprovalQuestionPlain(ev.question) : "Approval needed"
                );
              } else if (ev.kind === "help_answer") {
                const evId = ev.id ? String(ev.id) : "";
                if (evId) answeredIds.add(evId);
                const question =
                  (evId && asksById.get(evId)) ||
                  (ev.question ? formatApprovalQuestionPlain(ev.question) : "Approval requested");
                const prefix = formatApprovalAnswerPrefix(ev.answer, ev.timed_out);
                const clockText = formatShortClock(ev.ts || ev.t);
                history.push({
                  id: evId || `ans-${history.length}`,
                  question,
                  choiceText: prefix,
                  clockText,
                  lineText: `${prefix}: ${question}${clockText ? ` · ${clockText}` : ""}`,
                });
              }
            }
          }
          const unmatchedEventMatches = history.map((h) => ({ id: h.id, choiceText: h.choiceText }));
          for (const row of tRows) {
            if (!row || (row.kind !== "answer" && row.msg_kind !== "answer")) continue;
            const rowId = row.help_id ? String(row.help_id) : "";
            if (rowId && answeredIds.has(rowId)) continue;
            const prefix = formatApprovalAnswerPrefix(row.text || row.answer, row.timed_out);
            const matchIdx = unmatchedEventMatches.findIndex((m) => m.choiceText === prefix);
            if (matchIdx !== -1) {
              unmatchedEventMatches.splice(matchIdx, 1);
              continue;
            }
            const question =
              (rowId && asksById.get(rowId)) ||
              (row.question ? formatApprovalQuestionPlain(row.question) : "Approval requested");
            const clockText = formatShortClock(row.ts || row.t);
            history.push({
              id: rowId || String(row.id || `ans-${history.length}`),
              question,
              choiceText: prefix,
              clockText,
              lineText: `${prefix}: ${question}${clockText ? ` · ${clockText}` : ""}`,
            });
          }
          return history;
        }

        function buildPillFact(cleanText, isVerified) {
          const text = String(cleanText || "").trim();
          if (!text) return "";
          if (isVerified) {
            const loopMatch = text.match(/(\d+\s+rounds?),?\s*(\d+\s+patch(?:es)?)/i);
            if (loopMatch) {
              return `${loopMatch[1]}, ${loopMatch[2]}`;
            }
          }
          if (text.length <= 24) return text;
          const cut = text.slice(0, 23);
          const lastSpace = cut.lastIndexOf(" ");
          return (lastSpace > 8 ? cut.slice(0, lastSpace) : cut).trim();
        }

        function mapStep(
          childRun,
          detail,
          pendingHelpForChild,
          agentsMap,
          fallbackIndex,
          isMockContext,
          rememberedMap,
          parentRouteEvent,
          transcriptsById,
          primaryAgentPref,
          groupAgentCount,
          groupTranscriptRows,
          stepRunIdSet,
          includeUnmatchedTranscriptSteps
        ) {
          const events = Array.isArray(detail?.events) ? detail.events : [];
          const actorLabel = actorLabelForRole(childRun.role, fallbackIndex, groupAgentCount);
          const agentIdentity = resolveAgentIdentity(
            childRun,
            agentsMap,
            fallbackIndex,
            rememberedMap,
            events,
            parentRouteEvent,
            transcriptsById,
            primaryAgentPref,
            groupAgentCount
          );
          const app = extractRunApp(childRun, events, parentRouteEvent);
          const unappliedPatch = [...events].reverse().find((e) => e.kind === "patch" && e.applied === false);
          const verifiedEvent = [...events].reverse().find((e) => e.kind === "verify" && e.achieved);
          const isMockStep = Boolean(
            isMockContext ||
              hasMockVerifyEvidence([childRun], { [childRun.id]: detail }) ||
              isMockSummaryText(childRun.result?.summary)
          );

          let stateSymbolWord = "▶ Running";
          let stateColorClass = "state-working";
          let isWorking = false;

          if (pendingHelpForChild.length || childRun.state === "awaiting_human") {
            stateSymbolWord = "◔ Needs approval";
            stateColorClass = "state-warning";
          } else if (childRun.state === "queued" || childRun.state === "planning") {
            stateSymbolWord = "▶ Running";
            stateColorClass = "state-working";
            isWorking = true;
          } else if (childRun.state === "acting") {
            stateSymbolWord = "▶ Running";
            stateColorClass = "state-working";
            isWorking = true;
          } else if (childRun.state === "done" && childRun.result?.ok === true) {
            if (isMockStep) {
              stateSymbolWord = "Finished · sample run, not verified";
              stateColorClass = "state-neutral";
            } else {
              stateSymbolWord = "✓ Verified";
              stateColorClass = "state-success";
            }
          } else if (childRun.state === "failed" || childRun.result?.ok === false) {
            stateSymbolWord = deriveStoppedLabel(childRun.result?.summary || "", events);
            stateColorClass = "state-neutral";
          } else {
            stateSymbolWord = "◔ Finished, not verified";
            stateColorClass = "state-warning";
          }

          /* Latest meaningful event in plain words */
          let latestSummary = "";
          let latestSummaryIsAction = false;
          if (unappliedPatch && (childRun.state === "failed" || childRun.role === "dev")) {
            latestSummary = summarizeEventPlain(unappliedPatch);
          } else {
            for (let i = events.length - 1; i >= 0; i--) {
              const ev = events[i];
              let candidate = "";
              if (ev?.kind === "verify" && ev.achieved) {
                const rawEv = String(ev.evidence || "").trim();
                if (!/^mock$/i.test(rawEv)) {
                  const plainEv = formatEvidencePlain(rawEv, app, childRun.result?.summary || "");
                  candidate = plainEv ? `Verified: ${plainEv}` : "Verified goal on screen";
                }
              } else {
                candidate = summarizeEventPlain(ev);
              }
              if (candidate && candidate !== "Finished" && candidate !== "Stopped" && candidate !== "Working") {
                latestSummary = candidate;
                latestSummaryIsAction = Boolean(
                  ev?.kind === "act" ||
                    ev?.kind === "graph" ||
                    ev?.msg_kind === "step" ||
                    (ev?.kind === "msg" && ev.role !== "user" && isAgentActionLine(ev.text, ev.kind, ev.msg_kind))
                );
                break;
              }
            }
          }
          if (!latestSummary) {
            if (verifiedEvent?.evidence && !isMockSummaryText(verifiedEvent.evidence)) {
              const plainEv = formatEvidencePlain(verifiedEvent.evidence, app, childRun.result?.summary || "");
              latestSummary = plainEv ? `Verified: ${plainEv}` : "Verified goal on screen";
            } else if (childRun.result?.summary && !isMockSummaryText(childRun.result.summary)) {
              const plainSummary = cleanPlainSummary(childRun.result.summary, app, "");
              if (plainSummary) latestSummary = cleanFailureFact(plainSummary);
            } else if (isWorking) {
              latestSummary = "Working…";
            }
          }

          const detailLines = formatStepDetails(childRun, events, app);
          const workData = buildWorkStepsForRun(
            childRun,
            detail,
            app,
            groupTranscriptRows,
            stepRunIdSet,
            includeUnmatchedTranscriptSteps
          );

          return {
            id: childRun.id,
            role: childRun.role ? String(childRun.role) : "",
            isOrchestrator: !childRun.role || String(childRun.role).toLowerCase() === "orchestrator",
            goal: childRun.goal ? String(childRun.goal) : "",
            elapsedText: formatSeconds(childRun.elapsed),
            app,
            actorLabel,
            agentIdentity,
            stateSymbolWord,
            stateColorClass,
            latestSummary,
            latestSummaryIsAction,
            detailLines,
            workSteps: workData.lines,
            workStepCount: workData.stepCount,
            hasDetails: detailLines.length > 0 || isWorking,
            isWorking,
          };
        }

        function buildLiveStepForSingleRun(parent, r, detailsById, stepById) {
          if (!r) return null;
          const evs = Array.isArray(detailsById[r.id]?.events) ? detailsById[r.id].events : [];
          let latestIdx = -1;
          for (let i = evs.length - 1; i >= 0; i--) {
            if (evs[i]?.kind === "act" || evs[i]?.kind === "decide") {
              latestIdx = i;
              break;
            }
          }
          if (latestIdx === -1) return null;
          const latestEv = evs[latestIdx];
          const tVal = Number(latestEv.t) || 0;
          const isRunActive =
            r.state === "acting" ||
            r.state === "planning" ||
            r.state === "queued" ||
            r.state === "awaiting_human";

          const stepInfo = stepById.get(r.id);
          const agentName = stepInfo?.agentIdentity?.name || actorLabelForRole(r.role);
          const agentColor = stepInfo?.agentIdentity?.color || NEUTRAL_AGENT_COLOR;
          const agentEdge = stepInfo?.agentIdentity?.palette?.edge || "#E0E3E6";
          const app = stepInfo?.app || "";

          let phrase = "";
          if (latestEv.kind === "act") {
            let prevAct = null;
            for (let j = latestIdx - 1; j >= 0; j--) {
              if (evs[j]?.kind === "act") {
                prevAct = evs[j];
                break;
              }
            }
            const curParts = parseActionParts(latestEv.action);
            const prevParts = prevAct ? parseActionParts(prevAct.action) : null;
            if (
              prevParts &&
              curParts.verb &&
              prevParts.verb === curParts.verb &&
              curParts.target &&
              prevParts.target &&
              curParts.target.length <= 16 &&
              prevParts.target.length <= 16
            ) {
              const verbWord =
                curParts.verb === "click"
                  ? "clicked"
                  : curParts.verb === "double_click"
                  ? "double-clicked"
                  : curParts.verb === "press"
                  ? "pressed"
                  : "";
              if (verbWord) {
                phrase = `${verbWord} ${prevParts.target}, then ${curParts.target}`;
              }
            }
            if (!phrase) {
              phrase = summarizeActPlain(latestEv);
            }
          } else {
            phrase = summarizeDecidePlain(latestEv);
          }

          const prefix = app ? `${agentName} in ${app}` : agentName;
          const localText = app ? `In ${app}: ${phrase}` : sentenceCase(phrase);
          return {
            key: `${parent.id}:${r.id}`,
            runId: r.id,
            fingerprint: `${r.id}:${evs.length}:${latestEv.t}:${latestEv.kind}:${latestEv.action || ""}:${latestEv.thought || ""}`,
            agentName,
            agentColor,
            agentEdge,
            app,
            phrase,
            localText,
            text: `${prefix}: ${phrase}`,
            tVal,
            isRunActive,
          };
        }

        function buildLiveStepForRun(parent, runsForStep, detailsById, stepById) {
          let best = null;
          for (let rIdx = 0; rIdx < runsForStep.length; rIdx++) {
            const entry = buildLiveStepForSingleRun(parent, runsForStep[rIdx], detailsById, stepById);
            if (!entry) continue;
            if (!best || (entry.isRunActive && !best.isRunActive) || (entry.isRunActive === best.isRunActive && entry.tVal >= best.tVal)) {
              best = entry;
            }
          }
          return best;
        }

        function buildDigestForRun(parent, rawChildren, detailsById, stepById, costData) {
          const rawDigest = parent.result?.digest || null;
          const childRuns = rawChildren.length ? rawChildren : [parent];
          const actEvents = [];
          let seq = 0;

          for (const r of childRuns) {
            const evs = Array.isArray(detailsById[r.id]?.events) ? detailsById[r.id].events : [];
            const stepInfo = stepById.get(r.id);
            const agentName = stepInfo?.agentIdentity?.name || actorLabelForRole(r.role);
            const agentColor = stepInfo?.agentIdentity?.color || NEUTRAL_AGENT_COLOR;
            const agentEdge = stepInfo?.agentIdentity?.palette?.edge || "#E0E3E6";
            const app = stepInfo?.app || "";

            for (const ev of evs) {
              if (ev?.kind !== "act") continue;
              actEvents.push({
                seq: seq++,
                t: Number(ev.t) || 0,
                runId: r.id,
                agentName,
                agentColor,
                agentEdge,
                app,
                action: ev.action || "",
                plainText: sentenceCase(summarizeActPlain(ev)),
                fromMemory: ev.source === "memory",
                actMs: ev.act_ms != null ? Number(ev.act_ms) : null,
              });
            }
          }

          actEvents.sort((a, b) => (a.t !== b.t ? a.t - b.t : a.seq - b.seq));
          actEvents.forEach((item, idx) => {
            item.index = idx + 1;
          });

          const seconds = rawDigest?.seconds != null ? Number(rawDigest.seconds) : Number(parent.elapsed) || 0;
          const totalSteps =
            actEvents.length > 0
              ? actEvents.length
              : rawDigest?.steps != null
              ? Number(rawDigest.steps)
              : rawChildren.reduce((sum, c) => sum + (Number(c.result?.steps) || 0), 0);
          const memorySteps =
            actEvents.length > 0
              ? actEvents.filter((a) => a.fromMemory).length
              : Number(rawDigest?.memory_steps || 0);
          const helpRequests = rawDigest?.help_requests != null ? Number(rawDigest.help_requests) : 0;
          const children = Array.isArray(rawDigest?.children)
            ? rawDigest.children
            : rawChildren.map((c) => c.id);

          let costUsd = null;
          let costIsNull = false;
          const isExplicitMockCost = Boolean(
            (costData && costData.mock === true) ||
            (rawDigest?.task_cost && costData == null && rawDigest.task_cost.mock === true)
          );
          const llmNullInEvents = [parent, ...rawChildren].some((r) => {
            const evs = Array.isArray(detailsById[r.id]?.events) ? detailsById[r.id].events : [];
            const llmEvs = evs.filter((e) => e?.kind === "llm");
            return llmEvs.length > 0 && llmEvs.some((e) => e.cost === null) && llmEvs.every((e) => e.cost == null || e.cost === 0);
          });
          if (costData && costData.cost_usd === null) {
            costIsNull = true;
          } else if (costData && typeof costData.cost_usd === "number") {
            costUsd = costData.cost_usd;
            if (costUsd === 0 && llmNullInEvents) costIsNull = true;
          } else if (rawDigest?.task_cost && costData == null && rawDigest.task_cost.cost_usd === null) {
            costIsNull = true;
          } else if (rawDigest?.task_cost && typeof rawDigest.task_cost.cost_usd === "number") {
            costUsd = rawDigest.task_cost.cost_usd;
            if (costUsd === 0 && llmNullInEvents) costIsNull = true;
          } else if (rawDigest?.llm && rawDigest.llm.cost === null) {
            costIsNull = true;
          } else if (rawDigest?.llm && typeof rawDigest.llm.cost === "number" && (rawDigest.llm.calls > 0 || rawDigest.llm.cost > 0)) {
            costUsd = rawDigest.llm.cost;
            if (costUsd === 0 && llmNullInEvents) costIsNull = true;
          } else if (llmNullInEvents) {
            costIsNull = true;
          }

          if (Array.isArray(rawDigest?.task_cost?.actions)) {
            for (const actItem of rawDigest.task_cost.actions) {
              if (actItem && actItem.to == null) {
                // Explicitly allow null target node on action records
              }
            }
          }

          const finalCostText = isExplicitMockCost
            ? "$0 (sample run)"
            : costIsNull
            ? "—"
            : formatCostUsd(costUsd);
          const liveCostText = isExplicitMockCost
            ? "$0 (sample run)"
            : costIsNull || costUsd === null
            ? "—"
            : formatCostUsd(costUsd) || "—";

          return {
            summary: rawDigest?.summary ? String(rawDigest.summary) : "",
            timeText: formatSeconds(seconds),
            totalSteps,
            memorySteps,
            helpRequests,
            children,
            llm: rawDigest?.llm || null,
            costUsd,
            costText: finalCostText,
            liveCostText,
            actEvents,
            hasActEvents: actEvents.length > 0,
          };
        }

        function mapRuns(rawRuns, detailsById, pendingHelpList, meta) {
          const runsList = Array.isArray(rawRuns) ? rawRuns : [];
          const helpList = Array.isArray(pendingHelpList) ? pendingHelpList : [];
          const agentsMap = meta && meta.agentsById && typeof meta.agentsById === "object" ? meta.agentsById : {};
          const rememberedMap =
            meta && meta.rememberedAgentsById && typeof meta.rememberedAgentsById === "object"
              ? meta.rememberedAgentsById
              : {};
          const costsById = meta && meta.costsById && typeof meta.costsById === "object" ? meta.costsById : {};
          const transcriptsById =
            meta && meta.transcriptsById && typeof meta.transcriptsById === "object" ? meta.transcriptsById : {};
          const nowSec = meta && meta.nowSec != null ? Number(meta.nowSec) : Date.now() / 1000;
          const primaryAgentPref = readPrimaryAgentPref(meta);
          const byId = new Map(runsList.map((r) => [r.id, r]));
          const rootParentByRunId = new Map();
          for (const r of runsList) {
            if (!r || !r.id) continue;
            let cur = r;
            const seen = new Set();
            while (cur && cur.parent && byId.has(cur.parent) && !seen.has(cur.id)) {
              seen.add(cur.id);
              cur = byId.get(cur.parent);
            }
            rootParentByRunId.set(r.id, cur ? (cur.parent && !byId.has(cur.parent) ? cur.id : cur.parent || cur.id) : r.id);
          }

          /* Group child runs (including follow-up orchestrator grandchildren) under root parent runs */
          const parents = runsList.filter((r) => !r.parent || !byId.has(r.parent));
          const childrenByParent = new Map();
          for (const r of runsList) {
            const rootId = rootParentByRunId.get(r.id);
            if (rootId && rootId !== r.id && byId.has(rootId)) {
              if (!childrenByParent.has(rootId)) childrenByParent.set(rootId, []);
              childrenByParent.get(rootId).push(r);
            } else if (r.parent && byId.has(r.parent)) {
              if (!childrenByParent.has(r.parent)) childrenByParent.set(r.parent, []);
              childrenByParent.get(r.parent).push(r);
            }
          }

          /* Live cursor agents for collapsed notch pill dots */
          const liveAgents = [];
          const addedAgentIds = new Set();
          for (const [agentId, entry] of Object.entries(agentsMap)) {
            if (!entry || typeof entry !== "object") continue;
            const runObj = byId.get(agentId);
            if (runObj && (runObj.state === "done" || runObj.state === "failed")) continue;
            if (runObj && runObj.role === "orchestrator" && childrenByParent.has(runObj.id)) continue;
            const entryName = String(entry.name || actorLabelForRole(runObj?.role)).trim();
            const isOrchAgent = runObj?.role === "orchestrator" || entryName === "ComputerAnything";
            const customSwatch = isOrchAgent && primaryAgentPref ? primaryAgentPref.swatch : null;
            const displayName =
              isOrchAgent && primaryAgentPref && primaryAgentPref.alias
                ? primaryAgentPref.alias
                : entryName;
            addedAgentIds.add(agentId);
            liveAgents.push({
              id: agentId,
              name: displayName,
              color: normalizeHex(customSwatch ? customSwatch.color : entry.color || entry.body, NEUTRAL_AGENT_COLOR),
              edge: normalizeHex(customSwatch ? customSwatch.edge : entry.edge, "#E0E3E6"),
              ink: normalizeHex(customSwatch ? customSwatch.ink : entry.ink, "#323B43"),
            });
          }
          for (const parent of parents) {
            const rawChildren = [...(childrenByParent.get(parent.id) || [])].reverse();
            const parentEvs = Array.isArray(detailsById[parent.id]?.events) ? detailsById[parent.id].events : [];
            const parentRoute = [...parentEvs].reverse().find((e) => e?.kind === "route") || null;
            const candidates = rawChildren.length ? rawChildren : [parent];
            candidates.forEach((child, idx) => {
              if (!child || addedAgentIds.has(child.id)) return;
              const isRunningState =
                child.state === "queued" ||
                child.state === "planning" ||
                child.state === "acting" ||
                child.state === "awaiting_human";
              if (!isRunningState) return;
              const evs = Array.isArray(detailsById[child.id]?.events) ? detailsById[child.id].events : [];
              const identity = resolveAgentIdentity(
                child,
                agentsMap,
                idx,
                rememberedMap,
                evs,
                parentRoute,
                transcriptsById,
                primaryAgentPref,
                candidates.length
              );
              addedAgentIds.add(child.id);
              liveAgents.push({
                id: child.id,
                name: identity.name,
                color: normalizeHex(identity.color, NEUTRAL_AGENT_COLOR),
                edge: normalizeHex(identity.palette?.edge, "#E0E3E6"),
                ink: normalizeHex(identity.palette?.ink, "#323B43"),
              });
            });
          }

          const mappedRuns = parents.map((parent) => {
            const rawChildren = [...(childrenByParent.get(parent.id) || [])].reverse();
            const groupRuns = [parent, ...rawChildren];
            const groupRunIds = new Set(groupRuns.map((r) => r.id));

            const parentEvents = Array.isArray(detailsById[parent.id]?.events) ? detailsById[parent.id].events : [];
            const parentRouteEvent = [...parentEvents].reverse().find((e) => e?.kind === "route") || null;

            const timedOutHelpIds = new Set();
            const helpEventsById = new Map();
            for (const gr of groupRuns) {
              const evs = Array.isArray(detailsById[gr.id]?.events) ? detailsById[gr.id].events : [];
              for (const ev of evs) {
                if (ev?.kind === "help" && ev.id) {
                  helpEventsById.set(ev.id, { ...ev, run: gr.id });
                } else if (ev?.kind === "help_answer" && ev.id && ev.timed_out === true) {
                  timedOutHelpIds.add(ev.id);
                }
              }
            }

            const helpItemsById = new Map();
            for (const h of helpList) {
              if (!h || !groupRunIds.has(h.run) || h.answer != null) continue;
              helpItemsById.set(h.id, h);
            }
            for (const hid of timedOutHelpIds) {
              if (!helpItemsById.has(hid) && helpEventsById.has(hid)) {
                const he = helpEventsById.get(hid);
                helpItemsById.set(hid, {
                  id: hid,
                  run: he.run,
                  kind: he.help_kind || "",
                  question: he.question || "Approval needed",
                  options: Array.isArray(he.options) ? he.options : [],
                  detail: "",
                  answer: null,
                });
              }
            }

            const pendingHelp = Array.from(helpItemsById.values()).map((h) => {
              const helpEv = helpEventsById.get(h.id);
              const kind = h.kind || helpEv?.help_kind || "";
              const kindWarning = getApprovalKindWarning(kind);
              const askedAtSec =
                h.asked != null
                  ? Number(h.asked)
                  : h.asked_age_s != null
                  ? nowSec - Number(h.asked_age_s)
                  : nowSec;
              const elapsedSec = Math.max(0, nowSec - askedAtSec);
              const remainingSec = Math.max(0, Math.ceil(300 - elapsedSec));
              const isExpired = Boolean(timedOutHelpIds.has(h.id) || remainingSec <= 0);
              const countdownText = isExpired ? "0:00" : formatCountdown(remainingSec);
              const agentName = h.agent ? String(h.agent).trim() : "";
              return {
                id: h.id,
                run: h.run,
                agentName,
                kind,
                kindWarning,
                askedAtSec,
                remainingSec: isExpired ? 0 : remainingSec,
                countdownText,
                isExpired,
                statusText: isExpired ? "Expired" : "",
                question: formatApprovalQuestionPlain(h.question || "Approval needed"),
                options: Array.isArray(h.options) ? h.options : [],
                detail: h.detail ? String(h.detail) : "",
                timeoutNote: isExpired
                  ? "No answer received within 5m · Declined."
                  : `Denies in ${countdownText} · Silence means no.`,
              };
            });

            const activePendingHelp = pendingHelp.filter((h) => !h.isExpired);

            const isSampleContext = Boolean(meta.isSampleData);
            const hasMockVerify = hasMockVerifyEvidence(groupRuns, detailsById);
            const isMockRun = isMockRunGroup(groupRuns, detailsById, costsById[parent.id], isSampleContext);

            const rawGroupTranscript = Array.isArray(transcriptsById[parent.id])
              ? transcriptsById[parent.id].filter((row) => {
                  if (!row) return false;
                  if (row.run && rootParentByRunId.has(row.run) && rootParentByRunId.get(row.run) !== parent.id) {
                    return false;
                  }
                  return true;
                })
              : [];
            const stepRuns = rawChildren.length ? rawChildren : [parent];
            const stepRunIdSet = new Set(stepRuns.map((r) => r.id));
            const steps = stepRuns.map((child, idx) => {
              const childHelp = pendingHelp.filter((h) => h.run === child.id && !h.isExpired);
              return mapStep(
                child,
                detailsById[child.id],
                childHelp,
                agentsMap,
                idx,
                isMockRun,
                rememberedMap,
                parentRouteEvent,
                transcriptsById,
                primaryAgentPref,
                stepRuns.length,
                rawGroupTranscript,
                stepRunIdSet,
                idx === 0
              );
            });
            const stepById = new Map(steps.map((s) => [s.id, s]));
            for (const item of pendingHelp) {
              if (!item.agentName && item.run) {
                const helpStep = stepById.get(item.run);
                if (helpStep && !helpStep.isOrchestrator && helpStep.agentIdentity?.name) {
                  item.agentName = helpStep.agentIdentity.name;
                }
              }
            }

            const apps = [];
            const seenApps = new Set();
            const addAppName = (name) => {
              const clean = String(name || "").trim();
              if (clean && !seenApps.has(clean)) {
                seenApps.add(clean);
                apps.push(clean);
              }
            };
            for (const s of steps) {
              if (s.app) addAppName(s.app);
            }
            if (!apps.length) {
              if (parentRouteEvent?.app) addAppName(parentRouteEvent.app);
              if (Array.isArray(parentRouteEvent?.subtasks)) {
                for (const sub of parentRouteEvent.subtasks) {
                  if (sub?.app) addAppName(sub.app);
                }
              }
            }

            const primaryApp = apps[0] || "";
            const speakText = extractSpeakText(groupRuns, detailsById);
            const rawResultSummary = parent.result?.summary || parent.result?.digest?.summary || speakText || "";
            const plainResultSummary =
              rawResultSummary && !isMockSummaryText(rawResultSummary)
                ? cleanPlainSummary(rawResultSummary, primaryApp, "")
                : "";
            const evidenceText = isMockRun
              ? ""
              : extractVerificationEvidence(groupRuns, detailsById, primaryApp, plainResultSummary);
            const unappliedPatch = hasUnappliedPatch(groupRuns, detailsById);

            /* Truth rules (Requirement 4 & A5):
               Check mark (✓) ONLY when parent run is done AND parent.result.ok === true
               AND it is a real (non-mock, non-sample) run.
               Under CA_MOCK / sample data, show a neutral non-verified state with no green check. */
            let state = "working"; // "working" | "waiting" | "verified" | "failed" | "unverified"
            let stateSymbolWord = "▶ Running";
            let stateFact = "";
            let pillFact = "";
            let stateColorClass = "state-working";
            let stopKind = "";

            if (activePendingHelp.length > 0 || parent.state === "awaiting_human" || rawChildren.some((c) => c.state === "awaiting_human")) {
              state = "waiting";
              stateSymbolWord = "◔ Needs approval";
              stateFact = activePendingHelp[0]?.question || pendingHelp[0]?.question || "Waiting for your answer";
              pillFact = buildPillFact(stateFact, false);
              stateColorClass = "state-warning";
            } else if (parent.state === "queued" || parent.state === "planning" || parent.state === "acting") {
              state = "working";
              stateSymbolWord = "▶ Running";
              const activeChild = steps.find((s) => s.isWorking);
              stateFact = activeChild ? (activeChild.agentIdentity?.name || activeChild.actorLabel) : "Planning";
              pillFact = buildPillFact(stateFact, false);
              stateColorClass = "state-working";
            } else if (parent.state === "done" && parent.result?.ok === true) {
              if (isMockRun) {
                state = "unverified";
                stateSymbolWord = "Finished · sample run, not verified";
                stateFact = plainResultSummary ? cleanFailureFact(plainResultSummary) : "";
                pillFact = buildPillFact(stateFact || "Sample run", false);
                stateColorClass = "state-neutral";
              } else {
                state = "verified";
                stateSymbolWord = "✓ Verified";
                stateFact = plainResultSummary ? sentenceCase(plainResultSummary) : "All checks passed";
                pillFact = buildPillFact(stateFact, true);
                stateColorClass = "state-success";
              }
            } else if (parent.state === "failed" || parent.result?.ok === false) {
              state = "failed";
              const baseSummary = cleanFailureFact(plainResultSummary || parent.result?.summary || parent.result?.digest?.summary);
              const allGroupEvents = groupRuns.flatMap((gr) =>
                Array.isArray(detailsById[gr.id]?.events) ? detailsById[gr.id].events : []
              );
              const outcome = classifyStoppedOutcome(
                parent.result?.summary || parent.result?.digest?.summary || speakText || baseSummary,
                allGroupEvents
              );
              stopKind = outcome.kind;
              stateSymbolWord = outcome.label;
              stateFact = unappliedPatch
                ? `${baseSummary} · Nothing was changed.`
                : baseSummary;
              pillFact = buildPillFact(stateSymbolWord || baseSummary, false);
              stateColorClass = "state-neutral";
            } else if (parent.state === "done") {
              state = "unverified";
              stateSymbolWord = "◔ Finished, not verified";
              const baseSummary = cleanFailureFact(plainResultSummary || parent.result?.summary || parent.result?.digest?.summary || speakText);
              stateFact = baseSummary;
              pillFact = buildPillFact(baseSummary, false);
              stateColorClass = "state-warning";
            } else {
              state = "failed";
              stopKind = "real_failure";
              stateSymbolWord = "Stopped before finishing";
              stateFact = "Run stopped before finishing";
              pillFact = buildPillFact(stateFact, false);
              stateColorClass = "state-neutral";
            }

            const isFinished = state === "verified" || state === "failed" || state === "unverified";
            const isRealFailure = state === "failed" && stopKind === "real_failure";
            const primaryStep = steps[0] || null;
            const failureAgentName = primaryStep?.agentIdentity?.name || primaryStep?.actorLabel || "Agent";
            const rawFailureMsg =
              stateSymbolWord === "Stopped before finishing"
                ? "Couldn't finish"
                : stateSymbolWord || stateFact || "Couldn't finish";
            const failureLineText = /[.!?]$/.test(rawFailureMsg) ? rawFailureMsg : `${rawFailureMsg}.`;
            const liveSteps = [];
            if (!isFinished) {
              for (const r of stepRuns) {
                const entry = buildLiveStepForSingleRun(parent, r, detailsById, stepById);
                if (entry && entry.isRunActive) {
                  const st = stepById.get(r.id);
                  if (st) st.liveStep = entry;
                  liveSteps.push(entry);
                }
              }
            }
            const liveStep = !isFinished
              ? buildLiveStepForRun(parent, stepRuns, detailsById, stepById)
              : null;
            if (liveStep && !liveSteps.length) {
              const st = stepById.get(liveStep.runId);
              if (st) st.liveStep = liveStep;
              liveSteps.push(liveStep);
            }
            const digest = buildDigestForRun(parent, rawChildren, detailsById, stepById, costsById[parent.id], state);
            const permissionIssue = detectPermissionIssue(parent, groupRuns, detailsById, state);
            const producedOutputs = extractProducedOutputs(parent, groupRuns, detailsById);
            const copyResultText = buildCopyResultText({
              stateSymbolWord,
              stateFact,
              speakText,
              evidenceText,
              outputs: producedOutputs,
            });
            const transcriptRows = normalizeTranscriptRows(rawGroupTranscript, parent.id, rootParentByRunId);
            const approvalHistory = buildApprovalHistoryForGroup(groupRuns, detailsById, rawGroupTranscript);
            const activePendingHelpCountdown = activePendingHelp[0]?.countdownText || "";
            const lastTranscriptRow = transcriptRows.length ? transcriptRows[transcriptRows.length - 1] : null;
            const meaningfulTranscriptRow =
              [...transcriptRows]
                .reverse()
                .find((tr) => tr && tr.text && !/^Finished\.?$/i.test(String(tr.text).trim())) || null;
            const lastTsFromTranscript =
              lastTranscriptRow && lastTranscriptRow.ts != null ? Number(lastTranscriptRow.ts) : 0;
            const firstTsFromTranscript =
              transcriptRows[0] && transcriptRows[0].ts != null ? Number(transcriptRows[0].ts) : 0;
            const rawTs = Number(parent.ts || parent.updated || parent.created || parent.started || 0);
            const rawStartTs = Number(parent.started || parent.started_at || parent.created || firstTsFromTranscript || rawTs || 0);
            const sortTs = Math.max(rawTs, lastTsFromTranscript);
            const startTs = rawStartTs || sortTs;
            const listClockText = formatShortClock(sortTs);
            const plainFactForPreview =
              stateFact && !/^Finished\.?$/i.test(String(stateFact).trim()) ? stateFact : "";
            const lastLinePreview =
              (meaningfulTranscriptRow && meaningfulTranscriptRow.text) ||
              (activePendingHelp[0]?.question) ||
              (state === "failed" ? stateSymbolWord : plainFactForPreview) ||
              parent.goal ||
              "Untitled chat";

            return {
              id: parent.id,
              parent: parent.parent || null,
              goal: parent.goal || "Untitled run",
              apps,
              appLabel: apps.join(", "),
              elapsedText: formatSeconds(parent.elapsed),
              listClockText,
              state,
              stopKind,
              isRealFailure,
              failureAgentName,
              failureLineText,
              isFinished,
              isMock: isMockRun,
              mockNote: isSampleContext || hasMockVerify || isMockRun
                ? "Sample data. Nothing here ran on this Mac."
                : "",
              stateSymbolWord,
              stateFact,
              pillFact,
              stateColorClass,
              evidenceText,
              speakText,
              liveStep,
              liveSteps,
              digest,
              steps,
              pendingHelp,
              permissionIssue,
              producedOutputs,
              copyResultText,
              transcriptRows,
              approvalHistory,
              startTs,
              sortTs,
              lastLinePreview,
              activePendingHelpCountdown,
            };
          });

          const pendingHelpRun = mappedRuns.find((r) => r.pendingHelp.some((h) => !h.isExpired)) || null;

          return {
            connectionStatus: meta.connectionStatus,
            connectionError: meta.connectionError || "",
            isSampleData: Boolean(meta.isSampleData),
            liveAgents,
            pendingHelpRunId: pendingHelpRun ? pendingHelpRun.id : "",
            runs: mappedRuns,
          };
        }

        const DEFAULT_AGENT_SWATCHES = [
          { key: "lagoon", name: "Lagoon", color: "#B5D0EB", edge: "#D6E9FF", ink: "#2F647C" },
          { key: "rose",   name: "Rose",   color: "#EECED6", edge: "#FFF0F1", ink: "#963F59" },
          { key: "mint",   name: "Mint",   color: "#C0DED0", edge: "#E6FFF0", ink: "#396C5A" },
          { key: "lilac",  name: "Lilac",  color: "#E1CDE8", edge: "#FBE8F7", ink: "#71388B" },
          { key: "amber",  name: "Amber",  color: "#F0D9BE", edge: "#FFFCE0", ink: "#865733" },
        ];

        const SUGGESTED_AGENT_NAMES = ["Aria", "Milo", "Sora", "Kai", "Nora", "Leo", "Sage", "Zoe"];

        function normalizeAgentSwatch(swatchVal, fallbackIdx = 0) {
          const clean = String(swatchVal || "").trim();
          const lower = clean.toLowerCase();
          const upper = clean.toUpperCase();
          const found = clean
            ? DEFAULT_AGENT_SWATCHES.find((s) => s.key === lower || s.name.toLowerCase() === lower || s.color === upper)
            : null;
          return found || DEFAULT_AGENT_SWATCHES[Math.abs(Number(fallbackIdx) || 0) % DEFAULT_AGENT_SWATCHES.length];
        }

        function suggestAgentName(existingNames = []) {
          const used = new Set((existingNames || []).map((n) => String(n || "").trim().toLowerCase()).filter(Boolean));
          for (const candidate of SUGGESTED_AGENT_NAMES) {
            if (!used.has(candidate.toLowerCase())) return candidate;
          }
          let n = 2;
          while (used.has(`agent ${n}`)) n += 1;
          return `Agent ${n}`;
        }

        function suggestAgentSwatch(existingSwatches = []) {
          const used = new Set((existingSwatches || []).map((s) => normalizeAgentSwatch(s).key));
          for (const sw of DEFAULT_AGENT_SWATCHES) {
            if (!used.has(sw.key)) return sw.key;
          }
          return DEFAULT_AGENT_SWATCHES[(existingSwatches?.length || 1) % DEFAULT_AGENT_SWATCHES.length].key;
        }

        function isFinishedNoise(text) {
          return /^Finished\.?$/i.test(String(text || "").trim());
        }

        function pickConversationLastLine(latestTask, waitingTask) {
          if (!latestTask) return "No tasks yet";
          const activeQ = waitingTask?.pendingHelp?.find((h) => !h.isExpired)?.question;
          if (activeQ && !isFinishedNoise(activeQ)) return activeQ;
          if (latestTask.isFinished && latestTask.state !== "failed") {
            if (latestTask.stateFact && !isFinishedNoise(latestTask.stateFact)) return latestTask.stateFact;
            if (latestTask.speakText && !isFinishedNoise(latestTask.speakText)) return latestTask.speakText;
          }
          if (latestTask.state === "failed" && latestTask.stateSymbolWord && !isFinishedNoise(latestTask.stateSymbolWord)) {
            return latestTask.stateSymbolWord;
          }
          const rows = Array.isArray(latestTask.transcriptRows) ? latestTask.transcriptRows : [];
          for (let i = rows.length - 1; i >= 0; i -= 1) {
            const txt = String(rows[i]?.text || "").trim();
            if (txt && !isFinishedNoise(txt)) return txt;
          }
          if (latestTask.lastLinePreview && !isFinishedNoise(latestTask.lastLinePreview)) {
            return latestTask.lastLinePreview;
          }
          return latestTask.goal || "No tasks yet";
        }

        function buildAgentConversations(vm, opts = {}) {
          const runs = Array.isArray(vm?.runs) ? vm.runs : [];
          const hiddenSet = opts.hiddenRunIds instanceof Set
            ? opts.hiddenRunIds
            : new Set(Array.isArray(opts.hiddenRunIds) ? opts.hiddenRunIds : []);
          const primarySwatch = normalizeAgentSwatch(opts.primaryIdentity?.color || opts.primaryIdentity?.palette?.body || "lagoon", 0);
          const primaryName = String(opts.primaryIdentity?.name || "ComputerAnything").trim() || "ComputerAnything";
          const primaryIdentity = opts.primaryIdentity && opts.primaryIdentity.palette
            ? { ...opts.primaryIdentity, name: primaryName }
            : {
                name: primaryName,
                color: primarySwatch.color,
                hasAgentColor: true,
                rawEdge: primarySwatch.edge,
                rawInk: primarySwatch.ink,
                palette: { body: primarySwatch.color, edge: primarySwatch.edge, ink: primarySwatch.ink },
              };
          const primaryThreads = [
            opts.primaryThread,
            ...(Array.isArray(opts.primaryThreads) ? opts.primaryThreads : []),
          ].filter(Boolean);
          const createdAgents = Array.isArray(opts.createdAgents) ? opts.createdAgents : [];
          const optimisticMap = opts.optimisticAgentByRunId && typeof opts.optimisticAgentByRunId === "object"
            ? opts.optimisticAgentByRunId
            : {};

          const list = [];
          const byId = new Map();
          const claimMap = new Map();

          const primaryConv = {
            id: "__primary__",
            isPrimary: true,
            name: primaryIdentity.name,
            swatch: primarySwatch.key,
            identity: primaryIdentity,
            thread: String(opts.primaryThread || "").trim(),
            threads: Array.from(new Set(primaryThreads)),
            _taskEntries: [],
            tasks: [],
          };
          list.push(primaryConv);
          byId.set(primaryConv.id, primaryConv);

          createdAgents.forEach((ag, idx) => {
            if (!ag || !ag.id) return;
            const sw = normalizeAgentSwatch(ag.swatch, idx + 1);
            const cleanName = String(ag.name || "").trim() || `Agent ${idx + 2}`;
            const claimed = Array.from(new Set([
              ag.thread,
              ...(Array.isArray(ag.threads) ? ag.threads : []),
            ].map((t) => String(t || "").trim()).filter(Boolean)));
            const conv = {
              id: String(ag.id),
              isPrimary: false,
              name: cleanName,
              swatch: sw.key,
              identity: {
                name: cleanName,
                color: sw.color,
                hasAgentColor: true,
                rawEdge: sw.edge,
                rawInk: sw.ink,
                palette: { body: sw.color, edge: sw.edge, ink: sw.ink },
              },
              thread: String(ag.thread || claimed[0] || "").trim(),
              threads: claimed,
              _taskEntries: [],
              tasks: [],
            };
            list.push(conv);
            byId.set(conv.id, conv);
            for (const t of claimed) {
              claimMap.set(t, conv.id);
            }
          });

          runs.forEach((runVm, vmIdx) => {
            if (!runVm || !runVm.id || hiddenSet.has(runVm.id)) return;
            let ownerId = optimisticMap[runVm.id] || claimMap.get(runVm.id) || "";
            if (!ownerId && Array.isArray(runVm.steps)) {
              for (const s of runVm.steps) {
                if (s && s.id && claimMap.has(s.id)) {
                  ownerId = claimMap.get(s.id);
                  break;
                }
              }
            }
            if (!ownerId || !byId.has(ownerId)) {
              ownerId = "__primary__";
            }
            byId.get(ownerId)._taskEntries.push({ run: runVm, vmIdx });
          });

          for (const conv of list) {
            conv._taskEntries.sort((a, b) => {
              const aTs = Number(a.run.startTs || a.run.sortTs || 0);
              const bTs = Number(b.run.startTs || b.run.sortTs || 0);
              if (aTs && bTs && aTs !== bTs) return aTs - bTs;
              return b.vmIdx - a.vmIdx;
            });
            conv.tasks = conv._taskEntries.map((e) => e.run);
            delete conv._taskEntries;

            const latestTask = conv.tasks.length ? conv.tasks[conv.tasks.length - 1] : null;
            const waitingTask = conv.tasks.find((t) => t.state === "waiting") || null;
            const workingTask = conv.tasks.find((t) => t.state === "working") || null;
            conv.hasWaiting = Boolean(waitingTask);
            conv.hasWorking = Boolean(workingTask);
            conv.state = waitingTask ? "waiting" : workingTask ? "working" : (latestTask ? latestTask.state : "idle");
            conv.badge = waitingTask
              ? { text: "! Needs you", cls: "state-warning" }
              : workingTask
              ? { text: "● Working", cls: "state-working" }
              : null;
            conv.latestTask = latestTask;
            conv.pendingHelpTaskId = waitingTask ? waitingTask.id : "";
            conv.lastLinePreview = pickConversationLastLine(latestTask, waitingTask);
            conv.listClockText = latestTask ? latestTask.listClockText : "";
            conv.latestSortTs = latestTask ? Number(latestTask.sortTs || 0) : 0;
            conv.liveRunIds = conv.tasks.filter((t) => !t.isFinished).map((t) => t.id);
            conv.allRunIds = conv.tasks.map((t) => t.id);

            let copyText = "";
            for (let i = conv.tasks.length - 1; i >= 0; i -= 1) {
              const t = conv.tasks[i];
              if (t.copyResultText && !isFinishedNoise(t.copyResultText)) {
                copyText = t.copyResultText;
                break;
              }
              if (t.stateFact && !isFinishedNoise(t.stateFact)) {
                copyText = t.stateFact;
                break;
              }
            }
            conv.copyResultText = copyText || (conv.lastLinePreview !== "No tasks yet" ? conv.lastLinePreview : "");
          }

          return { list, byId };
        }

        return {
          mapRuns,
          DEFAULT_AGENT_SWATCHES,
          normalizeAgentSwatch,
          suggestAgentName,
          suggestAgentSwatch,
          buildAgentConversations,
          deriveStoppedLabel,
          getApprovalKindWarning,
          isMoneyOrSendApproval,
          formatApprovalQuestionPlain,
          actorLabelForRole,
        };
      })();

      /* ============================================================================
         3. APPLICATION STATE & UI CONTROLLER (Reads ONLY WorkspaceAdapter ViewModel)
         ============================================================================ */
      const notchShell = document.getElementById("notch-shell");
      const pillTrigger = document.getElementById("pill-trigger");
      const pillStatusLine = document.getElementById("pill-status-line");
      const panelView = document.getElementById("panel-view");
      const panelHeader = document.getElementById("panel-header");
      const openWorkspaceBtn = document.getElementById("open-workspace-btn");

      function announceRunTransitions(checkVm) {
        if (!checkVm || !Array.isArray(checkVm.runs)) return;
        const convList = getConversationsForVm(checkVm)?.list || [];
        const resolveRunAgentName = (r) => {
          const owner = convList.find((c) => c.allRunIds && c.allRunIds.includes(r.id));
          if (owner?.identity?.name) return owner.identity.name;
          const workingStep = (r.steps || []).find((s) => s.isWorking);
          return (
            workingStep?.agentIdentity?.name ||
            r.failureAgentName ||
            getPrimaryAgentRowIdentity().name ||
            "Agent"
          );
        };
        const buildSnap = (r) => ({
          state: r.state,
          isFinished: Boolean(r.isFinished),
          waitingCount: Array.isArray(r.pendingHelp) ? r.pendingHelp.length : 0,
          workingStepIds: new Set((r.steps || []).filter((s) => s.isWorking).map((s) => s.id)),
        });

        if (!hasInitializedStatusBaseline) {
          hasInitializedStatusBaseline = true;
          lastRunStatusSnapshots.clear();
          for (const r of checkVm.runs) {
            lastRunStatusSnapshots.set(r.id, buildSnap(r));
          }
          return;
        }

        const announcements = [];
        for (const r of checkVm.runs) {
          const prev = lastRunStatusSnapshots.get(r.id);
          const next = buildSnap(r);
          lastRunStatusSnapshots.set(r.id, next);
          const agentName = resolveRunAgentName(r);

          if ((!prev && r.state === "working") || (prev && prev.state !== "working" && r.state === "working")) {
            const workingStep = (r.steps || []).find((s) => s.isWorking);
            const stepName = workingStep?.agentIdentity?.name || agentName;
            const appSuffix = workingStep?.app ? ` in ${workingStep.app}` : "";
            announcements.push(`${stepName} started${appSuffix}`);
          } else if (prev && r.state === "working") {
            const newStep = (r.steps || []).find((s) => s.isWorking && !prev.workingStepIds.has(s.id));
            if (newStep) {
              const stepName = newStep.agentIdentity?.name || agentName;
              const appSuffix = newStep.app ? ` in ${newStep.app}` : "";
              announcements.push(`${stepName} started${appSuffix}`);
            }
          }

          if (r.state === "waiting" && (!prev || prev.state !== "waiting" || next.waitingCount > prev.waitingCount)) {
            const q = (r.pendingHelp || []).find((h) => !h.isExpired)?.question || "";
            announcements.push(`${agentName} needs you${q ? `: ${q}` : ""}`);
          }

          if (r.isFinished && (!prev || !prev.isFinished)) {
            if (r.state === "failed") {
              const reason = (stopNoticesByRunId.get(r.id) || r.failureLineText || "Stopped").trim();
              announcements.push(`${agentName}: ${reason}`);
            } else {
              const summary = (r.evidenceText || r.stateFact || r.stateSymbolWord || "Done").trim();
              announcements.push(`${agentName} finished: ${summary}`);
            }
          }
        }

        if (announcements.length) {
          announceStatus(announcements.slice(0, 2).join(" · "));
        }
      }

      async function copyTextWithFeedback(text, copyKey, statusMessage) {
        const clean = String(text || "");
        if (!clean) return false;
        let ok = false;
        try {
          if (navigator.clipboard && typeof navigator.clipboard.writeText === "function") {
            await navigator.clipboard.writeText(clean);
            ok = true;
          }
        } catch {
          ok = false;
        }
        if (!ok && typeof document !== "undefined") {
          try {
            const ta = document.createElement("textarea");
            ta.value = clean;
            ta.setAttribute("readonly", "");
            ta.style.position = "fixed";
            ta.style.opacity = "0";
            document.body.appendChild(ta);
            ta.select();
            ok = document.execCommand("copy");
            document.body.removeChild(ta);
          } catch {
            ok = false;
          }
        }
        if (ok && copyKey) {
          copiedItemIds.add(copyKey);
          renderNow();
          setTimeout(() => {
            copiedItemIds.delete(copyKey);
            if (lastViewModel) renderNow();
          }, 1800);

        announceStatus(ok ? (statusMessage || "Copied to clipboard") : "Could not copy to clipboard");

      function formatTaskDividerLabel(prevTs, curTs) {
        const curNum = Number(curTs || 0);
        if (!Number.isFinite(curNum) || curNum < 1000000000) return "";
        const prevNum = Number(prevTs || 0);
        const sameDay =
          prevNum >= 1000000000 &&
          new Date(prevNum * 1000).toDateString() === new Date(curNum * 1000).toDateString();
        if (sameDay && Math.abs(curNum - prevNum) < 300) return "";
        try {
          const d = new Date(curNum * 1000);
          const timeStr = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
          const now = new Date();
          if (d.toDateString() === now.toDateString()) {
            return sameDay ? timeStr : `Today · ${timeStr}`;
          }
          const yest = new Date(now);
          yest.setDate(now.getDate() - 1);
          if (d.toDateString() === yest.toDateString()) {
            return `Yesterday · ${timeStr}`;
          }
          const dateStr = d.toLocaleDateString([], { month: "short", day: "numeric" });
          return `${dateStr} · ${timeStr}`;
        } catch {
          return "";
        }
