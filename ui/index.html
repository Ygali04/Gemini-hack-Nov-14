  <script src="./vendor/sea-glass/sea-glass.classic.js"></script>
  <script src="./shared/agent-glass.js"></script>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const fixtureParam = params.get("fixture");
      const queryToken = params.get("t") || "";
      const hasShellBridge = () => Boolean(window.webkit?.messageHandlers?.shell);

      if (hasShellBridge() || params.get("shell") === "notch") {
        document.documentElement.classList.add("is-shell");
        document.body.classList.add("is-shell");
      }

      if (params.get("state") === "expanded") {
        document.body.dataset.state = "expanded";
      }

      /* ============================================================================
         1. TRANSPORT LAYER (Shell Bridge | Same-Origin Fetch | Fixture Mode)
         ============================================================================ */
      const Transport = (function () {
        let bridgeSeq = 1;
        const pendingBridgeCalls = new Map();

        /* Session-only connection state (never persisted to disk/localStorage) */
        let sessionToken = queryToken;
        let sessionBaseUrl = queryToken ? window.location.origin : "";
        let fixtureState = null;

        window.__notchBridgeReceive = function (msg) {
          if (!msg) return;
          if (msg.id && pendingBridgeCalls.has(msg.id)) {
            const resolver = pendingBridgeCalls.get(msg.id);
            pendingBridgeCalls.delete(msg.id);
            resolver(msg);
            return;
          }
          if (msg.type === "connectionUpdated" && msg.ok && !fixtureParam) {
            sessionBaseUrl = msg.baseUrl || "shell";
            sessionToken = "shell-session";
            connectionError = "";
            connectionStatus = "loading";
            pollAll();
            return;
          }
          if (!msg.id) {
            /* Pushed by the shell, not a reply: hotkey, dropped files */
            window.dispatchEvent(new CustomEvent("shell-event", { detail: msg }));
          }
        };

        function callShell(type, payload) {
          return new Promise((resolve, reject) => {
            if (!hasShellBridge()) {
              reject(new Error("Shell unavailable"));
              return;
            }
            const id = "b-" + bridgeSeq++;
            pendingBridgeCalls.set(id, resolve);
            try {
              window.webkit.messageHandlers.shell.postMessage({
                type,
                id,
                ...(payload || {}),
              });
            } catch (err) {
              pendingBridgeCalls.delete(id);
              reject(err);
            }
          });
        }

        function parseBackendAddress(raw) {
          const trimmed = String(raw || "").trim();
          if (!trimmed) {
            return { ok: false, error: "Paste the address the backend printed" };
          }
          let parsed;
          try {
            parsed = new URL(trimmed);
          } catch {
            return { ok: false, error: "Address must be a valid URL with ?t=" };
          }
          const token = parsed.searchParams.get("t") || "";
          if (!token) {
            return { ok: false, error: "Address is missing ?t= token" };
          }
          return {
            ok: true,
            baseUrl: parsed.origin,
            token,
          };
        }

        async function init() {
          if (fixtureParam) {
            await loadFixture(fixtureParam);
            return { connected: true, isSampleData: true };
          }
          if (hasShellBridge()) {
            const cfg = await callShell("getConfig");
            const voiceMeta = {
              speechAvailable: Boolean(cfg && cfg.speechAvailable),
              onDeviceSpeech: Boolean(cfg && cfg.onDeviceSpeech),
              isDictating: Boolean(cfg && cfg.isDictating),
              isSpeaking: Boolean(cfg && cfg.isSpeaking),
              speakText: cfg && cfg.speakText ? String(cfg.speakText) : "",
            };
            if (cfg && cfg.connected) {
              sessionBaseUrl = cfg.baseUrl || "shell";
              sessionToken = "shell-session"; /* same marker as setConnection: the real token stays in the shell */
              return { connected: true, isSampleData: false, ...voiceMeta };
            }
            return { connected: false, isSampleData: false, ...voiceMeta };
          }
          if (sessionToken && window.location.protocol.startsWith("http")) {
            return { connected: true, isSampleData: false };
          }
          return { connected: false, isSampleData: false };
        }

        async function setConnection(rawUrl) {
          if (hasShellBridge()) {
            const res = await callShell("setConnection", { url: rawUrl });
            if (!res || !res.ok) {
              return { ok: false, error: res?.error || "Invalid address" };
            }
            sessionBaseUrl = res.baseUrl || "shell";
            sessionToken = "shell-session";
            return { ok: true };
          }

          const parsed = parseBackendAddress(rawUrl);
          if (!parsed.ok) return parsed;

          if (window.location.protocol.startsWith("http") && parsed.baseUrl !== window.location.origin) {
            return {
              ok: false,
              error: "Browser origin differs; open " + parsed.baseUrl + "/?t=… directly or use desktop notch",
            };
          }

          sessionBaseUrl = parsed.baseUrl;
          sessionToken = parsed.token;
          return { ok: true };
        }

        function clearConnection() {
          sessionToken = "";
          sessionBaseUrl = "";
        }

        function isConnected() {
          if (fixtureParam) return Boolean(fixtureState);
          return Boolean(sessionToken);
        }

        async function loadFixture(name) {
          const safe = String(name || "").replace(/[^A-Za-z0-9_-]/g, "");
          if (!safe) throw new Error("Invalid fixture name");
          let rawText = "";
          if (hasShellBridge()) {
            const res = await callShell("readFixture", { name: safe });
            if (!res || !res.ok) throw new Error("Sample data not found");
            rawText = res.body || "";
          } else {
            const res = await fetch(`./fixtures/${safe}.json`, { cache: "no-store" });
            if (!res.ok) throw new Error("Sample data not found");
            rawText = await res.text();
          }
          const parsed = JSON.parse(rawText);
          const nowSec = Math.floor(Date.now() / 1000);
          const rawHelp = Array.isArray(parsed.help) ? parsed.help : [];
          const normalizedHelp = rawHelp.map((h) => {
            if (h && h.asked == null && h.asked_age_s != null) {
              return { ...h, asked: nowSec - Number(h.asked_age_s) };
            }
            return h;
          });
          fixtureState = {
            runs: Array.isArray(parsed.runs) ? parsed.runs : [],
            details: parsed.details && typeof parsed.details === "object" ? parsed.details : {},
            help: normalizedHelp,
            agents: parsed.agents && typeof parsed.agents === "object" ? parsed.agents : {},
            costs: parsed.costs && typeof parsed.costs === "object" ? parsed.costs : {},
            capabilities: parsed.capabilities && typeof parsed.capabilities === "object" ? parsed.capabilities : {},
            memory: Array.isArray(parsed.memory) ? parsed.memory : [],
          };
        }

        async function request(method, path, options = {}) {
          if (fixtureParam) {
            return handleFixtureRequest(method, path, options);
          }

          if (hasShellBridge()) {
            const payload = { method, path };
            if (options.filePaths && options.filePaths.length) {
              payload.filePaths = options.filePaths;
              payload.prompt = options.prompt || "";
            } else if (options.jsonBody !== undefined) {
              payload.body = JSON.stringify(options.jsonBody);
            }
            const res = await callShell("http", payload);
            if (!res || res.status === 0) {
              throw Object.assign(new Error(res?.error || "Not connected"), { code: "NETWORK" });
            }
            let data = null;
            try {
              data = res.body ? JSON.parse(res.body) : {};
            } catch {
              data = {};
            }
            if (!res.ok) {
              throw Object.assign(new Error(data.error || `HTTP ${res.status}`), {
                status: res.status,
                code: res.status === 403 ? "AUTH" : "HTTP",
                data,
              });
            }
            return data;
          }

          if (!sessionToken) {
            throw Object.assign(new Error("Not connected"), { code: "AUTH" });
          }

          const fetchOpts = {
            method,
            headers: { "X-CA-Token": sessionToken },
          };
          if (options.formData) {
            fetchOpts.body = options.formData;
          } else if (options.jsonBody !== undefined) {
            fetchOpts.headers["Content-Type"] = "application/json";
            fetchOpts.body = JSON.stringify(options.jsonBody);
          }

          const res = await fetch(path, fetchOpts);
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            throw Object.assign(new Error(data.error || `HTTP ${res.status}`), {
              status: res.status,
              code: res.status === 403 ? "AUTH" : "HTTP",
              data,
            });
          }
          return data;
        }

        function handleFixtureRequest(method, path, options) {
          if (!fixtureState) throw new Error("Sample data unavailable");
          const cleanPath = String(path || "").split("?")[0];
          if (method === "GET" && cleanPath === "/api/runs") {
            return JSON.parse(JSON.stringify(fixtureState.runs));
          }
          if (method === "POST" && cleanPath.startsWith("/api/runs/") && cleanPath.endsWith("/stop")) {
            if (!fixtureState.capabilities?.stop) {
              throw Object.assign(new Error("not found"), {
                status: 404,
                code: "HTTP",
                data: { error: "not found" },
              });
            }
            const runId = decodeURIComponent(cleanPath.slice("/api/runs/".length, -"/stop".length));
            const target = fixtureState.runs.find((r) => r.id === runId);
            if (!target) {
              throw Object.assign(new Error("no such run"), {
                status: 404,
                code: "HTTP",
                data: { error: "no such run" },
              });
            }
            const targets = [target, ...fixtureState.runs.filter((r) => r.parent === runId)];
            const actCount = targets.reduce((sum, r) => {
              const evs = Array.isArray(fixtureState.details?.[r.id]?.events) ? fixtureState.details[r.id].events : [];
              return sum + evs.filter((e) => e?.kind === "act" || (e?.kind === "patch" && e.applied === true)).length;
            }, 0);
            for (const r of targets) {
              if (r.state === "done" || r.state === "failed") continue;
              r.state = "failed";
              r.result = { ok: false, summary: actCount > 0 ? "Stopped by user" : "Stopped by user · Nothing was changed." };
              const detail = fixtureState.details?.[r.id];
              if (detail) {
                detail.state = "failed";
                detail.result = r.result;
                if (!Array.isArray(detail.events)) detail.events = [];
                detail.events.push({ t: (detail.elapsed || 1) + 0.1, kind: "state", state: "failed" });
              }
            }
            return { ok: true, stopped: runId, changed_actions: actCount };
          }
          if (method === "GET" && cleanPath.startsWith("/api/runs/")) {
            const subPath = cleanPath.slice("/api/runs/".length);
            if (subPath.endsWith("/cost")) {
              const runId = decodeURIComponent(subPath.slice(0, -"/cost".length));
              const cost =
                fixtureState.costs?.[runId] ||
                fixtureState.details?.[runId]?.result?.digest?.task_cost ||
                fixtureState.runs.find((r) => r.id === runId)?.result?.digest?.task_cost ||
                {};
              return JSON.parse(JSON.stringify(cost));
            }
            const detail = fixtureState.details[subPath] || fixtureState.runs.find((r) => r.id === subPath);
            if (!detail) throw new Error("Run not found");
            return JSON.parse(JSON.stringify(detail));
          }
          if (method === "GET" && cleanPath === "/api/help") {
            return JSON.parse(JSON.stringify(fixtureState.help.filter((h) => h.answer == null)));
          }
          if (method === "GET" && cleanPath === "/api/agents") {
            return JSON.parse(JSON.stringify(fixtureState.agents || {}));
          }
          if (method === "GET" && cleanPath === "/api/memory") {
            const hasMemory = fixtureState.capabilities?.memory === true || (fixtureState.memory && fixtureState.memory.length > 0);
            if (fixtureState.capabilities?.memory === false || !hasMemory) {
              throw Object.assign(new Error("not found"), {
                status: 404,
                code: "HTTP",
                data: { error: "not found" },
              });
            }
            return JSON.parse(JSON.stringify(fixtureState.memory || []));
          }
          if (method === "DELETE" && cleanPath.startsWith("/api/memory/")) {
            const hasMemory = fixtureState.capabilities?.memory === true || (fixtureState.memory && fixtureState.memory.length > 0);
            if (fixtureState.capabilities?.memory === false || !hasMemory) {
              throw Object.assign(new Error("not found"), {
                status: 404,
                code: "HTTP",
                data: { error: "not found" },
              });
            }
            const memId = decodeURIComponent(cleanPath.slice("/api/memory/".length));
            const before = fixtureState.memory.length;
            fixtureState.memory = fixtureState.memory.filter((m) => String(m.id) !== memId);
            if (fixtureState.memory.length === before) {
              throw Object.assign(new Error("no such memory"), {
                status: 404,
                code: "HTTP",
                data: { error: "no such memory" },
              });
            }
            return { ok: true, id: memId };
          }
          if (method === "POST" && path.startsWith("/api/help/")) {
            const hid = path.slice("/api/help/".length);
            const choice = options.jsonBody?.choice;
            const item = fixtureState.help.find((h) => h.id === hid);
            if (!item || !item.options.includes(choice)) {
              throw new Error("Invalid choice");
            }
            item.answer = choice;
            const targetRun = fixtureState.runs.find((r) => r.id === item.run);
            const targetDetail = fixtureState.details[item.run];
            const isApprove = choice === item.options[0];
            if (targetRun) {
              targetRun.state = isApprove ? "done" : "failed";
              targetRun.result = {
                ok: isApprove,
                summary: isApprove ? "Completed after approval" : "Stopped: denied by user",
              };
            }
            if (targetDetail) {
              targetDetail.state = targetRun ? targetRun.state : "done";
              targetDetail.events.push({
                t: (targetDetail.elapsed || 9) + 1,
                kind: "help_answer",
                id: hid,
                answer: choice,
                timed_out: false,
              });
              targetDetail.result = targetRun?.result || null;
            }
            const parent = targetRun?.parent
              ? fixtureState.runs.find((r) => r.id === targetRun.parent)
              : null;
            if (parent) {
              parent.state = isApprove ? "done" : "failed";
              parent.result = {
                ok: isApprove,
                summary: isApprove ? "Completed after approval" : "Stopped: denied by user",
              };
            }
            return { ok: true };
          }
          if (method === "POST" && path === "/api/task") {
            const promptText = options.prompt || options.jsonBody?.prompt || "New task";
            const newId = "r-sample-" + Date.now();
            const parentRun = {
              id: newId,
              goal: promptText,
              role: "orchestrator",
              parent: null,
              state: "planning",
              elapsed: 0.1,
              n_events: 1,
              result: null,
            };
            fixtureState.runs.unshift(parentRun);
            fixtureState.details[newId] = {
              ...parentRun,
              events: [{ t: 0.1, kind: "state", state: "planning" }],
            };
            return { run: newId };
          }
          throw new Error("Unsupported path in sample data");
        }

        async function pickFiles(kind) {
          if (!hasShellBridge()) return null;
          const res = await callShell("pickFiles", { kind });
          return Array.isArray(res?.files) ? res.files : [];
        }

        /* Fire-and-forget message to the shell (open or close a window); no reply expected */
        function post(type, payload) {
          if (!hasShellBridge()) return;
          try {
            window.webkit.messageHandlers.shell.postMessage({ type, ...(payload || {}) });
          } catch {
            // Ignore bridge errors
          }
        }

        async function openWorkspace(fixtureName) {
          if (hasShellBridge()) {
            return callShell("openWorkspace", fixtureName ? { fixture: fixtureName } : {});
          }
          const url = new URL("./workspace.html", window.location.href);
          if (fixtureName) url.searchParams.set("fixture", fixtureName);
          if (queryToken) url.searchParams.set("t", queryToken);
          window.open(url.toString(), "_blank", "noopener");
          return { ok: true };
        }

        return {
          init,
          setConnection,
          clearConnection,
          isConnected,
          request,
          pickFiles,
          post,
          openWorkspace,
        };
      })();

      /* ============================================================================
         2. SINGLE ADAPTER (Maps upstream /api/* shapes -> ViewModel; views read ONLY ViewModel)
         ============================================================================ */
      const WorkspaceAdapter = (function () {
        const NEUTRAL_AGENT_COLOR = "#5C6B7A";

        const PRIMARY_SWATCHES = [
          { key: "lagoon", name: "Lagoon", color: "#B5D0EB", edge: "#D6E9FF", ink: "#2F647C" },
          { key: "rose",   name: "Rose",   color: "#EECED6", edge: "#FFF0F1", ink: "#963F59" },
          { key: "mint",   name: "Mint",   color: "#C0DED0", edge: "#E6FFF0", ink: "#396C5A" },
          { key: "lilac",  name: "Lilac",  color: "#E1CDE8", edge: "#FBE8F7", ink: "#71388B" },
          { key: "amber",  name: "Amber",  color: "#F0D9BE", edge: "#FFFCE0", ink: "#865733" },
        ];

        const APPROVAL_KIND_WARNINGS = {
          destructive: "This can't be undone",
          sign_in: "This changes sign-in or security settings",
          money: "This spends money",
        };

        function matchPrimarySwatch(rawSwatch) {
          const val = String(rawSwatch || "").trim();
          if (!val) return null;
          const lower = val.toLowerCase();
          const upper = val.toUpperCase();
          return (
            PRIMARY_SWATCHES.find((s) => s.key === lower || s.name.toLowerCase() === lower || s.color === upper) ||
            null
          );
        }

        function readPrimaryAgentPref(meta) {
          let raw = meta && meta.primaryAgent ? meta.primaryAgent : null;
          if (!raw) {
            try {
              if (typeof localStorage !== "undefined") {
                const stored = localStorage.getItem("ca.primaryAgent");
                if (stored) raw = JSON.parse(stored);
              }
            } catch {
              raw = null;
            }
          }
          if (!raw || typeof raw !== "object") return null;
          const alias = typeof raw.alias === "string" ? raw.alias.trim() : "";
          const swatch = matchPrimarySwatch(raw.swatch);
          if (!alias && !swatch) return null;
          return { alias, swatch };
        }

        function normalizeHex(hex, fallback) {
          const s = String(hex || "").trim();
          if (/^#[0-9a-fA-F]{6}$/.test(s)) return s.toUpperCase();
          if (/^#[0-9a-fA-F]{3}$/.test(s)) {
            return (
              "#" +
              s[1] + s[1] +
              s[2] + s[2] +
              s[3] + s[3]
            ).toUpperCase();
          }
          return fallback;
        }

        function hexToRgb(hex) {
          const clean = normalizeHex(hex, "#000000").slice(1);
          const n = parseInt(clean, 16);
          return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
        }

        function rgbToHex(r, g, b) {
          const clamp = (v) => Math.max(0, Math.min(255, Math.round(v)));
          return (
            "#" +
            [clamp(r), clamp(g), clamp(b)]
              .map((v) => v.toString(16).padStart(2, "0"))
              .join("")
              .toUpperCase()
          );
        }

        function mixHex(hexA, hexB, weightB) {
          const [r1, g1, b1] = hexToRgb(hexA);
          const [r2, g2, b2] = hexToRgb(hexB);
          const w = Math.max(0, Math.min(1, weightB));
          return rgbToHex(
            r1 + (r2 - r1) * w,
            g1 + (g2 - g1) * w,
            b1 + (b2 - b1) * w
          );
        }

        function relativeLuminance(hex) {
          const [r, g, b] = hexToRgb(hex).map((v) => {
            const c = v / 255;
            return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
          });
          return 0.2126 * r + 0.7152 * g + 0.0722 * b;
        }

        function contrastRatio(hexA, hexB) {
          const l1 = relativeLuminance(hexA);
          const l2 = relativeLuminance(hexB);
          const hi = Math.max(l1, l2);
          const lo = Math.min(l1, l2);
          return (hi + 0.05) / (lo + 0.05);
        }

        function ensureContrastInk(bodyHex, rawInkHex) {
          let ink = normalizeHex(rawInkHex, mixHex(bodyHex, "#101216", 0.65));
          for (let step = 0; step < 6; step++) {
            if (contrastRatio(bodyHex, ink) >= 4.7) return ink;
            ink = mixHex(ink, "#101216", 0.28);
          }
          return ink;
        }

        function hashString(str) {
          let h = 2166136261;
          for (let i = 0; i < str.length; i++) {
            h ^= str.charCodeAt(i);
            h = Math.imul(h, 16777619);
          }
          return h >>> 0;
        }

        function extractEventAgentName(events, parentRouteEvent, fallbackIndex) {
          const list = Array.isArray(events) ? events : [];
          for (let i = list.length - 1; i >= 0; i--) {
            const ev = list[i];
            if ((ev?.kind === "route" || ev?.kind === "act" || (ev?.kind === "msg" && ev.role === "agent")) && ev.agent) {
              return String(ev.agent).trim();
            }
          }
          if (parentRouteEvent) {
            if (Array.isArray(parentRouteEvent.names) && parentRouteEvent.names[fallbackIndex]) {
              return String(parentRouteEvent.names[fallbackIndex]).trim();
            }
            if (parentRouteEvent.agent) {
              return String(parentRouteEvent.agent).trim();
            }
          }
          return "";
        }

        function extractEventOrTranscriptAgent(runObj, events, transcriptsById, parentRouteEvent, fallbackIndex) {
          const list = Array.isArray(events) ? events : [];
          let evColor = "";
          let evEdge = "";
          let evInk = "";
          for (let i = list.length - 1; i >= 0; i--) {
            const ev = list[i];
            if ((ev?.kind === "route" || ev?.kind === "act" || (ev?.kind === "msg" && ev.role === "agent")) && (ev.color || ev.body)) {
              evColor = ev.color || ev.body;
              evEdge = ev.edge || "";
              evInk = ev.ink || "";
              break;
            }
          }
          const evName = extractEventAgentName(list, parentRouteEvent, fallbackIndex);
          const allRows = [];
          if (transcriptsById && runObj?.id && Array.isArray(transcriptsById[runObj.id])) {
            allRows.push(...transcriptsById[runObj.id]);
          }
          if (transcriptsById && runObj?.parent && Array.isArray(transcriptsById[runObj.parent])) {
            allRows.push(...transcriptsById[runObj.parent]);
          }
          let trName = "";
          let trColor = "";
          for (const row of allRows) {
            if (!row || row.role !== "agent") continue;
            if (row.run === runObj?.id || (evName && row.agent === evName)) {
              if (!trName && row.agent) trName = String(row.agent).trim();
              if (!trColor && (row.color || row.body)) trColor = row.color || row.body;
              if (trName && trColor) break;
            }
          }
          return {
            name: evName || trName,
            color: evColor || trColor,
            edge: evEdge,
            ink: evInk,
          };
        }

        function resolveAgentIdentity(
          runObj,
          agentsMap,
          fallbackIndex,
          rememberedMap,
          events,
          parentRouteEvent,
          transcriptsById,
          primaryAgentPref
        ) {
          const recovered = extractEventOrTranscriptAgent(
            runObj,
            events,
            transcriptsById,
            parentRouteEvent,
            fallbackIndex
          );
          const directRecord =
            (agentsMap && runObj?.id ? agentsMap[runObj.id] : null) ||
            (rememberedMap && runObj?.id ? rememberedMap[runObj.id] : null) ||
            (rememberedMap && recovered.name ? rememberedMap[`agent:${recovered.name}`] : null) ||
            null;
          const record = directRecord && (directRecord.color || directRecord.body)
            ? directRecord
            : recovered.color
            ? {
                name: directRecord?.name || recovered.name,
                color: recovered.color,
                edge: recovered.edge,
                ink: recovered.ink,
              }
            : directRecord;
          const fallbackName = recovered.name || actorLabelForRole(runObj?.role);
          const resolvedBackendName = String(record?.name || fallbackName).trim();
          const isOrchestrator = runObj?.role === "orchestrator" || resolvedBackendName === "ComputerAnything";
          const displayName =
            isOrchestrator && primaryAgentPref && primaryAgentPref.alias
              ? primaryAgentPref.alias
              : resolvedBackendName;
          const swatchOverride = isOrchestrator && primaryAgentPref ? primaryAgentPref.swatch : null;
          const seed = hashString(String(runObj?.id || displayName || "agent")) % 10000;
          const hasAgentColor = Boolean(swatchOverride || (record && (record.color || record.body)));
          if (hasAgentColor) {
            const rawColor = normalizeHex(
              swatchOverride ? swatchOverride.color : record.color || record.body,
              NEUTRAL_AGENT_COLOR
            );
            const rawEdge = normalizeHex(
              swatchOverride ? swatchOverride.edge : record.edge,
              mixHex(rawColor, "#FFFFFF", 0.35)
            );
            const rawInk = normalizeHex(
              swatchOverride ? swatchOverride.ink : record.ink,
              mixHex(rawColor, "#000000", 0.45)
            );
            const shared = typeof window !== "undefined" ? window.AgentGlass : null;
            let palette;
            if (shared && typeof shared.resolveAgentPalette === "function") {
              const resolved = shared.resolveAgentPalette({
                color: rawColor,
                edge: rawEdge,
                ink: rawInk,
              });
              palette = {
                body: normalizeHex(resolved.body, rawColor),
                edge: normalizeHex(resolved.edge, rawEdge),
                ink: normalizeHex(resolved.ink, rawInk),
              };
            } else {
              palette = {
                body: rawColor,
                edge: rawEdge,
                ink: ensureContrastInk(rawColor, mixHex(rawInk, "#000000", 0.25)),
              };
            }
            return {
              id: runObj?.id || `agent-${fallbackIndex}`,
              name: displayName,
              color: rawColor,
              rawEdge,
              rawInk,
              hasAgentColor: true,
              palette,
              seed,
            };
          }
          const baseColor = NEUTRAL_AGENT_COLOR;
          const body = mixHex(baseColor, "#FFFFFF", 0.70);
          const edge = mixHex(body, "#FFFFFF", 0.35);
          const derivedInk = mixHex(baseColor, "#000000", 0.45);
          const ink = ensureContrastInk(body, derivedInk);
          return {
            id: runObj?.id || `agent-${fallbackIndex}`,
            name: displayName,
            color: baseColor,
            rawEdge: edge,
            rawInk: derivedInk,
            hasAgentColor: false,
            palette: { body, edge, ink },
            seed,
          };
        }

        function formatCountdown(sec) {
          const total = Math.max(0, Math.ceil(Number(sec) || 0));
          const mins = Math.floor(total / 60);
          const rem = total % 60;
          return `${mins}:${String(rem).padStart(2, "0")}`;
        }

        function formatCostUsd(costUsd) {
          if (costUsd == null || costUsd === "" || Number.isNaN(Number(costUsd))) return "";
          const n = Math.max(0, Number(costUsd));
          if (n === 0) return "$0.00";
          if (n < 0.01) return `$${n.toFixed(4)}`;
          return `$${n.toFixed(2)}`;
        }

        function parseActionParts(rawAction) {
          const raw = String(rawAction || "").trim();
          if (!raw) return { verb: "", target: "" };
          const idx = raw.indexOf(":");
          if (idx === -1) return { verb: raw.toLowerCase(), target: "" };
          return {
            verb: raw.slice(0, idx).trim().toLowerCase(),
            target: raw.slice(idx + 1).trim(),
          };
        }

        function summarizeActPlain(ev) {
          const { verb, target } = parseActionParts(ev?.action);
          if (!verb) return "performed action";
          switch (verb) {
            case "click":
              return target ? `clicked ${target}` : "clicked element";
            case "double_click":
              return target ? `double-clicked ${target}` : "double-clicked element";
            case "type":
              return target ? `typed in ${target}` : "typed text";
            case "set_value":
              return target ? `set ${target}` : "set value";
            case "press":
              return target ? `pressed ${target}` : "pressed key";
            case "scroll":
              return target ? `scrolled ${target}` : "scrolled";
            case "open_app":
              return target ? `opened ${target}` : "opened app";
            case "run_applescript":
              return "ran app script";
            default:
              return target ? `${verb.replace(/_/g, " ")} ${target}` : verb.replace(/_/g, " ");
          }
        }

        function summarizeDecidePlain(ev) {
          if (ev?.thought) return String(ev.thought).trim();
          if (ev?.action === "done") return "checking if done";
          return "deciding...";
        }

        function extractRunApp(runObj, events, parentRouteEvent, childIndex) {
          if (runObj?.app) return String(runObj.app).trim();
          const list = Array.isArray(events) ? events : [];
          for (let i = list.length - 1; i >= 0; i--) {
            if (list[i]?.kind === "app_ready" && list[i].app) {
              return String(list[i].app).trim();
            }
          }
          if (parentRouteEvent && Array.isArray(parentRouteEvent.subtasks) && parentRouteEvent.subtasks.length) {
            const byGoal = parentRouteEvent.subtasks.find((s) => s && s.goal === runObj?.goal && s.app);
            if (byGoal) return String(byGoal.app).trim();
            const byIdx = parentRouteEvent.subtasks[childIndex];
            if (byIdx?.app) return String(byIdx.app).trim();
          }
          if (parentRouteEvent?.app) return String(parentRouteEvent.app).trim();
          for (let i = list.length - 1; i >= 0; i--) {
            const node = list[i]?.kind === "graph" ? String(list[i].node || "") : "";
            const prefix = node.split(":")[0].trim();
            if (prefix && prefix !== "?") return prefix;
          }
          return "";
        }

        function pluralizeUnits(text) {
          return String(text || "")
            .replace(/(\d+)\s+round\(s\)/gi, (_, n) => `${n} round${Number(n) === 1 ? "" : "s"}`)
            .replace(/(\d+)\s+patch\(es\)/gi, (_, n) => `${n} patch${Number(n) === 1 ? "" : "es"}`);
        }

        function formatSeconds(sec) {
          const n = Math.max(0, Number(sec) || 0);
          if (n < 1) return "<1s";
          if (n < 10) return `${n.toFixed(1)}s`;
          const whole = Math.round(n);
          if (whole < 60) return `${whole}s`;
          const mins = Math.floor(whole / 60);
          const rem = whole % 60;
          return `${mins}m ${String(rem).padStart(2, "0")}s`;
        }

        function sentenceCase(text) {
          const s = String(text || "").trim();
          if (!s) return "";
          return s.charAt(0).toUpperCase() + s.slice(1);
        }

        function actorLabelForRole(role) {
          if (role === "qa") return "QA agent";
          if (role === "dev") return "Dev agent";
          if (role === "cu") return "Computer use agent";
          if (role === "marketing") return "Marketing agent";
          return "Agent";
        }

        function summarizeEventPlain(ev) {
          if (!ev || typeof ev !== "object") return "";
          switch (ev.kind) {
            case "state":
              if (ev.state === "planning") return "Planning next steps";
              if (ev.state === "acting") return "Working";
              if (ev.state === "awaiting_human") return "Waiting for your answer";
              if (ev.state === "done") return "Finished";
              if (ev.state === "failed") return "Stopped";
              return "";
            case "graph": {
              const target = ev.to != null && ev.to !== "" ? ` -> ${ev.to}` : "";
              return ev.action ? `${sentenceCase(summarizeActPlain(ev))}${target}` : "";
            }
            case "route":
              if (Array.isArray(ev.names) && ev.names.length) {
                return `Assigned to ${ev.names.join(", ")}`;
              }
              if (ev.agent) return `Assigned to ${ev.agent}`;
              return `Assigned to ${actorLabelForRole(ev.role)}`;
            case "app_ready":
              return ev.app ? `Opened ${ev.app}` : "Opened app";
            case "memory":
              return ev.msg ? sentenceCase(ev.msg) : "Replaying saved steps";
            case "decide":
              return ev.thought ? sentenceCase(ev.thought) : (ev.action === "done" ? "Checking if done" : "Deciding next step");
            case "act":
              return ev.action ? sentenceCase(summarizeActPlain(ev)) : "Performed action";
            case "verify":
              if (ev.achieved) {
                return ev.evidence ? `Verified: ${ev.evidence}` : "Verified goal on screen";
              }
              return ev.evidence ? `Not verified yet: ${ev.evidence}` : "Verification check failed";
            case "tests":
              return ev.exit === 0
                ? `Tests passed (round ${ev.round || 1})`
                : `Tests failed (round ${ev.round || 1})`;
            case "ui_check":
              return ev.summary ? sentenceCase(ev.summary) : (ev.ok ? "UI check passed" : "UI check found issues");
            case "bug_report": {
              const count = Array.isArray(ev.bugs) ? ev.bugs.length : 0;
              if (count === 0) return `Round ${ev.round || 1}: no bugs found`;
              return `Round ${ev.round || 1}: found ${count} bug${count === 1 ? "" : "s"}`;
            }
            case "patch":
              if (ev.applied === false) {
                return ev.error && /denied/i.test(ev.error)
                  ? "Patch denied · Nothing was changed."
                  : "Patch not applied · Nothing was changed.";
              }
              return ev.explanation ? `Applied fix: ${ev.explanation}` : "Applied patch";
            case "commit":
              return ev.ok ? "Committed fix" : "Could not commit fix";
            case "help":
              return ev.question ? `Asked: ${ev.question}` : "Waiting for approval";
            case "help_answer":
              if (ev.timed_out) return "Approval expired";
              return `Answered: ${sentenceCase(ev.answer || "")}`;
            case "msg": {
              const msgText = String(ev.text || "").trim();
              if (!msgText || ev.msg_kind === "prompt") return "";
              return sentenceCase(msgText);
            }
            case "speak":
              return ev.text || ev.msg || ev.message ? sentenceCase(ev.text || ev.msg || ev.message) : "";
            case "artifact":
              return ev.tagline ? `Created brief: ${ev.tagline}` : "Saved output";
            case "tour":
              return ev.summary ? sentenceCase(ev.summary) : `Captured screen ${ev.step || ""}`.trim();
            case "warn":
              return ev.error ? sentenceCase(ev.error) : "Warning";
            case "error":
              return ev.error || ev.msg ? sentenceCase(ev.error || ev.msg) : "Error occurred";
            case "result":
              return ev.summary ? sentenceCase(ev.summary) : "";
            default:
              return "";
          }
        }

        function formatStepDetails(run, events) {
          const lines = [];
          for (const ev of events) {
            const line = summarizeEventPlain(ev);
            if (line) {
              lines.push(line);
            }
            if (ev.kind === "bug_report" && Array.isArray(ev.bugs)) {
              for (const b of ev.bugs) {
                lines.push(`  - [${b.severity || "issue"}] ${b.title}${b.evidence ? ` (${b.evidence})` : ""}`);
              }
            }
            if (ev.kind === "patch" && ev.diff) {
              lines.push(ev.diff);
            }
            if (ev.kind === "patch" && ev.applied === false && ev.error) {
              lines.push(`  Reason: ${ev.error} · Nothing was changed.`);
            }
          }
          if (!lines.length && run.result?.summary) {
            lines.push(sentenceCase(run.result.summary));
          }
          return lines;
        }

        function extractVerificationEvidence(allRunsInGroup, detailsById) {
          for (const r of allRunsInGroup) {
            const detail = detailsById[r.id];
            const evs = Array.isArray(detail?.events) ? detail.events : [];
            const verified = [...evs].reverse().find((e) => e.kind === "verify" && e.achieved && e.evidence);
            if (verified) return String(verified.evidence).trim();
          }
          return "";
        }

        function hasUnappliedPatch(allRunsInGroup, detailsById) {
          for (const r of allRunsInGroup) {
            const detail = detailsById[r.id];
            const evs = Array.isArray(detail?.events) ? detail.events : [];
            const unapplied = [...evs].reverse().find((e) => e.kind === "patch" && e.applied === false);
            if (unapplied) return unapplied;
          }
          return null;
        }

        function extractSpeakText(allRunsInGroup, detailsById) {
          let latestMsg = "";
          for (const r of allRunsInGroup) {
            const detail = detailsById[r.id];
            const evs = Array.isArray(detail?.events) ? detail.events : [];
            const speak = [...evs].reverse().find((e) => e.kind === "speak" && (e.text || e.msg || e.message));
            if (speak) {
              const txt = String(speak.text || speak.msg || speak.message).trim();
              if (txt) return txt;
            }
            if (!latestMsg) {
              const msg = [...evs]
                .reverse()
                .find(
                  (e) =>
                    e.kind === "msg" &&
                    (e.role === "assistant" || e.msg_kind === "result" || e.msg_kind === "plan") &&
                    e.text
                );
              if (msg) {
                latestMsg = String(msg.text).trim();
              }
            }
          }
          return latestMsg;
        }

        function hasMockVerifyEvidence(allRunsInGroup, detailsById) {
          for (const r of allRunsInGroup) {
            const evs = Array.isArray(detailsById[r.id]?.events) ? detailsById[r.id].events : [];
            if (evs.some((e) => e?.kind === "verify" && e.achieved === true && /^mock$/i.test(String(e.evidence || "").trim()))) {
              return true;
            }
          }
          return false;
        }

        function hasVerifyPass(allRunsInGroup, detailsById) {
          let seenVerify = false;
          for (const r of allRunsInGroup) {
            const detail = detailsById[r.id];
            const evs = Array.isArray(detail?.events) ? detail.events : [];
            for (let i = evs.length - 1; i >= 0; i--) {
              if (evs[i]?.kind === "verify") {
                seenVerify = true;
                if (evs[i].achieved === true) return { seenVerify: true, passed: true };
                if (evs[i].achieved === false) return { seenVerify: true, passed: false };
              }
            }
          }
          return { seenVerify, passed: false };
        }

        function cleanFailureFact(rawSummary) {
          const text = pluralizeUnits(String(rawSummary || "").trim());
          if (!text) return "Stopped before finishing";
          const withoutRepo = text.replace(/^QA\s+\S+:\s*/i, "");
          return sentenceCase(withoutRepo);
        }

        function buildPillFact(cleanText, isVerified) {
          const text = String(cleanText || "").trim();
          if (!text) return "";
          if (isVerified) {
            const loopMatch = text.match(/(\d+\s+rounds?),?\s*(\d+\s+patch(?:es)?)/i);
            if (loopMatch) {
              return `${loopMatch[1]}, ${loopMatch[2]}`;
            }
          }
          if (text.length <= 24) return text;
          const cut = text.slice(0, 23);
          const lastSpace = cut.lastIndexOf(" ");
          return (lastSpace > 8 ? cut.slice(0, lastSpace) : cut).trim();
        }

        function mapStep(
          childRun,
          detail,
          pendingHelpForChild,
          agentsMap,
          fallbackIndex,
          isMockContext,
          rememberedMap,
          parentRouteEvent,
          transcriptsById,
          primaryAgentPref
        ) {
          const events = Array.isArray(detail?.events) ? detail.events : [];
          const actorLabel = actorLabelForRole(childRun.role);
          const agentIdentity = resolveAgentIdentity(
            childRun,
            agentsMap,
            fallbackIndex,
            rememberedMap,
            events,
            parentRouteEvent,
            transcriptsById,
            primaryAgentPref
          );
          const app = extractRunApp(childRun, events, parentRouteEvent, fallbackIndex);
          const unappliedPatch = [...events].reverse().find((e) => e.kind === "patch" && e.applied === false);
          const verifiedEvent = [...events].reverse().find((e) => e.kind === "verify" && e.achieved);
          const isSampleStep = Boolean(isMockContext);

          let stateSymbolWord = "▶ Running";
          let stateColorClass = "state-working";
          let isWorking = false;

          if (pendingHelpForChild.length || childRun.state === "awaiting_human") {
            stateSymbolWord = "◔ Needs approval";
            stateColorClass = "state-warning";
          } else if (childRun.state === "queued" || childRun.state === "planning") {
            stateSymbolWord = "▶ Running";
            stateColorClass = "state-working";
            isWorking = true;
          } else if (childRun.state === "acting") {
            stateSymbolWord = "▶ Running";
            stateColorClass = "state-working";
            isWorking = true;
          } else if (childRun.state === "done" && childRun.result?.ok === true) {
            stateSymbolWord = isSampleStep ? "✓ Verified (mock)" : "✓ Verified";
            stateColorClass = "state-success";
          } else if (childRun.state === "failed" || childRun.result?.ok === false) {
            stateSymbolWord = "× Failed";
            stateColorClass = "state-danger";
          } else {
            stateSymbolWord = "◔ Finished, not verified";
            stateColorClass = "state-warning";
          }

          /* Latest meaningful event in plain words */
          let latestSummary = "";
          if (unappliedPatch && (childRun.state === "failed" || childRun.role === "dev")) {
            latestSummary = summarizeEventPlain(unappliedPatch);
          } else {
            for (let i = events.length - 1; i >= 0; i--) {
              const candidate = summarizeEventPlain(events[i]);
              if (candidate && candidate !== "Finished" && candidate !== "Stopped" && candidate !== "Working") {
                latestSummary = candidate;
                break;
              }
            }
          }
          if (!latestSummary) {
            if (verifiedEvent?.evidence) {
              latestSummary = `Verified: ${verifiedEvent.evidence}`;
            } else if (childRun.result?.summary) {
              latestSummary = cleanFailureFact(childRun.result.summary);
            } else if (isWorking) {
              latestSummary = "Working…";
            }
          }

          const detailLines = formatStepDetails(childRun, events);

          return {
            id: childRun.id,
            app,
            actorLabel,
            agentIdentity,
            stateSymbolWord,
            stateColorClass,
            latestSummary,
            detailLines,
            hasDetails: detailLines.length > 0 || isWorking,
            isWorking,
          };
        }

        function buildLiveStepForRun(parent, runsForStep, detailsById, stepById) {
          let best = null;
          for (let rIdx = 0; rIdx < runsForStep.length; rIdx++) {
            const r = runsForStep[rIdx];
            const evs = Array.isArray(detailsById[r.id]?.events) ? detailsById[r.id].events : [];
            let latestIdx = -1;
            for (let i = evs.length - 1; i >= 0; i--) {
              if (evs[i]?.kind === "act" || evs[i]?.kind === "decide") {
                latestIdx = i;
                break;
              }
            }
            if (latestIdx === -1) continue;
            const latestEv = evs[latestIdx];
            const tVal = Number(latestEv.t) || 0;
            const isRunActive =
              r.state === "acting" ||
              r.state === "planning" ||
              r.state === "queued" ||
              r.state === "awaiting_human";
            if (!best || (isRunActive && !best.isRunActive) || (isRunActive === best.isRunActive && tVal >= best.tVal)) {
              best = { r, evs, latestIdx, latestEv, tVal, isRunActive };
            }
          }
          if (!best) return null;

          const { r, evs, latestIdx, latestEv } = best;
          const stepInfo = stepById.get(r.id);
          const agentName = stepInfo?.agentIdentity?.name || actorLabelForRole(r.role);
          const agentColor = stepInfo?.agentIdentity?.color || NEUTRAL_AGENT_COLOR;
          const agentEdge = stepInfo?.agentIdentity?.palette?.edge || "#E0E3E6";
          const app = stepInfo?.app || "";

          let phrase = "";
          if (latestEv.kind === "act") {
            let prevAct = null;
            for (let j = latestIdx - 1; j >= 0; j--) {
              if (evs[j]?.kind === "act") {
                prevAct = evs[j];
                break;
              }
            }
            const curParts = parseActionParts(latestEv.action);
            const prevParts = prevAct ? parseActionParts(prevAct.action) : null;
            if (
              prevParts &&
              curParts.verb &&
              prevParts.verb === curParts.verb &&
              curParts.target &&
              prevParts.target &&
              curParts.target.length <= 16 &&
              prevParts.target.length <= 16
            ) {
              const verbWord =
                curParts.verb === "click"
                  ? "clicked"
                  : curParts.verb === "double_click"
                  ? "double-clicked"
                  : curParts.verb === "press"
                  ? "pressed"
                  : "";
              if (verbWord) {
                phrase = `${verbWord} ${prevParts.target}, then ${curParts.target}`;
              }
            }
            if (!phrase) {
              phrase = summarizeActPlain(latestEv);
            }
          } else {
            phrase = summarizeDecidePlain(latestEv);
          }

          const prefix = app ? `${agentName} in ${app}` : agentName;
          return {
            key: `${parent.id}:${r.id}`,
            fingerprint: `${r.id}:${evs.length}:${latestEv.t}:${latestEv.kind}:${latestEv.action || ""}:${latestEv.thought || ""}`,
            agentName,
            agentColor,
            agentEdge,
            app,
            text: `${prefix}: ${phrase}`,
          };
        }

        function buildDigestForRun(parent, rawChildren, detailsById, stepById, costData) {
          const rawDigest = parent.result?.digest || null;
          const childRuns = rawChildren.length ? rawChildren : [parent];
          const actEvents = [];
          let seq = 0;

          for (const r of childRuns) {
            const evs = Array.isArray(detailsById[r.id]?.events) ? detailsById[r.id].events : [];
            const stepInfo = stepById.get(r.id);
            const agentName = stepInfo?.agentIdentity?.name || actorLabelForRole(r.role);
            const agentColor = stepInfo?.agentIdentity?.color || NEUTRAL_AGENT_COLOR;
            const agentEdge = stepInfo?.agentIdentity?.palette?.edge || "#E0E3E6";
            const app = stepInfo?.app || "";

            for (const ev of evs) {
              if (ev?.kind !== "act") continue;
              actEvents.push({
                seq: seq++,
                t: Number(ev.t) || 0,
                runId: r.id,
                agentName,
                agentColor,
                agentEdge,
                app,
                action: ev.action || "",
                plainText: sentenceCase(summarizeActPlain(ev)),
                fromMemory: ev.source === "memory",
                actMs: ev.act_ms != null ? Number(ev.act_ms) : null,
              });
            }
          }

          actEvents.sort((a, b) => (a.t !== b.t ? a.t - b.t : a.seq - b.seq));
          actEvents.forEach((item, idx) => {
            item.index = idx + 1;
          });

          const seconds = rawDigest?.seconds != null ? Number(rawDigest.seconds) : Number(parent.elapsed) || 0;
          const totalSteps =
            actEvents.length > 0
              ? actEvents.length
              : rawDigest?.steps != null
              ? Number(rawDigest.steps)
              : rawChildren.reduce((sum, c) => sum + (Number(c.result?.steps) || 0), 0);
          const memorySteps =
            actEvents.length > 0
              ? actEvents.filter((a) => a.fromMemory).length
              : Number(rawDigest?.memory_steps || 0);
          const helpRequests = rawDigest?.help_requests != null ? Number(rawDigest.help_requests) : 0;
          const children = Array.isArray(rawDigest?.children)
            ? rawDigest.children
            : rawChildren.map((c) => c.id);

          let costUsd = null;
          let costIsNull = false;
          const isExplicitMockCost = Boolean(
            (costData && costData.mock === true) ||
            (rawDigest?.task_cost && costData == null && rawDigest.task_cost.mock === true)
          );
          const llmNullInEvents = [parent, ...rawChildren].some((r) => {
            const evs = Array.isArray(detailsById[r.id]?.events) ? detailsById[r.id].events : [];
            const llmEvs = evs.filter((e) => e?.kind === "llm");
            return llmEvs.length > 0 && llmEvs.some((e) => e.cost === null) && llmEvs.every((e) => e.cost == null || e.cost === 0);
          });
          if (costData && costData.cost_usd === null) {
            costIsNull = true;
          } else if (costData && typeof costData.cost_usd === "number") {
            costUsd = costData.cost_usd;
            if (costUsd === 0 && llmNullInEvents) costIsNull = true;
          } else if (rawDigest?.task_cost && costData == null && rawDigest.task_cost.cost_usd === null) {
            costIsNull = true;
          } else if (rawDigest?.task_cost && typeof rawDigest.task_cost.cost_usd === "number") {
            costUsd = rawDigest.task_cost.cost_usd;
            if (costUsd === 0 && llmNullInEvents) costIsNull = true;
          } else if (rawDigest?.llm && rawDigest.llm.cost === null) {
            costIsNull = true;
          } else if (rawDigest?.llm && typeof rawDigest.llm.cost === "number" && (rawDigest.llm.calls > 0 || rawDigest.llm.cost > 0)) {
            costUsd = rawDigest.llm.cost;
            if (costUsd === 0 && llmNullInEvents) costIsNull = true;
          } else if (llmNullInEvents) {
            costIsNull = true;
          }

          if (Array.isArray(rawDigest?.task_cost?.actions)) {
            for (const actItem of rawDigest.task_cost.actions) {
              if (actItem && actItem.to == null) {
                // Explicitly allow null target node on action records
              }
            }
          }

          const finalCostText = isExplicitMockCost
            ? "$0 (mock run)"
            : costIsNull
            ? "—"
            : formatCostUsd(costUsd);
          const liveCostText = isExplicitMockCost
            ? "$0 (mock run)"
            : costIsNull || costUsd === null
            ? "—"
            : formatCostUsd(costUsd) || "—";

          return {
            summary: rawDigest?.summary ? String(rawDigest.summary) : "",
            timeText: formatSeconds(seconds),
            totalSteps,
            memorySteps,
            helpRequests,
            children,
            llm: rawDigest?.llm || null,
            costUsd,
            costText: finalCostText,
            liveCostText,
            actEvents,
            hasActEvents: actEvents.length > 0,
          };
        }

        function mapRuns(rawRuns, detailsById, pendingHelpList, meta) {
          const runsList = Array.isArray(rawRuns) ? rawRuns : [];
          const helpList = Array.isArray(pendingHelpList) ? pendingHelpList : [];
          const agentsMap = meta && meta.agentsById && typeof meta.agentsById === "object" ? meta.agentsById : {};
          const rememberedMap =
            meta && meta.rememberedAgentsById && typeof meta.rememberedAgentsById === "object"
              ? meta.rememberedAgentsById
              : {};
          const costsById = meta && meta.costsById && typeof meta.costsById === "object" ? meta.costsById : {};
          const transcriptsById =
            meta && meta.transcriptsById && typeof meta.transcriptsById === "object" ? meta.transcriptsById : {};
          const nowSec = meta && meta.nowSec != null ? Number(meta.nowSec) : Date.now() / 1000;
          const primaryAgentPref = readPrimaryAgentPref(meta);
          const byId = new Map(runsList.map((r) => [r.id, r]));

          /* Group child runs under parent orchestrator runs */
          const parents = runsList.filter((r) => !r.parent || !byId.has(r.parent));
          const childrenByParent = new Map();
          for (const r of runsList) {
            if (r.parent && byId.has(r.parent)) {
              if (!childrenByParent.has(r.parent)) childrenByParent.set(r.parent, []);
              childrenByParent.get(r.parent).push(r);
            }
          }

          /* Live cursor agents for collapsed notch pill dots */
          const liveAgents = [];
          for (const [agentId, entry] of Object.entries(agentsMap)) {
            if (!entry || typeof entry !== "object") continue;
            const runObj = byId.get(agentId);
            if (runObj && (runObj.state === "done" || runObj.state === "failed")) continue;
            if (runObj && runObj.role === "orchestrator" && childrenByParent.has(runObj.id)) continue;
            const entryName = String(entry.name || actorLabelForRole(runObj?.role)).trim();
            const isOrchAgent = runObj?.role === "orchestrator" || entryName === "ComputerAnything";
            const customSwatch = isOrchAgent && primaryAgentPref ? primaryAgentPref.swatch : null;
            const displayName =
              isOrchAgent && primaryAgentPref && primaryAgentPref.alias
                ? primaryAgentPref.alias
                : entryName;
            liveAgents.push({
              id: agentId,
              name: displayName,
              color: normalizeHex(customSwatch ? customSwatch.color : entry.color || entry.body, NEUTRAL_AGENT_COLOR),
              edge: normalizeHex(customSwatch ? customSwatch.edge : entry.edge, "#E0E3E6"),
              ink: normalizeHex(customSwatch ? customSwatch.ink : entry.ink, "#323B43"),
            });
          }

          const mappedRuns = parents.map((parent) => {
            const rawChildren = [...(childrenByParent.get(parent.id) || [])].reverse();
            const groupRuns = [parent, ...rawChildren];
            const groupRunIds = new Set(groupRuns.map((r) => r.id));

            const parentEvents = Array.isArray(detailsById[parent.id]?.events) ? detailsById[parent.id].events : [];
            const parentRouteEvent = [...parentEvents].reverse().find((e) => e?.kind === "route") || null;

            const timedOutHelpIds = new Set();
            const helpEventsById = new Map();
            for (const gr of groupRuns) {
              const evs = Array.isArray(detailsById[gr.id]?.events) ? detailsById[gr.id].events : [];
              for (const ev of evs) {
                if (ev?.kind === "help" && ev.id) {
                  helpEventsById.set(ev.id, { ...ev, run: gr.id });
                } else if (ev?.kind === "help_answer" && ev.id && ev.timed_out === true) {
                  timedOutHelpIds.add(ev.id);
                }
              }
            }

            const helpItemsById = new Map();
            for (const h of helpList) {
              if (!h || !groupRunIds.has(h.run) || h.answer != null) continue;
              helpItemsById.set(h.id, h);
            }
            for (const hid of timedOutHelpIds) {
              if (!helpItemsById.has(hid) && helpEventsById.has(hid)) {
                const he = helpEventsById.get(hid);
                helpItemsById.set(hid, {
                  id: hid,
                  run: he.run,
                  kind: he.help_kind || "",
                  question: he.question || "Approval needed",
                  options: Array.isArray(he.options) ? he.options : [],
                  detail: "",
                  answer: null,
                });
              }
            }

            const pendingHelp = Array.from(helpItemsById.values()).map((h) => {
              const helpEv = helpEventsById.get(h.id);
              const kind = h.kind || helpEv?.help_kind || "";
              const kindWarning = APPROVAL_KIND_WARNINGS[kind] || "";
              const askedAtSec =
                h.asked != null
                  ? Number(h.asked)
                  : h.asked_age_s != null
                  ? nowSec - Number(h.asked_age_s)
                  : nowSec;
              const elapsedSec = Math.max(0, nowSec - askedAtSec);
              const remainingSec = Math.max(0, Math.ceil(300 - elapsedSec));
              const isExpired = Boolean(timedOutHelpIds.has(h.id) || remainingSec <= 0);
              const countdownText = isExpired ? "0:00" : formatCountdown(remainingSec);
              return {
                id: h.id,
                run: h.run,
                kind,
                kindWarning,
                askedAtSec,
                remainingSec: isExpired ? 0 : remainingSec,
                countdownText,
                isExpired,
                statusText: isExpired ? "Expired" : "",
                question: h.question || "Approval needed",
                options: Array.isArray(h.options) ? h.options : [],
                detail: h.detail ? String(h.detail) : "",
                timeoutNote: isExpired
                  ? "No answer received within 5m · Declined."
                  : `Denies in ${countdownText} · Silence means no.`,
              };
            });

            const activePendingHelp = pendingHelp.filter((h) => !h.isExpired);

            const isSampleContext = Boolean(meta.isSampleData);
            const hasMockVerify = hasMockVerifyEvidence(groupRuns, detailsById);

            const steps = (rawChildren.length ? rawChildren : [parent]).map((child, idx) => {
              const childHelp = pendingHelp.filter((h) => h.run === child.id && !h.isExpired);
              return mapStep(
                child,
                detailsById[child.id],
                childHelp,
                agentsMap,
                idx,
                isSampleContext,
                rememberedMap,
                parentRouteEvent,
                transcriptsById,
                primaryAgentPref
              );
            });
            const stepById = new Map(steps.map((s) => [s.id, s]));

            const apps = [];
            const seenApps = new Set();
            const addAppName = (name) => {
              const clean = String(name || "").trim();
              if (clean && !seenApps.has(clean)) {
                seenApps.add(clean);
                apps.push(clean);
              }
            };
            if (parentRouteEvent?.app) addAppName(parentRouteEvent.app);
            if (Array.isArray(parentRouteEvent?.subtasks)) {
              for (const sub of parentRouteEvent.subtasks) {
                if (sub?.app) addAppName(sub.app);
              }
            }
            for (const s of steps) {
              if (s.app) addAppName(s.app);
            }

            const evidenceText = extractVerificationEvidence(groupRuns, detailsById);
            const speakText = extractSpeakText(groupRuns, detailsById);
            const unappliedPatch = hasUnappliedPatch(groupRuns, detailsById);

            /* Truth rules (Requirement 4 & A5):
               Check mark (✓) ONLY when parent run is done AND parent.result.ok === true.
               Under CA_MOCK / sample data, label clearly that mock verification is not evidence. */
            let state = "working"; // "working" | "waiting" | "verified" | "failed" | "unverified"
            let stateSymbolWord = "▶ Running";
            let stateFact = "";
            let pillFact = "";
            let stateColorClass = "state-working";

            if (activePendingHelp.length > 0 || parent.state === "awaiting_human" || rawChildren.some((c) => c.state === "awaiting_human")) {
              state = "waiting";
              stateSymbolWord = "◔ Needs approval";
              stateFact = activePendingHelp[0]?.question || pendingHelp[0]?.question || "Waiting for your answer";
              pillFact = buildPillFact(stateFact, false);
              stateColorClass = "state-warning";
            } else if (parent.state === "queued" || parent.state === "planning" || parent.state === "acting") {
              state = "working";
              stateSymbolWord = "▶ Running";
              const activeChild = steps.find((s) => s.isWorking);
              stateFact = activeChild ? (activeChild.agentIdentity?.name || activeChild.actorLabel) : "Planning";
              pillFact = buildPillFact(stateFact, false);
              stateColorClass = "state-working";
            } else if (parent.state === "done" && parent.result?.ok === true) {
              state = "verified";
              stateSymbolWord = isSampleContext ? "✓ Verified (mock)" : "✓ Verified";
              const rawSummary = parent.result.summary || parent.result.digest?.summary || speakText;
              stateFact = rawSummary ? cleanFailureFact(rawSummary) : "All checks passed";
              pillFact = buildPillFact(stateFact, true);
              stateColorClass = "state-success";
            } else if (parent.state === "failed" || parent.result?.ok === false) {
              state = "failed";
              stateSymbolWord = "× Failed";
              const baseSummary = cleanFailureFact(parent.result?.summary || parent.result?.digest?.summary);
              stateFact = unappliedPatch
                ? `${baseSummary} · Nothing was changed.`
                : baseSummary;
              pillFact = buildPillFact(baseSummary, false);
              stateColorClass = "state-danger";
            } else if (parent.state === "done") {
              state = "unverified";
              stateSymbolWord = "◔ Finished, not verified";
              const baseSummary = cleanFailureFact(parent.result?.summary || parent.result?.digest?.summary || speakText);
              stateFact = baseSummary;
              pillFact = buildPillFact(baseSummary, false);
              stateColorClass = "state-warning";
            } else {
              state = "failed";
              stateSymbolWord = "× Failed";
              stateFact = "Run stopped without a verified result";
              pillFact = buildPillFact(stateFact, false);
              stateColorClass = "state-danger";
            }

            const isFinished = state === "verified" || state === "failed" || state === "unverified";
            const liveStep = !isFinished
              ? buildLiveStepForRun(parent, rawChildren.length ? rawChildren : [parent], detailsById, stepById)
              : null;
            const digest = buildDigestForRun(parent, rawChildren, detailsById, stepById, costsById[parent.id], state);

            return {
              id: parent.id,
              goal: parent.goal || "Untitled run",
              apps,
              appLabel: apps.join(", "),
              elapsedText: formatSeconds(parent.elapsed),
              state,
              isFinished,
              isMock: isSampleContext || hasMockVerify,
              mockNote: isSampleContext
                ? "Mock verification is not real evidence"
                : hasMockVerify
                ? "Mock verification (mock mode) is not real evidence"
                : "",
              stateSymbolWord,
              stateFact,
              pillFact,
              stateColorClass,
              evidenceText,
              speakText,
              liveStep,
              digest,
              steps,
              pendingHelp,
            };
          });

          return {
            connectionStatus: meta.connectionStatus,
            connectionError: meta.connectionError || "",
            isSampleData: Boolean(meta.isSampleData),
            liveAgents,
            runs: mappedRuns,
          };
        }

        return { mapRuns };
      })();

      /* ============================================================================
         3. APPLICATION STATE & UI CONTROLLER (Reads ONLY WorkspaceAdapter ViewModel)
