<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agent workspace</title>
  <link rel="stylesheet" href="./workspace/styles.css" />
</head>
<body>
  <div class="workspace-app">
    <!-- TOP STRIP (<= 36px): View menu on the left, Sample tag if sample, Stop all on the right -->
    <header class="workspace-header">
      <div class="workspace-topbar">
        <div class="workspace-topbar-left">
          <div class="view-menu-wrap">
            <button
              type="button"
              id="view-menu-btn"
              class="view-menu-btn"
              aria-haspopup="menu"
              aria-expanded="false"
              aria-controls="view-menu-dropdown"
            >
              <span id="view-menu-label">Agent graph</span>
              <span class="view-menu-chevron" aria-hidden="true">&#8964;</span>
            </button>
            <div
              id="view-menu-dropdown"
              class="view-menu-dropdown hidden"
              role="menu"
              aria-label="Workspace views"
            ></div>
          </div>
          <span id="provenance-badge" class="provenance-tag" style="display:none;">Sample data</span>
        </div>

        <div id="stop-all-wrap" class="stop-all-wrap hidden">
          <button type="button" id="stop-all-btn" class="btn btn-destructive hidden">Stop all</button>
          <span id="stop-all-status" class="state-text hidden" role="status" aria-live="polite"></span>
        </div>
      </div>
    </header>

    <!-- CONNECTION / SAMPLE FIXTURE BAR -->
    <div id="connection-banner" class="connection-banner hidden" role="status" aria-live="polite"></div>

    <!-- MAIN VIEWS (10 views, fills remaining viewport without page scroll) -->
    <main class="workspace-main">
      <!-- Agent graph -->
      <section
        id="panel-graph"
        class="view-section active"
        role="tabpanel"
        data-view-panel="graph"
        aria-label="Agent graph"
      >
        <div id="b1-content" class="view-inner"></div>
      </section>

      <!-- State machine -->
      <section
        id="panel-state-machine"
        class="view-section"
        role="tabpanel"
        data-view-panel="state-machine"
        aria-label="State machine"
        hidden
      >
        <div id="b1b-content" class="view-inner"></div>
      </section>

      <!-- Transcript -->
      <section
        id="panel-logs"
        class="view-section"
        role="tabpanel"
        data-view-panel="logs"
        aria-label="Transcript"
        hidden
      >
        <div id="b2-content" class="view-inner view-scroll"></div>
      </section>

      <!-- Artifacts -->
      <section
        id="panel-artifacts"
        class="view-section"
        role="tabpanel"
        data-view-panel="artifacts"
        aria-label="Artifacts"
        hidden
      >
        <div id="b6-content" class="view-inner view-scroll"></div>
      </section>

      <div hidden aria-hidden="true" data-view-panel="marketing"></div>

      <!-- Analytics -->
      <section
        id="panel-analytics"
        class="view-section"
        role="tabpanel"
        data-view-panel="analytics"
        aria-label="Analytics"
        hidden
      >
        <div id="b3-content" class="view-inner view-scroll"></div>
      </section>

      <!-- Agent settings -->
      <section
        id="panel-agent-settings"
        class="view-section"
        role="tabpanel"
        data-view-panel="agent-settings"
        aria-label="Agent settings"
        hidden
      >
        <div id="b8-content" class="view-inner view-scroll"></div>
      </section>
      <div hidden aria-hidden="true" data-view-panel="settings"></div>

      <!-- App settings -->
      <section
        id="panel-app-settings"
        class="view-section"
        role="tabpanel"
        data-view-panel="app-settings"
        aria-label="App settings"
        hidden
      >
        <div id="b10-content" class="view-inner view-scroll"></div>
      </section>

      <!-- History -->
      <section
        id="panel-history"
        class="view-section"
        role="tabpanel"
        data-view-panel="history"
        aria-label="History"
        hidden
      >
        <div id="b5-content" class="view-inner view-scroll"></div>
      </section>

      <!-- Memory -->
      <section
        id="panel-memory"
        class="view-section"
        role="tabpanel"
        data-view-panel="memory"
        aria-label="Memory"
        hidden
      >
        <div id="b9-content" class="view-inner view-scroll"></div>
      </section>

      <!-- Onboarding -->
      <section
        id="panel-onboarding"
        class="view-section"
        role="tabpanel"
        data-view-panel="onboarding"
        aria-label="Onboarding"
        hidden
      >
        <div id="b4-content" class="view-inner view-scroll"></div>
      </section>
    </main>
  </div>

  <!-- Vendored sea-glass material renderer (classic script for file:// WKWebView + HTTP compatibility) -->
  <script src="./vendor/sea-glass/sea-glass.classic.js"></script>
  <script src="./shared/agent-glass.js"></script>
  <script src="./workspace/app.js"></script>
</body>
</html>
